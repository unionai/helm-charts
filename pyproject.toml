[project]
name = "helm-charts-tooling"
version = "0.0.0"
description = "Build, release, and CI tooling for unionai/helm-charts (invoke tasks, chart generators, checks)."
requires-python = ">=3.11"
dependencies = [
    "GitPython==3.2.1",
    "PyGithub==2.6.1",
    "PyYAML==6.0.2",
    "invoke==2.2.0",
]

[dependency-groups]
# Formatter/linter (ruff, pinned to match .pre-commit-config.yaml and the "format"
# CI check) plus the unit-test runner for the builder tasks.
dev = [
    "pytest==9.0.3",
    "ruff==0.16.1",
]

[tool.uv]
# Tooling workspace, not a distributable package: sync installs the dependencies
# only, with no build step for this project itself.
package = false
