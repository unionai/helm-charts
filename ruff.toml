# Ruff — formatter + linter (replaces black + isort). See TESTING.md / CI "format".
line-length = 100
target-version = "py311"

# Chart-embedded payloads (rendered into ConfigMaps via .Files.Get, snapshot-tested).
# Formatting them would churn rendered manifests for no gain, so leave them alone.
extend-exclude = ["charts/*/files"]

[lint]
# Light, format-adjacent gate: pyflakes (F, catches unused imports/names — honors
# `# noqa`), ruff's default syntax subset (E4/E7/E9), and import sorting (I,
# replaces isort). Not a broad style linter.
select = ["E4", "E7", "E9", "F", "I"]
