# Synthetic profile: GCP, Workload Identity, GCS storage, app serving ON.
# Not a real deployment -- see README.md.
global:
  CONTROLPLANE_HOST: controlplane.example.invalid
  CLUSTER_NAME: example-gcp-1
  ORG_NAME: example-org
  METADATA_BUCKET: example-metadata-bucket
  FAST_REGISTRATION_BUCKET: example-metadata-bucket
  AUTH_CLIENT_ID: example-client-id
  GOOGLE_PROJECT_ID: example-project
  BACKEND_IAM_ROLE_ARN: example-backend@example-project.example.invalid
  WORKER_IAM_ROLE_ARN: example-worker@example-project.example.invalid

provider: gcp
low_privilege: false

storage:
  provider: gcs
  bucketName: example-metadata-bucket
  gcp:
    projectId: example-project

namespaces:
  enabled: true
clusterresourcesync:
  enabled: true
flytepropeller:
  enabled: true
opencost:
  enabled: true

# App-serving axis: exercises the Knative/serving templates.
apps:
  enabled: true
serving:
  enabled: true
knative-operator:
  enabled: false

imageBuilder:
  enabled: true
  defaultRepository: registry.example.invalid/example
dcgm-exporter:
  enabled: false

# Placeholder client credentials -- the chart requires these to render.
secrets:
  admin:
    create: true
    clientId: example-client-id
    clientSecret: example-client-secret-placeholder
