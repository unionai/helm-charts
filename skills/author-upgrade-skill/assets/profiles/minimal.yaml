# Synthetic profile: base chart, subcharts off. Isolates Union-chart behavior from
# upstream dependency churn. Not a real deployment -- see README.md.
global:
  CONTROLPLANE_HOST: controlplane.example.invalid
  CLUSTER_NAME: example-minimal-1
  ORG_NAME: example-org
  METADATA_BUCKET: example-metadata-bucket
  FAST_REGISTRATION_BUCKET: example-metadata-bucket
  AUTH_CLIENT_ID: example-client-id

monitoring:
  enabled: false
prometheus:
  enabled: false
metrics-server:
  enabled: false
opencost:
  enabled: false
fluentbit:
  enabled: false
dcgm-exporter:
  enabled: false
ingress-nginx:
  enabled: false
knative-operator:
  enabled: false
imageBuilder:
  enabled: false
apps:
  enabled: false
serving:
  enabled: false

# Placeholder client credentials -- the chart requires these to render.
secrets:
  admin:
    create: true
    clientId: example-client-id
    clientSecret: example-client-secret-placeholder
