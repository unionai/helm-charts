# Synthetic profile: Azure, Workload Identity, blob storage, apps ON, Zero Trust ON,
# low-privilege mode. Not a real deployment -- see README.md.
global:
  CONTROLPLANE_HOST: controlplane.example.invalid
  CLUSTER_NAME: example-azure-1
  ORG_NAME: example-org
  METADATA_BUCKET: example-storage-container
  FAST_REGISTRATION_BUCKET: example-storage-container
  AUTH_CLIENT_ID: example-client-id
  AZURE_BACKEND_CLIENT_ID: 00000000-0000-0000-0000-000000000000
  AZURE_WORKER_CLIENT_ID: 00000000-0000-0000-0000-000000000000

provider: azure
low_privilege: true

azure:
  tenantId: 00000000-0000-0000-0000-000000000000
  subscriptionId: 00000000-0000-0000-0000-000000000000
  resourceGroupName: example-resource-group

storage:
  provider: custom
  bucketName: example-storage-container
  custom:
    type: stow
    connection: {}
    stow:
      kind: azure
      config:
        account: exampleaccount
    container: example-storage-container

namespaces:
  enabled: true
clusterresourcesync:
  enabled: true
flytepropeller:
  enabled: true
opencost:
  enabled: true

# Zero-trust axis.
zero_trust:
  enabled: true

# App-serving axis, without claiming a tenant-wide ingress.
apps:
  enabled: true
tunnelService:
  apps:
    enableGlobalIngress: false
knative-operator:
  enabled: false

imageBuilder:
  enabled: true
  authenticationType: azure
  defaultRepository: registry.example.invalid/example
dcgm-exporter:
  enabled: false

# Placeholder client credentials -- the chart requires these to render.
secrets:
  admin:
    create: true
    clientId: example-client-id
    clientSecret: example-client-secret-placeholder
