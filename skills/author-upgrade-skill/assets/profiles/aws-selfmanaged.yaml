# Synthetic profile: AWS, IRSA identity, S3 storage, apps off, standard privilege.
# Not a real deployment -- see README.md.
global:
  CONTROLPLANE_HOST: controlplane.example.invalid
  CLUSTER_NAME: example-aws-1
  ORG_NAME: example-org
  METADATA_BUCKET: example-metadata-bucket
  FAST_REGISTRATION_BUCKET: example-metadata-bucket
  AUTH_CLIENT_ID: example-client-id
  BACKEND_IAM_ROLE_ARN: arn:aws:iam::000000000000:role/example-backend
  WORKER_IAM_ROLE_ARN: arn:aws:iam::000000000000:role/example-worker

provider: aws
low_privilege: false

storage:
  provider: aws
  bucketName: example-metadata-bucket

namespaces:
  enabled: true
clusterresourcesync:
  enabled: true
flytepropeller:
  enabled: true
opencost:
  enabled: true

apps:
  enabled: false
serving:
  enabled: false
knative-operator:
  enabled: false
imageBuilder:
  enabled: false
dcgm-exporter:
  enabled: false

# Placeholder client credentials -- the chart requires these to render.
secrets:
  admin:
    create: true
    clientId: example-client-id
    clientSecret: example-client-secret-placeholder
