# Source: onebox/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    onebox:
      organization: "onebox"
      seedProjects: ["default"]
      listen:
        address: ":8080"
        tasksAddress: ":8082"
      consoleUpstream: "http://127.0.0.1:3000"
      logoutRedirect: "/v2"
      # Task pods call back over the in-cluster tasks port, where every
      # request acts as the built-in tasks app (authz.tasksRole).
      taskEndpoint: "release-name-onebox.union.svc:8082"
      identity:
        subjectHeaders: ["X-Forwarded-User"]
        emailHeaders: ["X-Forwarded-Email"]
        nameHeaders: ["X-Forwarded-Preferred-Username"]
        groupsHeaders: ["X-Forwarded-Groups"]
        claimsJWTHeaders: []
        anonymousSubject: "anonymous"
      profiles:
        enabled: true
      authz:
        enabled: false
        adminUsers: []
        defaultRole: "viewer"
        tasks:
          role: "contributor"
      apps:
        provider: "none"
      userclouds:
        clientSecretPath: /etc/onebox/internal/userclouds-client-secret
      webhook:
        enabled: true
        serviceName: "release-name-onebox"
        # templates/webhook.yaml installs the configuration and cert Secret.
        externalConfiguration: true
      # Union apps, run on Knative Serving in the cluster.
      serving:
        enabled: true
        publicURLPattern: "https://%s.apps.onebox.example.com"
      clusterData:
        metadataBucketPrefix: "s3://onebox-data"
        storageType: "s3"
        bucketRegion: "us-east-2"
        gcpProjectId: ""
    db:
      host: "postgres.example.internal"
      port: 5432
      dbname: "union"
      username: "union"
      passwordPath: /etc/onebox/db/password
      options: "sslmode=disable"
      connectionPool:
        maxIdleConnections: 2
        maxOpenConnections: 40
    storage:
      
      type: stow
      container: "onebox-data"
      enable-multicontainer: true
      stow:
        kind: s3
        config:
          region: "us-east-2"
          # Credentials come from the pod: IRSA / pod identity, or AWS_* env vars
          # from storage.existingSecret.
          auth_type: iam
    # Task pods, their secrets and their logs all live in this namespace.
    leaseworker:
      namespace-template: "union"
      limit-namespace: "union"
    namespace_mapping:
      template: "union"
    fasttask:
      callback-uri: "http://release-name-onebox.union.svc:15606"
    plugins:
      k8s:
        default-env-vars:
          - AWS_REGION: "us-east-2"
  extra.yaml: |
    {}

