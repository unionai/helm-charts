# Source: onebox/templates/nodeagent.yaml
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: volumes.union.ai
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
spec:
  # Node-local ephemeral inline volumes only: the broker premounts a FUSE
  # channel per pod and hands its fd to the pod's unprivileged client.
  volumeLifecycleModes:
    - Ephemeral
  attachRequired: false
  podInfoOnMount: true
  storageCapacity: false
  fsGroupPolicy: None
