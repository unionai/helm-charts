  name: release-name-onebox-kourier
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.10.5
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.10.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: kourier
