# Source: onebox/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.10.5
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.10.5"
    app.kubernetes.io/managed-by: Helm
spec:
  # One process serves everything and the leasor holds its queues in memory:
  # never two at once, not even during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: onebox
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onebox
        app.kubernetes.io/instance: release-name
      annotations:
        checksum/config: 24319dd027d944346d7e503fe9978dcf2e6f7deebebf96a41e8a1fe3f5275d35
    spec:
      serviceAccountName: release-name-onebox
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: onebox
          image: "ghcr.io/unionai/onebox-server:2026.10.5"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/etc/onebox/config/config.yaml
            - --config=/etc/onebox/config/extra.yaml
            - --work-dir=/var/run/onebox
          ports:
            - name: http
              containerPort: 8080
            - name: tasks
              containerPort: 8082
            - name: gateway
              containerPort: 8083
            - name: fasttask
              containerPort: 15606
            - name: metrics
              containerPort: 10254
            - name: webhook
              containerPort: 9443
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/onebox/config
            - name: db-password
              mountPath: /etc/onebox/db
            - name: internal
