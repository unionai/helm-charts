# Source: onebox/templates/webhook.yaml
# Secret injection into task pods in this namespace only. Named after the
# namespace too: the object is cluster-scoped.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: union-release-name-onebox
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
webhooks:
  - name: flyte-pod-webhook.flyte.org
    admissionReviewVersions: [v1, v1beta1]
    clientConfig:
      caBundle: dGVzdC1jYQ==
      service:
        name: release-name-onebox
        namespace: union
        path: /mutate--v1-pod
        port: 9443
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: union
    objectSelector:
      matchLabels:
        inject-flyte-secrets: "true"
    reinvocationPolicy: Never
    rules:
      - apiGroups: ["*"]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: "*"
    sideEffects: NoneOnDryRun
    timeoutSeconds: 30

