# Source: onebox/templates/rbac.yaml
# onebox runs task pods and keeps their secrets in its own namespace; it needs
# nothing outside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.11.2
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.11.2"
    app.kubernetes.io/managed-by: Helm
rules:
  # Task pods, their logs, and the pod templates tasks may name.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log, podtemplates, serviceaccounts]
    verbs: [get, list, watch]
  # Secrets: the secret store, image pull secrets, the webhook's certificate.
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # Task events: read for the console, recorded by the worker.
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [get, list, watch, create, update, patch]
  # The operator proxy's namespace quota route (read only).
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list, watch]
  # Apps: each is a Knative Service the app controller owns, plus an optional
  # PodDisruptionBudget for apps that keep several replicas.
  - apiGroups: [serving.knative.dev]
    resources: [services, configurations, revisions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [serving.knative.dev]
    resources: [services/status]
    verbs: [get]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
