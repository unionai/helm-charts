    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 100%
  selector:
    matchLabels:
      app: 3scale-kourier-gateway
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app: 3scale-kourier-gateway
        app.kubernetes.io/instance: release-name
    spec:
      serviceAccountName: release-name-onebox-kourier
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: kourier-gateway
          image: "ghcr.io/unionai/envoy:2026.10.5"
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/envoy]
          args:
            - --base-id 1
            - -c /tmp/config/envoy-bootstrap.yaml
            - --log-level info
            - --drain-time-s $(DRAIN_TIME_SECONDS)
            - --drain-strategy immediate
          env:
            - name: DRAIN_TIME_SECONDS
              value: "15"
            # The union-apps filter asks onebox's gateway port who a caller is
            # (/me) and whether they may use the app (AuthorizerService).
            - name: UNION_AUTH_TENANTAUTHURL
              value: "http://release-name-onebox.union.svc.cluster.local:8083/me"
            - name: UNION_AUTH_TENANTCONTROLPLANEURL
              value: "http://release-name-onebox.union.svc.cluster.local:8083"
            - name: UNION_AUTH_TENANTAUTHSIGNINURL
              value: "https://onebox.example.com/oauth2/start"
            - name: UNION_AUTH_OVERRIDENORG
              value: "onebox"
          ports:
            - name: http2-external
              containerPort: 8080
            - name: http2-internal
              containerPort: 8081
            - name: https-external
              containerPort: 8443
            - name: http-probe
              containerPort: 8090
            - name: https-probe
              containerPort: 9443
            - name: metrics
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config-volume
              mountPath: /tmp/config
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: internalkourier
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: internalkourier
              path: /ready
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              memory: 800Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: config-volume
          configMap:
            name: release-name-onebox-kourier-bootstrap
