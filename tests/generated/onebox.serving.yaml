            - name: PG_USER
              value: "union"
            - name: PG_PASSWORD_FILE
              value: /etc/onebox/db/password
            - name: PG_SSLMODE
              value: "disable"
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: db-password
              mountPath: /etc/onebox/db
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: release-name-onebox
        - name: db-password
          secret:
            secretName: onebox-db
            items:
              - key: password
                path: password
        - name: internal
          secret:
            secretName: onebox-internal
        - name: work
