              value: "true"
          ports:
            - name: http2-external
              containerPort: 8080
            - name: http2-internal
              containerPort: 8081
            - name: https-external
              containerPort: 8443
            - name: http-probe
              containerPort: 8090
            - name: https-probe
              containerPort: 9443
            - name: metrics
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config-volume
              mountPath: /tmp/config
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: internalkourier
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: internalkourier
              path: /ready
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              memory: 800Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: config-volume
          configMap:
            name: release-name-onebox-kourier-bootstrap
