apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.11.2
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.11.2"
    app.kubernetes.io/managed-by: Helm
spec:
  # One process serves everything and the leasor holds its queues in memory:
  # never two at once, not even during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: onebox
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onebox
        app.kubernetes.io/instance: release-name
      annotations:
        checksum/config: 3594d9c6c0029f0ee3a3f2c958069786104424984258026bbd28649ad89b7eca
    spec:
      serviceAccountName: release-name-onebox
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: onebox
          image: "ghcr.io/unionai/onebox-server:2026.11.2"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/etc/onebox/config/config.yaml
            - --config=/etc/onebox/config/extra.yaml
            - --work-dir=/var/run/onebox
          ports:
            - name: http
              containerPort: 8080
            - name: tasks
              containerPort: 8082
            - name: gateway
              containerPort: 8083
            - name: fasttask
              containerPort: 15606
            - name: metrics
              containerPort: 10254
            - name: webhook
              containerPort: 9443
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/onebox/config
            - name: db-password
              mountPath: /etc/onebox/db
            - name: internal
              mountPath: /etc/onebox/internal
            - name: work
              mountPath: /var/run/onebox
            - name: tmp
              mountPath: /tmp
        - name: console
          image: "ghcr.io/unionai/onebox-console:2026.11.2"
          imagePullPolicy: IfNotPresent
          env:
            # Loopback only: onebox serves the console under /v2 on its port.
            - name: HOSTNAME
              value: 127.0.0.1
            - name: PORT
              value: "3000"
            - name: UNION_ORG_OVERRIDE
              value: "onebox"
            - name: IS_SELF_HOSTED
              value: "true"
            - name: DISABLE_EXTERNAL_TELEMETRY
              value: "true"
            - name: SELF_HOSTED_FEATURE_FLAGS
              value: "{\"artifacts-enabled\":true,\"llm-gateway-enabled\":true}"
            # Project and org dashboards, queried from onebox's database. Access
            # is checked by replaying the caller's request to onebox's public
            # port (never the internal one, which trusts its callers).
            - name: DASHBOARD_BACKEND
              value: postgres
            - name: DASHBOARD_ORG
              value: "onebox"
            - name: DASHBOARD_AUTH_URL
              value: http://127.0.0.1:8080
            - name: PG_HOST
              value: "postgres.example.internal"
            - name: PG_PORT
              value: "5432"
            - name: PG_DATABASE
              value: "union"
            - name: PG_USER
              value: "union"
            - name: PG_PASSWORD_FILE
              value: /etc/onebox/db/password
            - name: PG_SSLMODE
              value: "disable"
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: db-password
              mountPath: /etc/onebox/db
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: release-name-onebox
        - name: db-password
          secret:
            secretName: onebox-db
            items:
              - key: password
                path: password
        - name: internal
          secret:
            secretName: onebox-internal
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}

