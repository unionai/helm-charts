# Source: onebox/templates/bundled.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-onebox-s3
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: release-name-onebox-s3
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-name-onebox-s3
        app.kubernetes.io/instance: release-name
    spec:
      containers:
        - name: s3
          image: docker.io/floci/floci:1.7.0
          env:
            - {name: FLOCI_DEFAULT_REGION, value: us-east-1}
            - {name: FLOCI_STORAGE_MODE, value: hybrid}
            - {name: FLOCI_STORAGE_PERSISTENT_PATH, value: /data}
            - {name: FLOCI_SERVICES_LAMBDA_ENABLED, value: "false"}
            - {name: FLOCI_SERVICES_RDS_ENABLED, value: "false"}
            - {name: FLOCI_SERVICES_ECS_ENABLED, value: "false"}
            - {name: FLOCI_SERVICES_EKS_ENABLED, value: "false"}
            - {name: FLOCI_SERVICES_EC2_ENABLED, value: "false"}
          ports:
            - containerPort: 4566
          readinessProbe:
            tcpSocket:
              port: 4566
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
        # Creates the bucket, and the CORS rule the console's presigned reads
        # need, whenever the store starts; both calls are idempotent.
        - name: bucket
          image: docker.io/curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              until curl -fsS -o /dev/null -X PUT http://127.0.0.1:4566/onebox || curl -fsS -o /dev/null http://127.0.0.1:4566/onebox; do sleep 2; done
              until curl -fsS -o /dev/null -X PUT -H 'Content-Type: application/xml' 'http://127.0.0.1:4566/onebox?cors' --data-binary \
                '<CORSConfiguration><CORSRule><AllowedOrigin>*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>'; do sleep 2; done
              echo bucket ready
              exec sleep 2147483647
          resources:
            requests: {cpu: 10m, memory: 16Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: release-name-onebox-s3
---
# Source: onebox/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
spec:
  # One process serves everything and the leasor holds its queues in memory:
  # never two at once, not even during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: onebox
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onebox
        app.kubernetes.io/instance: release-name
      annotations:
        checksum/config: 754582798f809365d2d02458044411a5765cf860a4ca4f181e6edc25aadc7bcd
    spec:
      serviceAccountName: release-name-onebox
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: onebox
          image: "registry.unionai.cloud/controlplane/onebox:2026.9.7"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/etc/onebox/config/config.yaml
            - --config=/etc/onebox/config/extra.yaml
            - --work-dir=/var/run/onebox
          ports:
            - name: http
              containerPort: 8080
            - name: tasks
              containerPort: 8082
            - name: fasttask
              containerPort: 15606
            - name: metrics
              containerPort: 10254
            - name: webhook
              containerPort: 9443
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: release-name-onebox-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: release-name-onebox-s3
                  key: AWS_SECRET_ACCESS_KEY
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/onebox/config
            - name: db-password
              mountPath: /etc/onebox/db
            - name: internal
              mountPath: /etc/onebox/internal
            - name: work
              mountPath: /var/run/onebox
            - name: tmp
              mountPath: /tmp
        - name: console
          image: "registry.unionai.cloud/controlplane/unionconsole:2026.9.7"
          imagePullPolicy: IfNotPresent
          env:
            # Loopback only: onebox serves the console under /v2 on its port.
            - name: HOSTNAME
              value: 127.0.0.1
            - name: PORT
              value: "3000"
            - name: UNION_ORG_OVERRIDE
              value: "onebox"
            - name: IS_SELF_HOSTED
              value: "true"
            - name: DISABLE_EXTERNAL_TELEMETRY
              value: "true"
            - name: SELF_HOSTED_FEATURE_FLAGS
              value: "{\"artifacts-enabled\":true}"
            # Project and org dashboards, queried from onebox's database. Access
            # is checked by replaying the caller's request to onebox's public
            # port (never the internal one, which trusts its callers).
            - name: DASHBOARD_BACKEND
              value: postgres
            - name: DASHBOARD_ORG
              value: "onebox"
            - name: DASHBOARD_AUTH_URL
              value: http://127.0.0.1:8080
            - name: PG_HOST
              value: "release-name-onebox-postgres"
            - name: PG_PORT
              value: "5432"
            - name: PG_DATABASE
              value: "union"
            - name: PG_USER
              value: "union"
            - name: PG_PASSWORD_FILE
              value: /etc/onebox/db/password
            - name: PG_SSLMODE
              value: "disable"
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: db-password
              mountPath: /etc/onebox/db
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: release-name-onebox
        - name: db-password
          secret:
            secretName: release-name-onebox-db
            items:
              - key: password
                path: password
        - name: internal
          secret:
            secretName: onebox-internal
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
