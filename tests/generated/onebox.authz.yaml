    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    resourceNames: ["release-name-onebox"]
    verbs: [get, update, patch]
---
# Source: onebox/templates/rbac.yaml
