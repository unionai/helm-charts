---
# Source: onebox/templates/networkpolicy.yaml
# The tasks port trusts whoever reaches it as the built-in tasks app: only task
# pods (this namespace, plus tasksFrom) may. Only the authenticating proxy may
# reach the port that trusts its identity headers, when proxyFrom names it.
# The webhook port stays open: the API server's address is not something a
# policy can name portably.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: onebox
      app.kubernetes.io/instance: release-name
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth
          podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
    - ports:
        - port: 8082
        - port: 15606
      from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              union.ai/onebox-tasks: "true"
    - ports:
        - port: 9443
    - ports:
        - port: 10254

