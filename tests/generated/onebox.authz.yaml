---
# Source: onebox/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    onebox:
      organization: "onebox"
      seedProjects: ["default"]
      listen:
        address: ":8080"
        tasksAddress: ":8082"
      consoleUpstream: "http://127.0.0.1:3000"
      logoutRedirect: "/oauth2/sign_out"
      authMetadata:
        externalAuthServerBaseUrl: "https://example.okta.com/oauth2/default"
        flyteClient:
          audience: ""
          clientId: 0oa-sdk-client
          redirectUri: http://localhost:53593/callback
          scopes:
          - openid
          - profile
          - offline_access
      # Task pods call back over the in-cluster tasks port, where every
      # request acts as the built-in tasks app (authz.tasksRole).
      taskEndpoint: "release-name-onebox.union.svc:8082"
      identity:
        subjectHeaders: ["X-Forwarded-User"]
        emailHeaders: ["X-Forwarded-Email"]
        nameHeaders: ["X-Forwarded-Preferred-Username"]
        groupsHeaders: ["X-Forwarded-Groups"]
        claimsJWTHeaders: ["Cf-Access-Jwt-Assertion"]
        anonymousSubject: "anonymous"
        proxySecretHeader: "X-Onebox-Proxy-Secret"
        proxySecretPath: /etc/onebox/proxy/secret
      profiles:
        enabled: true
      authz:
        enabled: true
        adminUsers: ["admin@example.com"]
        defaultRole: "contributor"
        tasks:
          role: "contributor"
      apps:
        provider: "none"
      userclouds:
        clientSecretPath: /etc/onebox/internal/userclouds-client-secret
      webhook:
        enabled: true
        serviceName: "release-name-onebox"
      clusterData:
        metadataBucketPrefix: "s3://onebox-data"
        storageType: "s3"
        bucketRegion: "us-east-1"
        gcpProjectId: ""
    db:
      host: "postgres.example.internal"
      port: 5432
      dbname: "union"
      username: "union"
      passwordPath: /etc/onebox/db/password
      options: "sslmode=require"
      connectionPool:
        maxIdleConnections: 2
        maxOpenConnections: 40
    storage:
      
      type: stow
      container: "onebox-data"
      enable-multicontainer: true
      stow:
        kind: s3
        config:
          region: "us-east-1"
          # Credentials come from the pod: IRSA / pod identity, or AWS_* env vars
          # from storage.existingSecret.
          auth_type: iam
          endpoint: "https://minio.example.internal"
          disable_ssl: false
    # Task pods, their secrets and their logs all live in this namespace.
    leaseworker:
      namespace-template: "union"
      limit-namespace: "union"
    namespace_mapping:
      template: "union"
    fasttask:
      callback-uri: "http://release-name-onebox.union.svc:15606"
    plugins:
      k8s:
        default-env-vars:
          - FLYTE_AWS_ENDPOINT: "https://minio.example.internal"
          - AWS_ENDPOINT_URL: "https://minio.example.internal"
          - AWS_REGION: "us-east-1"
        default-env-from-secrets:
          - "onebox-s3"
  extra.yaml: |
    {}

