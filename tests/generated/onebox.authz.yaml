# Source: onebox/templates/rbac.yaml
# onebox runs task pods, and keeps their secrets and plugin objects, in its
# own namespace; it needs nothing outside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-name-onebox
  namespace: union
  labels:
