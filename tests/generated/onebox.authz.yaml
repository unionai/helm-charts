---
# Source: onebox/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
  ports:
    # The console (/v2), the Connect and gRPC API and the REST routes. Put the
    # authenticating proxy in front of this port.
    - name: http
      port: 80
      targetPort: http
      appProtocol: kubernetes.io/h2c
    # Task pods call the API here: TLS with a self-signed certificate, which
    # they do not verify. In-cluster only.
    - name: tasks
      port: 443
      targetPort: tasks
    # Reusable-container (fast task) workers report back here. In-cluster only.
    - name: fasttask
      port: 15606
      targetPort: fasttask
    # The API server calls the pod webhook here (task pods only).
    - name: webhook
      port: 9443
      targetPort: webhook

---
# Source: onebox/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
spec:
  # One process serves everything and the leasor holds its queues in memory:
  # never two at once, not even during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: onebox
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onebox
        app.kubernetes.io/instance: release-name
      annotations:
        checksum/config: 110cd990809cd4e704a7a594468d9e04f3771bcbb03984a2ef0febb662bee961
    spec:
      serviceAccountName: release-name-onebox
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: onebox
          image: "registry.unionai.cloud/controlplane/onebox:2026.9.7"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/etc/onebox/config/config.yaml
            - --config=/etc/onebox/config/extra.yaml
            - --work-dir=/var/run/onebox
          ports:
            - name: http
              containerPort: 8080
            - name: tasks
              containerPort: 8443
            - name: fasttask
              containerPort: 15606
            - name: metrics
              containerPort: 10254
            - name: webhook
              containerPort: 9443
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: onebox-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: onebox-s3
                  key: AWS_SECRET_ACCESS_KEY
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/onebox/config
            - name: db-password
              mountPath: /etc/onebox/db
            - name: internal
              mountPath: /etc/onebox/internal
            - name: work
              mountPath: /var/run/onebox
            - name: tmp
              mountPath: /tmp
        - name: console
          image: "registry.unionai.cloud/controlplane/unionconsole:2026.9.7"
          imagePullPolicy: IfNotPresent
          env:
            # Loopback only: onebox serves the console under /v2 on its port.
            - name: HOSTNAME
              value: 127.0.0.1
            - name: PORT
              value: "3000"
            - name: UNION_ORG_OVERRIDE
              value: "onebox"
            - name: IS_SELF_HOSTED
              value: "true"
            - name: DISABLE_EXTERNAL_TELEMETRY
              value: "true"
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: release-name-onebox
        - name: db-password
          secret:
            secretName: release-name-onebox-db
            items:
              - key: password
                path: password
        - name: internal
          secret:
            secretName: onebox-internal
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
