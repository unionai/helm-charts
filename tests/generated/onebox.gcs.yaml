# Source: onebox/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
  ports:
    # The console (/v2), the Connect and gRPC API and the REST routes. Put the
    # authenticating proxy in front of this port.
    - name: http
      port: 80
      targetPort: http
      appProtocol: kubernetes.io/h2c
    # Task pods call the API here; every request acts as the built-in tasks
    # app. In-cluster only (see networkPolicy).
    - name: tasks
      port: 8082
      targetPort: tasks
      appProtocol: kubernetes.io/h2c
    # Reusable-container (fast task) workers report back here. In-cluster only.
    - name: fasttask
      port: 15606
      targetPort: fasttask

