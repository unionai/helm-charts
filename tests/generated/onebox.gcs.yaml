    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-name-onebox
subjects:
  - kind: ServiceAccount
    name: release-name-onebox
    namespace: union

---
# Source: onebox/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
  ports:
    # The console (/v2), the Connect and gRPC API and the REST routes. Put the
    # authenticating proxy in front of this port.
    - name: http
      port: 80
      targetPort: http
      appProtocol: kubernetes.io/h2c
    # Task pods call the API here; every request acts as the built-in tasks
    # app. In-cluster only (see networkPolicy).
    - name: tasks
      port: 8082
      targetPort: tasks
      appProtocol: kubernetes.io/h2c
    # Reusable-container (fast task) workers report back here. In-cluster only.
    - name: fasttask
      port: 15606
      targetPort: fasttask

---
# Source: onebox/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
spec:
  # One process serves everything and the leasor holds its queues in memory:
  # never two at once, not even during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: onebox
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onebox
        app.kubernetes.io/instance: release-name
      annotations:
        checksum/config: d1d993717d43978aade6dec8303bc988f5b13978f0f310ba926d1dde101324a0
    spec:
      serviceAccountName: release-name-onebox
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: onebox
          image: "registry.unionai.cloud/controlplane/onebox:2026.9.7"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/etc/onebox/config/config.yaml
            - --config=/etc/onebox/config/extra.yaml
            - --work-dir=/var/run/onebox
          ports:
            - name: http
              containerPort: 8080
            - name: tasks
              containerPort: 8082
            - name: fasttask
              containerPort: 15606
            - name: metrics
              containerPort: 10254
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/onebox/config
            - name: db-password
              mountPath: /etc/onebox/db
            - name: internal
              mountPath: /etc/onebox/internal
            - name: work
              mountPath: /var/run/onebox
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: release-name-onebox
        - name: db-password
          secret:
            secretName: onebox-db
            items:
              - key: password
                path: password
        - name: internal
          secret:
            secretName: onebox-internal
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
