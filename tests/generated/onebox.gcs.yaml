# Source: onebox/templates/nodeagent.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: release-name-onebox-node-agent
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
spec:
  # Not onebox's selector labels: the Service selects those.
  selector:
    matchLabels:
      app.kubernetes.io/name: release-name-onebox-node-agent
      app.kubernetes.io/instance: release-name
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-name-onebox-node-agent
        app.kubernetes.io/instance: release-name
      annotations:
        # Components read the config at start.
        checksum/config: 3b1897cae953d6ffbf9de6cd278ac250c83da5bed2ad29423b2154545b8809d9
        prometheus.io/scrape: "true"
        prometheus.io/port: "10254"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: release-name-onebox-node-agent
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      volumes:
        - name: config
          configMap:
            name: release-name-onebox-node-agent
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: uvol-sockets
          hostPath:
            path: /run/uvol
            type: DirectoryOrCreate
        - name: uvol-state
          hostPath:
            path: /var/lib/uvol/state
            type: DirectoryOrCreate
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: uvol-node-cache
          hostPath:
            path: /var/lib/uvol/node-cache
            type: DirectoryOrCreate
      containers:
        - name: node-agent
          image: "registry.unionai.cloud/controlplane/onebox:2026.9.7"
          imagePullPolicy: IfNotPresent
          args: [nodeagent, run, --config, /etc/union/agent.yaml]
          securityContext:
            # /dev/fuse is outside the runtime's device allowlist, and only
            # privileged grants it; the image's non-root USER is forced back
            # to root because the device is root-owned.
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: metrics
              containerPort: 10254
              protocol: TCP
          # Ready once kubelet has acknowledged the CSI registration; until
          # then every NodePublish fails with "driver not found".
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              memory: 320Mi
            requests:
              cpu: 20m
              memory: 64Mi
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOG_LEVEL
              value: "4"
          volumeMounts:
            - name: config
              mountPath: /etc/union
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              # The broker premounts FUSE inside kubelet-owned publish targets;
              # the mounts must propagate to the host and on into task pods.
              mountPropagation: Bidirectional
            - name: uvol-sockets
              mountPath: /run/uvol
            - name: uvol-state
              mountPath: /var/lib/uvol/state
            - name: dev-fuse
              mountPath: /dev/fuse
            - name: uvol-node-cache
              mountPath: /var/lib/uvol/node-cache

