# Source: onebox/templates/nodeagent.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-name-onebox-node-agent
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
data:
  agent.yaml: |
    nodeReadiness:
      enabled: false
    gpuFaultWatcher:
      enabled: false
    uvolBroker:
      enabled: true
      driverName: volumes.union.ai
      kubeletDir: /var/lib/kubelet
      socketDir: /run/uvol
      stateDir: /var/lib/uvol/state
      nodeCacheDir: /var/lib/uvol/node-cache
      blockAllow:
        - namespace: union
      blockFreezeMax: "60s"
      metricsScope: "uvol_broker"
      profilerPort: 10254
