---
# Source: onebox/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
  annotations:
    iam.gke.io/gcp-service-account: onebox@acme-prod.iam.gserviceaccount.com

---
# Source: onebox/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    onebox:
      organization: "acme"
      seedProjects: ["default"]
      listen:
        address: ":8080"
        tasksAddress: ":8082"
      consoleUpstream: ""
      logoutRedirect: "/v2"
      # Task pods call back over the in-cluster tasks port, where every
      # request acts as the built-in tasks app (authz.tasksRole).
      taskEndpoint: "release-name-onebox.union.svc:8082"
      identity:
        subjectHeaders: ["X-Forwarded-User"]
        emailHeaders: ["X-Forwarded-Email"]
        nameHeaders: ["X-Forwarded-Preferred-Username"]
        groupsHeaders: ["X-Forwarded-Groups"]
        claimsJWTHeaders: []
        anonymousSubject: "anonymous"
      profiles:
        enabled: true
      authz:
        enabled: false
        adminUsers: []
        defaultRole: "viewer"
        tasks:
          role: "contributor"
      apps:
        provider: "none"
      userclouds:
        clientSecretPath: /etc/onebox/internal/userclouds-client-secret
      webhook:
        enabled: false
        serviceName: "release-name-onebox"
        # templates/webhook.yaml installs the configuration and cert Secret.
        externalConfiguration: true
      clusterData:
        metadataBucketPrefix: "gs://acme-onebox"
        storageType: "gcs"
        bucketRegion: "us-east-1"
        gcpProjectId: "acme-prod"
    db:
      host: "10.0.0.5"
      port: 5432
      dbname: "union"
      username: "union"
      passwordPath: /etc/onebox/db/password
      options: "sslmode=disable"
      connectionPool:
        maxIdleConnections: 2
        maxOpenConnections: 40
    storage:
      
      type: stow
      container: "acme-onebox"
      enable-multicontainer: true
      stow:
        kind: google
        config:
          json: ""
          project_id: "acme-prod"
          scopes: https://www.googleapis.com/auth/cloud-platform
    # Task pods, their secrets and their logs all live in this namespace.
    leaseworker:
      namespace-template: "union"
      limit-namespace: "union"
    namespace_mapping:
      template: "union"
    fasttask:
      callback-uri: "http://release-name-onebox.union.svc:15606"
    plugins:
      k8s:
        default-env-vars:
          - AWS_REGION: "us-east-1"
  extra.yaml: |
    {}

---
# Source: onebox/templates/rbac.yaml
# onebox runs task pods and keeps their secrets in its own namespace; it needs
# nothing outside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "2026.9.7"
    app.kubernetes.io/managed-by: Helm
rules:
  # Task pods, their logs, and the pod templates tasks may name.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log, podtemplates, serviceaccounts]
    verbs: [get, list, watch]
  # Secrets: the secret store, image pull secrets, the webhook's certificate.
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # Task events: read for the console, recorded by the worker.
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [get, list, watch, create, update, patch]
  # The operator proxy's namespace quota route (read only).
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list, watch]
---
# Source: onebox/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-name-onebox
  namespace: union
  labels:
    helm.sh/chart: onebox-2026.9.7
    app.kubernetes.io/name: onebox
