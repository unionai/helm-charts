apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: controlplane-grpc-unprotected-h2c
  namespace: union
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: controlplane-grpc-unprotected
  timeout:
    tcp:
      connectTimeout: "1200s"  # grpc_connect_timeout 1200s
    http:
      requestTimeout: "1200s"  # grpc_read_timeout 1200s (unary calls)
      maxStreamDuration: "0s"  # no limit for WatchExecutionStatusUpdates streaming
  tcpKeepalive:
    probes: 9
    idleTime: "15s"
    interval: "15s"
  http2: {}
