# Source: controlplane/templates/flyte-core-app.yaml
# Second GRPCRoute — split from grpcroute-protected to stay within the
# Gateway API 16-rule-per-resource limit (gateway.networking.k8s.io CRD v1.4.1).
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: controlplane-grpc-protected-extended
  namespace: union
spec:
  parentRefs:
    - name: controlplane
      namespace: union
  hostnames:
    - "test.example.com"
    - "envoy-controlplane.envoy-gateway.svc.cluster.local"
  rules:
    # leasor (v2 — queue/lease equivalent for v2 actions/leasor stack)
    - matches:
        - method: {service: "cloudidl.workflow.v2.LeasorService"}
      backendRefs:
        - name: leasor
          port: 80
    # actions + pluginState (v2)
    - matches:
        - method: {service: "flyteidl2.actions.ActionsService"}
        - method: {service: "cloudidl.pluginstate.PluginStateService"}
      backendRefs:
        - name: actions
          port: 80
    # eventsProxy (v2 — runs in the executions binary, called by leaseworker)
    - matches:
        - method: {service: "flyteidl2.workflow.EventsProxyService"}
      backendRefs:
        - name: executions
          port: 80
    # Union v2 workflow services (executions)
    - matches:
        - method: {service: "cloudidl.workflow.RunService"}
        - method: {service: "cloudidl.workflow.InternalRunService"}
        - method: {service: "cloudidl.workflow.TaskService"}
        - method: {service: "cloudidl.workflow.TriggerService"}
        - method: {service: "flyteidl2.workflow.RunService"}
        - method: {service: "flyteidl2.task.TaskService"}
        - method: {service: "flyteidl2.trigger.TriggerService"}
      backendRefs:
        - name: executions
          port: 80
