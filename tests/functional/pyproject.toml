[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
# Rerun a scenario once on a *transient* failure only (infra / registry /
# propagation); a deterministic failure (assertion, wrong cluster, missing
# outputs) doesn't match a pattern and fails immediately. Mirrors the old
# _is_transient classifier. The pattern is QUOTED and uses literal spaces:
# pytest shlex-splits addopts and would otherwise eat the backslashes in "\s+".
addopts = '''-ra -p no:cacheprovider --reruns 1 --reruns-delay 15 --only-rerun "(?i)(no clusters? found|imagepullbackoff|errimagepull|back-off pulling|grace period|not ready within|did not reach a terminal state|connection (refused|reset|aborted)|deadline exceeded|timed out|etcdserver|50[234]|temporarily unavailable|service unavailable|too many requests|cluster .*not found)"'''
markers = [
    "app: app-serving test (skipped with --skip-app on selfhosted)",
    "logs: log-persistence test (skipped with --skip-logs on k3d)",
]
