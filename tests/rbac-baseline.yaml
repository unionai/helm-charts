- name: union-executor-ns-write
  invariant: cluster_write
  reason: 'rbac.clusterWideBindings defaults to true (dataplane RBAC namespaced-bindings plan, task 2). Task namespaces are created at runtime by clusterresourcesync or an external provisioner, so Helm cannot enumerate them at template time and cannot emit a RoleBinding per namespace for a set it does not know. The executor''s ns-write ClusterRole is bound cluster-wide by default so it can reach task namespaces to launch task pods -- ns-write for the executor is apiGroups:[*] resources:[*] write. The release-namespace RoleBinding is emitted alongside it, so setting rbac.clusterWideBindings: false is a pure removal with no window in which the workload holds neither binding. See charts/dataplane/RELEASE.md (Unreleased) and the rbac.clusterWideBindings comment in charts/dataplane/values.yaml.'
  snapshots:
  - dataplane.per-component-sa-full-priv
  grant:
  - binding union-executor-ns-write
  - subject ServiceAccount/union/executor
  - write apiGroups=[*] resources=[*] verbs=[create,delete,patch,update]
