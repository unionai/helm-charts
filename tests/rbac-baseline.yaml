- name: union-union-cluster-write
  invariant: cluster_write
  reason: 'Escape hatch. With flytepropellerwebhook.managedConfig: false the webhook registers its own MutatingWebhookConfiguration, which is cluster-scoped and cannot be conveyed by any Role. Reachable only at low_privilege: false -- the template fails the render otherwise. Under the default managedConfig: true, Helm creates the configuration and this grant does not render at all. Carried forward from the entry previously pinned as union-webhook-role for this same snapshot; the object is now named for the shared identity (union-system) rather than for the webhook, because commonServiceAccount.enabled defaults to true and the webhook''s cluster bucket is aggregated onto that ServiceAccount. It is the only component contributing a cluster-write rule here, so the grant is unchanged.'
  snapshots:
  - dataplane.webhook-unmanaged-config-full-priv
  grant:
  - binding union-union-cluster-write
  - subject ServiceAccount/union/union-system
  - write apiGroups=[admissionregistration.k8s.io] resources=[mutatingwebhookconfigurations] verbs=[create,patch,update]
- name: union-union-ns-write
  invariant: cluster_write
  reason: 'rbac.clusterWideBindings defaults to true (dataplane RBAC namespaced-bindings plan, task 2). Task namespaces are created at runtime by clusterresourcesync or an external provisioner, so Helm cannot enumerate them at template time and cannot emit a RoleBinding per namespace for a set it does not know. union-system''s ns-write ClusterRole is bound cluster-wide by default so it can reach task namespaces to launch task pods -- ns-write for the shared identity is apiGroups:[*] resources:[*] write, i.e. how the operator launches task pods. The release-namespace RoleBinding is emitted alongside it, so setting rbac.clusterWideBindings: false is a pure removal with no window in which the workload holds neither binding. See charts/dataplane/RELEASE.md (Unreleased) and the rbac.clusterWideBindings comment in charts/dataplane/values.yaml.'
  snapshots:
  - dataplane.clusterresourcesync
  - dataplane.flytepropeller
  - dataplane.monitoring-full-priv
  - dataplane.namespace-multi
  - dataplane.nodeobserver-full-priv
  - dataplane.webhook-unmanaged-config-full-priv
  - dataplane.zero-trust-full-priv
  grant:
  - binding union-union-ns-write
  - subject ServiceAccount/union/union-system
  - write apiGroups=[*] resources=[*] verbs=[create,delete,patch,update]
  - write apiGroups=[*] resources=[configmaps,deployments,pods,podtemplates,resourcequotas,secrets] verbs=[create,update]
  - write apiGroups=[*] resources=[configmaps,pods,podtemplates,resourcequotas,secrets] verbs=[delete]
