  invariant: cluster_write
  reason: 'rbac.clusterWideBindings defaults to true (dataplane RBAC namespaced-bindings plan, task 2). Task namespaces are created at runtime by clusterresourcesync or an external provisioner, so Helm cannot enumerate them at template time and cannot emit a RoleBinding per namespace for a set it does not know. The webhook''s ns-write ClusterRole is bound cluster-wide by default so it can reach task namespaces to mutate pods and secrets there. The release-namespace RoleBinding is emitted alongside it, so setting rbac.clusterWideBindings: false is a pure removal with no window in which the workload holds neither binding. See charts/dataplane/RELEASE.md (Unreleased) and the rbac.clusterWideBindings comment in charts/dataplane/values.yaml.'
