# helm-values: examples/values-test-certs.yaml
#
# Companion to dataplane.per-component-sa.yaml: commonServiceAccount.enabled:
# false in the multi-namespace posture, where it was already honored. Keyed on
# namespaces.enabled, not the deprecated low_privilege.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
namespaces:
  enabled: true
commonServiceAccount:
  enabled: false

secrets:
  admin:
    create: false

# Enabled only because the webhook's imagePullSecrets guard fails the render
# without it. Not what this fixture pins.
clusterresourcesync:
  enabled: true
