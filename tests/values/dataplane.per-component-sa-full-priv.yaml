# helm-values: examples/values-test-certs.yaml
#
# Coverage for commonServiceAccount.enabled: false at low_privilege: false.
#
# This quadrant was reachable before the useCommonServiceAccount detangle but
# was rendered by no fixture, so per-component ServiceAccounts had never
# appeared in a snapshot in either privilege mode.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
commonServiceAccount:
  enabled: false

secrets:
  admin:
    create: false
