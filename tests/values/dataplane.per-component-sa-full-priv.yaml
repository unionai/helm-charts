# helm-values: examples/values-test-certs.yaml
#
# commonServiceAccount.enabled: false at low_privilege: false.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
commonServiceAccount:
  enabled: false

secrets:
  admin:
    create: false

# Enabled because low_privilege: false now needs something creating work
# namespaces. Not what this fixture pins, but leaving it off would be an
# incoherent config to snapshot.
clusterresourcesync:
  enabled: true
