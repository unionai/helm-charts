# helm-values: examples/values-test-certs.yaml
# storage.credentialsSecretRef.mode=env: no keys in any ConfigMap; components and
# task pods read them from the Secret via secretKeyRef (single-namespace mode).
host: union.us-west-2.union.ai
clusterName: union-r2
orgName: union
provider: compat

secrets:
  admin:
    create: true
    clientId: clientId
    clientSecret: clientSecret

storage:
  provider: compat
  endpoint: "https://xxxxxxxxxxxx.r2.cloudflarestorage.com"
  bucketName: bucket
  region: auto
  fastRegistrationBucketName: bucket
  credentialsSecretRef:
    name: storage-credentials
    mode: env
