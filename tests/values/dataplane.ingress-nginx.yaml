# helm-values: examples/values-test-certs.yaml
# Pins the ingress-nginx subchart's RBAC, which no other fixture renders. The
# chart scopes the controller to the release namespace by default, so what
# should appear is a namespaced Role + RoleBinding and an IngressClass — not a
# ClusterRole granting cluster-wide read on secrets.
global:
  # Control-plane host so the dataplane→CP connection resolves. Without it the
  # dataplane.cp.host template's required guard fails the render.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
ingress-nginx:
  enabled: true

secrets:
  admin:
    create: false
