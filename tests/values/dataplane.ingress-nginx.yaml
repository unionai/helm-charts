# helm-values: examples/values-test-certs.yaml
# Pins the ingress-nginx subchart's RBAC, which no other fixture renders. The chart scopes
# the controller to the release namespace by default, so the golden should show a namespaced
# Role + RoleBinding and an IngressClass — not a ClusterRole reading secrets cluster-wide.
global:
  # Required by dataplane.cp.host's guard.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
ingress-nginx:
  enabled: true

secrets:
  admin:
    create: false
