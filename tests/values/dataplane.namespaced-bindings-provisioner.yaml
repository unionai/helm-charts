# helm-values: examples/values-test-certs.yaml
#
# Work namespaces are not known at template time (namespaces.static empty,
# namespaces.enabled false), so clusterresourcesync creates each one and applies
# the ab_union_rolebinding.yaml entry built from
# dataplane.rbac.provisionerBindingTemplate. That entry must name the work-ns
# ClusterRole and exactly the ServiceAccounts declared into the work-ns slot.
# The ab_ prefix sorts it ahead of the ServiceAccount and ResourceQuota that
# depend on it.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  static: []
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false


secrets:
  admin:
    create: false
