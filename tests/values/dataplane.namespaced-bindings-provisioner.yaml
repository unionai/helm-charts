# helm-values: examples/values-test-certs.yaml
#
# Runtime posture: work namespaces are not known at template time
# (namespaces.static empty, namespaces.enabled at its default false), so
# clusterresourcesync creates each namespace and applies the
# ab_union_rolebinding.yaml entry generated from
# dataplane.rbac.provisionerBindingTemplate. That entry must name the work-ns
# ClusterRole and exactly the ServiceAccounts declared into the work-ns slot;
# the ab_ key sorts it before the ServiceAccount and ResourceQuota that depend
# on it. clusterresourcesync keeps its cluster-scoped rules and a_namespace
# template here. Image-pull secret mirroring is left at the chart default
# (enabled), which this posture supports. Static posture:
# tests/values/dataplane.task-namespaces.yaml.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  static: []
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false


secrets:
  admin:
    create: false
