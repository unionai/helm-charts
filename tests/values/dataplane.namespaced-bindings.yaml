# helm-values: examples/values-test-certs.yaml
#
# rbac.clusterWideBindings: false at low_privilege: false.
#
# The opt-in posture: union workloads hold permissions only where a RoleBinding
# names them, instead of cluster-wide. With taskNamespaces still empty (this
# fixture), the chart emits only the release-namespace RoleBinding and a
# provisioner is expected to create the rest at runtime.
#
# This snapshot is the reference for what an operator gets when they take the
# opt-in without enumerating namespaces -- deliberately covered so the
# combination is visible in review rather than only reachable in production.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"
rbac:
  clusterWideBindings: false

secrets:
  admin:
    create: false
