# helm-values: examples/values-test-certs.yaml
#
# Static posture: namespaces.enabled: true at low_privilege: false, with
# namespaces.static left at its default six names. The chart knows the work
# namespaces at render time, so it emits one `union-work-ns` RoleBinding per listed
# namespace itself.
#
# It is NOT the posture where the runtime provisioner stands down, and this fixture
# is what pins that: `namespaces.static` is a pre-seeded subset, not the full set a
# dataplane uses, so clusterresourcesync keeps creating a namespace per project as
# projects are registered. Those namespaces are unknown at render time and can only
# get their binding from the provisioner. So with clusterresourcesync on, the
# `ab_work_ns_binding.yaml` template and the `bind` grant appear here as well as in
# the runtime-only posture — the chart's own RoleBindings cover the six static names
# and nothing else.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"
clusterresourcesync:
  enabled: true

secrets:
  admin:
    create: false
