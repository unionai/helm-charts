# helm-values: examples/values-test-certs.yaml
#
# rbac.clusterWideBindings: false at low_privilege: false, with
# namespaces.managed left at its default (the six names common/namespaces.yaml
# used to hardcode).
#
# The opt-in posture: union workloads hold permissions only where a
# RoleBinding names them, instead of cluster-wide. Because namespaces.managed
# is non-empty by default, the chart emits a RoleBinding per default task
# namespace plus the release-namespace RoleBinding, and no cluster-wide
# binding.
#
# This snapshot is the reference for what an operator gets when they take the
# opt-in posture without narrowing the task namespace list -- deliberately
# covered so the combination is visible in review rather than only reachable
# in production.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"
rbac:
  clusterWideBindings: false

secrets:
  admin:
    create: false
