# helm-values: examples/values-test-certs.yaml
#
# namespaces.enabled: true at low_privilege: false, with namespaces.static
# left at its default (the six names common/namespaces.yaml used to hardcode).
#
# README Option 2 taken without narrowing the task namespace list. Union
# workloads hold permissions only where a RoleBinding names them -- no ns-*
# role is ever bound cluster-wide -- so the chart emits a RoleBinding per
# default task namespace plus the release-namespace RoleBinding, and nothing
# else.
#
# This snapshot is the reference for what an operator gets when they enumerate
# namespaces by flipping namespaces.enabled alone, leaving the list at its
# default. Deliberately covered so the combination is visible in review rather
# than only reachable in production.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"

secrets:
  admin:
    create: false
