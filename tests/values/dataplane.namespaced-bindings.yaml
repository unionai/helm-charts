# helm-values: examples/values-test-certs.yaml
#
# Static posture (namespaces.enabled: true at low_privilege: false) with
# namespaces.static left at its default six names: the chart emits a work-ns
# RoleBinding per default task namespace plus the release-namespace comp-ns
# RoleBinding, and nothing else.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"

secrets:
  admin:
    create: false
