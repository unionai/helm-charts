# helm-values: examples/values-test-certs.yaml
#
# Static posture: namespaces.enabled: true at low_privilege: false, with
# namespaces.static left at its default six names. The chart knows the work
# namespaces at render time, so it emits one `union-work-ns` RoleBinding per listed
# namespace itself.
#
# That is also the posture where the runtime provisioner must stay out of the way,
# and this fixture is what pins it: clusterresourcesync is on, so its ConfigMap and
# ClusterRole both render, and neither may carry the work-ns binding —
# no `ab_work_ns_binding.yaml` entry and no `bind` rule on `union-work-ns`. Both
# halves key off dataplane.rbac.staticPosture, so they suppress together or the
# provisioner is told to create a binding it has no `bind` grant for.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"
clusterresourcesync:
  enabled: true

secrets:
  admin:
    create: false
