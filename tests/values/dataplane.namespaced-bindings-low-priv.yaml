# helm-values: examples/values-test-certs.yaml
# expect-fail: rbac.clusterWideBindings: false has no meaning under low_privilege: true
#
# A no-op setting that reads as a hardening step. Under low_privilege there are
# no task namespaces and nothing is bound cluster-wide, so turning cluster-wide
# bindings off changes nothing at all.
#
# Failing the render is the honest outcome: an operator who sets this believes
# they have narrowed something, and silence would confirm a belief that is
# false.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
rbac:
  clusterWideBindings: false

secrets:
  admin:
    create: false
