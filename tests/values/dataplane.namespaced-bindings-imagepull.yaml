# helm-values: examples/values-test-certs.yaml
# expect-fail: requires either rbac.clusterWideBindings: true or a non-empty namespaces.managed
#
# The webhook mirrors image-pull secrets into each task namespace. With
# cluster-wide bindings off and no enumerated namespaces to bind into, it has no
# reach -- and the resulting Forbidden is SWALLOWED rather than surfaced, so the
# pod is admitted without its secret and fails later with ImagePullBackOff.
#
# This is the one component in the chart whose RBAC failure is silent, which is
# why it is a template-time error instead of a documentation note.
#
# namespaces.managed is set explicitly to [] rather than left to inherit the
# chart default (six non-empty names) -- with the default in place (and even
# with namespaces.enabled left at its own default of false), the webhook
# guard's `not (and .Values.namespaces.managed .Values.namespaces.enabled)`
# condition would still need namespaces.managed empty to fire on this axis
# alone; leaving it at [] is what exercises the guard deterministically
# regardless of namespaces.enabled.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
rbac:
  clusterWideBindings: false
namespaces:
  managed: []

secrets:
  admin:
    create: false
