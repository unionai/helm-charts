# helm-values: examples/values-test-certs.yaml
#
# Narrowest posture: a short, non-default list of task namespaces. Union-authored
# RBAC holds permissions only in those namespaces plus the release namespace.
# fluent-bit (enabled by default) shares the union-system ServiceAccount and
# keeps its own read-only cluster-wide grant, independent of namespaces.static.
# clusterresourcesync is enabled to cover its constrained posture: no
# cluster-scoped object, bound by RoleBindings into the namespaces below.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
  static:
    - tenant-a-production
    - tenant-b-production
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"

clusterresourcesync:
  enabled: true

secrets:
  admin:
    create: false
