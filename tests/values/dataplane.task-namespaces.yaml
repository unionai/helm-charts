# helm-values: examples/values-test-certs.yaml
#
# The strictest posture: a short, explicit list of task namespaces. The pooled
# work-ns role is never bound cluster-wide, so this render is the narrowest reach
# union workloads can be given.
#
# Union-authored RBAC -- the pooled union-work-ns role, plus the release-
# namespace union-comp-ns-read (and -comp-ns-write when any enabled component
# declares into it) -- holds permissions in exactly the namespaces named below
# plus the release namespace, and nowhere else. This is the render to inspect
# when asking what "union workloads only have permissions in task namespaces"
# actually produces.
#
# That confinement does not extend to every workload sharing the identity:
# fluentbit.enabled: true (the default, unchanged here) runs fluent-bit as the
# same union-system ServiceAccount, which separately carries its own
# read-only cluster-wide grant (get/list/watch on namespaces/pods) for log
# shipping. That grant is independent of namespaces.static; hardening it is
# deliberately out of scope here.
#
# A deliberately short, non-default list proves the bindings follow
# namespaces.static rather than the six names common/namespaces.yaml used to
# hardcode.
#
# clusterresourcesync is enabled here so the constrained posture is covered:
# with the namespaces pre-created it needs no cluster-scoped object at all and
# is bound by RoleBindings into the two namespaces named below.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
  static:
    - tenant-a-production
    - tenant-b-production
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"

clusterresourcesync:
  enabled: true

secrets:
  admin:
    create: false
