# helm-values: examples/values-test-certs.yaml
#
# The strict posture: enumerated task namespaces AND no cluster-wide binding.
#
# union workloads hold permissions in exactly the namespaces named below plus
# the release namespace, and nowhere else. This is the render to inspect when
# asking what "union workloads only have permissions in task namespaces"
# actually produces.
#
# A deliberately short, non-default list proves the bindings follow
# taskNamespaces rather than the six names common/namespaces.yaml used to
# hardcode.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"
taskNamespaces:
  - tenant-a-production
  - tenant-b-production
rbac:
  clusterWideBindings: false

secrets:
  admin:
    create: false
