# helm-values: examples/values-test-certs.yaml
#
# The strict posture: enumerated task namespaces AND no cluster-wide binding.
#
# Union-authored RBAC (the union-*, operator-system, proxy-system and
# flytepropeller-* roles) holds permissions in exactly the namespaces named
# below plus the release namespace, and nowhere else. This is the render to
# inspect when asking what "union workloads only have permissions in task
# namespaces" actually produces.
#
# That confinement does not extend to every workload sharing the identity:
# fluentbit.enabled: true (the default, unchanged here) runs fluent-bit as the
# same union-system ServiceAccount, which separately carries its own
# read-only cluster-wide grant (get/list/watch on namespaces/pods) for log
# shipping. That grant is independent of taskNamespaces and
# rbac.clusterWideBindings; hardening it is deliberately out of scope here.
#
# A deliberately short, non-default list proves the bindings follow
# taskNamespaces rather than the six names common/namespaces.yaml used to
# hardcode.
#
# clusterresourcesync is enabled here so the constrained posture is covered:
# with namespaces pre-created and no cluster-wide binding, it needs no
# cluster-scoped object at all and is bound by RoleBindings into the two
# namespaces named below.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"
taskNamespaces:
  - tenant-a-production
  - tenant-b-production
rbac:
  clusterWideBindings: false

clusterresourcesync:
  enabled: true

secrets:
  admin:
    create: false
