# helm-values: examples/values-test-certs.yaml
#
# The narrowest setup: a short, non-default list of task namespaces. Union's own
# RBAC grants access only in those namespaces plus the release namespace. The
# exception is fluent-bit (on by default), which shares the union-system
# ServiceAccount and keeps its own read-only cluster-wide grant.
# clusterresourcesync is enabled here to pin its narrow form: no cluster-scoped
# object, bound by RoleBindings into the namespaces below.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
namespaces:
  enabled: true
  static:
    - tenant-a-production
    - tenant-b-production
namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"

clusterresourcesync:
  enabled: true

secrets:
  admin:
    create: false
