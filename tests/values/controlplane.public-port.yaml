# Control plane served on a non-443 port. global.UNION_PUBLIC_PORT must carry
# the port into both public authorizedUris entries (the host and the *.apps.
# wildcard), so flyteadmin's first-hostname-match builds the OAuth callback
# with it.
global:
  UNION_HOST: "test.example.com"
  UNION_ORG: "test-org"
  UNION_PUBLIC_PORT: "8443"
  INTERNAL_CLIENT_ID: "test-internal-client-id"
  AUTH_TOKEN_URL: "https://test.example.com/oauth2/v1/token"

dbHost: "db-instance-url"
dbName: "dbName"
dbUser: "dbUser"
dbPass: "dbPass"
bucketName: "bucketName"
artifactsBucketName: "artifactsBucketName"

configMap:
  connection:
    environment: staging
    region: us-east-2
    rootTenantURLPattern: dns:///fake-host.domain
controlplane:
  enabled: true
ingress:
  host: fake-host.domain
  tls:
    - hosts:
        - fake-host.domain
      secretName: fake-host-tls-secret
flyte:
  common:
    ingress:
      tls:
        secretName: fake-host-tls-secret
      host: fake-host.domain

  configmap:
    adminServer:
      connection:
        rootTenantURLPattern: dns:///fake-host.domain
    admin:
      admin:
        endpoint: dns:///fake-host.domain
        insecure: false
