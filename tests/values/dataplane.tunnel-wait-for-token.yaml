# helm-values: examples/values-test-certs.yaml
# Test fixture: the proxy's tunnel container waits for the operator to write tunnel_token
# (read from a secret volume) instead of taking it from an env var.

host: union.test.union.ai
clusterName: union-test
orgName: union
provider: aws

storage:
  provider: aws
  authType: iam
  bucketName: test-bucket
  region: us-east-1

secrets:
  admin:
    create: true
    clientSecret: test-secret
    clientId: test-client

proxy:
  tunnel:
    waitForToken: true
