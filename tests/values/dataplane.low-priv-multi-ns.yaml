# helm-values: examples/values-test-certs.yaml
#
# Mode-combination guard: low_privilege=true AND namespaces.enabled=true.
#
# singleNamespace is `or (not namespaces.enabled) low_privilege`, so this
# combination has singleNamespace=true via the low_privilege leg while
# namespaces.enabled is true. It is the mirror of
# dataplane.flytepropeller.yaml (which has singleNamespace=true via the
# namespaces leg while low_privilege is false).
#
# Together the two fixtures pin both legs of the helper independently, so a
# regression that collapses singleNamespace back onto raw low_privilege is
# caught by one or the other.
host: union.us-west-2.union.ai
clusterName: my-cluster
orgName: union
provider: metal
low_privilege: true
namespaces:
  enabled: true
storage:
  provider: "compat"
  endpoint: http://localstack.aws.svc.cluster.local:4566
  accessKey: test123
  secretKey: test
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
imageBuilder:
  defaultRepository: "localhost:5000/union-dataplane"
secrets:
  admin:
    create: true
    clientId: my-client-id
    clientSecret: my-secret
