# helm-values: examples/values-test-certs.yaml
#
# Mode-combination guard: low_privilege=true AND namespaces.enabled=true.
#
# singleNamespace is exactly low_privilege, so this render is namespace-scoped
# despite namespaces.enabled=true, and namespaces.enabled contributes only the
# six pre-seeded namespaces in common/namespaces.yaml (plus gating the
# per-namespaces.static RoleBindings, moot here since low_privilege suppresses
# the loop that would emit them) -- it carries no privilege meaning. This
# fixture pins that separation: a regression that folds namespaces.enabled back
# into singleNamespace (as `or (not namespaces.enabled) low_privilege` did) is
# invisible here, because both legs agree, so it is
# dataplane.namespace-multi.yaml (low_privilege=false + namespaces.enabled=true)
# that catches that direction.
#
# What this fixture uniquely covers is the other direction: low_privilege=true
# must suppress namespace pre-seeding and force namespaced RBAC even with
# namespaces.enabled=true.
host: union.us-west-2.union.ai
clusterName: my-cluster
orgName: union
provider: metal
low_privilege: true
namespaces:
  enabled: true
storage:
  provider: "compat"
  endpoint: http://localstack.aws.svc.cluster.local:4566
  accessKey: test123
  secretKey: test
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
imageBuilder:
  defaultRepository: "localhost:5000/union-dataplane"
secrets:
  admin:
    create: true
    clientId: my-client-id
    clientSecret: my-secret
