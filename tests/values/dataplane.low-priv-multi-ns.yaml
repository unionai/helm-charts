# helm-values: examples/values-test-certs.yaml
#
# low_privilege: true together with namespaces.enabled: true. Pins that
# low_privilege still forces namespaced RBAC and suppresses namespace
# pre-seeding.
host: union.us-west-2.union.ai
clusterName: my-cluster
orgName: union
provider: metal
low_privilege: true
namespaces:
  enabled: true
storage:
  provider: "compat"
  endpoint: http://localstack.aws.svc.cluster.local:4566
  accessKey: test123
  secretKey: test
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
imageBuilder:
  defaultRepository: "localhost:5000/union-dataplane"
secrets:
  admin:
    create: true
    clientId: my-client-id
    clientSecret: my-secret
