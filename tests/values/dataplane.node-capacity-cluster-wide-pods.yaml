# helm-values: examples/values-test-certs.yaml
#
# Node capacity on a namespace-limited operator. Such an operator's pod cache sees
# only its own namespace, so per-pool usage would under-count; clusterWidePods opts
# it into a cluster-wide pod watch, which the operator's cluster-read ClusterRole
# authorizes. The snapshot must show both keys in the operator ConfigMap alongside
# the role.
host: union.us-west-2.union.ai
clusterName: my-cluster
orgName: union
provider: metal
low_privilege: true
config:
  operator:
    limitNamespace: union
    clusterHealth:
      nodeCapacity:
        enabled: true
        clusterWidePods: true
storage:
  provider: "compat"
  endpoint: http://localstack.aws.svc.cluster.local:4566
  accessKey: test123
  secretKey: test
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
imageBuilder:
  defaultRepository: "localhost:5000/union-dataplane"
secrets:
  admin:
    create: true
    clientId: my-client-id
    clientSecret: my-secret
