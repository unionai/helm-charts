# helm-values: examples/values-test-certs.yaml,values.aws.yaml

global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
  CLUSTER_NAME: "test-cluster-name"
  ORG_NAME: "test-org-name"
  CLIENT_ID: "test-client-id"
  METADATA_BUCKET: "test-metadata-bucket"
  FAST_REGISTRATION_BUCKET: "test-fast-registration-bucket"
  AWS_ACCOUNT_ID: "123456789012"
  AWS_REGION: "test-region"
  BACKEND_IAM_ROLE_ARN: "test-backend-iam-role-arn"
  WORKER_IAM_ROLE_ARN: "test-worker-iam-role-arn"

storage:
  type: "s3"
  s3:
    region: "test-region"

secrets:
  admin:
    clientSecret: "test-not-real-secret"

# Zero trust is left at its default (false) so this golden covers the classic
# deployment: KnativeServing driven by knative-operator rather than the
# vendored gateway components. That path gates on `not zero_trust.enabled`, so
# the zero-trust disabled goldens never exercise it.
knative-operator:
  enabled: false

# apps.enabled: false must drop the KnativeServing CR, the serving envoy
# bootstrap ConfigMap and the serving.knative.dev RBAC rules. This is the
# behaviour every pre-`apps.enabled` deployment relied on `serving.enabled` for.
apps:
  enabled: false

# Deliberately contradicts apps.enabled to pin the precedence in the golden:
# apps.enabled wins over the deprecated serving.enabled.
serving:
  enabled: true
