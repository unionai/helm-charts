# helm-values: examples/values-test-certs.yaml,values.aws.yaml

global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
  CLUSTER_NAME: "test-cluster-name"
  ORG_NAME: "test-org-name"
  CLIENT_ID: "test-client-id"
  METADATA_BUCKET: "test-metadata-bucket"
  FAST_REGISTRATION_BUCKET: "test-fast-registration-bucket"
  AWS_ACCOUNT_ID: "123456789012"
  AWS_REGION: "test-region"
  BACKEND_IAM_ROLE_ARN: "test-backend-iam-role-arn"
  WORKER_IAM_ROLE_ARN: "test-worker-iam-role-arn"

storage:
  type: "s3"
  s3:
    region: "test-region"

secrets:
  admin:
    clientSecret: "test-not-real-secret"

zero_trust:
  enabled: true

knative-operator:
  enabled: false

# The legacy migration path: `apps.enabled` is left unset so the deprecated
# `serving.enabled` is what decides. This is what every deployment created
# before `apps.enabled` existed still sets, so the golden guards it against
# regressions in the precedence helper — the rendered output here must match
# dataplane.aws.zero-trust-apps-disabled.yaml except for the deprecation
# notice, which resolves `apps.enabled=<unset>` on this path.
serving:
  enabled: false
