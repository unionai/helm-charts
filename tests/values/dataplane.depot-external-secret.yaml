# helm-values: examples/values-test-certs.yaml
#
# Depot mode with imageBuilder.depot.createSecret: false: the depot-token Secret
# is created outside the chart (by hand or by Union Fleet). The chart must not
# render it, but the task PodTemplate must still reference it in imagePullSecrets.
host: union.us-west-2.union.ai
clusterName: union-depot
orgName: union
provider: aws

secrets:
  admin:
    create: true
    clientId: clientId
    clientSecret: clientSecret

storage:
  provider: aws
  authType: iam
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-east-2

imageBuilder:
  enabled: true
  buildkitUri: ""
  defaultRepository: registry.depot.dev/test-project
  authenticationType: basic
  buildkit:
    enabled: false
  depot:
    createSecret: false
