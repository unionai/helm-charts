# helm-values: examples/values-test-certs.yaml
# Exercises configurable runtime settings that otherwise preserve existing defaults.

host: union.test.union.ai
clusterName: runtime-overrides
orgName: union
provider: aws

storage:
  provider: aws
  authType: iam
  bucketName: test-bucket
  region: us-east-1

secrets:
  admin:
    create: true
    clientId: test-client
    clientSecret: test-secret

leaseworker:
  podSecurityContext:
    fsGroup: 2000
    runAsGroup: 2000
    runAsNonRoot: true
    runAsUser: 2000

fluentbit:
  tailDBPath: /var/lib/fluent-bit/tail.db

serviceAccount:
  imagePullSecrets:
    - name: task-private-registry

commonServiceAccount:
  imagePullSecrets:
    - name: system-private-registry
