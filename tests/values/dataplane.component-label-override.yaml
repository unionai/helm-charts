# helm-values: examples/values-test-certs.yaml
# Test fixture: a values layer that sets the reserved platform.union.ai/component label
# itself, through every user-extensible label value the templates render. The chart emits
# the component label after those, so the chart's id wins the duplicate key and the
# rendered workloads stay discoverable by the operator; test-workload-labels.py checks
# that no workload carries the override value.

host: union.test.union.ai
clusterName: union-test
orgName: union
provider: aws

storage:
  provider: aws
  authType: iam
  bucketName: test-bucket
  region: us-east-1

secrets:
  admin:
    create: true
    clientSecret: test-secret
    clientId: test-client

additionalPodLabels:
  platform.union.ai/component: user-override
  custom-label: custom-value

operator:
  podLabels:
    platform.union.ai/component: user-override

flytepropeller:
  podLabels:
    platform.union.ai/component: user-override

leaseworker:
  podLabels:
    platform.union.ai/component: user-override

nodeobserver:
  podLabels:
    platform.union.ai/component: user-override

gateway:
  components:
    envoy:
      labels:
        platform.union.ai/component: user-override
