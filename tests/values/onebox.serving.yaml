# Apps on: the app controller runs in onebox (Knative Serving in the cluster).
database:
  sslMode: disable
  host: postgres.example.internal
  existingSecret: onebox-db
storage:
  type: s3
  bucket: onebox-data
  region: us-east-2
internalSecret:
  existingSecret: onebox-internal
serving:
  enabled: true
  publicURLPattern: https://%s.apps.onebox.example.com
