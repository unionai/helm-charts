# helm-values: examples/values-test-certs.yaml
#
# Externally-managed work namespaces (namespaces.create: false): no
# `kind: Namespace` in the output, one union-work-ns RoleBinding per listed
# namespace.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
namespaces:
  enabled: true
  create: false
  static:
    - tenant-a-development
    - tenant-a-production
clusterresourcesync:
  enabled: true
