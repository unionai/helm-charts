# helm-values: examples/values-test-certs.yaml
#
# Externally-managed work namespaces: the operator creates the Namespace
# objects, this chart creates only the RoleBindings. There should be no
# `kind: Namespace` in the output and a union-work-ns RoleBinding in each
# listed namespace.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
namespaces:
  enabled: true
  create: false
  static:
    - tenant-a-development
    - tenant-a-production
clusterresourcesync:
  enabled: true
