# helm-values: examples/values-test-certs.yaml
# helm-args: --api-versions monitoring.coreos.com/v1 --api-versions admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
global:
  # Control-plane host so the dataplane→CP connection resolves. Without it the
  # dataplane.cp.host template's required guard fails the render.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
secrets:
  admin:
    create: false
# GPU fault handling is opt-in, so this fixture keeps it rendered: the watcher's
# DaemonSet, RBAC, PriorityClass and admission policies, the operator's quarantine
# config section and RBAC, and the scrape, alerts and dashboard for both. The
# Prometheus Operator and ValidatingAdmissionPolicy APIs are declared so the
# monitoring objects and admission policies render.
# Quarantine needs the operator's cluster permissions and an operator release that
# has the controller.
low_privilege: false
image:
  union:
    tag: "2026.10.0"
gpuFaultWatcher:
  enabled: true
config:
  gpuQuarantine:
    enabled: true
monitoring:
  alerting:
    enabled: true
