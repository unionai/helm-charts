# helm-values: examples/values-test-certs.yaml
#
# Posture: fully dynamic. No work namespace is known at render time —
# clusterresourcesync creates them as projects are registered. This is what
# terraform generates for a full-privilege dataplane, spelled in the new values.
#
# Keyed on the new values only (no low_privilege). With namespaces.static empty
# the chart creates no Namespace objects at all, and a_namespace stays in the
# clusterresource-template ConfigMap because createNamespaces defaults to true.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

namespaces:
  enabled: true
  static: []

namespace_mapping:
  template: "{{`{{ project }}`}}-{{`{{ domain }}`}}"

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false
