# helm-values: examples/values-test-certs.yaml
#
# nodeobserver at the chart default low_privilege: true. Its companion is
# dataplane.nodeobserver-full-priv.yaml.
#
# Both slots nodeobserver declares are cluster slots, so both render as
# ClusterRoles here — the only union component whose grant does not narrow with
# low_privilege. That is not a widening the chart chose: `nodes` is cluster-scoped
# and the namespaced Role this replaces never conveyed it, and nodeobserver lists
# pods with an empty namespace plus a spec.nodeName field selector, which the API
# server authorizes as a cluster-scoped request. The Role could not satisfy either
# rule, so this is the first release in which nodeobserver installs and works in
# the default posture.
global:
  # Control-plane host so the dataplane→CP connection resolves. Without it the
  # dataplane.cp.host template's required guard fails the render.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
nodeobserver:
  enabled: true

secrets:
  admin:
    create: false
