# helm-values: examples/values-test-certs.yaml
# expect-fail: nodeobserver.enabled requires low_privilege: false
#
# nodeobserver.enabled: true at the chart default low_privilege: true is an
# unsatisfiable combination, and the chart now says so at template time.
#
# This fixture previously produced a snapshot: a DaemonSet plus a namespaced
# Role naming the cluster-scoped `nodes` resource, which the API server accepts
# and silently ignores. The install went green and the component died on its
# first node write. Keeping the fixture as an expect-fail case rather than
# deleting it preserves the guard -- if the `fail` is ever removed, this goes
# red instead of quietly regenerating a broken-install snapshot.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
nodeobserver:
  enabled: true

secrets:
  admin:
    create: false
