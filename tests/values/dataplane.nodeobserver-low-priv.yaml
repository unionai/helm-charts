# helm-values: examples/values-test-certs.yaml,values.aws.yaml
#
# nodeobserver at low_privilege: true. This combination used to fail the render.
# The slot emitter always emits cluster slots as ClusterRoles, so the grant is
# correct here; pinning it proves nodeobserver installs in the default posture.

host: "test-controlplane-host"
secrets:
  admin:
    clientSecret: "test-not-real-secret"

low_privilege: true
nodeobserver:
  enabled: true
