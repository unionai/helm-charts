# helm-values: examples/values-test-certs.yaml

# global.imageMirrors with the task-pod rewrite turned off: an explicit
# managedImage.enabled: false keeps the managed-image endpoint out of the
# MutatingWebhookConfiguration and the mirror rules out of the webhook config,
# while the chart's own images still go through the mirror and are pre-warmed.

global:
  CONTROLPLANE_HOST: "test-controlplane-host"
  AUTH_CLIENT_ID: "test-client-id"
  imageMirrors:
    public.ecr.aws: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ecr-public

secrets:
  admin:
    create: false

flytepropellerwebhook:
  webhook:
    webhooks:
      managedImage:
        enabled: false
