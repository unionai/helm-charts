# helm-values: examples/values-test-certs.yaml
# expect-fail: flytepropellerwebhook.managedConfig: false requires low_privilege: false
#
# managedConfig: false at the chart default low_privilege: true is unsatisfiable.
# The webhook must register a cluster-scoped MutatingWebhookConfiguration, which
# no namespaced Role can convey, and without registration it receives no pods --
# so there is no useful degraded mode. Previously this shipped a dead rule and
# the webhook silently did nothing.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
flytepropellerwebhook:
  managedConfig: false

secrets:
  admin:
    create: false
