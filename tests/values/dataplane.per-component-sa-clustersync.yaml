# helm-values: examples/values-test-certs.yaml
#
# commonServiceAccount.enabled: false together with clusterresourcesync.enabled:
# true. Six identities, each with its own ns-* ClusterRoles, so
# clusterresourcesync's bind grant must derive resourceNames per identity rather
# than hardcode "union".
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
commonServiceAccount:
  enabled: false

namespaces:
  enabled: true

secrets:
  admin:
    create: false

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false
