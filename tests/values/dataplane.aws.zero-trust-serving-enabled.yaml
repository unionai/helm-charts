# helm-values: examples/values-test-certs.yaml,values.aws.yaml

global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
  CLUSTER_NAME: "test-cluster-name"
  ORG_NAME: "test-org-name"
  CLIENT_ID: "test-client-id"
  METADATA_BUCKET: "test-metadata-bucket"
  FAST_REGISTRATION_BUCKET: "test-fast-registration-bucket"
  AWS_ACCOUNT_ID: "123456789012"
  AWS_REGION: "test-region"
  BACKEND_IAM_ROLE_ARN: "test-backend-iam-role-arn"
  WORKER_IAM_ROLE_ARN: "test-worker-iam-role-arn"

storage:
  type: "s3"
  s3:
    region: "test-region"

secrets:
  admin:
    clientSecret: "test-not-real-secret"

zero_trust:
  enabled: true

knative-operator:
  enabled: false

# `apps.enabled` is left unset so the deprecated `serving.enabled` decides — the shape of
# deployments that predate `apps.enabled`. If values.yaml set apps.enabled to a literal
# false, that key would count as set, the precedence helper would stop consulting
# serving.enabled, and this golden would lose the Knative stack. That is what it guards.
#
# low_privilege has to be off because app serving requires it.
serving:
  enabled: true

low_privilege: false
