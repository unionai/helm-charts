# helm-values: examples/values-test-certs.yaml,values.aws.yaml

global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
  CLUSTER_NAME: "test-cluster-name"
  ORG_NAME: "test-org-name"
  CLIENT_ID: "test-client-id"
  METADATA_BUCKET: "test-metadata-bucket"
  FAST_REGISTRATION_BUCKET: "test-fast-registration-bucket"
  AWS_ACCOUNT_ID: "123456789012"
  AWS_REGION: "test-region"
  BACKEND_IAM_ROLE_ARN: "test-backend-iam-role-arn"
  WORKER_IAM_ROLE_ARN: "test-worker-iam-role-arn"

storage:
  type: "s3"
  s3:
    region: "test-region"

secrets:
  admin:
    clientSecret: "test-not-real-secret"

zero_trust:
  enabled: true

knative-operator:
  enabled: false

# The legacy migration path, and the reason app serving is defaulted off by
# omission rather than by writing `apps.enabled: false` into values.yaml.
# `apps.enabled` is left unset here so the deprecated `serving.enabled` is what
# decides — which is the shape of every deployment created before `apps.enabled`
# existed. A literal false in values.yaml would make that key *set*, the
# precedence helper would stop consulting `serving.enabled`, and this golden
# would lose the entire Knative stack. That is what it guards.
#
# low_privilege must therefore be off too: turning app serving on by any route
# means the pair is refused otherwise.
serving:
  enabled: true

low_privilege: false
