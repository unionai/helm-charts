# helm-values: examples/values-test-certs.yaml
#
# commonServiceAccount.enabled: false at the chart's default namespace posture
# (namespaces.enabled: false). Previously ignored here — useCommonServiceAccount
# was `commonServiceAccount.enabled OR singleNamespace`, so the single-namespace
# branch forced the shared ServiceAccount and per-component identities were
# silently unreachable. It is now keyed on commonServiceAccount.enabled alone and
# honored in both postures.
#
# Per-component identities do not narrow RBAC; they exist to give each component
# its own cloud IAM identity.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
commonServiceAccount:
  enabled: false

secrets:
  admin:
    create: false
