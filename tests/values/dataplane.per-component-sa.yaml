# helm-values: examples/values-test-certs.yaml
#
# commonServiceAccount.enabled: false at the chart default low_privilege: true.
# Previously the low_privilege branch forced the shared ServiceAccount and this
# key was ignored; it is now honored in both privilege modes.
#
# Per-component identities do not narrow RBAC. A pooled slot is one role bound to
# every ServiceAccount that declares into it, so every component on the slot
# model holds the same comp-ns and work-ns rules whether or not the identities are
# split. Splitting them buys one cloud IAM identity per component, nothing more.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
commonServiceAccount:
  enabled: false

secrets:
  admin:
    create: false
