# helm-values: examples/values-test-certs.yaml
#
# Coverage for commonServiceAccount.enabled: false at the chart default
# low_privilege: true.
#
# Before the useCommonServiceAccount detangle this combination was
# UNREACHABLE: the helper ORed in singleNamespace (exactly low_privilege), so
# an explicit false was discarded and every component collapsed onto
# union-system regardless. No fixture in the repo set commonServiceAccount at
# all, so nothing caught it.
#
# This is also the chart's strictest available posture -- per-component
# identities, all namespaced RBAC -- so it is the render to inspect when
# asking what a maximally locked-down dataplane looks like.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
commonServiceAccount:
  enabled: false

secrets:
  admin:
    create: false
