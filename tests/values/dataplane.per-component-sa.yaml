# helm-values: examples/values-test-certs.yaml
#
# commonServiceAccount.enabled: false at the chart default low_privilege: true.
# Previously the low_privilege branch forced the shared ServiceAccount and this
# key was ignored; it is now honored in both privilege modes.
#
# Per-component identities do not narrow the one pooled slot. `union-work-ns` is a
# single role bound to every ServiceAccount that declares into it, so every
# component on the slot model holds the same work-ns rules whether or not the
# identities are split. The comp-ns and cluster slots are per-component roles
# already, so what splitting the identities changes there is only which account
# each is bound to -- plus one cloud IAM identity per component.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
commonServiceAccount:
  enabled: false

secrets:
  admin:
    create: false
