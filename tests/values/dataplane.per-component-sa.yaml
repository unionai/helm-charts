# helm-values: examples/values-test-certs.yaml
#
# commonServiceAccount.enabled: false at the chart default low_privilege: true.
#
# Per-component identities are not an RBAC narrowing: the pooled slots bind one
# role to every declaring ServiceAccount, so all five hold the same work-ns rule
# set. They exist to give each component its own cloud IAM identity. For narrow
# in-cluster reach see tests/values/dataplane.task-namespaces.yaml.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
commonServiceAccount:
  enabled: false

secrets:
  admin:
    create: false
