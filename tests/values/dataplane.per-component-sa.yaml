# helm-values: examples/values-test-certs.yaml
#
# commonServiceAccount.enabled: false at the chart default low_privilege: true.
# Per-component identities do not narrow RBAC: the pooled slots bind one role to
# every declaring ServiceAccount, so all five get the same work-ns rules. They
# exist to give each component its own cloud IAM identity.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
commonServiceAccount:
  enabled: false

secrets:
  admin:
    create: false
