# helm-values: examples/values-test-certs.yaml
#
# flytepropellerwebhook.managedConfig: false at the chart default
# low_privilege: true. Companion to
# dataplane.webhook-unmanaged-config-full-priv.yaml.
#
# No union-webhook-cluster-write here, and that is the point of the fixture. The
# propeller config template sets disableCreateMutatingWebhookConfig whenever
# low_privilege is true, whatever managedConfig says, so the webhook does not
# self-register in this posture and the cluster-scoped write would be dead. What
# it also exposes — visible in this snapshot as the absence of any
# MutatingWebhookConfiguration — is that at these values neither Helm nor the
# webhook creates one. That predates this release; the RBAC change only stops
# granting for it.
global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
flytepropellerwebhook:
  managedConfig: false

secrets:
  admin:
    create: false
