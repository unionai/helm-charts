# helm-values: examples/values-test-certs.yaml,values.aws.yaml
#
# flytepropellerwebhook.managedConfig: false at low_privilege: true. The webhook
# registers its own MutatingWebhookConfiguration, a cluster-scoped write that
# cannot be resourceNames-scoped because RBAC cannot scope `create`.

host: "test-controlplane-host"
secrets:
  admin:
    clientSecret: "test-not-real-secret"

low_privilege: true
flytepropellerwebhook:
  enabled: true
  managedConfig: false
