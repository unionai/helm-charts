# helm-values: examples/values-test-certs.yaml
#
# flytepropellerwebhook.managedConfig: false at the chart default
# low_privilege: true. Its companion is
# dataplane.webhook-unmanaged-config-full-priv.yaml.
#
# There is no union-webhook-cluster-write here, and that is the point of the
# fixture. The propeller config template sets disableCreateMutatingWebhookConfig
# whenever low_privilege is true, whatever managedConfig says, so the webhook
# skips self-registration in this posture, and the cluster-scoped write would sit
# unused. This snapshot also shows that at these values, neither Helm nor the
# webhook creates a MutatingWebhookConfiguration — visible here as its absence.
# That predates this release; the RBAC change only stops granting for it.
global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
flytepropellerwebhook:
  managedConfig: false

secrets:
  admin:
    create: false
