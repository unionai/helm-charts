# helm-values: examples/values-test-certs.yaml
#
# Node-capacity reporting under low privilege. low_privilege defaults to true, so this
# fixture covers the case the feature exists for: the broad operator ClusterRole is
# suppressed while the narrow read-only node-capacity ClusterRole still renders.
global:
  # Control-plane host so the dataplane→CP connection resolves. Without it the
  # dataplane.cp.host template's required guard fails the render.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
config:
  operator:
    nodeCapacity:
      enabled: true
secrets:
  admin:
    create: false
