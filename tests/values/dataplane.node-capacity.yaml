# helm-values: examples/values-test-certs.yaml
#
# Node-capacity reporting at the singleNamespace default, the case the feature exists
# for: the operator's cluster-read ClusterRole gains get on nodes, a read on the
# single-namespace allowlist, and nothing else cluster-scoped.
global:
  # Control-plane host so the dataplane→CP connection resolves. Without it the
  # dataplane.cp.host template's required guard fails the render.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
  AUTH_CLIENT_ID: "test-client-id"
config:
  operator:
    clusterHealth:
      nodeCapacity:
        enabled: true
secrets:
  admin:
    create: false
