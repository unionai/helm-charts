# helm-values: examples/values-test-certs.yaml
# Test fixture: the operator's plugins.yaml without the connector service. The
# leaseworker is off, so the task logs are propeller's, and flyteconnector is off, so
# the agent-service / connector-service sections stay out of plugins.yaml as they do
# of the leaseworker ConfigMap; exercises the operator.pluginsConfig helper's gates.
host: byok.us-west-2.union.ai
clusterName: test-e2e-plugins
orgName: byok
provider: gcp
low_privilege: false
storage:
  provider: gcs
  bucketName: test-gcp-bucket
  fastRegistrationBucketName: test-gcp-bucket
  region: us-central1
  enableMultiContainer: true
  gcp:
    projectId: test-gcp-project-123
secrets:
  admin:
    create: true
    clientId: byok-test-e2e-plugins-operator
    clientSecret: test-not-real-secret
additionalServiceAccountAnnotations:
  iam.gke.io/gcp-service-account: 'union-backend@test-gcp-project-123.iam.gserviceaccount.com'
userRoleAnnotationKey: iam.gke.io/gcp-service-account
userRoleAnnotationValue: union-worker@test-gcp-project-123.iam.gserviceaccount.com
leaseworker:
  enabled: false
flyteconnector:
  enabled: false
config:
  task_logs:
    plugins:
      logs:
        kubernetes-enabled: false
        stackdriver-enabled: true
  enabled_plugins:
    plugins:
      connector-service:
        defaultConnector:
          endpoint: "k8s:///flyteconnector.{{ .Release.Namespace }}:8000"
    tasks:
      task-plugins:
        enabled-plugins:
          - container
          - connector-service
