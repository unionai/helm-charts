# helm-values: examples/values-test-certs.yaml
# expect-fail: namespaces.enabled has been renamed to namespaces.create
#
# namespaces.enabled was renamed to namespaces.create (Finding 1 of the
# whole-branch RBAC review): the flag now also gates whether the
# taskNamespaces RoleBindings are emitted, not just Namespace pre-seeding, so
# a bare rename could not be silent -- Helm does not error on unknown values
# keys, so an overlay that still sets the old key would otherwise render
# green while getting neither the namespaces nor the bindings it asked for.
#
# This fixture proves the render fails loudly instead. It deliberately still
# sets the OLD key -- that is the whole point -- and asserts the render never
# gets far enough to matter whether taskNamespaces or low_privilege are set.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
namespaces:
  enabled: true

secrets:
  admin:
    create: false
