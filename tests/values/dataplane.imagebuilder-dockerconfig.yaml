# helm-values: examples/values-test-certs.yaml
# On-prem (metal) dataplane whose image builder pushes to a private registry
# with static credentials from the `union-registry-credentials` Secret. The
# Secret is created outside the chart; nothing here may render its contents.
singleNamespace: true
host: union.us-west-2.union.ai
clusterName: my-cluster
orgName: union
provider: metal
storage:
  provider: "compat"
  endpoint: http://minio.minio.svc.cluster.local:9000
  accessKey: test123
  secretKey: test
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
serviceAccount:
  imagePullSecrets:
    - name: existing-pull-secret
imageBuilder:
  defaultRepository: "us-central1-docker.pkg.dev/my-project/union-dataplane"
  authenticationType: dockerconfig
secrets:
  admin:
    create: true
    clientId: my-client-id
    clientSecret: my-secret
