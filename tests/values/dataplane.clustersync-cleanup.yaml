# helm-values: examples/values-test-certs.yaml
#
# cleanupNamespace: true adds `delete` to
# union-clusterresourcesync-cluster-write's namespaces rule, and nothing else.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
clusterresourcesync:
  enabled: true
  config:
    cluster_resources:
      unionProjectSyncConfig:
        cleanupNamespace: true
