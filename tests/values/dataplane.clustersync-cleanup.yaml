# helm-values: examples/values-test-certs.yaml
#
# cleanupNamespace is the only thing that should add `delete` to
# union-clusterresourcesync-cluster-write's namespaces rule. Diff this
# summary against dataplane.clusterresourcesync to confirm that is the
# only difference.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
clusterresourcesync:
  enabled: true
  config:
    cluster_resources:
      unionProjectSyncConfig:
        cleanupNamespace: true
