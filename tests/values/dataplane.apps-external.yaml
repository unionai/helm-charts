# helm-values: examples/values-test-certs.yaml
# apps.external: shared Knative core outside the release; this release keeps its
# own Kourier controller + gateway bound to its own ingress class.
host: union.us-west-2.union.ai
clusterName: union-shared
orgName: union
provider: aws
storage:
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
secrets:
  admin:
    create: true
    clientId: clientId
    clientSecret: clientSecret
apps:
  enabled: true
  external:
    enabled: true
