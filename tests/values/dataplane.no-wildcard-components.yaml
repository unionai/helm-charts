# helm-values: examples/values-test-certs.yaml
#
# The converse of the migration: with leaseworker and flytepropeller off, nothing
# declares a resource wildcard into work-ns, so the pooled `union-work-ns` role
# lists operator's and proxy's resources explicitly and holds no '*'. Those two are
# the only other components on the slot model at this point; the rest still carry
# hand-written RBAC.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
leaseworker:
  enabled: false
flytepropeller:
  enabled: false
# A full-privilege dataplane needs something creating work namespaces and binding
# `union-work-ns` in each one. This is what supplies the binding here.
clusterresourcesync:
  enabled: true
