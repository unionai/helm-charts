# helm-values: examples/values-test-certs.yaml
#
# Proves the pooled work-ns role is the union of only ENABLED contributors.
# With executor, leaseworker and flytepropeller off, nothing declares */* into
# work-ns, so the role should list operator's, proxy's and webhook's resources
# explicitly rather than collapsing to a wildcard.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
executor:
  enabled: false
leaseworker:
  enabled: false
flytepropeller:
  enabled: false
clusterresourcesync:
  enabled: true
