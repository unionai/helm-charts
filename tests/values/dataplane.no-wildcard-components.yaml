# helm-values: examples/values-test-certs.yaml
#
# With leaseworker and flytepropeller off, nothing declares a wildcard into
# work-ns: the pooled role lists operator's, proxy's and webhook's resources
# explicitly.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
leaseworker:
  enabled: false
flytepropeller:
  enabled: false
clusterresourcesync:
  enabled: true
