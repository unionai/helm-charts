# helm-values: examples/values-test-certs.yaml
# helm-args: --api-versions monitoring.coreos.com/v1 --api-versions admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
# Legacy flat-config reader: overrides must also match the sectioned layout used
# by combined builds, plus the container ports and host mounts. No quarantine:
# 2026.9.7 does not contain its controller.
global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
  AUTH_CLIENT_ID: "test-client-id"
secrets:
  admin:
    create: false
image:
  union:
    tag: "2026.9.7"
gpuFaultWatcher:
  enabled: true
  metricsPort: 9199
  config:
    kmsgPath: /dev/custom-kmsg
    podResourcesSocket: unix:///run/custom-kubelet/pod-resources/kubelet.sock
    # Both known releases ignore this field. Preserve it for checkpoint builds.
    stateDir: /var/lib/custom-watcher
