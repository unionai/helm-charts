# helm-values: examples/values-test-certs.yaml
# Workload identity with a service account per component (the leaseworker reads
# the operator's union-workload-identity ConfigMap under its own identity), a
# custom token mount path, and leaseworker workload identity settings the chart
# must keep (it owns only enabled and tokenFile).
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
  AUTH_CLIENT_ID: "test-client-id"
low_privilege: false
commonServiceAccount:
  enabled: false

secrets:
  admin:
    create: false

leaseworker:
  config:
    workloadIdentity:
      plugins: [pod]
      reusableEnvironments: false

workloadIdentity:
  enabled: true
  tokenMountPath: /custom/identity
