# helm-values: examples/values-test-certs.yaml
host: union.us-west-2.union.ai
clusterName: union-oci
orgName: union
provider: oci

secrets:
  admin:
    create: true
    clientId: clientId
    clientSecret: clientSecret

storage:
  endpoint: "https://xxxxxxxxxxx.compat.objectstorage.us-ashburn-1.oraclecloud.com"
  bucketName: bucket
  region: "us-ashburn-1"
  fastRegistrationBucketName: bucket
  credentialsSecretRef:
    name: "storage-credentials"

fluentbit:
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: {name: storage-credentials, key: access_key_id}
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: {name: storage-credentials, key: secret_key}
