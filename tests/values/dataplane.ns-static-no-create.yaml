# helm-values: examples/values-test-certs.yaml
#
# Posture: static work namespaces this chart does NOT create, with
# clusterresourcesync syncing into them but not creating them either. The
# least-privilege multi-namespace posture — nothing in this render mints a
# namespace.
#
# Keyed on the new values only (no low_privilege). Pins two things:
#   - namespaces.create: false suppresses the Namespace objects while
#     namespaces.static still names the work namespaces
#   - clusterresourcesync.createNamespaces: false drops a_namespace from the
#     clusterresource-template ConfigMap
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

namespaces:
  enabled: true
  create: false
  static:
    - flytesnacks-development
    - flytesnacks-production

clusterresourcesync:
  enabled: true
  createNamespaces: false
  config:
    union:
      auth:
        enable: false
