# helm-values: examples/values-test-certs.yaml,values.aws.yaml
#
# Mode-combination guard: zero_trust.enabled=true AND low_privilege=false.
#
# templates/gateway/rbac.yaml and kourier-controller.yaml gate on
# `zero_trust.enabled AND apps.enabled` and never consult privilege mode, so
# their output is identical in both modes today. Pinning the full-privilege
# render makes any future privilege-mode gating visible as a diff rather than
# a silent no-op.

global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
  CLUSTER_NAME: "test-cluster-name"
  ORG_NAME: "test-org-name"
  CLIENT_ID: "test-client-id"
  METADATA_BUCKET: "test-metadata-bucket"
  FAST_REGISTRATION_BUCKET: "test-fast-registration-bucket"
  AWS_ACCOUNT_ID: "123456789012"
  AWS_REGION: "test-region"
  BACKEND_IAM_ROLE_ARN: "test-backend-iam-role-arn"
  WORKER_IAM_ROLE_ARN: "test-worker-iam-role-arn"

low_privilege: false

storage:
  type: "s3"
  s3:
    region: "test-region"

secrets:
  admin:
    clientSecret: "test-not-real-secret"

zero_trust:
  enabled: true

knative-operator:
  enabled: false
