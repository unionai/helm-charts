# helm-values: examples/values-test-certs.yaml
global:
  # Control-plane host so the dataplane→CP connection resolves. Without it the
  # dataplane.cp.host template's required guard fails the render.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
  AUTH_CLIENT_ID: "test-client-id"
# A non-default mount path: the operator ConfigMap must name it under
# clusterHealth.connectorConfigPath, matching the operator Deployment's mount.
operator:
  connectorConfigMountPath: /var/run/union/connector-config

secrets:
  admin:
    create: false
