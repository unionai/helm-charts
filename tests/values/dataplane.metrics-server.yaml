# helm-values: examples/values-test-certs.yaml
# Pins the metrics-server subchart's RBAC, which no other fixture renders. Three
# things here are structural and cannot be narrowed from values: cluster-wide
# read on pods and nodes plus get on nodes/metrics, the system:auth-delegator
# ClusterRoleBinding, and a RoleBinding written into kube-system — a hardcoded
# literal, so `helm upgrade` from a namespace-confined identity gets a 403 there.
global:
  # Control-plane host so the dataplane→CP connection resolves. Without it the
  # dataplane.cp.host template's required guard fails the render.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
metrics-server:
  enabled: true

secrets:
  admin:
    create: false
