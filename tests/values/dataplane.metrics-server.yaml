# helm-values: examples/values-test-certs.yaml
# This pins the metrics-server subchart's RBAC — the only fixture that renders it. Three
# things in it are fixed regardless of values: cluster-wide read on pods and nodes plus
# get on nodes/metrics, the system:auth-delegator ClusterRoleBinding, and a RoleBinding
# hardcoded into kube-system — so `helm upgrade` from a namespace-confined identity gets
# a 403 there.
global:
  # Required by dataplane.cp.host's guard.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
metrics-server:
  enabled: true

secrets:
  admin:
    create: false
