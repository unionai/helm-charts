# helm-values: examples/values-test-certs.yaml
#
# Depot mode (imageBuilder.enabled, buildkit disabled, no buildkitUri). The
# chart must not render a depot-token Secret (the admin creates it), but the
# task PodTemplate must still pull with depot-token.
host: union.us-west-2.union.ai
clusterName: union-depot
orgName: union
provider: aws

secrets:
  admin:
    create: true
    clientId: clientId
    clientSecret: clientSecret

storage:
  provider: aws
  authType: iam
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-east-2

imageBuilder:
  enabled: true
  buildkitUri: ""
  defaultRepository: registry.depot.dev/test-project
  authenticationType: basic
  buildkit:
    enabled: false
