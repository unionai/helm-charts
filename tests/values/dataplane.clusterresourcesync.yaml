# helm-values: examples/values-test-certs.yaml

host: test.example.com

low_privilege: false

namespaces:
  enabled: true

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false
  clusterRoleRules:
    - apiGroups:
        - example.com
      resources:
        - widgets
      verbs:
        - get
        - list
        - watch
        - create
        - patch
  # Kinds whose resource name is not the naive plural: the derived grant must name
  # endpoints, gateways and networkpolicies.
  additionalTemplates:
    - key: d_endpoints
      value: |
        apiVersion: v1
        kind: Endpoints
        metadata:
          name: external-db
          namespace: {{ namespace }}
    - key: e_gateway
      value: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: tenant
          namespace: {{ namespace }}
    - key: f_networkpolicy
      value: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: default-deny
          namespace: {{ namespace }}
