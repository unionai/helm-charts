# helm-values: examples/values-test-certs.yaml

# Exercises the clusterresourcesync ClusterRole template, which is only rendered
# when low_privilege=false (i.e. not singleNamespace mode) -- singleNamespace is
# exactly low_privilege, independent of namespaces.enabled. Locks in the default
# clusterRoleRules (including limitranges) and verifies that custom rules render
# through to the cluster-write ClusterRole.
#
# namespaces.enabled MUST stay at its default false here. Setting it true (with
# the default non-empty namespaces.static) selects the constrained posture, in
# which clusterresourcesync's rules come from namespacedRoleRules and
# clusterRoleRules is not consulted at all -- so the custom example.com/widgets
# rule below would silently vanish and this fixture would pin the opposite of
# what its name says. Namespace object creation and the constrained posture are
# covered by dataplane.namespace-multi.yaml and dataplane.task-namespaces.yaml.
host: test.example.com

low_privilege: false

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false
  clusterRoleRules:
    - apiGroups:
        - ""
        - rbac.authorization.k8s.io
      resources:
        - clusterrolebindings
        - configmaps
        - limitranges
        - namespaces
        - podtemplates
        - pods
        - resourcequotas
        - rolebindings
        - roles
        - secrets
        - serviceaccounts
        - services
      verbs:
        - '*'
    - apiGroups:
        - example.com
      resources:
        - widgets
      verbs:
        - get
        - list
        - watch
