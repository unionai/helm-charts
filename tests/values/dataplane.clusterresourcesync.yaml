# helm-values: examples/values-test-certs.yaml

# Runtime posture (low_privilege: false, namespaces.enabled at its default
# false): custom clusterresourcesync.clusterRoleRules are appended to the
# chart-derived cluster-write ClusterRole. Static posture is pinned by
# tests/values/dataplane.static-ns-clusterrules.yaml.
host: test.example.com

low_privilege: false

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false
  clusterRoleRules:
    - apiGroups:
        - example.com
      resources:
        - widgets
      verbs:
        - get
        - list
        - watch
