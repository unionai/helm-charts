# helm-values: examples/values-test-certs.yaml

# Exercises the clusterresourcesync ClusterRole template, which is only rendered
# when low_privilege=false (i.e. not singleNamespace mode) -- singleNamespace is
# exactly low_privilege, independent of namespaces.enabled. Verifies that custom
# clusterRoleRules render through to the cluster-write ClusterRole, appended
# after the chart-derived rules. The default rule set (namespaces, rolebindings)
# is pinned by other fixtures and is no longer part of what this key carries --
# those grants are derived from the slot model, not from clusterRoleRules.
#
# namespaces.enabled MUST stay at its default false here so this fixture pins
# the runtime posture (chart-derived rules + this fixture's custom rule, both
# present). The static posture -- where the chart-derived rules are absent but
# a non-empty clusterRoleRules still must render as one valid list, re-emitting
# a cluster-scoped grant in the posture that otherwise has none -- is pinned by
# tests/values/dataplane.static-ns-clusterrules.yaml.
host: test.example.com

low_privilege: false

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false
  clusterRoleRules:
    - apiGroups:
        - example.com
      resources:
        - widgets
      verbs:
        - get
        - list
        - watch
