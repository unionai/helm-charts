# helm-values: examples/values-test-certs.yaml

# low_privilege: false with work namespaces created at runtime
# (namespaces.enabled off). Pins that custom clusterresourcesync.clusterRoleRules
# are appended to the chart's cluster-write ClusterRole. The static-namespace
# counterpart is tests/values/dataplane.static-ns-clusterrules.yaml.
host: test.example.com

low_privilege: false

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false
  clusterRoleRules:
    - apiGroups:
        - example.com
      resources:
        - widgets
      verbs:
        - get
        - list
        - watch
