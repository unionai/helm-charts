# helm-values: examples/values-test-certs.yaml

host: test.example.com

low_privilege: false

namespaces:
  enabled: true

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false
  clusterRoleRules:
    - apiGroups:
        - example.com
      resources:
        - widgets
      verbs:
        - get
        - list
        - watch
        - create
        - patch
