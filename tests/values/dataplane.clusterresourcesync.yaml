# helm-values: examples/values-test-certs.yaml

# clusterresourcesync at low_privilege: false with namespaces.enabled: true, plus a
# non-empty clusterRoleRules.
#
# Two things are pinned here. First, the shape of the derived grant: the twelve
# resources at verbs ['*'] that clusterRoleRules used to default to are gone, and
# union-clusterresourcesync-cluster-write now carries only what the chart's own
# templates create, plus the `bind` rule confined by resourceNames to the pooled
# work-ns role.
#
# Second, that clusterRoleRules is still a working extension point and is not gated
# on namespace posture: namespaces.enabled: true pre-seeds the six default names,
# and the widgets rule below is granted cluster-wide regardless, because a project
# registered after install lands in a namespace this render cannot know.
host: test.example.com

low_privilege: false

namespaces:
  enabled: true

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false
  clusterRoleRules:
    - apiGroups:
        - example.com
      resources:
        - widgets
      verbs:
        - get
        - list
        - watch
        - create
        - patch
