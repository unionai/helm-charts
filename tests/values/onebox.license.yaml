# A key from a Secret, and Get a key pointed at another issuer.
database:
  sslMode: disable
  host: postgres.example.internal
  existingSecret: onebox-db
storage:
  type: s3
  bucket: onebox-data
  region: us-east-2
internalSecret:
  existingSecret: onebox-internal
webhook:
  certificate:
    # A generated cert would differ on every render.
    provider: external
    external: {caCert: test-ca, tlsCrt: test-crt, tlsKey: test-key}
license:
  existingSecret: onebox-license
  issueURL: https://licenses.example.com/onebox
