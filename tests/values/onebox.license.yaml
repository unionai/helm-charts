# Licensing enforced, with a key from a Secret and a self-hosted issuer.
database:
  sslMode: disable
  host: postgres.example.internal
  existingSecret: onebox-db
storage:
  type: s3
  bucket: onebox-data
  region: us-east-2
internalSecret:
  existingSecret: onebox-internal
webhook:
  certificate:
    # A generated cert would differ on every render.
    provider: external
    external: {caCert: test-ca, tlsCrt: test-crt, tlsKey: test-key}
license:
  enforce: true
  existingSecret: onebox-license
  issueURL: https://licenses.example.com/onebox
  trustedKeys:
    - id: example-2026
      pem: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEexample
        -----END PUBLIC KEY-----
