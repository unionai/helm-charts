# helm-values: examples/values-test-certs.yaml
#
# nodeobserver.enabled at low_privilege: false. The only fixture where
# union-nodeobserver renders: it needs write on the cluster-scoped `nodes`, so
# its ClusterRole and ClusterRoleBinding are a deliberate escape hatch.
# low_privilege alone is the trigger, so if privilege were re-coupled to
# namespaces.enabled this would drop to a Role.
global:
  # Required by dataplane.cp.host's guard.
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
nodeobserver:
  enabled: true

secrets:
  admin:
    create: false

# Enabled only because the webhook's imagePullSecrets guard fails the render
# without it. Not what this fixture pins.
clusterresourcesync:
  enabled: true
