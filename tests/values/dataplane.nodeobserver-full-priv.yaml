# helm-values: examples/values-test-certs.yaml
#
# nodeobserver at low_privilege: false, the companion to
# dataplane.nodeobserver.yaml.
#
# The pair is what pins the claim that nodeobserver's grant is identical in both
# privilege modes: union-nodeobserver-cluster-read and
# union-nodeobserver-cluster-write should have identical rules in this snapshot
# and in dataplane.nodeobserver.yaml. Nothing compares them automatically -- the
# guard suite renders one configuration at a time and cannot assert across two --
# so if you change either role, diff the two snapshots by hand. Before this
# release the low_privilege branch emitted a namespaced Role holding the same
# rules, which conveyed neither of them.
global:
  # Required by dataplane.cp.host's guard.
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
nodeobserver:
  enabled: true

secrets:
  admin:
    create: false

# A full-privilege dataplane needs something creating work namespaces and binding
# `union-work-ns` in each one. Not what this fixture pins.
clusterresourcesync:
  enabled: true
