# helm-values: examples/values-test-certs.yaml
#
# nodeobserver.enabled at low_privilege: false, with namespaces.enabled at its
# chart default of false. The only fixture in which union-nodeobserver renders:
# it needs write on the cluster-scoped `nodes`, so its ClusterRole and
# ClusterRoleBinding are a deliberate escape hatch. low_privilege alone is the
# trigger, so a regression re-coupling privilege to namespaces.enabled degrades
# this render to a Role. The default-privilege combination is expect-fail.
global:
  # Required by dataplane.cp.host's guard.
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
nodeobserver:
  enabled: true

secrets:
  admin:
    create: false

# Enabled for the runtime work-ns binding route; the webhook's imagePullSecrets
# guard fails the render without it. Not what this fixture pins.
clusterresourcesync:
  enabled: true
