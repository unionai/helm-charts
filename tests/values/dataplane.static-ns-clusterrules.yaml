# helm-values: examples/values-test-certs.yaml
#
# Static namespaces plus a non-empty clusterresourcesync.clusterRoleRules.
# clusterRoleRules is not gated on namespace mode, so setting it re-emits
# union-clusterresourcesync-cluster-write (ClusterRole and ClusterRoleBinding)
# in a setup that otherwise creates no cluster-scoped object.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
namespaces:
  enabled: true
  static:
    - tenant-a-development
    - tenant-a-production
clusterresourcesync:
  enabled: true
  clusterRoleRules:
    - apiGroups:
        - example.com
      resources:
        - widgets
      verbs:
        - get
        - list
        - watch
        - create
        - patch
