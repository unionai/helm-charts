# helm-values: examples/values-test-certs.yaml
#
# Static posture with a non-empty clusterresourcesync.clusterRoleRules.
# clusterRoleRules is not posture-gated, so populating it re-emits
# union-clusterresourcesync-cluster-write (ClusterRole plus ClusterRoleBinding)
# in the posture that otherwise holds no cluster-scoped object, carrying only
# the operator's rules. `*` verbs are rejected by the chart's allowlist.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
namespaces:
  enabled: true
  static:
    - tenant-a-development
    - tenant-a-production
clusterresourcesync:
  enabled: true
  clusterRoleRules:
    - apiGroups:
        - example.com
      resources:
        - widgets
      verbs:
        - get
        - list
        - watch
        - create
        - patch
