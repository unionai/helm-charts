# helm-values: examples/values-test-certs.yaml
#
# flytepropellerwebhook.managedConfig: false at low_privilege: false — the one
# combination in which the webhook registers its own MutatingWebhookConfiguration,
# and so the one in which union-webhook-cluster-write renders.
#
# The grant cannot be confined: RBAC has no name to match against before the
# object exists, so `create` on a cluster-scoped kind is unbounded by
# construction. Its companion dataplane.webhook-unmanaged-config-low-priv.yaml
# pins the other half — that the same values do not produce it under
# low_privilege, where the binary is configured not to self-register.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
flytepropellerwebhook:
  managedConfig: false

secrets:
  admin:
    create: false

# A full-privilege dataplane needs something creating work namespaces and binding
# `union-work-ns` in each one. Not what this fixture pins.
clusterresourcesync:
  enabled: true
