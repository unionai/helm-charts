# helm-values: examples/values-test-certs.yaml
#
# flytepropellerwebhook.managedConfig: false at low_privilege: false: the webhook
# self-registers, so its mutatingwebhookconfigurations grant is used.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
flytepropellerwebhook:
  managedConfig: false

secrets:
  admin:
    create: false

# Enabled for the runtime work-ns binding route; the webhook's imagePullSecrets
# guard fails the render without it. Not what this fixture pins.
clusterresourcesync:
  enabled: true
