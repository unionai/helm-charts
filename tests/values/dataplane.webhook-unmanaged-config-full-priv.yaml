# helm-values: examples/values-test-certs.yaml
#
# managedConfig: false at low_privilege: false -- the configuration in which the
# webhook self-registers and its mutatingwebhookconfigurations grant is genuine.
#
# Without this fixture the only coverage of managedConfig: false would be an
# assertion that it fails, and the working path would render in no snapshot.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
flytepropellerwebhook:
  managedConfig: false

secrets:
  admin:
    create: false

# clusterresourcesync.enabled: true is the reach route, not part of what this
# fixture pins. The pooled work-ns role is never bound cluster-wide, so a
# low_privilege: false data plane reaches its task namespaces only through
# per-namespace RoleBindings -- and with namespaces.enabled at its default false,
# the provisioner applying the generated ab_union_rolebinding.yaml template (from
# dataplane.rbac.provisionerBindingTemplate) is the only thing creating them.
# Without it the webhook's imagePullSecrets guard fails the render. See
# tests/values/dataplane.namespaced-bindings-provisioner.yaml.
clusterresourcesync:
  enabled: true
