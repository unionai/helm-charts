# helm-values: examples/values-test-certs.yaml
# Pins the opencost subchart's RBAC, which no other fixture renders —
# dataplane.cost.yaml exercises the cost recording rules with opencost off.
# opencost prices the whole cluster, so its ClusterRole is cluster-wide
# get/list/watch and the chart offers no key to narrow it. The fixture exists so
# a subchart bump that widens it shows up in review.
global:
  # Control-plane host so the dataplane→CP connection resolves. Without it the
  # dataplane.cp.host template's required guard fails the render.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
opencost:
  enabled: true

secrets:
  admin:
    create: false
