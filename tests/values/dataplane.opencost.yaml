# helm-values: examples/values-test-certs.yaml
# Pins the opencost subchart's RBAC, which no other fixture renders — dataplane.cost.yaml
# exercises the cost recording rules with opencost off. opencost prices the whole cluster, so
# its ClusterRole is cluster-wide get/list/watch and the chart offers no key to narrow it.
# This fixture makes a subchart bump that widens it show up in review.
global:
  # Required by dataplane.cp.host's guard.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
opencost:
  enabled: true

secrets:
  admin:
    create: false
