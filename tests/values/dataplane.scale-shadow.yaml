# helm-values: values.aws.yaml, examples/values-test-certs.yaml
# Scale in shadow mode for one project: the watcher only, as the operator's identity, in the
# metadata bucket. No fixes, pushes, notifications or agent.

global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
  CLUSTER_NAME: "test-cluster-name"
  ORG_NAME: "test-org-name"
  CLIENT_ID: "test-client-id"
  AUTH_CLIENT_ID: "test-auth-client-id"
  METADATA_BUCKET: "test-metadata-bucket"
  FAST_REGISTRATION_BUCKET: "test-fast-registration-bucket"
  AWS_REGION: "test-region"
  BACKEND_IAM_ROLE_ARN: "test-backend-iam-role-arn"
  WORKER_IAM_ROLE_ARN: "test-worker-iam-role-arn"

secrets:
  admin:
    clientSecret: "test-not-real-secret"

scale:
  enabled: true
  # Scale needs a caller key or the proxy NetworkPolicy before it serves anything.
  callerAuth:
    secretName: scale-caller
  config:
    shadow: true
    projects: [scale-demo]
