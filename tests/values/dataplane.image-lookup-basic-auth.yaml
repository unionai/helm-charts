# helm-values: examples/values-test-certs.yaml
#
# A registry that needs a username and password to read image manifests
# (imageBuilder.authenticationType: basic). The operator proxy's image lookup
# must get its credentials from imageBuilder.basicAuth; without them the
# operator rejects the "basic" lookup at startup.
host: union.us-west-2.union.ai
clusterName: union-basic-auth
orgName: union
provider: aws

secrets:
  admin:
    create: true
    clientId: clientId
    clientSecret: clientSecret

storage:
  provider: aws
  authType: iam
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-east-2

imageBuilder:
  enabled: true
  defaultRepository: registry.example.com/union
  authenticationType: basic
  basicAuth:
    username: robot
    passwordSecretName: REGISTRY_PASSWORD

proxy:
  podEnv:
    - name: FLYTE_SECRET_REGISTRY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: registry-credentials
          key: password
