# helm-values: examples/values-test-certs.yaml
#
# Mode-combination guard: monitoring.enabled=true AND low_privilege=false.
#
# dataplane.monitoring.yaml covers monitoring under the default
# low_privilege=true. The kube-prometheus-stack subchart's RBAC is not gated
# on privilege mode at all, so both modes must be pinned to make any future
# gating visible in the diff.
global:
  # Control-plane host so the dataplane->CP connection resolves. Without it the
  # dataplane.cp.host template's required guard fails the render.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
low_privilege: false
monitoring:
  enabled: true
  alerting:
    enabled: true
secrets:
  admin:
    create: false
    clientSecret: test
    clientId: test

# clusterresourcesync.enabled: true is the reach route, not part of what this
# fixture pins. The pooled work-ns role is never bound cluster-wide, so a
# low_privilege: false data plane reaches its task namespaces only through
# per-namespace RoleBindings -- and with namespaces.enabled at its default false,
# the provisioner applying the generated ab_union_rolebinding.yaml template (from
# dataplane.rbac.provisionerBindingTemplate) is the only thing creating them.
# Without it the webhook's imagePullSecrets guard fails the render. See
# tests/values/dataplane.namespaced-bindings-provisioner.yaml.
clusterresourcesync:
  enabled: true
