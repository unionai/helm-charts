# helm-values: examples/values-test-certs.yaml
#
# monitoring.enabled at low_privilege: false. Pins that the kube-prometheus-stack
# subchart's RBAC is the same in either privilege mode.
global:
  # Required by dataplane.cp.host's guard.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
low_privilege: false
monitoring:
  enabled: true
  alerting:
    enabled: true
secrets:
  admin:
    create: false
    clientSecret: test
    clientId: test

# Enabled only because the webhook's imagePullSecrets guard requires it to render.
# This key is incidental to what the fixture pins above.
clusterresourcesync:
  enabled: true
