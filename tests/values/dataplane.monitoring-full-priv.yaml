# helm-values: examples/values-test-certs.yaml
#
# monitoring.enabled at low_privilege: false. Pins that the kube-prometheus-stack
# subchart's RBAC is the same in either privilege mode.
global:
  # Required by dataplane.cp.host's guard.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
low_privilege: false
monitoring:
  enabled: true
  alerting:
    enabled: true
secrets:
  admin:
    create: false
    clientSecret: test
    clientId: test

# Enabled only because the webhook's imagePullSecrets guard fails the render
# without it. Not what this fixture pins.
clusterresourcesync:
  enabled: true
