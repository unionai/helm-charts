# helm-values: examples/values-test-certs.yaml
#
# monitoring.enabled at low_privilege: false. The kube-prometheus-stack
# subchart's RBAC is not privilege-gated; the default mode is covered by
# dataplane.monitoring.yaml.
global:
  # Required by dataplane.cp.host's guard.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
low_privilege: false
monitoring:
  enabled: true
  alerting:
    enabled: true
secrets:
  admin:
    create: false
    clientSecret: test
    clientId: test

# Enabled for the runtime work-ns binding route; the webhook's imagePullSecrets
# guard fails the render without it. Not what this fixture pins.
clusterresourcesync:
  enabled: true
