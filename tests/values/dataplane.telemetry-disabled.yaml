# helm-values: examples/values-test-certs.yaml
# Opting out of telemetry injects FLYTE_DISABLE_TELEMETRY=true into every task pod.

host: union.test.union.ai
clusterName: union-test
orgName: union
provider: aws

storage:
  provider: aws
  authType: iam
  bucketName: test-bucket
  region: us-east-1

secrets:
  admin:
    create: true
    clientSecret: test-secret
    clientId: test-client

telemetry:
  enabled: false
