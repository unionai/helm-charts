# helm-values: examples/values-test-certs.yaml
global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
  AUTH_CLIENT_ID: "test-client-id"
secrets:
  admin:
    create: false
# block.allow left unset with singleNamespace off: the broker allows block mode
# for every pod (blockAllow: [{namespace: "*"}]). dataplane.uvol-broker.yaml
# covers an explicit list under the default singleNamespace.
singleNamespace: false
uvolMountBroker:
  enabled: true
