# helm-values: examples/values-test-certs.yaml
global:
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
secrets:
  admin:
    create: false
# block.allow left unset with low_privilege off: the broker allows block mode
# for every pod (blockAllow: [{namespace: "*"}]). dataplane.uvol-broker.yaml
# covers an explicit list under the default low_privilege.
low_privilege: false
uvolMountBroker:
  enabled: true
