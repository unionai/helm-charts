# Served under /onebox of a shared host, apps under /onebox/apps/<app>/.
basePath: /onebox/
database:
  sslMode: disable
  host: postgres.example.internal
  existingSecret: onebox-db
storage:
  type: s3
  bucket: onebox-data
  region: us-east-2
internalSecret:
  existingSecret: onebox-internal
serving:
  enabled: true
  publicURLPattern: https://platform.example.com/onebox/apps/%s/
  gateway:
    auth:
      signInURL: https://platform.example.com/oauth2/start
authMetadata:
  externalAuthServerBaseUrl: https://idp.example.com
webhook:
  certificate:
    # A generated cert would differ on every render.
    provider: external
    external: {caCert: test-ca, tlsCrt: test-crt, tlsKey: test-key}
