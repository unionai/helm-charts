# GCS with workload identity, console disabled, webhook disabled.
organization: acme
database:
  host: 10.0.0.5
  existingSecret: onebox-db
storage:
  type: gcs
  bucket: acme-onebox
  gcpProjectId: acme-prod
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: onebox@acme-prod.iam.gserviceaccount.com
console:
  enabled: false
webhook:
  enabled: false
internalSecret:
  existingSecret: onebox-internal
