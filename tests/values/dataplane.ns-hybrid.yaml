# helm-values: examples/values-test-certs.yaml
#
# Posture: hybrid — the chart pre-seeds a known list of work namespaces and
# clusterresourcesync provisions the rest at runtime. Inexpressible before
# namespaces.static and clusterresourcesync.createNamespaces became independent
# keys.
#
# Keyed on the new values only (no low_privilege). Deliberately distinctive
# namespace names, so the snapshot proves the list comes from namespaces.static
# and not from the six defaults.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

namespaces:
  enabled: true
  create: true
  static:
    - seeded-alpha
    - seeded-beta

clusterresourcesync:
  enabled: true
  config:
    union:
      auth:
        enable: false
