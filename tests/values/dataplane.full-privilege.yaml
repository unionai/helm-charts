# helm-values: examples/values-test-certs.yaml, examples/values.full-privilege.yaml
#
# Pins examples/values.full-privilege.yaml itself: the ClusterRole covers all six
# kube-state-metrics collectors, and the Deployment drops --namespaces.
global:
  # Required by dataplane.cp.host's guard.
  UNION_CONTROL_PLANE_HOST: "test-controlplane-host"
secrets:
  admin:
    create: false
    clientSecret: test
    clientId: test
