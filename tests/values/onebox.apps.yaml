# The no-auth install guide: apps and remote image builds with nothing to
# install beforehand but Postgres and a bucket. The chart runs Knative Serving,
# BuildKit, a registry and Prometheus.
database:
  sslMode: disable
  host: postgres.example.internal
  existingSecret: onebox-db
storage:
  type: s3
  bucket: onebox-data
  authType: accesskey
  existingSecret: onebox-s3
imageBuilder:
  enabled: true
  bundled:
    enabled: true
serving:
  enabled: true
  publicURLPattern: http://%s.apps.127-0-0-1.nip.io:8080
  gateway:
    auth:
      enabled: false
internalSecret:
  existingSecret: onebox-internal
webhook:
  certificate:
    # A generated cert would differ on every render.
    provider: external
    external: {caCert: test-ca, tlsCrt: test-crt, tlsKey: test-key}
prometheus:
  enabled: true
