# helm-values: examples/values-test-certs.yaml
#
# syncClusterConfig and secretsWatcher on together: pins the comp-ns-read and
# comp-ns-write rules each contributes.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
clusterresourcesync:
  enabled: true
config:
  operator:
    syncClusterConfig:
      enabled: true
    secretsWatcher:
      enabled: true
      dryRun: false
