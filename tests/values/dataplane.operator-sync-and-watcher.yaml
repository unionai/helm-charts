# helm-values: examples/values-test-certs.yaml
#
# Both operator features that add components-namespace rules, on at once.
# union-comp-ns-write should carry configmaps + podtemplates + apps/deployments
# (syncClusterConfig) and apps/replicasets (secretsWatcher); union-comp-ns-read
# should carry podtemplates + pods + secrets.
host: test.example.com

secrets:
  admin:
    clientId: test-client-id
    clientSecret: test-client-secret

low_privilege: false
clusterresourcesync:
  enabled: true
config:
  operator:
    syncClusterConfig:
      enabled: true
    secretsWatcher:
      enabled: true
      dryRun: false
