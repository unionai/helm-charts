# helm-values: examples/values-test-certs.yaml
#
# Multi-namespace mode (namespaces.enabled: true, low_privilege: false), the
# companion to dataplane.namespace-single.yaml. Every consumer of the shared
# "dataplane.namespaceTemplate" helper (executor, leaseworker, operator) must
# resolve the top-level namespace_mapping.template verbatim; the test- prefix
# below makes a coincidental match impossible.
host: union.us-west-2.union.ai
clusterName: my-cluster
orgName: union
provider: metal
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "test-{{`{{ project }}`}}-{{`{{ domain }}`}}"
# Enabled so its namespace_mapping.yaml is covered. This is the static posture,
# so it provisions no namespaces and holds no cluster-scoped grant; the chart
# emits the work-ns RoleBindings, one per namespaces.static name.
#
# Not a config to copy: namespaces.static keeps its defaults while
# namespace_mapping.template is test-prefixed, so the two do not correspond. For
# a coherent static posture see tests/values/dataplane.task-namespaces.yaml.
clusterresourcesync:
  enabled: true
storage:
  provider: "compat"
  endpoint: http://localstack.aws.svc.cluster.local:4566
  accessKey: test123
  secretKey: test
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
imageBuilder:
  defaultRepository: "localhost:5000/union-dataplane"
secrets:
  admin:
    create: true
    clientId: my-client-id
    clientSecret: my-secret
