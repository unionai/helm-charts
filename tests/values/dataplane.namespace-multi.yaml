# helm-values: examples/values-test-certs.yaml
#
# Multi-namespace mode (namespaces.enabled: true, low_privilege: false). Every
# consumer of the "dataplane.namespaceTemplate" helper (executor, leaseworker,
# operator) must resolve the top-level namespace_mapping.template verbatim. The
# test- prefix below makes a coincidental match impossible.
host: union.us-west-2.union.ai
clusterName: my-cluster
orgName: union
provider: metal
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "test-{{`{{ project }}`}}-{{`{{ domain }}`}}"
# Enabled so its namespace_mapping.yaml is covered. With static namespaces it
# provisions nothing and gets no cluster-scoped grant; the chart emits one
# work-ns RoleBinding per namespaces.static name.
#
# Do not copy this as a deployment config: namespaces.static keeps its defaults
# while namespace_mapping.template is test-prefixed, so the two do not match. For
# a coherent static setup see tests/values/dataplane.task-namespaces.yaml.
clusterresourcesync:
  enabled: true
storage:
  provider: "compat"
  endpoint: http://localstack.aws.svc.cluster.local:4566
  accessKey: test123
  secretKey: test
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
imageBuilder:
  defaultRepository: "localhost:5000/union-dataplane"
secrets:
  admin:
    create: true
    clientId: my-client-id
    clientSecret: my-secret
