# helm-values: examples/values-test-certs.yaml
#
# Companion to dataplane.namespace-single.yaml: multi-namespace mode.
#
# With namespaces.enabled=true and low_privilege=false, singleNamespace is
# false, so every run-to-namespace mapper must resolve namespace_mapping.template
# verbatim instead of the release namespace. A deliberately distinctive template
# (test- prefix) proves the shared "dataplane.namespaceTemplate" helper passes an
# arbitrary template through unchanged -- not a coincidental match on {{ domain }}:
#   - leaseworker -> namespace-template: 'test-{{ project }}-{{ domain }}'
#   - operator    -> org.namespaceTemplate: "test-{{ project }}-{{ domain }}"
#
# This guards the else-branch of the helper and proves the consolidation onto the
# single top-level namespace_mapping input (config.namespace_config /
# config.namespace_mapping removed) still drives the multi-namespace case.
#
# Deliberately keyed on the deprecated `low_privilege`: this fixture is a
# regression pin for the alias. Do not migrate it to `namespaces.enabled`
# alone, or the coverage disappears.
host: union.us-west-2.union.ai
clusterName: my-cluster
orgName: union
provider: metal
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "test-{{`{{ project }}`}}-{{`{{ domain }}`}}"
# syncresources provisions the per-domain namespaces + RBAC that task pods
# land in under multi-namespace; enable it so its namespace_mapping.yaml
# (also driven by the single top-level namespace_mapping) is snapshot-covered.
clusterresourcesync:
  enabled: true
storage:
  provider: "compat"
  endpoint: http://localstack.aws.svc.cluster.local:4566
  accessKey: test123
  secretKey: test
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
imageBuilder:
  defaultRepository: "localhost:5000/union-dataplane"
secrets:
  admin:
    create: true
    clientId: my-client-id
    clientSecret: my-secret
