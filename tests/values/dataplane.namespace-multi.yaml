# helm-values: examples/values-test-certs.yaml
#
# Companion to dataplane.namespace-single.yaml: multi-namespace mode.
#
# With namespaces.enabled=true and low_privilege=false, singleNamespace is
# false, so every run-to-namespace mapper must resolve namespace_mapping.template
# ({{ domain }}) instead of the release namespace:
#   - executor    -> namespace_mapping.template: '{{ domain }}'
#   - leaseworker -> namespace-template: '{{ domain }}'
#   - operator    -> org.namespaceTemplate: "{{ domain }}"
#
# This guards the else-branch of the shared "dataplane.namespaceTemplate" helper
# and proves the consolidation onto the single top-level namespace_mapping input
# (config.namespace_config / config.namespace_mapping removed) still drives the
# multi-namespace case.
host: union.us-west-2.union.ai
clusterName: my-cluster
orgName: union
provider: metal
low_privilege: false
namespaces:
  enabled: true
namespace_mapping:
  template: "{{`{{ domain }}`}}"
storage:
  provider: "compat"
  endpoint: http://localstack.aws.svc.cluster.local:4566
  accessKey: test123
  secretKey: test
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
imageBuilder:
  defaultRepository: "localhost:5000/union-dataplane"
secrets:
  admin:
    create: true
    clientId: my-client-id
    clientSecret: my-secret
