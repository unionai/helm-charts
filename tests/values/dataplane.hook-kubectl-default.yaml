# helm-values: examples/values-test-certs.yaml
# helm-args: --is-upgrade

# Renders the pre-upgrade hook with the *default* image.kubectl values.
# dataplane.hook-kubectl-image.yaml covers the override path, but it replaces
# the repository outright, so without this profile the shipped default is never
# exercised and a regression to an unqualified repository would go unnoticed.
# The hook template is gated on .Release.IsUpgrade, hence --is-upgrade above.

global:
  CONTROLPLANE_HOST: "test-controlplane-host"

secrets:
  admin:
    create: false
