# helm-values: examples/values-test-certs.yaml
# expect-fail: nodeobserver.enabled requires rbac.clusterWideBindings: true
#
# nodeobserver cannot run in the restricted posture at any taskNamespaces count.
# Its pod list uses an empty namespace with a spec.nodeName field selector, which
# Kubernetes authorizes as a cluster-scope check -- a RoleBinding cannot convey
# it and the call 403s wholesale.
#
# Note the pods it reads are in the RELEASE namespace (it filters client-side for
# a DaemonSet there), so the cluster-wide requirement comes from the query shape,
# not the data. If that upstream List is ever scoped to a namespace this fixture
# should be deleted, not re-baselined.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
low_privilege: false
nodeobserver:
  enabled: true
rbac:
  clusterWideBindings: false
taskNamespaces:
  - tenant-a-production

secrets:
  admin:
    create: false
