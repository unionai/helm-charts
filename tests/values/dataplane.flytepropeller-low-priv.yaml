# helm-values: examples/values-test-certs.yaml
#
# flytepropeller.enabled at the chart default low_privilege: true, the counterpart
# to dataplane.flytepropeller.yaml. Propeller declares into the pooled slots like
# every other component, so here its work-ns rules land in the release-namespace
# `union-work-ns` Role and its work-ns-cluster-read slot is not emitted at all.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
flytepropeller:
  enabled: true

secrets:
  admin:
    create: false
