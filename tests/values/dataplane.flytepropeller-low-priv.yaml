# helm-values: examples/values-test-certs.yaml
#
# flytepropeller.enabled at the chart default low_privilege: true, where
# flytepropeller-role renders as a namespaced Role and its cluster-scoped
# customresourcedefinitions grant is inert.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
flytepropeller:
  enabled: true

secrets:
  admin:
    create: false
