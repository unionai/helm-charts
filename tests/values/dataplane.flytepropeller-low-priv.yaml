# helm-values: examples/values-test-certs.yaml
#
# flytepropeller.enabled: true at the chart default low_privilege: true.
#
# dataplane.flytepropeller.yaml sets low_privilege: false, so flytepropeller-role
# has only ever rendered as a ClusterRole and its cluster-scoped
# customresourcedefinitions grant never tripped dead_cluster_rule. A user running
# the chart's own default with flytepropeller enabled gets a namespaced Role
# naming a cluster-scoped resource -- silently inert -- and no snapshot covered it.
global:
  CONTROLPLANE_HOST: "test-controlplane-host"
flytepropeller:
  enabled: true

secrets:
  admin:
    create: false
