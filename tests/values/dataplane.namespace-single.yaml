# helm-values: examples/values-test-certs.yaml
#
# Regression guard for single-namespace (low_privilege) namespace resolution.
#
# Every component that maps a run to a K8s namespace must pin to the release
# namespace under singleNamespace, so namespace-scoped RBAC (union-system) is
# never exceeded:
#   - executor    -> namespace_mapping.template
#   - leaseworker -> namespace-template
#   - operator    -> org.namespaceTemplate
#
# This fixture sets namespace_mapping.template ({{ domain }}) AND a stale
# config.operator.org.namespaceTemplate ({{ domain }}) — both of which must be
# IGNORED under singleNamespace. Before the shared "dataplane.namespaceTemplate"
# helper, the executor emitted namespace_mapping twice ({{ domain }} won by YAML
# last-key-wins) and task pods were created in the domain namespace, failing
# with "pods is forbidden ... in the namespace <domain>". The snapshot must show
# every mapper resolved to the release namespace.
host: union.us-west-2.union.ai
clusterName: my-cluster
orgName: union
provider: metal
low_privilege: true
namespace_mapping:
  template: "{{`{{ domain }}`}}"
config:
  operator:
    org:
      namespaceTemplate: "{{`{{ domain }}`}}"
storage:
  provider: "compat"
  endpoint: http://localstack.aws.svc.cluster.local:4566
  accessKey: test123
  secretKey: test
  bucketName: bucket
  fastRegistrationBucketName: bucket
  region: us-west-2
imageBuilder:
  defaultRepository: "localhost:5000/union-dataplane"
secrets:
  admin:
    create: true
    clientId: my-client-id
    clientSecret: my-secret
