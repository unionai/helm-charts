# helm-values: examples/values-test-certs.yaml,values.aws.yaml
#
# zero_trust with commonServiceAccount.enabled: false, which is the only posture
# where the five app-serving ServiceAccounts are distinct. Pins that each
# knative component's cluster roles bind to its own identity, so the per-binary
# permission split is real rather than nominal.

host: "test-controlplane-host"
# Required only because gateway.auth.enable defaults true and the envoy
# template hard-requires orgName once zero_trust.enabled is set. Not what
# this fixture pins.
global:
  ORG_NAME: "test-org-name"
secrets:
  admin:
    clientSecret: "test-not-real-secret"

zero_trust:
  enabled: true
knative-operator:
  enabled: false
commonServiceAccount:
  enabled: false
