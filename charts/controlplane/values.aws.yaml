# Union Control Plane — AWS overlay.
# Layer on top of values.yaml. Topology (intracluster, split-cluster, etc.)
# is decided by env-layer DNS + LB annotations, not by this overlay.

global:
  # --- Deployment Identity ---
  UNION_HOST: ""              # Control plane FQDN (e.g. "mycompany.union.ai")
  UNION_ORG: ""               # Organization name (must match dataplane)

  # --- AWS Infrastructure ---
  AWS_REGION: ""              # e.g. "us-west-2"
  DB_HOST: ""                 # RDS endpoint
  DB_NAME: ""
  DB_USER: ""
  DB_DEBUG: false             # Enable GORM SQL debug logging
  BUCKET_NAME: ""             # S3 bucket for metadata
  KUBERNETES_SECRET_NAME: ""  # K8s secret with DB password under key "pass.txt"

  # --- AWS IAM (IRSA) ---
  FLYTEADMIN_IAM_ROLE_ARN: "" # IAM role shared by flyteadmin, datacatalog, cacheservice

  # --- Service-to-Service OAuth2 ---
  INTERNAL_CLIENT_ID: ""      # client_credentials client ID
  AUTH_TOKEN_URL: ""          # OAuth2 token endpoint
  OIDC_S2S_SCOPE: ""          # Okta: leave empty. Entra ID: "api://my-app/.default"

configMap:
  connection:
    region: '{{ .Values.global.AWS_REGION }}'

flyte:
  region: '{{ .Values.global.AWS_REGION }}'
  storage:
    type: s3
    s3:
      region: "{{ .Values.global.AWS_REGION }}"
  configmap:
    adminServer:
      connection:
        region: '{{ .Values.global.AWS_REGION }}'
      # OIDC auth (appAuth / userAuth) is IdP-specific, not cloud-specific — it
      # lives in base values.yaml under flyte.configmap.adminServer.auth (with
      # the Okta/Entra fill-in guidance). Set it there or at the env layer.

  # --- AWS IRSA Annotations ---
  # Override global.AWS_POD_IDENTITY_ANNOTATION_PREFIX if your AWS pod identity
  # webhook uses a custom --annotation-prefix.
  flyteadmin:
    serviceAccount:
      annotations:
        "{{ .Values.global.AWS_POD_IDENTITY_ANNOTATION_PREFIX }}/role-arn": "{{ .Values.global.FLYTEADMIN_IAM_ROLE_ARN }}"
  datacatalog:
    serviceAccount:
      annotations:
        "{{ .Values.global.AWS_POD_IDENTITY_ANNOTATION_PREFIX }}/role-arn": "{{ .Values.global.FLYTEADMIN_IAM_ROLE_ARN }}"
  cacheservice:
    serviceAccount:
      annotations:
        "{{ .Values.global.AWS_POD_IDENTITY_ANNOTATION_PREFIX }}/role-arn": "{{ .Values.global.FLYTEADMIN_IAM_ROLE_ARN }}"

services:
  artifacts:
    serviceAccount:
      # Set per env: configure the artifacts pod's IRSA annotation map directly
      # (artifacts does not use AWS_POD_IDENTITY_ANNOTATION_PREFIX), e.g.
      #   annotations:
      #     eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/union-artifacts"
      annotations: {}

scylla:
  storageClass:
    provisioner: "ebs.csi.eks.amazonaws.com"
    parameters:
      type: gp2
      fsType: ext4

# EKS manages controller-manager, scheduler, etcd, and kube-proxy internally —
# their metrics endpoints aren't reachable from the cluster. Disable scraping
# + alerting to avoid false-positive TargetDown alerts.
monitoring:
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  defaultRules:
    rules:
      kubeControllerManager: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeProxy: false
      etcd: false
