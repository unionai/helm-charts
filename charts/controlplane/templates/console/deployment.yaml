apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  {{- $autoscaling := include "console.autoscaling" . | fromYaml }}
  {{- if and $autoscaling (not $autoscaling.enabled) }}
  replicas: {{ .Values.console.replicaCount }}
  {{- end }}
  {{- $strategy := include "console.strategy" . }}
  {{- if $strategy }}
  strategy:
    {{- $strategy | fromYaml | toYaml | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.console.podAnnotations }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        platform.union.ai/zone: "controlplane"
        {{- include "console.selectorLabels" . | nindent 8 }}
        {{- with .Values.console.podLabels }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.console.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ include "console.name" . }}
        securityContext:
          {{- toYaml .Values.console.securityContext | nindent 10 }}
        image: "{{ tpl .Values.console.image.repository . }}:{{ (tpl .Values.console.image.tag .) | default (tpl .Values.image.tag .) }}"
        imagePullPolicy: {{ .Values.console.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.console.service.targetPort }}
          protocol: TCP
        - name: http-metrics
          containerPort: {{ .Values.console.service.metricsPort }}
          protocol: TCP
        {{- /* Always inject UNION_ORG_OVERRIDE (single-tenant org) first so a consumer
               that overrides .Values.console.env (helm lists replace, not merge) can't
               drop it; then append the user-provided list. */}}
        {{- $envVars := list }}
        {{- if .Values.global.UNION_ORG }}
        {{- $envVars = concat $envVars (list (dict "name" "UNION_ORG_OVERRIDE" "value" (.Values.global.UNION_ORG | toString))) }}
        {{- end }}
        {{- $envVars = concat $envVars (.Values.console.env | default (list)) }}
        {{- /* Self-hosted feature flags the console reads at runtime
               (window.__ENV.SELF_HOSTED_FEATURE_FLAGS, a gate->bool JSON), so a surface is a
               values toggle rather than a console image rebuild. `artifacts-enabled` is
               DERIVED from the same expression that gates the artifacts pod
               (not services.artifacts.disabled) — one source of truth, so the nav can't drift
               from the backend. Explicit console.featureFlags entries override any gate. */}}
        {{- $ff := deepCopy (.Values.console.featureFlags | default dict) }}
        {{- $ff = merge $ff (dict "artifacts-enabled" (not (index .Values.services "artifacts" | default dict).disabled)) }}
        {{- with $ff }}
        {{- $envVars = concat $envVars (list (dict "name" "SELF_HOSTED_FEATURE_FLAGS" "value" (toJson .))) }}
        {{- end }}
        {{- $telemetry := .Values.console.telemetry | default dict }}
        {{- if and (hasKey $telemetry "externalEnabled") (not $telemetry.externalEnabled) }}
        {{- $envVars = concat $envVars (list (dict "name" "DISABLE_EXTERNAL_TELEMETRY" "value" "true")) }}
        {{- end }}
        {{- with $envVars }}
        env:
          {{- tpl (toYaml .) $ | nindent 10 }}
        {{- end }}
        {{- with .Values.console.envFrom }}
        envFrom:
          {{- tpl (toYaml .) $ | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.console.resources | nindent 10 }}
      {{- with (merge (dict) (.Values.console.nodeSelector | default dict) ((.Values.scheduling | default dict).nodeSelector | default dict)) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.console.affinity | default (.Values.scheduling | default dict).affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (concat ((.Values.scheduling | default dict).tolerations | default list) (.Values.console.tolerations | default list)) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
