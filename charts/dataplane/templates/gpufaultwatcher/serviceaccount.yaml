{{- if .Values.gpuFaultWatcher.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-gpufaultwatcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpuFaultWatcher.labels" . | nindent 4 }}
---
# A ClusterRole even under low_privilege: the watcher reads pods in every namespace on
# its node and writes its node's status, which a Role cannot grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: union-gpufaultwatcher
  labels:
    {{- include "gpuFaultWatcher.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# The node-scoped pod informer resolves a GPU holder to its pod.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
# Setting the GPUXidCritical condition. admissionpolicy.yaml holds this to the
# watcher's own node where the cluster supports it.
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: union-gpufaultwatcher
  labels:
    {{- include "gpuFaultWatcher.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: union-gpufaultwatcher
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: union-gpufaultwatcher
{{- end }}
