{{- if and .Values.gpuFaultWatcher.enabled (not .Values.gpuFaultWatcher.priorityClassName) }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "gpuFaultWatcher.priorityClassName" . }}
  labels:
    {{- include "gpuFaultWatcher.labels" . | nindent 4 }}
value: {{ .Values.gpuFaultWatcher.priorityClass.value | int64 }}
preemptionPolicy: Never
globalDefault: false
description: "Union GPU fault watcher. Schedules ahead of ordinary pods but never preempts, so on a full node the watcher waits rather than evicting a task."
{{- end }}
