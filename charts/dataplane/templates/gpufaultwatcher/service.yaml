{{- if .Values.gpuFaultWatcher.enabled }}
---
# For the ServiceMonitor, which scrapes each watcher pod through the Service's
# endpoints. Headless, since nothing connects to the Service itself.
apiVersion: v1
kind: Service
metadata:
  name: union-gpufaultwatcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpuFaultWatcher.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.gpuFaultWatcher.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "gpuFaultWatcher.selectorLabels" . | nindent 4 }}
{{- end }}
