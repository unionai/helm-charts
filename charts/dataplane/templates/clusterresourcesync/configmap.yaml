{{- if and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: union-clusterresourcesync-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clusterresourcesync.labels" . | nindent 4 }}
data:
  {{- with .Values.clusterresourcesync.config }}
  cluster_resources.yaml: | {{ tpl (toYaml .) $ | nindent 4 }}
  {{- end }}

  {{- with .Values.config.admin }}
  admin.yaml: | {{ tpl (toYaml .) $ | nindent 4 }}
  {{- end }}

  {{- with .Values.config.domain }}
  domain.yaml: | {{ tpl (toYaml .) $ | nindent 4 }}
  {{- end }}

  {{- with .Values.config.clusters }}
  clusters.yaml: |
    clusters:
      {{- tpl (toYaml .) $ | nindent 6 }}
  {{- end }}

  {{- with .Values.logging }}
  logger.yaml: |
    logger:
      {{- tpl (omit . "pythonLevel" | toYaml) $ | nindent 6 }}
  {{- end }}

  {{- $nsMapping := .Values.namespace_mapping }}
  {{- with $nsMapping }}
  namespace_mapping.yaml: |
    namespace_mapping:
      {{- tpl (toYaml .) $ | nindent 6 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: union-clusterresource-template
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clusterresourcesync.labels" . | nindent 4 }}
data:
{{- $static := include "dataplane.rbac.staticPosture" . }}
{{- range .Values.clusterresourcesync.templates }}
{{- /*
Drop a_namespace in the static posture. The namespaces are pre-created (by
common/namespaces.yaml, or out of band under namespaces.create: false) and this
ServiceAccount deliberately holds no `namespaces` permission there. Pre-creating
the object does not make reconciling it authorized: the create is a
cluster-scoped attribute check and returns Forbidden, on every project
namespace, on every sync cycle, with a render and an apply that both look clean.
*/ -}}
{{- if and (eq .key "a_namespace") $static }}
{{- else }}
  {{ .key }}.yaml: | {{ .value | nindent 4 }}
{{- end }}
{{- end }}
{{- /*
Add the work-ns RoleBinding when this chart is not binding it. Keyed `ab_` so it
applies immediately after a_namespace and before the ServiceAccount and
ResourceQuota, which now depend on the reach it grants.
*/ -}}
{{- if not $static }}
  ab_union_rolebinding.yaml: | {{ include "dataplane.rbac.provisionerBindingTemplate" . | nindent 4 }}
{{- end }}
{{- range .Values.clusterresourcesync.additionalTemplates }}
  {{ .key }}.yaml: | {{ .value | nindent 4 }}
{{- end }}
{{- end }}
