{{- if and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "clusterresourcesync.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.clusterresourcesync" -}}
cluster-write:
  - apiGroups: [""]
    resources: [namespaces]
    verbs:
      - get
      - create
      - patch
{{- if dig "cleanupNamespace" false (dig "unionProjectSyncConfig" dict (.Values.clusterresourcesync.config.cluster_resources | default dict) | default dict) }}
      - delete
{{- end }}
  - apiGroups: [""]
    resources: [serviceaccounts, resourcequotas]
    verbs:
      - get
      - create
      - patch
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs:
      - get
      - create
      - patch
{{- with .Values.clusterresourcesync.clusterRoleRules }}
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end -}}
