{{- if and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "clusterresourcesync.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
{{/* Outside the slot model: system:auth-delegator is a built-in ClusterRole. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: union-clustersync-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- define "dataplane.rbac.slots.clusterresourcesync" -}}
{{/*
Declares into work-ns in both postures; in the runtime posture it bootstraps by
creating the namespace and then the binding naming its own ServiceAccount. These
two resources matter only when no wildcard-holding component subsumes them.
*/}}
work-ns:
  - apiGroups: [""]
    resources: [serviceaccounts, resourcequotas]
{{- $staticPosture := include "dataplane.rbac.staticPosture" . -}}
{{- $operatorRules := .Values.clusterresourcesync.clusterRoleRules | default list -}}
{{- if or (not $staticPosture) $operatorRules }}
cluster-write:
{{- if not $staticPosture }}
{{/*
Runtime posture only, cluster-scoped because the namespaces do not exist at
render time. get/create/patch is the controller's one dynamic apply path
(flyte/flyteadmin/pkg/clusterresource/controller.go:379,387,440). The `bind`
rule is added by the emitter, not declared here, because its resourceNames
target the work-ns role name.
*/}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs:
      - get
      - create
      - patch
{{- if dig "unionProjectSyncConfig" "cleanupNamespace" false .Values.clusterresourcesync.config.cluster_resources }}
{{/*
Deletion runs only for archived projects when CleanupNamespace is set
(controller.go:481-520, 900-906). `dig` is required: unionProjectSyncConfig has
no default in values.yaml and a plain field chain panics on the absent parent.
*/}}
      - delete
{{- end }}
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs:
      - get
      - create
      - patch
{{- end }}
{{- with $operatorRules }}
{{/*
Operator-supplied and ungated by posture, since operator templates may need
grants the chart cannot derive in either. Appended, not merged into the block
above, so this key is a single list either way. emitSlot's verb allowlist
excludes `bind` for declared rules.
*/}}
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end -}}
