{{- if and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "clusterresourcesync.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
{{/*
Kept outside the slot model: this ClusterRoleBinding references the built-in
ClusterRole system:auth-delegator, which this chart does not define and
therefore cannot express as a slot.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: union-clustersync-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- define "dataplane.rbac.slots.clusterresourcesync" -}}
{{/*
Declares into work-ns in BOTH postures. In the static posture the chart binds
it there. In the runtime posture it is a subject of the binding IT creates --
that is how it bootstraps: create the namespace, create the binding naming its
own ServiceAccount, then do everything else through work-ns like any other
component.

serviceaccounts and resourcequotas are named for the case where no
wildcard-holding component is enabled. When the executor IS enabled the pooled
role already covers every apiGroup and resource, so these are subsumed -- which
is also why operator-supplied templates creating ConfigMaps, LimitRanges or CRDs
need no coordination and no resource-derivation mechanism.
*/}}
work-ns:
  - apiGroups: [""]
    resources: [serviceaccounts, resourcequotas]
{{- $staticPosture := include "dataplane.rbac.staticPosture" . -}}
{{- $operatorRules := .Values.clusterresourcesync.clusterRoleRules | default list -}}
{{- if or (not $staticPosture) $operatorRules }}
cluster-write:
{{- if not $staticPosture }}
{{/*
Runtime posture only. Cluster-scoped BY NECESSITY: it must act in namespaces
that do not exist when Helm renders, and there is no way to pre-authorize
those.

Verbs are get/create/patch because the controller applies every template
through one dynamic path -- Create, on AlreadyExists Get, then Patch
(flyte/flyteadmin/pkg/clusterresource/controller.go:379,387,440). It never
calls update, list or watch.

The `bind` rule is NOT declared here. It is appended by the emitter
(dataplane.rbac.provisionerBindRule), because its resourceNames target is the
single constant work-ns role name. Declaring it here is what created the
recursion the old groupsExcluding helper existed to break: the rule's
resourceNames came from the rendered role names, which came from evaluating
this declaration.
*/}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs:
      - get
      - create
      - patch
{{- if dig "unionProjectSyncConfig" "cleanupNamespace" false .Values.clusterresourcesync.config.cluster_resources }}
{{/*
Namespace deletion exists (controller.go:481-520) but runs only for archived
projects when CleanupNamespace is set (controller.go:900-906). It defaults
false, and unionProjectSyncConfig has no default entry in values.yaml at all --
`dig` is load-bearing here, not stylistic: a plain
.cluster_resources.unionProjectSyncConfig.cleanupNamespace chain panics with
"nil pointer evaluating interface {}.cleanupNamespace" the moment the parent
key is absent, which it always is unless an operator has set it. Today's grant
carries delete unconditionally via verbs: ['*'].
*/}}
      - delete
{{- end }}
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs:
      - get
      - create
      - patch
{{- end }}
{{- with $operatorRules }}
{{/*
Operator-supplied, from .Values.clusterresourcesync.clusterRoleRules. NOT
gated on the runtime posture above: an operator's own
`clusterresourcesync.templates` entries may need a grant for a resource type
the chart does not derive -- a custom resource, say -- in BOTH postures, and
in the static posture this component otherwise has no cluster-write role at
all for such a grant to extend. Appended (not merged into the block above) so
this key stays present, and a single list, whether the derived rules are
there or not. Flows through emitSlot's declared-rule validation like every
rule here: required verbs, verb allowlist -- and `bind` is not on that
allowlist for ANY declared rule, operator-supplied or chart-derived alike, so
there is no rule shape an operator can write here that reaches `bind`. The
emitter's own bind rule is appended separately, after this validation runs
(see dataplane.rbac.emitSlot's extraRules and common/rbac.yaml).
*/}}
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end -}}
