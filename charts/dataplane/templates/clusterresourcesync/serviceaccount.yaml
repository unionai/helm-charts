{{- if and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "clusterresourcesync.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
{{/*
Kept outside the bucket model: this ClusterRoleBinding references the built-in
ClusterRole system:auth-delegator, which this chart does not define and
therefore cannot express as a bucket.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: union-clustersync-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- /*
$constrained here MUST agree with the identically-named variable inside
dataplane.rbac.buckets.clusterresourcesync below: Go template `define` blocks
do not close over this scope's variables, so it is recomputed there from the
same three inputs rather than shared. If either expression changes, change
both -- they are two copies of one condition, not two independent ones.

namespaces.enabled is one of those three inputs, not just clusterWideBindings
and namespaces.managed: this posture routes clusterresourcesync's rules through
dataplane.rbac.emitBucket's per-namespaces.managed RoleBinding loop (see
_rbac.tpl), which itself only emits those RoleBindings when namespaces.enabled
is true. Without requiring it here too, a render with clusterWideBindings:
false and a non-empty namespaces.managed but namespaces.enabled left at its
default false would drop clusterresourcesync's cluster-scoped RBAC (the point
of $constrained) while ALSO getting no per-namespace RoleBindings to replace it
with -- a ClusterRole with no binding at all, silently non-functional. Folding
namespaces.enabled in means that combination instead falls back to the default
posture (clusterresourcesync keeps its normal cluster-wide RBAC), which is
wrong only in the sense of not being maximally confined -- not in the sense of
silently bricking the component.
*/}}
{{- $constrained := and (not .Values.rbac.clusterWideBindings) .Values.namespaces.managed .Values.namespaces.enabled }}
{{- if $constrained }}
{{/*
Constrained posture: this component's rules are routed through the SAME
dataplane.rbac.emitBucket used by every other component (common/rbac.yaml),
called directly here rather than via that file's identity loop --
clusterresourcesync always keeps its own dedicated ServiceAccount (never
collapsed onto a shared identity, see dataplane.rbac.identities), so there is
no group to join and nothing lost by calling it from its own component file
instead.

Reached when task namespaces are enumerated, cluster-wide bindings are off,
AND namespaces.enabled is true (see $constrained's doc comment above for why
that third input is required). Both cluster-scoped entries drop out of the
rule list -- `namespaces`
because the namespaces are pre-created rather than synced into existence, and
`clusterrolebindings` because the posture is per-namespace RoleBindings -- so
what remains (clusterresourcesync.namespacedRoleRules) is entirely namespaced
and can be conveyed by RoleBindings. Passing bucket "ns-write" is what makes
emitBucket choose that path: a ClusterRole (rules defined once) plus a
RoleBinding per entry in namespaces.managed, and -- because
rbac.clusterWideBindings is false whenever $constrained is true -- no
ClusterRoleBinding.

`bind` on the union ns-* roles is conveyed this way too. The escalation check
for creating a RoleBinding in namespace N is evaluated as a NAMESPACED
attribute check even though clusterroles is a cluster-scoped resource type, so
a RoleBinding suffices -- verified on k3s 1.35, see the plan's Superseded
Decisions section. The intuitive inference is the opposite and is wrong. It is
appended to namespacedRoleRules the same way the default posture's bucket
below appends it to clusterRoleRules -- outside the operator-overridable
list, so an overlay that replaces that list wholesale does not silently drop
it.

skipReleaseNamespaceBinding: true is the one way this call differs from what
emitBucket does for every other ns-write bucket: without it, emitBucket
always ALSO binds this role in the release namespace (see its doc comment in
_rbac.tpl), which is correct for components whose pods run there and need
namespaced access of their own, but wrong for clusterresourcesync -- it
provisions OTHER namespaces, and gaining reach into its own release namespace
as a side effect of gaining reach into task namespaces would be an
unrequested grant this posture is specifically supposed to not have.
*/}}
{{- $bindRule := dict
      "apiGroups" (list "rbac.authorization.k8s.io")
      "resources" (list "clusterroles")
      "verbs" (list "bind")
      "resourceNames" (fromYamlArray (include "dataplane.rbac.bucketRoleNames" $)) }}
{{- include "dataplane.rbac.emitBucket" (dict
      "ctx" $
      "identity" "clusterresourcesync"
      "bucket" "ns-write"
      "rules" (concat .Values.clusterresourcesync.namespacedRoleRules (list $bindRule))
      "serviceAccount" (printf "union-%s" (include "clusterresourcesync.serviceAccountName" $))
      "skipReleaseNamespaceBinding" true) }}
{{- end }}
{{- end }}
{{/*
clusterresourcesync's rule list is operator-overridable (see
clusterresourcesync.clusterRoleRules in values.yaml), so it cannot be
partitioned statically -- a customer may add any resource. It names
`namespaces` and `clusterrolebindings` in the default set, so the whole list is
cluster-scoped by construction and goes into cluster-write.

This component only renders at low_privilege: false (gating framework case 1:
in single-namespace mode there are no per-project namespaces, so there is
nothing to sync), which is why an unpartitioned cluster bucket is safe here.

Returns every bucket empty in the constrained posture (rbac.clusterWideBindings:
false, a non-empty namespaces.managed, AND namespaces.enabled: true). In that
posture this component's rules are still emitted through
dataplane.rbac.emitBucket -- just called directly, above, rather than reached
via this define and common/rbac.yaml's identity loop -- see the comment on the
constrained block above for why.
*/}}
{{- define "dataplane.rbac.buckets.clusterresourcesync" -}}
{{- $constrained := and (not .Values.rbac.clusterWideBindings) .Values.namespaces.managed .Values.namespaces.enabled -}}
ns-read: []
ns-write: []
cluster-read: []
cluster-write:
{{- if $constrained }} []
{{- else }}
{{ toYaml .Values.clusterresourcesync.clusterRoleRules | indent 2 }}
{{/*
Appended OUTSIDE clusterresourcesync.clusterRoleRules on purpose.

That list is documented as operator-overridable, and an environment overlay
that replaces it wholesale would silently drop this rule -- breaking exactly
the installs most likely to have customised it, and breaking them at first task
execution rather than at deploy.

`bind` is what satisfies RBAC escalation prevention when this ServiceAccount
creates a RoleBinding referencing a union ns-* ClusterRole. Without it the API
server refuses with "attempting to grant RBAC permissions not currently held",
because this identity does not hold apiGroups:['*'] x resources:['*'].

resourceNames confines the grant to the union bucket roles: it cannot be used
to bind an arbitrary ClusterRole. Verified on k3s 1.35 -- see the plan's
Superseded Decisions section for the experiment and its controls.

This adds no reach it lacks by another route: clusterRoleRules already grants
`roles` at verbs ['*'], and '*' includes `escalate`, so this identity can
already author a Role with arbitrary rules and bind it. Naming the ClusterRoles
explicitly is the narrower and more auditable path.

Emitted unconditionally, in both ServiceAccount modes -- NOT gated on
useCommonServiceAccount. dataplane.rbac.bucketRoleNames is already derived from
dataplane.rbac.identities, so it correctly names every identity's ns-* roles
whether they are collapsed onto union-system or split across dedicated
ServiceAccounts. Gating this on useCommonServiceAccount added no safety and
instead dropped the grant entirely in the one configuration that most needs
it: commonServiceAccount.enabled: false produces per-component ServiceAccounts
-- up to nine ns-* roles across five identities in this chart's own fixtures
-- every one of which this ServiceAccount still needs bind on to provision
task-namespace RoleBindings for them. See
tests/values/dataplane.per-component-sa-clustersync.yaml, which exists to keep
this covered.
*/}}
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      - bind
    resourceNames:
      {{- include "dataplane.rbac.bucketRoleNames" . | nindent 6 }}
{{- end }}
{{- end -}}
