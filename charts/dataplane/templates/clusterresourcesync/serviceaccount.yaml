{{- if and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "clusterresourcesync.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: union-clustersync-resource
{{- /*
The work-ns binding this component is handed in its clusterresource-template needs
two separate grants, and both are emitted here rather than left to
clusterRoleRules, because that key is an operator override and the chart cannot
inject a template whose permissions an override can withdraw. The failure mode is
silent: the render is clean and the sync is refused on every namespace it creates.

  rolebindings  ordinary authority to create the object. The default
                clusterRoleRules carries this, but none of the default templates
                creates a RoleBinding, so an install that trimmed the list to what
                it needed would not.
  bind          authority to reference a role the caller does not itself hold.
                Kubernetes refuses privilege escalation without it; resourceNames
                confines it to the one chart-authored role. See
                dataplane.rbac.provisionerBindRule.

Both are concatenated into one list rather than appended as text, so an empty or
null clusterRoleRules still renders a valid sequence.
*/}}
{{- $rules := .Values.clusterresourcesync.clusterRoleRules | default list -}}
{{- $bind := fromYamlArray (include "dataplane.rbac.provisionerBindRule" .) | default list -}}
{{- if $bind -}}
{{- $rules = concat $rules (list (dict
      "apiGroups" (list "rbac.authorization.k8s.io")
      "resources" (list "rolebindings")
      "verbs" (list "get" "create" "update" "patch"))) $bind -}}
{{- end }}
rules:
  {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: union-clustersync-resource
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: union-clustersync-resource
subjects:
  - kind: ServiceAccount
    name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: union-clustersync-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
