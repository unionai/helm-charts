{{- if and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "clusterresourcesync.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
{{/*
Outside the slot model on purpose: system:auth-delegator is a built-in
ClusterRole, so there is no rule for the emitter to carry.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: union-clustersync-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- define "dataplane.rbac.slots.clusterresourcesync" -}}
{{/*
Everything here is cluster-scoped rather than declared into work-ns, and that is
deliberate. This component's job is to bring a work namespace into existence: on
the first sync after a project is registered it creates the Namespace and then
applies the rest of its templates into it, and at that moment it holds no
RoleBinding there -- it is about to create one. Rules reachable only through a
per-namespace RoleBinding would be a chicken-and-egg, resolvable only by making
the ordering of the template keys load-bearing for correctness. It is not, and
dataplane.rbac.provisionerBindingTemplate says so; keeping these cluster-scoped
is what keeps that true.

What this replaces is the union-clustersync-resource ClusterRole, whose rules
came wholly from the clusterresourcesync.clusterRoleRules default: twelve
resources at verbs ['*'], cluster-wide, including secrets, roles and
clusterrolebindings. Nothing in the chart's own templates needs most of that.
The rules below are derived from what those templates actually create, and
clusterRoleRules becomes the empty extension point for anything an operator adds.
*/}}
cluster-write:
{{/*
a_namespace. `get` and the write verbs are the controller's apply path; there is
no list or watch, because it is told which namespaces to reconcile by the
control plane rather than by discovering them.
*/}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs:
      - get
      - create
      - update
      - patch
{{- if dig "cleanupNamespace" false (dig "unionProjectSyncConfig" dict (.Values.clusterresourcesync.config.cluster_resources | default dict) | default dict) }}
{{/*
Namespace deletion happens only for archived projects, and only when asked for.
`dig` rather than a field chain because unionProjectSyncConfig has no default in
values.yaml, and defaulted at every level because `dig` traverses a missing key
but not one that is present with a nil value -- which is what an overlay leaves
behind when it disables a block by setting it to null.
*/}}
      - delete
{{- end }}
{{/*
b_default_service_account and c_project_resource_quota, the other two default
templates.
*/}}
  - apiGroups: [""]
    resources: [serviceaccounts, resourcequotas]
    verbs:
      - get
      - create
      - update
      - patch
{{/*
The work-ns RoleBinding this component is handed in its clusterresource-template
needs two separate grants, and both are chart-derived rather than left to
clusterRoleRules, because that key is an operator override and the chart must not
inject a template whose permissions an override can withdraw. The failure mode is
silent: clean render, sync refused on every namespace it creates.

  rolebindings  ordinary authority to create the object.
  bind          authority to reference a role the caller does not itself hold.
                Kubernetes refuses privilege escalation without it. This half is
                added by dataplane.rbac.emitSlot rather than declared here,
                because its resourceNames name the pooled work-ns role and a
                declared rule is not allowed to name `bind` at all.
*/}}
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs:
      - get
      - create
      - update
      - patch
{{- with .Values.clusterresourcesync.clusterRoleRules }}
{{/*
Operator-supplied rules for resource types added through
clusterresourcesync.templates or additionalTemplates, which the chart cannot
derive. Ungated by namespace posture: these namespaces are not all known at
render time, so the grant has to be cluster-wide to be useful. Verbs run through
emitSlot's allowlist, which refuses wildcards.
*/}}
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end -}}
