{{- if and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "clusterresourcesync.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
{{/* Outside the slot model: system:auth-delegator is a built-in ClusterRole. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: union-clustersync-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- define "dataplane.rbac.slots.clusterresourcesync" -}}
{{/*
Applied from the cluster resource templates into each work namespace. Redundant
when another component already holds the work-ns wildcard.
*/}}
work-ns:
  - apiGroups: [""]
    resources: [serviceaccounts, resourcequotas]
{{- $staticPosture := include "dataplane.rbac.staticPosture" . -}}
{{- $operatorRules := .Values.clusterresourcesync.clusterRoleRules | default list -}}
{{- if or (not $staticPosture) $operatorRules }}
cluster-write:
{{- if not $staticPosture }}
{{/*
Cluster-scoped because these namespaces do not exist at render time. get, create
and patch are the controller's apply path
(flyte/flyteadmin/pkg/clusterresource/controller.go:379,387,440). The `bind` rule
is added by the emitter, not here, since its resourceNames name the work-ns role.
*/}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs:
      - get
      - create
      - patch
{{- if dig "unionProjectSyncConfig" "cleanupNamespace" false .Values.clusterresourcesync.config.cluster_resources }}
{{/*
Deletion happens only for archived projects (controller.go:481-520, 900-906).
`dig` is required: unionProjectSyncConfig has no default in values.yaml and a
plain field chain panics on the missing parent.
*/}}
      - delete
{{- end }}
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs:
      - get
      - create
      - patch
{{- end }}
{{- with $operatorRules }}
{{/*
Applied regardless of `staticPosture`: operator templates may need grants the
chart cannot derive. emitSlot's verb allowlist excludes `bind` for declared rules.
*/}}
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end -}}
