{{- if and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "clusterresourcesync.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: union-clustersync-resource
rules:
  {{- toYaml .Values.clusterresourcesync.clusterRoleRules | nindent 2 }}
  {{- /*
  `bind` on the pooled work-ns ClusterRole, so the RoleBinding this component is
  handed in its clusterresource-template can actually be created: Kubernetes
  refuses a caller granting permissions it does not itself hold unless it holds
  `bind` on the referenced role. Self-suppresses when the chart binds work-ns
  itself, so no guard is needed here. Emitted from the template rather than from
  clusterRoleRules because that key is an operator override.
  */}}
  {{- with include "dataplane.rbac.provisionerBindRule" . }}
  {{- . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: union-clustersync-resource
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: union-clustersync-resource
subjects:
  - kind: ServiceAccount
    name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: union-clustersync-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: union-{{ include "clusterresourcesync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
