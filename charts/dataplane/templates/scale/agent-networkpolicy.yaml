{{- if and .Values.scale.enabled .Values.scale.agent.enabled .Values.scale.agent.networkPolicy.enabled }}
{{- $np := .Values.scale.agent.networkPolicy }}
{{- /* Only Knative's own pods open connections to the agent: the activator (while it wakes), the
       internal gateway (once it is up) and the autoscaler (metrics). A task pod cannot reach it
       directly; through the gateway it gets nothing done without a token the operator proxy
       accepts. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scale-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: scale-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.knativeNamespace | default .Release.Namespace }}
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  {{- include "scale-agent.knativeApps" . | nindent 18 }}
{{- end }}
