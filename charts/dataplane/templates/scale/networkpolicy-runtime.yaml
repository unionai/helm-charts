{{- if and .Values.scale.enabled (dig "runtimeNetworkPolicy" "enabled" true .Values.scale) }}
{{- /* The Scale runtime serves no RPCs: only its debug port, with metrics and the health check
       (and the profiler only when scale.enablePprof is on). It holds Scale's signing key, the
       fix-writer secret, the GitHub App key and the notify credentials in memory, so only the
       chart's Prometheus and scale.runtimeNetworkPolicy.metricsFrom may connect, on that port.
       Kubelet probes are not subject to NetworkPolicy. As the union-operator chart
       (operator/deploy/helm/templates/scale/networkpolicy-runtime.yaml). */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scale-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "scale.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "scale.prometheusSelectorLabels" . | nindent 14 }}
        {{- with dig "runtimeNetworkPolicy" "metricsFrom" list .Values.scale }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: debug
          protocol: TCP
{{- end }}
