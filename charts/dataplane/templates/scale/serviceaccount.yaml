{{- if and .Values.scale.enabled .Values.scale.serviceAccount.create }}
{{- /* Scale's own identity in the cluster. It needs no Kubernetes API access, so it gets no role
       and no token; annotations give it cloud IAM for Scale's bucket only. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale.labels" . | nindent 4 }}
  {{- with .Values.scale.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
