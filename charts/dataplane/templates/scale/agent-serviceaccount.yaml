{{- if and .Values.scale.enabled .Values.scale.agent.enabled }}
{{- /* The agent's own identity in the cluster. It calls only the operator proxy and Flyte's read
       APIs, so it needs no Kubernetes API access, no token, and no cloud IAM. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scale-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-agent.labels" . | nindent 4 }}
  {{- with .Values.scale.agent.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
