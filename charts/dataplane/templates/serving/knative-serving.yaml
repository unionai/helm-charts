{{- if and (include "apps.enabled" .) (not .Values.zero_trust.enabled) }}
{{- /*
Nulling a values block (`serving: null`, `serving.auth: null`) is Helm's
documented way to drop a chart default, so every read below goes through a
`default dict` guard instead of dereferencing the block directly -- a bare
`.Values.serving.extraConfig.deployment` panics with "nil pointer evaluating
interface {}.extraConfig" the moment the block above it is null.

`auth.enabled` falls back to true rather than empty when its block is dropped:
values.yaml defaults it on, and rendering "" would quietly hand Kourier a
disabled Union authz plugin. An explicit `false` still renders as false.
*/}}
{{- $serving := .Values.serving | default dict }}
{{- $extraConfig := $serving.extraConfig | default dict }}
{{- $resources := $serving.resources | default dict }}
{{- $auth := $serving.auth | default dict }}
{{- $authEnabled := true }}
{{- if not (kindIs "invalid" $auth.enabled) }}
{{- $authEnabled = $auth.enabled }}
{{- end }}
apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: {{ include "serving.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.serving.knativeServingHook.enabled }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
  labels:
    {{- include "serving.labels" . | nindent 4 }}
spec:
  config:
    deployment:
      progress-deadline: "30m"
      queue-sidecar-cpu-request: "25m"
      queue-sidecar-cpu-limit: "1000m"
      queue-sidecar-memory-request: "400Mi"
      queue-sidecar-memory-limit: "800Mi"
      queue-sidecar-ephemeral-storage-request: "512Mi"
      queue-sidecar-ephemeral-storage-limit: "1024Mi"
      {{- if $extraConfig.deployment }}
      {{- tpl ($extraConfig.deployment | toYaml) . | nindent 6 }}
      {{- end }}
    features:
      kubernetes.podspec-affinity: "enabled"
      kubernetes.podspec-nodeselector: "enabled"
      kubernetes.podspec-tolerations: "enabled"
      kubernetes.podspec-fieldref: "enabled"
      kubernetes.podspec-dnspolicy: "enabled"
      kubernetes.podspec-schedulername: "enabled"
      kubernetes.podspec-securitycontext: "enabled"
      # Allow adding a capability subset to the user container's securityContext
      # (e.g. CAP_SYS_ADMIN, which PodTemplate.allow_fuse() sets so apps/tasks can
      # mount a FUSE filesystem such as a flyteplugins-union Volume).
      kubernetes.containerspec-addcapabilities: "enabled"
      {{- if $extraConfig.features }}
      {{- tpl ($extraConfig.features | toYaml) . | nindent 6 }}
      {{- end }}
    network:
      ingress-class: "kourier.ingress.networking.knative.dev"
      {{- if $extraConfig.network }}
      {{- tpl ($extraConfig.network | toYaml) . | nindent 6 }}
      {{- end }}
  {{- with $serving.replicas }}
  high-availability:
    replicas: {{ . }}
  {{- end }}
  ingress:
    kourier:
      enabled: true
      bootstrap-configmap: "{{ include "serving.envoyBootstrapConfigMapName" . }}"
      service-type: ClusterIP
  podDisruptionBudgets:
  - name: 3scale-kourier-gateway-pdb
    minAvailable: 50%
  - name: activator-pdb
    minAvailable: 50%
  - name: webhook-pdb
    minAvailable: 50%
  registry:
    override:
      # TODO(jeev): Wire up Union fork of Envoy
      3scale-kourier-gateway/kourier-gateway: ghcr.io/unionai/envoy:456fed84d4ad9a9dfb186d117d9362e9dc0f7c1f
      # TODO(jeev): Wire up Union fork of Kourier
      net-kourier-controller/controller: ghcr.io/unionai/kourier@sha256:5804c348d15b3959604e3e3ceed216c3a1c7b32cbe254c7d3eb02a35e62ba9c4
  workloads:
  - name: 3scale-kourier-gateway
    labels:
      {{- include "3scale-kourier-gateway.labels" . | nindent 6 }}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                {{- include "3scale-kourier-gateway.selectorLabels" . | nindent 16 }}
            topologyKey: topology.kubernetes.io/zone
    annotations:
      checksum/bootstrap-config: {{ include (print $.Template.BasePath "/serving/bootstrap-configmap.yaml") . | sha256sum }}
    env:
    - container: kourier-gateway
      envVars:
      - name: UNION_AUTHZ_TENANTAUTHURL
        value: "https://{{ include "dataplane.cp.host" . }}/me"
      - name: UNION_AUTHZ_TENANTAUTHSIGNINURL
        value: "https://{{ include "dataplane.cp.host" . }}/login"
      - name: UNION_AUTHZ_TENANTCONTROLPLANEURL
        value: "https://{{ include "dataplane.cp.host" . }}"
    {{- with index $resources "3scale-kourier-gateway" }}
    resources:
    {{- range $container, $resources := . }}
      - container: {{ $container }}
        {{- $resources | toYaml | nindent 8 }}
    {{- end }}
    {{- end }}
  - name: activator
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - activator
            topologyKey: topology.kubernetes.io/zone
  - name: autoscaler
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - autoscaler
            topologyKey: topology.kubernetes.io/zone
  - name: autoscaler-hpa
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - autoscaler-hpa
            topologyKey: topology.kubernetes.io/zone
  - name: controller
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - controller
            topologyKey: topology.kubernetes.io/zone
  - name: net-kourier-controller
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - net-kourier-controller
            topologyKey: topology.kubernetes.io/zone
    env:
    - container: controller
      envVars:
      - name: KOURIER_UNION_AUTHZ_ENABLED
        value: {{ $authEnabled | quote }}
    {{- with index $resources "net-kourier-controller" }}
    resources:
    {{- range $container, $resources := . }}
      - container: {{ $container }}
        {{- $resources | toYaml | nindent 8 }}
    {{- end }}
    {{- end }}
  - name: webhook
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - webhook
            topologyKey: topology.kubernetes.io/zone
{{- end }}
