{{- if .Values.flytepropeller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flytepropeller-system
  namespace: {{ .Release.Namespace }}
  {{- with include "flytepropeller.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropeller.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.flytepropeller" -}}
comp-ns-write:
{{/*
The ONLY component in this chart that does Kubernetes leader election.

NOT gated on config.core.propeller.leader-election.enabled, deliberately. That
flag defaults true, the grant is two resource types in the components namespace,
and gating on a deep config path an overlay can restructure buys a fragile
conditional in exchange for nothing. If leader election is off the rules are
inert; if the path moves and the gate silently goes false, propeller loses its
lock and fails over incorrectly.

Despite the config key being `leader-election.lock-config-map`
(values.yaml:455-458), the lock is resourcelock.LeasesResourceLock
(flyte/flytepropeller/pkg/leaderelection/leader_election.go:42) -- a Lease named
propeller-leader in the release namespace, not a ConfigMap. It also records
leader-election Events on that Lease, hence `events`.

The executor sets LeaderElection: cfg.LeaderElect but LeaderElect defaults false
and this chart never sets it; the operator's manager sets none at all. If either
changes, they need this rule too.
*/}}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
  - apiGroups: [""]
    resources: [events]
work-ns:
  - apiGroups: ['*']
    resources: ['*']
{{/*
Declared for WHERE these reads must be authorized. cfg.LimitNamespace is
compared against the "all" default and this chart writes propeller/configmap.yaml's
limit-namespace only under singleNamespace, so at low_privilege: false every
informer below watches the whole cluster -- and a namespace-less LIST or WATCH
is a cluster-scope authorization check no per-namespace RoleBinding satisfies.
Enumerated explicitly; work-ns's wildcards stay out of a ClusterRoleBinding.

flyteworkflows: the FlyteWorkflow informer is the component's whole reason to
exist (flyte/flytepropeller/pkg/controller/controller.go:392-393, factory
:626), and SharedInformerOptions appends informers.WithNamespace only when
LimitNamespace differs from the default (:556-559). controller.go:130 blocks on
flyteworkflowSynced, so an unauthorized watch is a startup failure. The group
is flyte.lyft.com (pkg/apis/flyteworkflow/register.go:4).

podtemplates: the same k8sOpts feed the PodTemplate informer at
controller.go:396 (factory :628).

pods: the manager cache at flyte/flytepropeller/cmd/controller/cmd/root.go:136-143
leaves DefaultNamespaces nil, and each enabled k8s plugin registers a watch
through it (source.Kind at pkg/controller/nodes/task/k8s/plugin_manager.go:645).
container and sidecar are the only enabled registered k8s plugins and both
watch a core v1 Pod; flyte1's k8s-array is a core plugin with no
ResourceToWatch.

NOT declared here: namespaces. The workflow garbage collector lists them
through a direct client (pkg/controller/garbage_collector.go:51-55) when the
limit is unset, but its failure is a logger.Errorf per round -- completed
workflows stop being collected, startup is unaffected. See README.md.
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [podtemplates, pods]
    verbs: [list, watch]
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows]
    verbs: [list, watch]
{{- end -}}
