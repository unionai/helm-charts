{{- if .Values.flytepropeller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flytepropeller-system
  namespace: {{ .Release.Namespace }}
  {{- with include "flytepropeller.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropeller.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{/*
flytepropeller RBAC buckets. Both cluster buckets are empty: the explicit
customresourcedefinitions rule was deleted as a strict subset of the wildcard
below, which leaves nothing cluster-scoped. The wildcard belongs in ns-* and
never in cluster-* -- bound by RoleBinding it is namespace-admin, the accepted
operating model; bound cluster-wide it would be cluster-admin.
*/}}
{{- define "dataplane.rbac.buckets.flytepropeller" -}}
ns-read:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [get, list, watch]
ns-write:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [create, update, delete, patch]
  # deletecollection is not covered by the wildcard rule above.
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows, flyteworkflows/finalizers]
    verbs: [deletecollection]
cluster-read: []
cluster-write: []
{{- end -}}
{{- define "dataplane.rbac.slots.flytepropeller" -}}
comp-ns-write:
{{/*
The ONLY component in this chart that does Kubernetes leader election.

NOT gated on config.core.propeller.leader-election.enabled, deliberately. That
flag defaults true, the grant is two resource types in the components namespace,
and gating on a deep config path an overlay can restructure buys a fragile
conditional in exchange for nothing. If leader election is off the rules are
inert; if the path moves and the gate silently goes false, propeller loses its
lock and fails over incorrectly.

Despite the config key being `leader-election.lock-config-map`
(values.yaml:455-458), the lock is resourcelock.LeasesResourceLock
(flyte/flytepropeller/pkg/leaderelection/leader_election.go:42) -- a Lease named
propeller-leader in the release namespace, not a ConfigMap. It also records
leader-election Events on that Lease, hence `events`.

The executor sets LeaderElection: cfg.LeaderElect but LeaderElect defaults false
and this chart never sets it; the operator's manager sets none at all. If either
changes, they need this rule too.
*/}}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
  - apiGroups: [""]
    resources: [events]
work-ns:
  - apiGroups: ['*']
    resources: ['*']
{{- end -}}
