{{- if .Values.flytepropeller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flytepropeller-system
  namespace: {{ .Release.Namespace }}
  {{- with include "flytepropeller.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropeller.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
---
{{- if .Values.flytepropeller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "dataplane.rbacKind" . }}
metadata:
  name: flytepropeller-role
rules:
  # Allow Access All plugin objects.
  #
  # Explicit rules for pods (read), events (write) and customresourcedefinitions
  # were removed as strict subsets of this wildcard -- see the equivalent comment
  # in nodeexecutor/serviceaccount.yaml.
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
      - patch
  # Retained: `deletecollection` is not covered by the wildcard rule above.
  # `post` was removed -- it is not a Kubernetes RBAC verb for resource requests,
  # where the verb comes from RequestInfoFactory and POST maps to `create`. The
  # lowercased HTTP method is used only for nonResourceURLs.
  - apiGroups:
      - flyte.lyft.com
    resources:
      - flyteworkflows
      - flyteworkflows/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
      - patch
      - deletecollection
{{- end }}
---
{{- if .Values.flytepropeller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "dataplane.rbacBindingKind" . }}
metadata:
  name: flytepropeller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ include "dataplane.rbacKind" . }}
  name: flytepropeller-role
subjects:
  - kind: ServiceAccount
    name: flytepropeller-system
    namespace: {{ .Release.Namespace }}
{{- end }}
