{{- if .Values.flytepropeller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flytepropeller-system
  namespace: {{ .Release.Namespace }}
  {{- with include "flytepropeller.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropeller.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.flytepropeller" -}}
comp-ns-write:
{{/* The only component here that does leader election, and
config.core.propeller.leader-election.enabled defaults true. Despite the
`leader-election.lock-config-map` values key the lock is a Lease, and leader
election emits Events on it.

Verbs are the leader-election contract rather than the write set: client-go's
resource lock Gets the Lease, Creates it if it is missing and Updates it to renew
and to release, and never lists, watches or deletes it. The event recorder
Creates, and Patches or Updates an event it has already emitted. */}}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, update, patch]
{{/* flyteworkflows is declared in its own rule for one verb: the garbage
collector deletes completed workflows by label selector, so it needs
deletecollection, which the wildcard rule below deliberately does not carry. The
role this replaces carried the same split -- flyteworkflows named separately, at
a wider verb set than its wildcard rule. */}}
work-ns:
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows, flyteworkflows/finalizers]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ['*']
    resources: ['*']
    verbs: [get, list, watch, create, update, patch, delete]
{{/* propeller/configmap.yaml writes limit-namespace only under singleNamespace,
so at singleNamespace: false these informers watch every namespace.
flyteworkflows: propeller's informer sets a namespace only when limit-namespace
is set, and startup blocks until that watch syncs. Group is flyte.lyft.com.
podtemplates: watched with the same options as flyteworkflows.
pods: the manager cache is not scoped to a namespace; container and sidecar are
the only enabled Kubernetes plugins.
No customresourcedefinitions rule either, though the role this replaces carried
one: CRDs are cluster-scoped, so only a cluster slot can convey them, and this
chart installs the FlyteWorkflow CRD itself from crds/. Under singleNamespace the
namespaced Role that held it never conveyed it at all. */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [podtemplates, pods]
    verbs: [list, watch]
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows]
    verbs: [list, watch]
{{/* The workflow garbage collector cannot delete a collection across all
namespaces, so when limit-namespace is empty, "all" or "all-namespaces" it lists
the namespaces and deletes completed FlyteWorkflows in each
(flytepropeller/pkg/controller/garbage_collector.go). If that List fails, the
round ends without deleting anything, and completed workflows are never removed.
It is a one-shot List through a plain clientset each round, so list without
watch. It runs by default: max-ttl defaults to 23h (at that value propeller falls
back to max-ttl-hours, also 23) and gc-interval to 30m, and none of them is set
here. limit-namespace goes through tpl in propeller/configmap.yaml,
so it is compared as rendered. */}}
{{- $limitNs := lower (tpl (toString (dig "propeller" "limit-namespace" "" (.Values.config.core | default dict))) .) }}
{{- if has $limitNs (list "" "all" "all-namespaces") }}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
{{- end }}
{{- with fromYamlArray (include "dataplane.rbac.taskPluginClusterReadRules" .) }}
{{/* Operator-supplied plugin CRD reads. See taskPluginClusterReadRules in
values.yaml. */}}
{{ toYaml . | indent 2 }}
{{- end }}
{{- end -}}
