{{- if .Values.flytepropeller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flytepropeller-system
  namespace: {{ .Release.Namespace }}
  {{- with include "flytepropeller.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropeller.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.flytepropeller" -}}
comp-ns-write:
{{/* The only component here that does leader election, and
config.core.propeller.leader-election.enabled defaults true. Despite the
`leader-election.lock-config-map` key (values.yaml:455-458) the lock is a Lease
(flyte/flytepropeller/pkg/leaderelection/leader_election.go:42), and leader
election emits Events on it. */}}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
  - apiGroups: [""]
    resources: [events]
work-ns:
  - apiGroups: ['*']
    resources: ['*']
{{/* propeller/configmap.yaml writes limit-namespace only under singleNamespace,
so at low_privilege: false these informers watch every namespace.
flyteworkflows: the FlyteWorkflow informer
(flyte/flytepropeller/pkg/controller/controller.go:392-393) sets a namespace only
when LimitNamespace is non-default (:556-559), and controller.go:130 blocks on
its sync. Group is flyte.lyft.com (pkg/apis/flyteworkflow/register.go:4).
podtemplates: same k8sOpts, controller.go:396.
pods: the manager cache (cmd/controller/cmd/root.go:136-143) leaves
DefaultNamespaces nil; container and sidecar are the only enabled k8s plugins
(pkg/controller/nodes/task/k8s/plugin_manager.go:645).
No namespaces rule: the GC lists them with a direct client
(pkg/controller/garbage_collector.go:51-55) and only logs the failure once per
round. See README.md. */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [podtemplates, pods]
    verbs: [list, watch]
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows]
    verbs: [list, watch]
{{- end -}}
