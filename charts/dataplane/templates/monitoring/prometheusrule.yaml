{{- if and .Values.monitoring.prometheusRules.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1")
  .Values.cost.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "unionai-dataplane.fullname" . }}-dataplane-rules
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
spec:
{{ .Files.Get "files/recording-rules.yml" | indent 2 }}
{{- end }}
---
{{- /* The standalone prometheus subchart loads these same recording rules via the
       recording_rules.yml key injected into the override config ConfigMap; see
       templates/prometheus/configmap.yaml. */ -}}
{{- if and .Values.monitoring.prometheusRules.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "unionai-dataplane.fullname" . }}-monitoring-rules
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
spec:
  groups:
    # --- Recording rules (always active) ---
    - name: union_dataplane_recording
      interval: 30s
      rules:
        - record: union:dp:service_availability
          expr: |
            min by (namespace, deployment) (
              kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}"}
              / kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}"}
            )

        - record: union:dp:propeller:round_latency_p99
          expr: |
            flyte:propeller:all:round:round_time_unlabeled_ms{
              namespace="{{ .Release.Namespace }}",
              quantile="0.99"
            }

        - record: union:dp:propeller:active_workflows
          expr: |
            sum(flyte:propeller:all:execstats:active_workflow_executions{
              namespace="{{ .Release.Namespace }}"
            })

        - record: union:dp:propeller:queue_depth
          expr: |
            sum(flyte:propeller:all:main_depth{namespace="{{ .Release.Namespace }}"})

        - record: union:dp:operator:work_queue_failed_rate
          expr: |
            rate(union_operator:work_queue:operations_failed{
              namespace="{{ .Release.Namespace }}"
            }[5m])

        - record: union:dp:leaseworker:active_actions
          expr: |
            leaseworker:active_run_leases{namespace="{{ .Release.Namespace }}"}

        - record: union:dp:pods_unschedulable:sum
          expr: |
            sum by (namespace) (
              kube_pod_status_unschedulable
            )

    {{- if .Values.monitoring.alerting.enabled }}
    # --- Operational alerts (opt-in) ---
    # Basic health checks only. For SLO-based alerts, see monitoring.slos.
    - name: union_dataplane_alerts
      rules:
        - alert: UnionDPServiceDown
          expr: |
            kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ "{{" }} $labels.deployment {{ "}}" }} has 0 available replicas"

        - alert: UnionDPHighRestartRate
          expr: |
            increase(
              kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[1h]
            ) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.pod {{ "}}" }} restarting frequently"

        - alert: UnionDPPodsUnschedulable
          expr: |
            sum by (namespace) (kube_pod_status_unschedulable) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }} has pods that cannot be scheduled (insufficient capacity or taints) for 15m"

    {{- end }}

    {{- $quarantine := include "gpuQuarantine.enabled" . }}
    {{- if and .Values.monitoring.alerting.enabled (or .Values.gpuFaultWatcher.enabled $quarantine) }}
    # --- GPU fault handling alerts (with gpuFaultWatcher and config.gpuQuarantine) ---
    - name: union_dataplane_gpu_alerts
      rules:
        {{- if .Values.gpuFaultWatcher.enabled }}
        # Freshness comes from the fault's own time, so old faults stay quiet after Prometheus
        # restarts with empty storage, and a repeat fault alerts after the watcher restarts.
        # The newest fault per group counts, so an old fault on another GPU cannot hide it.
        - alert: UnionDPGPUFaultDetected
          expr: |
            time() - max by (node, kind, code) (
              union_gpufaultwatcher_last_fault_timestamp_seconds{severity="critical"}
            ) < 600
          labels:
            severity: warning
            # The expression keeps no namespace, and an AlertmanagerConfig routes on it.
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: "Critical GPU fault {{ "{{" }} $labels.kind {{ "}}" }} {{ "{{" }} $labels.code {{ "}}" }} on node {{ "{{" }} $labels.node {{ "}}" }}"
            description: >-
              The GPU fault watcher saw a critical GPU fault ({{ "{{" }} $labels.kind {{ "}}" }} {{ "{{" }} $labels.code {{ "}}" }})
              on node {{ "{{" }} $labels.node {{ "}}" }} in the last 10 minutes and set the node's
              GPUXidCritical condition. Runs on the faulting GPU show the fault in Union.
              {{- if $quarantine }}
              GPU quarantine takes the node out of scheduling unless it is in dry run or at
              its cap. Check the GPU, then release the node with the
              union.ai/gpu-quarantine-release annotation, or replace it.
              {{- else }}
              New work can still land on the node. Check the GPU, then replace the node.
              {{- end }}

        - alert: UnionDPGPUFaultUnresolved
          expr: |
            max by (node) (
              kube_node_status_condition{condition="GPUXidCritical", status="true"}
            ) == 1
          for: 1h
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: "GPU fault on node {{ "{{" }} $labels.node {{ "}}" }} unresolved for 1h"
            description: >-
              A GPU on node {{ "{{" }} $labels.node {{ "}}" }} took a critical fault an hour ago
              (see the node's GPUXidCritical condition and events), and the node has been
              neither released nor replaced.
              {{- if $quarantine }}
              A quarantined node's GPUs sit idle; one that is not quarantined (dry run, or
              the cap reached) still takes work. Check the GPU, then release the node with
              kubectl annotate node {{ "{{" }} $labels.node {{ "}}" }} union.ai/gpu-quarantine-release=<your name or ticket>,
              or replace it.
              {{- else }}
              The watcher latches the condition and nothing keeps new work off the node.
              Check the GPU, then replace the node.
              {{- end }}

        # A new GPU node counts as unavailable until its watcher is ready, so this fires
        # only when every sample for 30m had a GPU node without a ready watcher.
        - alert: UnionDPGPUFaultWatcherUnavailable
          expr: |
            max by (namespace, daemonset) (
              min_over_time(kube_daemonset_status_number_unavailable{namespace="{{ .Release.Namespace }}", daemonset="union-gpufaultwatcher"}[25m])
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} GPU node(s) without a ready GPU fault watcher for 30m"
            description: >-
              GPU faults on these nodes are not reported and do not set GPUXidCritical.
              The watcher requests no resources and never preempts, so the usual causes are
              eviction under memory pressure, a node at its pod limit leaving the pod
              Pending, or a crash loop. Find the node with kubectl get pods -n
              {{ .Release.Namespace }} -o wide -l app.kubernetes.io/name=gpufaultwatcher.
        {{- end }}
        {{- if $quarantine }}

        - alert: UnionDPGPUQuarantineHeld
          expr: |
            max by (namespace) (union_gpuquarantine_held_nodes) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} GPU node(s) held in quarantine for 1h"
            description: >-
              These nodes carry the union.ai/gpu-quarantine taint, but their GPUXidCritical
              condition was cleared without the union.ai/gpu-quarantine-release annotation,
              so the operator keeps them out of scheduling. They are idle capacity and count
              against config.gpuQuarantine.maxQuarantinedNodes. Find them through their
              GPUQuarantineReleaseRequired events, check each GPU, then release the node
              with the union.ai/gpu-quarantine-release annotation, or replace it.
        {{- end }}
    {{- end }}

    {{- if .Values.monitoring.slos.enabled }}
    # --- SLO recording rules (opt-in) ---
    - name: union_dataplane_slo_recording
      interval: 30s
      rules:
        - record: union:dp:slo:availability:ratio
          expr: |
            avg(
              kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}"}
              / kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}"}
            )

        - record: union:dp:slo:propeller_success_rate
          expr: |
            (
              rate(flyte:propeller:all:round:success_count{namespace="{{ .Release.Namespace }}"}[5m])
              / (
                rate(flyte:propeller:all:round:success_count{namespace="{{ .Release.Namespace }}"}[5m])
                + rate(flyte:propeller:all:round:error_count{namespace="{{ .Release.Namespace }}"}[5m])
              )
            ) or vector(1)

        - record: union:dp:slo:propeller_round_latency_p99
          expr: |
            flyte:propeller:all:round:round_time_unlabeled_ms{
              namespace="{{ .Release.Namespace }}",
              quantile="0.99"
            } / 1000

        # Tracks propeller round health only. Action terminal outcomes are
        # deliberately excluded: bad user code fails actions, and that must not
        # burn the error budget or page anyone — it is not a platform fault.
        - record: union:dp:slo:execution_success_rate
          expr: |
            union:dp:slo:propeller_success_rate or vector(1)

        - record: union:dp:slo:error_budget_remaining
          expr: |
            (
              1 - (
                (1 - union:dp:slo:execution_success_rate)
                / (1 - {{ .Values.monitoring.slos.targets.availability }})
              )
            ) or vector(1)
    {{- end }}

    {{- if and .Values.monitoring.slos.enabled .Values.monitoring.slos.alerting.enabled }}
    # --- SLO burn rate alerts (opt-in) ---
    - name: union_dataplane_slo_alerts
      rules:
        - alert: UnionDPHighErrorBudgetBurn
          expr: |
            union:dp:slo:error_budget_remaining < 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "DP error budget > 50% consumed"

        - alert: UnionDPErrorBudgetExhausted
          expr: |
            union:dp:slo:error_budget_remaining < 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "DP error budget exhausted"

        - alert: UnionDPPropellerLatencySLOBreach
          expr: |
            union:dp:slo:propeller_round_latency_p99 > {{ .Values.monitoring.slos.targets.latencyP99 }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "DP propeller p99 latency exceeding SLO target"
    {{- end }}
{{- end }}
