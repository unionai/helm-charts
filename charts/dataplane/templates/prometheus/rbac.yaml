{{- if .Values.prometheus.enabled }}

{{- $prom := .Values.prometheus }}
{{- $ksm := index $prom "kube-state-metrics" }}
{{- $single := eq (include "singleNamespace" .) "true" }}

{{- $promSA := default ($prom.server.fullnameOverride | trunc 63 | trimSuffix "-") ((($prom.serviceAccounts).server).name) }}
{{- $ksmName := "" }}
{{- if $ksm.fullnameOverride }}
{{- $ksmName = $ksm.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $n := default "kube-state-metrics" $ksm.nameOverride }}
{{- $ksmName = ternary (.Release.Name | trunc 63 | trimSuffix "-") (printf "%s-%s" .Release.Name $n | trunc 63 | trimSuffix "-") (contains $n .Release.Name) }}
{{- end }}
{{- $ksmSA := default $ksmName (($ksm.serviceAccount).name) }}

{{- $ksmRules := dict
  "pods"            (dict "apiGroups" (list "") "resources" (list "pods"))
  "nodes"           (dict "apiGroups" (list "") "resources" (list "nodes"))
  "namespaces"      (dict "apiGroups" (list "") "resources" (list "namespaces"))
  "resourcequotas"  (dict "apiGroups" (list "") "resources" (list "resourcequotas"))
  "deployments"     (dict "apiGroups" (list "extensions" "apps") "resources" (list "deployments"))
  "daemonsets"      (dict "apiGroups" (list "extensions" "apps") "resources" (list "daemonsets"))
}}
{{- $ksmClusterScoped := list "nodes" "namespaces" }}

{{- range $c := (ternary ($ksm.collectors | default list) list (default false $ksm.enabled)) }}
{{- if not (hasKey $ksmRules $c) }}
{{- fail (printf "prometheus.kube-state-metrics.collectors names %q, which templates/prometheus/rbac.yaml has no rule for, so it would run unauthorized. Add it to the $ksmRules map there (and to $ksmClusterScoped if it is cluster-scoped). Mapped collectors: %s." $c (join ", " (keys $ksmRules | sortAlpha))) }}
{{- end }}
{{- end }}
{{- $ksmCollectors := ternary ($ksm.collectors | default list) list (default false $ksm.enabled) }}
{{- $ksmNamespaced := list }}
{{- $ksmCluster := list }}
{{- range $c := $ksmCollectors }}
{{- if and $single (has $c $ksmClusterScoped) }}
{{- $ksmCluster = append $ksmCluster $c }}
{{- else }}
{{- $ksmNamespaced = append $ksmNamespaced $c }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" $single }}
metadata:
  name: union-operator-prometheus-rbac
  {{- if $single }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources:
      {{- if not $single }}
      - nodes
      - nodes/proxy
      - nodes/metrics
      {{- end }}
      - services
      - endpoints
      - pods
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses/status
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  {{- if not $single }}
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" $single }}
metadata:
  name: union-operator-prometheus-rbac
  {{- if $single }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ $promSA }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" $single }}
  name: union-operator-prometheus-rbac
{{- if $single }}
{{- /* Node- and cluster-level telemetry has no namespaced form, so under singleNamespace
       Prometheus reads it through a read-only cluster role: node discovery and the
       kubelet's cadvisor endpoint through the API server proxy, and the API server's own
       /metrics. Endpoint discovery for the API server job is confined to the default
       namespace, where the kubernetes Service lives. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-prometheus-cluster-read
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - list
      - watch
  - apiGroups: [""]
    resources:
      - nodes/proxy
    verbs:
      - get
  - nonResourceURLs: ["/metrics"]
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-prometheus-cluster-read
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ $promSA }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-prometheus-cluster-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Namespace }}-prometheus-apiserver-discovery
  namespace: default
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources:
      - endpoints
      - services
      - pods
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Namespace }}-prometheus-apiserver-discovery
  namespace: default
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ $promSA }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Namespace }}-prometheus-apiserver-discovery
{{- end }}
{{- if $ksm.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" $single }}
metadata:
  name: {{ $ksmName }}
  {{- if $single }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
rules:
{{- range $c := $ksmNamespaced }}
{{- $rule := index $ksmRules $c }}
  - apiGroups: [{{ range $i, $g := $rule.apiGroups }}{{ if $i }}, {{ end }}{{ $g | quote }}{{ end }}]
    resources: [{{ range $i, $r := $rule.resources }}{{ if $i }}, {{ end }}{{ $r | quote }}{{ end }}]
    verbs: ["list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" $single }}
metadata:
  name: {{ $ksmName }}
  {{- if $single }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ $ksmSA }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" $single }}
  name: {{ $ksmName }}
{{- if $ksmCluster }}
{{- /* Cluster-scoped collectors (nodes, namespaces) have no namespaced form, so under
       singleNamespace they get their own read-only cluster role. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-kube-state-metrics-cluster-read
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
rules:
{{- range $c := $ksmCluster }}
{{- $rule := index $ksmRules $c }}
  - apiGroups: [{{ range $i, $g := $rule.apiGroups }}{{ if $i }}, {{ end }}{{ $g | quote }}{{ end }}]
    resources:
      {{- range $rule.resources }}
      - {{ . }}
      {{- end }}
    verbs:
      - list
      - watch
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-kube-state-metrics-cluster-read
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ $ksmSA }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-kube-state-metrics-cluster-read
{{- end }}
{{- end }}
{{- end }}
