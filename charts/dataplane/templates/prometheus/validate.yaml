{{- /*
templates/prometheus/rbac.yaml owns RBAC for prometheus and kube-state-metrics, because a
template can branch on low_privilege and a subchart value cannot. Turning either
subchart's rbac.create back on adds a second, parallel grant that low_privilege no longer
governs -- cluster-scoped even in a namespace-confined install, and reported by nothing.
*/ -}}
{{- if .Values.prometheus.enabled }}
{{- $prom := .Values.prometheus }}
{{- $ksm := index .Values.prometheus "kube-state-metrics" }}

{{- if .Values.prometheus.rbac.create }}
{{- fail "prometheus.rbac.create must stay false. RBAC for prometheus is authored by templates/prometheus/rbac.yaml, which follows low_privilege; the subchart's own ClusterRole does not, so enabling it grants cluster-wide read even under low_privilege: true, alongside the grant this chart already renders." }}
{{- end }}

{{- if ($ksm.rbac).create }}
{{- fail "prometheus.kube-state-metrics.rbac.create must stay false. RBAC for kube-state-metrics is authored by templates/prometheus/rbac.yaml, which follows low_privilege; the subchart's own does not, so enabling it adds a second grant that low_privilege no longer governs." }}
{{- end }}

{{- /*
An empty collectors list is not "collect nothing". It becomes an omitted --resources flag,
which is how the subchart spells "all of them" -- 28 collectors including secrets, against
the empty Role rbac.yaml derives from the same empty list.
*/ -}}
{{- if and $ksm.enabled (empty $ksm.collectors) }}
{{- fail "prometheus.kube-state-metrics.collectors must name at least one collector. An empty list drops --resources from the kube-state-metrics Deployment, which makes it collect all 28 defaults (including secrets) while templates/prometheus/rbac.yaml grants it nothing." }}
{{- end }}

{{- /*
rbac.yaml binds the ServiceAccount name each subchart derives, in the release namespace.
The inputs below break one of those two assumptions, and they break silently: the grant
lands on a ServiceAccount or namespace the workload does not use, which is the 403 this
chart renders RBAC to prevent. Refuse rather than mirror -- tracking two upstream helpers
across every subchart bump costs more than the overrides are worth.

Refuse only where the derivations actually diverge. An explicit `name` is the case that
does work: rbac.yaml and both subchart helpers all resolve to it, whatever `create` says.
*/ -}}
{{- /* `| default true` would read a literal false as unset -- test the key instead. */ -}}
{{- $promSrvSA := (($prom.serviceAccounts).server) | default dict }}
{{- if empty $promSrvSA.name }}
{{- if and (hasKey $promSrvSA "create") (not $promSrvSA.create) }}
{{- fail "prometheus.serviceAccounts.server.create: false needs prometheus.serviceAccounts.server.name set to the ServiceAccount you are supplying. Without a name the server runs as `default` while templates/prometheus/rbac.yaml binds prometheus.server.fullnameOverride, so the grant lands on a ServiceAccount nothing runs as." }}
{{- end }}
{{- if empty $prom.server.fullnameOverride }}
{{- fail "prometheus.server.fullnameOverride must stay set, or prometheus.serviceAccounts.server.name must name the ServiceAccount. templates/prometheus/rbac.yaml derives the binding subject from fullnameOverride; cleared and unnamed it renders an empty subject, while the subchart deploys as <release>-prometheus-server." }}
{{- end }}
{{- end }}
{{- if $prom.forceNamespace }}
{{- fail "prometheus.forceNamespace is not supported. templates/prometheus/rbac.yaml renders its Role and binding subjects in the release namespace, so moving the workloads elsewhere leaves them unbound." }}
{{- end }}
{{- $ksmSA := ($ksm.serviceAccount) | default dict }}
{{- if and $ksm.enabled (empty $ksmSA.name) (hasKey $ksmSA "create") (not $ksmSA.create) }}
{{- fail "prometheus.kube-state-metrics.serviceAccount.create: false needs prometheus.kube-state-metrics.serviceAccount.name set to the ServiceAccount you are supplying. Without a name kube-state-metrics runs as `default` while templates/prometheus/rbac.yaml binds the name the subchart would have created, so the grant lands on a ServiceAccount nothing runs as." }}
{{- end }}
{{- if and $ksm.enabled $ksm.namespaceOverride }}
{{- fail "prometheus.kube-state-metrics.namespaceOverride is not supported. templates/prometheus/rbac.yaml renders its Role and binding subjects in the release namespace, so moving kube-state-metrics elsewhere leaves it unbound." }}
{{- end }}

{{- end }}
