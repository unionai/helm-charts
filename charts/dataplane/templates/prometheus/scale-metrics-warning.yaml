{{- /* The warning NOTES.txt prints about remote_writes that would ship scale_* metrics, as a
       rendered object, so ArgoCD users (helm template, no NOTES) see it in the app's resources.
       Rendered only when such a queue exists; it warns and never fails the render (owner decision
       2026-11-13 18:40 IST). See _scale-metrics.tpl. */}}
{{- $scaleLeaks := include "dataplane.scaleMetrics.leaks" . | trim }}
{{- if $scaleLeaks }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: union-scale-metrics-warning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
  annotations:
    union.ai/warning: "Some remote_write queues would send Scale's scale_* metrics (project, domain and model names) out of the data plane. See data.warning."
data:
  warning: |
    WARNING: these remote_write queues would send Scale's scale_* metrics out of the data plane:
    {{- $scaleLeaks | nindent 4 }}
    The chart cannot change these queues. To keep scale_* in the data plane, add this rule to each one
    (writeRelabelConfigs and sourceLabels for kube-prometheus-stack, write_relabel_configs and
    source_labels for prometheus.server):
      - source_labels: [__name__]
        regex: scale_.*
        action: drop
{{- end }}
