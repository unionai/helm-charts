{{- if .Values.flytepropellerwebhook.enabled }}
{{- if and (not .Values.flytepropellerwebhook.managedConfig) .Values.low_privilege }}
{{- fail "flytepropellerwebhook.managedConfig: false requires low_privilege: false. With managedConfig false the webhook registers its own MutatingWebhookConfiguration, a cluster-scoped resource no namespaced Role can convey. Without that registration the webhook receives no pods at all, so there is nothing to degrade to. Set flytepropellerwebhook.managedConfig: true to have Helm create the configuration, or set low_privilege: false." }}
{{- end }}
{{/*
The webhook mirrors image-pull secrets INTO each task namespace, so it needs
`secrets` write reach there. Without it the Forbidden is SWALLOWED rather than
surfaced: the pod is admitted without its secret and fails later with
ImagePullBackOff, with nothing connecting the symptom to RBAC. That silence is
why this is a template-time error rather than a documentation note.

THREE routes supply that reach, and the guard fires only when none of them does:

  1. rbac.clusterWideBindings: true -- the ClusterRoleBinding reaches every
     namespace, including ones created later.
  2. A non-empty namespaces.managed WITH namespaces.enabled: true -- the chart
     emits a RoleBinding per enumerated namespace (Option 2).
  3. A runtime provisioner -- clusterresourcesync applying the generated
     d_union_rolebinding_* templates, or an external one the operator has
     asserted via rbac.externalBindingProvisioner (Option 1).

Route 3 did not exist when this guard was written, and the guard was left
asserting that Option 1 could not mirror pull secrets at all. It can: the
generated ns-write RoleBinding grants `secrets` create/update/patch to the
webhook's ServiceAccount in every namespace clusterresourcesync provisions,
before any task pod is admitted there. Route 3 is expressed as
dataplane.rbac.provisionerBindingsNeeded (the posture) AND something that will
act on it. The chart cannot verify that the provisioner is healthy, only that one
is configured; rbac.externalBindingProvisioner is explicitly an operator
assertion.

Gated on `not low_privilege` because under low_privilege: true the concern
cannot arise: namespaces.managed and rbac.clusterWideBindings are both
documented no-ops there (there are no task namespaces; everything is pinned to
the release namespace), and the webhook's ns-write role always keeps its
release-namespace RoleBinding regardless of either setting. Without this gate, a
low_privilege: true render with rbac.clusterWideBindings: false and
namespaces.enabled left at its default (false) would trip THIS guard before
reaching the more specific "rbac.clusterWideBindings: false has no meaning under
low_privilege: true" failure in dataplane.rbac.emitBucket, which is the one that
actually explains the misconfiguration.
*/}}
{{- $reachViaProvisioner := and (include "dataplane.rbac.provisionerBindingsNeeded" .) (or (and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .))) .Values.rbac.externalBindingProvisioner) }}
{{- if and (not .Values.low_privilege) (not .Values.rbac.clusterWideBindings) (not (and .Values.namespaces.managed .Values.namespaces.enabled)) (not $reachViaProvisioner) .Values.config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled }}
{{- fail "flytepropellerwebhook with imagePullSecrets enabled needs write reach into task namespaces, and this configuration gives it none. The webhook mirrors image-pull secrets INTO each task namespace; without reach the Forbidden is swallowed rather than surfaced, so the pod is admitted without its secret and fails later with ImagePullBackOff, with nothing connecting the symptom to RBAC. Supply reach by ONE of: rbac.clusterWideBindings: true; a non-empty namespaces.managed WITH namespaces.enabled: true (README Option 2); or clusterresourcesync.enabled: true, whose generated RoleBinding templates grant it per task namespace (README Option 1). Alternatively set config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled: false if this deployment does not use managed images." }}
{{- end }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.buckets.webhook" -}}
ns-read:
  - apiGroups: ['*']
    resources: [secrets, pods, replicasets/finalizers]
    verbs: [get, list, watch]
ns-write:
  - apiGroups: ['*']
    resources: [secrets, pods, replicasets/finalizers]
    verbs: [create, update, patch]
cluster-read: []
{{- if .Values.flytepropellerwebhook.managedConfig }}
cluster-write: []
{{- else }}
{{/*
Only reachable at low_privilege: false -- the guard at the top of this file
fails the render otherwise, because a webhook that cannot register itself
receives no pods and there is nothing useful to degrade to.
*/}}
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, create, update, patch]
{{- end }}
{{- end -}}
