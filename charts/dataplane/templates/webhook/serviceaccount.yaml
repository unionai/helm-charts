{{- if .Values.flytepropellerwebhook.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.webhook" -}}
{{/*
The webhook admits task pods and injects secrets into them, so everything it
touches at steady state is in a work namespace. The role this replaces asked for
the same resources with apiGroups: ['*'] from a ClusterRoleBinding, which at
singleNamespace: false conveyed them in every namespace in the cluster. Declaring
them into work-ns keeps the resources and drops the reach: the pooled role is a
ClusterRole referenced only from per-work-namespace RoleBindings.

The serving certificate is mounted as a volume whichever provider issues it,
so the webhook itself never reads it through the API. Its release-namespace
grants are below, each for a code path a particular setting turns on.

There is no render-time check that the work namespaces exist. They may be
provisioned by this chart, by clusterresourcesync, or by the operator's own
tooling, and the chart cannot see the third; guarding on the two it can see
would refuse a valid configuration. The failure mode is worth knowing when
reading a bug report, because the Forbidden is never surfaced: the pod is
admitted without its secret and later reports ImagePullBackOff, which reads as a
registry problem.

Verbs are those the role this replaces carried, which stopped short of delete:
the webhook mirrors secrets into work namespaces and never removes them, and it
mutates pods through admission rather than through the API.
*/}}
work-ns:
  - apiGroups: [""]
    resources: [secrets, pods]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [replicasets/finalizers]
    verbs: [get, list, watch, create, update, patch]
{{/*
`dig` through a defaulted map at EVERY optional level rather than a field chain. An
overlay that disables a block by setting it to null leaves the key present with a nil
value, which a chain dereferences and `dig` alone will not traverse -- so defaulting
only the leaf still fails when the parent is the thing set to null.

config.core.webhook itself is not defaulted here: it is dereferenced directly on the
base branch by propeller.webhookConfigMinimal, so nulling it already fails and is not
this template's to catch.
*/}}
{{- $embedded := .Values.config.core.webhook.embeddedSecretManagerConfig | default dict -}}
{{- if dig "enabled" false (dig "imagePullSecrets" dict $embedded | default dict) }}
{{/*
A cluster-wide Secret read this chart cannot narrow. The webhook's Secret cache
is scoped to one namespace only when limit-namespace is set to something other
than "all", which this chart does only under singleNamespace -- and where it is
scoped, the pooled work-ns Role above already grants the same reads in the one
namespace that exists, so this slot is correctly empty there.

Narrowing it outside singleNamespace would not work anyway: the secret manager reads
the mirrored Secret out of the admitted pod's own namespace through this same
cache. Without the grant the cache never syncs, and failurePolicy: Fail then
rejects every pod labelled inject-flyte-secrets.
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
{{- end }}
{{- $registers := and (not (include "singleNamespace" .)) (not .Values.flytepropellerwebhook.managedConfig) }}
{{- $legacyCerts := eq .Values.flytepropellerwebhook.certificate.provider "legacy" }}
{{- if $registers }}
{{/*
Registration copies the webhook pod's own ownerReferences onto the
MutatingWebhookConfiguration, so it Gets its pod first (createMutationConfig in
flytepropeller/pkg/webhook/entrypoint.go). The pod is in the release namespace,
which is not a work namespace here, and a refused Get fails registration, which
stops the webhook. The pod name is not known at render time.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
{{- end }}
{{- if or $registers $legacyCerts }}
comp-ns-write:
{{- if $registers }}
{{/*
Those ownerReferences point at the webhook's ReplicaSet with
blockOwnerDeletion set. Where the OwnerReferencesPermissionEnforcement
admission plugin runs, as on OpenShift, setting that needs update on the owner's
finalizers subresource, in the owner's namespace. The ReplicaSet name carries a
hash, so this cannot be pinned.
*/}}
  - apiGroups: [apps]
    resources: [replicasets/finalizers]
    verbs: [update]
{{- end }}
{{- if $legacyCerts }}
{{/*
The legacy provider's init-certs container
(flytepropeller/pkg/webhook/init_cert.go, createWebhookSecret) Creates the
certificate Secret in the release namespace. On AlreadyExists, which is the
usual case because mutatingwebhookconfiguration.yaml pre-creates it empty, it
Gets the Secret and Updates it with the keys it is missing. `create` cannot be
pinned, so it is a rule of its own. get and update pin to the name init-certs
writes, which it reads from the webhook config it mounts.
*/}}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "flytepropellerwebhook.initCertsSecretName" . | quote }}]
    verbs: [get, update]
{{- end }}
{{- end }}
{{- if $registers }}
{{/*
Emitted only where the webhook actually registers itself. Registration is a
Create, and on AlreadyExists a Get followed by an Update of the same object; the
binary never patches, deletes, lists or watches it.

`create` cannot be confined by resourceNames -- RBAC has nothing to match a name
against before the object exists -- so that rule is unbounded by construction
and is worth withholding wherever it is dead. `get` and `update` can be, and are
pinned to the one name the webhook registers under, taken from
flytepropellerwebhook.registeredConfigName so it follows the mounted config.
They are a separate rule because resourceNames on the create rule would make
create unusable.

It is dead under singleNamespace whatever managedConfig says: propeller's config
template sets disableCreateMutatingWebhookConfig under `or singleNamespace (and
flytepropellerwebhook.enabled managedConfig)`, so singleNamespace alone stops the
binary from creating one. That is deliberate: singleNamespace allows no
cluster-scoped write that is not pinned to a name, and this create cannot be.
This gate mirrors that expression. Note the pairing it exposes rather than
causes: under singleNamespace with managedConfig: false, neither Helm nor the
webhook creates the MutatingWebhookConfiguration.

*/}}
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, update]
    resourceNames: [{{ include "flytepropellerwebhook.registeredConfigName" . | quote }}]
{{- end }}
{{- end -}}
