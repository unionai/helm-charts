{{- if .Values.flytepropellerwebhook.enabled }}
{{- if and (not .Values.flytepropellerwebhook.managedConfig) .Values.low_privilege }}
{{- fail "flytepropellerwebhook.managedConfig: false requires low_privilege: false. With managedConfig false the webhook registers its own MutatingWebhookConfiguration, a cluster-scoped resource no namespaced Role can convey. Without that registration the webhook receives no pods at all, so there is nothing to degrade to. Set flytepropellerwebhook.managedConfig: true to have Helm create the configuration, or set low_privilege: false." }}
{{- end }}
{{/*
The webhook mirrors image-pull secrets INTO each task namespace, so it needs
`secrets` write reach there. Without it the Forbidden is SWALLOWED rather than
surfaced: the pod is admitted without its secret and fails later with
ImagePullBackOff, with nothing connecting the symptom to RBAC. That silence is
why this is a template-time error rather than a documentation note.

TWO routes supply that reach, and the guard fires only when neither does:

  1. A non-empty namespaces.static WITH namespaces.enabled: true -- the chart
     emits a RoleBinding per enumerated namespace (Option 2).
  2. A runtime provisioner -- clusterresourcesync applying the generated
     ab_union_rolebinding.yaml template, or an external one the operator has
     asserted via rbac.externalBindingProvisioner (Option 1).

There is no third route via a cluster-wide binding: work-ns is never bound with
a ClusterRoleBinding (see the SLOT MODEL comment in _rbac.tpl), so per-namespace
RoleBindings are the only reach any union workload ever has into a task
namespace. Route 2 is expressed as the negation of
dataplane.rbac.staticPosture (the posture) AND something that will act on it.
The chart cannot verify that the provisioner is healthy, only that one is
configured; rbac.externalBindingProvisioner is explicitly an operator
assertion.

Gated on `not low_privilege` because under low_privilege: true the concern cannot
arise: namespaces.static is a documented no-op there (there are no task
namespaces; everything is pinned to the release namespace), and the webhook's
work-ns role always keeps its release-namespace RoleBinding.
*/}}
{{- $reachViaProvisioner := and (not (include "dataplane.rbac.staticPosture" .)) (or (and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .))) .Values.rbac.externalBindingProvisioner) }}
{{- if and (not .Values.low_privilege) (not (and .Values.namespaces.static .Values.namespaces.enabled)) (not $reachViaProvisioner) .Values.config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled }}
{{- fail "flytepropellerwebhook with imagePullSecrets enabled needs write reach into task namespaces, and this configuration gives it none. The webhook mirrors image-pull secrets INTO each task namespace; without reach the Forbidden is swallowed rather than surfaced, so the pod is admitted without its secret and fails later with ImagePullBackOff, with nothing connecting the symptom to RBAC. Union workloads reach task namespaces only through per-namespace RoleBindings, so supply one by ONE of: a non-empty namespaces.static WITH namespaces.enabled: true (README Option 2); or clusterresourcesync.enabled: true, whose generated RoleBinding templates grant it per task namespace (README Option 1). Alternatively set config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled: false if this deployment does not use managed images." }}
{{- end }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.webhook" -}}
{{/*
No components-namespace grant. Its serving cert is created by Helm (helm,
external and legacy providers, in mutatingwebhookconfiguration.yaml) or by
cert-manager (certs.yaml), and is consumed as a volume mount either way -- no
RBAC involved. Its secret WRITES are image-pull-secret injection into work
namespaces, which is what work-ns is for.
*/}}
work-ns:
  - apiGroups: ['*']
    resources: [secrets, pods, replicasets/finalizers]
{{- if not .Values.flytepropellerwebhook.managedConfig }}
{{/*
Only reachable at low_privilege: false -- the guard at the top of this file
fails the render otherwise, because a webhook that cannot register itself
receives no pods and there is nothing to degrade to.

Verbs are named explicitly because this is a per-component cluster slot. The
emitter's write set would add delete, which this component does not do today.
*/}}
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, create, update, patch]
{{- end }}
{{- end -}}
