{{- if .Values.flytepropellerwebhook.enabled }}
{{- if and (not .Values.flytepropellerwebhook.managedConfig) .Values.low_privilege }}
{{- fail "flytepropellerwebhook.managedConfig: false requires low_privilege: false. With managedConfig false the webhook registers its own MutatingWebhookConfiguration, a cluster-scoped resource no namespaced Role can convey. Without that registration the webhook receives no pods at all, so there is nothing to degrade to. Set flytepropellerwebhook.managedConfig: true to have Helm create the configuration, or set low_privilege: false." }}
{{- end }}
{{/*
Gated on `not low_privilege` because under low_privilege: true the concern
this guard exists for cannot arise: namespaces.managed and rbac.clusterWideBindings
are both documented no-ops there (there are no task namespaces; everything is
pinned to the release namespace), and the webhook's ns-write role always keeps
its release-namespace RoleBinding regardless of either setting. Without this
gate, a low_privilege: true render with rbac.clusterWideBindings: false and
namespaces.enabled left at its default (false) would trip THIS guard before
reaching the more specific "rbac.clusterWideBindings: false has no meaning
under low_privilege: true" failure in dataplane.rbac.emitBucket, which is the
one that actually explains the misconfiguration.
*/}}
{{- if and (not .Values.low_privilege) (not .Values.rbac.clusterWideBindings) (not (and .Values.namespaces.managed .Values.namespaces.enabled)) .Values.config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled }}
{{- fail "flytepropellerwebhook with imagePullSecrets enabled requires either rbac.clusterWideBindings: true or a non-empty namespaces.managed WITH namespaces.enabled: true. The webhook mirrors image-pull secrets INTO each task namespace, and without reach there the Forbidden is swallowed rather than surfaced: the pod is admitted without its secret and fails later with ImagePullBackOff, with nothing connecting the symptom to RBAC. Enumerate namespaces.managed and set namespaces.enabled: true so the chart can bind into them, or set config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled: false if this deployment does not use managed images." }}
{{- end }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.buckets.webhook" -}}
ns-read:
  - apiGroups: ['*']
    resources: [secrets, pods, replicasets/finalizers]
    verbs: [get, list, watch]
ns-write:
  - apiGroups: ['*']
    resources: [secrets, pods, replicasets/finalizers]
    verbs: [create, update, patch]
cluster-read: []
{{- if .Values.flytepropellerwebhook.managedConfig }}
cluster-write: []
{{- else }}
{{/*
Only reachable at low_privilege: false -- the guard at the top of this file
fails the render otherwise, because a webhook that cannot register itself
receives no pods and there is nothing useful to degrade to.
*/}}
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, create, update, patch]
{{- end }}
{{- end -}}
