{{- if .Values.flytepropellerwebhook.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.webhook" -}}
# The pod webhook mirrors image-pull secrets into each work namespace. It never
# deletes them. If the mirror is forbidden, the webhook logs the error and admits
# the pod without its secret, so the failure surfaces as ImagePullBackOff.
work-ns:
  - apiGroups: [""]
    resources: [secrets, pods]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [replicasets/finalizers]
    verbs: [get, list, watch, create, update, patch]
{{- $embedded := .Values.config.core.webhook.embeddedSecretManagerConfig | default dict -}}
{{- if dig "enabled" false (dig "imagePullSecrets" dict $embedded | default dict) }}
# Cluster-wide, and cannot be narrowed today. The webhook's Secret cache is scoped
# only when propeller's limit-namespace is not `all`. The webhook reads the same
# config key, so scoping the cache would also pin propeller's own informer. The
# secret manager reads the mirrored Secret from the admitted pod's namespace
# through this cache. imagePullSecrets.enabled: false drops it, along with the mirroring.
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
{{- end }}
{{- $registers := and (not (include "singleNamespace" .)) (not .Values.flytepropellerwebhook.managedConfig) }}
{{- $legacyCerts := eq .Values.flytepropellerwebhook.certificate.provider "legacy" }}
{{- /* $registers: the webhook writes its own MutatingWebhookConfiguration, with the pod as owner. */}}
{{- if $registers }}
comp-ns-read:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
{{- end }}
{{- if or $registers $legacyCerts }}
comp-ns-write:
{{- if $registers }}
  - apiGroups: [apps]
    resources: [replicasets/finalizers]
    verbs: [update]
{{- end }}
{{- if $legacyCerts }}
  # The init-certs init container's certificate Secret.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "flytepropellerwebhook.initCertsSecretName" . | quote }}]
    verbs: [get, update]
{{- end }}
{{- end }}
{{- if $registers }}
cluster-write:
  # create cannot be pinned by name, because the name does not exist until the
  # object does. get and update are pinned.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, update]
    resourceNames: [{{ include "flytepropellerwebhook.registeredConfigName" . | quote }}]
{{- end }}
{{- end -}}
