{{- if .Values.flytepropellerwebhook.enabled }}
{{- if and (not .Values.flytepropellerwebhook.managedConfig) .Values.low_privilege }}
{{- fail "flytepropellerwebhook.managedConfig: false requires low_privilege: false. With managedConfig false the webhook registers its own MutatingWebhookConfiguration, a cluster-scoped resource no namespaced Role can convey. Without that registration the webhook receives no pods at all, so there is nothing to degrade to. Set flytepropellerwebhook.managedConfig: true to have Helm create the configuration, or set low_privilege: false." }}
{{- end }}
{{/*
The webhook mirrors image-pull secrets into each work namespace, reachable only
through a RoleBinding for union-work-ns. Without one the Forbidden is swallowed:
the pod is admitted without its secret and fails later with ImagePullBackOff, so
fail at render time instead.
*/}}
{{- $reach := or
      (include "dataplane.rbac.staticPosture" .)
      (and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)))
      .Values.rbac.externalBindingProvisioner }}
{{- if and (not (include "singleNamespace" .)) (not $reach) .Values.config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled }}
{{- fail "flytepropellerwebhook with imagePullSecrets enabled needs write reach into work namespaces, and this configuration gives it none. The webhook mirrors image-pull secrets into each work namespace; without reach the Forbidden is swallowed rather than surfaced, so the pod is admitted without its secret and fails later with ImagePullBackOff. Union workloads reach work namespaces only through a RoleBinding for the union-work-ns ClusterRole, so supply one by ONE of: namespaces.enabled: true with a non-empty namespaces.static (this chart creates the bindings); or clusterresourcesync.enabled: true (it creates them per namespace it provisions); or rbac.externalBindingProvisioner: true if your own tooling creates them. Alternatively set config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled: false if this deployment does not use managed images." }}
{{- end }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.webhook" -}}
{{/*
No components-namespace grant: the serving cert is a volume mount whichever
provider creates it. The secret writes are image-pull-secret injection.
*/}}
work-ns:
  - apiGroups: ['*']
    resources: [secrets, pods, replicasets/finalizers]
{{- if .Values.config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled }}
{{/*
Cluster-wide Secret read. Unscopeable here: the informer cache's only knob is
DefaultNamespaces, set only when limitNamespace is neither empty nor "all"
(flyte/flytepropeller/pkg/secret/secrets_injector.go:75-83), which this chart
sets only under singleNamespace. Pinning it to one namespace would break
mirroring, since embedded_secret_manager.go:263 reads the mirrored secret at the
admitted pod's namespace through the same cache. Without the grant the webhook
hangs in WaitForCacheSync while failurePolicy: Fail rejects every pod labelled
inject-flyte-secrets.
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
{{- end }}
{{- if not .Values.flytepropellerwebhook.managedConfig }}
{{/*
Only reachable at low_privilege: false; the guard at the top fails the render
otherwise. Verbs are explicit to omit delete, which this component never does.
*/}}
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, create, update, patch]
{{- end }}
{{- end -}}
