{{- if .Values.flytepropellerwebhook.enabled }}
{{- if and (not .Values.flytepropellerwebhook.managedConfig) .Values.low_privilege }}
{{- fail "flytepropellerwebhook.managedConfig: false requires low_privilege: false. With managedConfig false the webhook registers its own MutatingWebhookConfiguration, a cluster-scoped resource no namespaced Role can convey. Without that registration the webhook receives no pods at all, so there is nothing to degrade to. Set flytepropellerwebhook.managedConfig: true to have Helm create the configuration, or set low_privilege: false." }}
{{- end }}
kind: {{ include "dataplane.rbacKind" . }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: union-webhook-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - "*"
    resources:
      - secrets
      - pods
      - replicasets/finalizers
    verbs:
      - get
      - create
      - update
      - patch
      - list
      - watch
  {{- if not .Values.flytepropellerwebhook.managedConfig }}
  # Cluster-scoped: the webhook registers its own MutatingWebhookConfiguration only
  # when managedConfig is false. Under the default (true) Helm creates it via
  # flytepropellerwebhook.webhook.configurationName and this grant is unnecessary --
  # it rendered as a dead rule in every low-privilege install.
  #
  # The guard above means this branch is only reachable at low_privilege: false,
  # so this rule always lands in a ClusterRole.
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
    verbs:
      - get
      - create
      - update
      - patch
  {{- end }}
---
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
---
{{- end }}
# Create a binding from Role -> ServiceAccount
kind: {{ include "dataplane.rbacBindingKind" . }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: union-webhook-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ include "dataplane.rbacKind" . }}
  name: union-webhook-role
subjects:
  - kind: ServiceAccount
    name: {{ include "webhook.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
