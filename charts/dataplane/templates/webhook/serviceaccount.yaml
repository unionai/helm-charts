{{- if .Values.flytepropellerwebhook.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.webhook" -}}
work-ns:
  - apiGroups: [""]
    resources: [secrets, pods]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [replicasets/finalizers]
    verbs: [get, list, watch, create, update, patch]
{{- $embedded := .Values.config.core.webhook.embeddedSecretManagerConfig | default dict -}}
{{- if dig "enabled" false (dig "imagePullSecrets" dict $embedded | default dict) }}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
{{- end }}
{{- $registers := and (not (include "singleNamespace" .)) (not .Values.flytepropellerwebhook.managedConfig) }}
{{- $legacyCerts := eq .Values.flytepropellerwebhook.certificate.provider "legacy" }}
{{- if $registers }}
comp-ns-read:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
{{- end }}
{{- if or $registers $legacyCerts }}
comp-ns-write:
{{- if $registers }}
  - apiGroups: [apps]
    resources: [replicasets/finalizers]
    verbs: [update]
{{- end }}
{{- if $legacyCerts }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "flytepropellerwebhook.initCertsSecretName" . | quote }}]
    verbs: [get, update]
{{- end }}
{{- end }}
{{- if $registers }}
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, update]
    resourceNames: [{{ include "flytepropellerwebhook.registeredConfigName" . | quote }}]
{{- end }}
{{- end -}}
