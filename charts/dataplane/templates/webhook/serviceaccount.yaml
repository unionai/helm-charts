{{- if .Values.flytepropellerwebhook.enabled }}
{{- if and (not .Values.flytepropellerwebhook.managedConfig) .Values.low_privilege }}
{{- fail "flytepropellerwebhook.managedConfig: false requires low_privilege: false. With managedConfig false the webhook registers its own MutatingWebhookConfiguration, a cluster-scoped resource no namespaced Role can convey. Without that registration the webhook receives no pods at all, so there is nothing to degrade to. Set flytepropellerwebhook.managedConfig: true to have Helm create the configuration, or set low_privilege: false." }}
{{- end }}
{{/*
The webhook mirrors image-pull secrets INTO each work namespace, so it needs
reach there. Without it the Forbidden is SWALLOWED rather than surfaced: the pod
is admitted without its secret and fails later with ImagePullBackOff, with
nothing connecting the symptom to RBAC. That silence is why this is a
template-time error rather than a documentation note.

Union workloads reach a work namespace only through a RoleBinding for
union-work-ns -- this chart never binds that role cluster-wide. Something must
create it: this chart in the static posture, or clusterresourcesync at provision
time, or an external provisioner the operator asserts via
rbac.externalBindingProvisioner. The chart cannot verify a provisioner is
healthy, only that one is configured.

Gated on `not low_privilege` because the concern cannot arise there: everything
is pinned to the release namespace and work-ns keeps its RoleBinding in it.
*/}}
{{- $reach := or
      (include "dataplane.rbac.staticPosture" .)
      (and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)))
      .Values.rbac.externalBindingProvisioner }}
{{- if and (not (include "singleNamespace" .)) (not $reach) .Values.config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled }}
{{- fail "flytepropellerwebhook with imagePullSecrets enabled needs write reach into work namespaces, and this configuration gives it none. The webhook mirrors image-pull secrets into each work namespace; without reach the Forbidden is swallowed rather than surfaced, so the pod is admitted without its secret and fails later with ImagePullBackOff. Union workloads reach work namespaces only through a RoleBinding for the union-work-ns ClusterRole, so supply one by ONE of: namespaces.enabled: true with a non-empty namespaces.static (this chart creates the bindings); or clusterresourcesync.enabled: true (it creates them per namespace it provisions); or rbac.externalBindingProvisioner: true if your own tooling creates them. Alternatively set config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled: false if this deployment does not use managed images." }}
{{- end }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.webhook" -}}
{{/*
No components-namespace grant. Its serving cert is created by Helm (helm,
external and legacy providers, in mutatingwebhookconfiguration.yaml) or by
cert-manager (certs.yaml), and is consumed as a volume mount either way -- no
RBAC involved. Its secret WRITES are image-pull-secret injection into work
namespaces, which is what work-ns is for.
*/}}
work-ns:
  - apiGroups: ['*']
    resources: [secrets, pods, replicasets/finalizers]
{{- if .Values.config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled }}
{{/*
THE MOST SENSITIVE GRANT IN THIS CHART: cluster-wide READ of every Secret. It
is read-only, it is gated on the feature that needs it, and it is emitted only
at low_privilege: false -- but it is still cluster-wide secret read, so the
whole justification is recorded here rather than in a commit message.

WHY IT IS UNSCOPED, AND WHY IT CANNOT BE SCOPED IN THE CHART.
flyte/flytepropeller/pkg/secret/secrets_injector.go:75-83 builds the Secret
informer cache with ctrlcache.Options carrying only Scheme. DefaultNamespaces
-- the single scoping knob; there is no ByObject, no field or label selector,
no lazy per-namespace construction -- is set only when limitNamespace is
neither empty nor "all". That value reaches the binary from a propeller: block
in the webhook's config, and this chart emits that block only under
singleNamespace (propeller.webhookConfigMinimal in _helpers.tpl). At full
privilege the binary's own "all" default therefore applies, the cache takes the
single unscoped-namespace path, and the Secret informer is registered eagerly
at secrets_injector.go:92 so the initial cluster-wide LIST is unavoidable.

WHY SCOPING IT TO THE WEBHOOK'S OWN NAMESPACE WOULD BREAK MIRRORING.
The cache has two readers, not one. embedded_secret_manager.go:333 reads the
reference secret in POD_NAMESPACE, but :263 reads the MIRRORED secret at
pod.GetNamespace() -- the admitted pod's namespace, an arbitrary work namespace
in this posture -- through the same cache-backed client. With DefaultNamespaces
pinned to one namespace, controller-runtime's multi_namespace_cache.go:236-241
returns "unknown namespace for the cache", which is a plain error and NOT
NotFound, so :282-285 fails admission instead of creating the mirror. A
one-namespace cache is therefore not a narrower version of this grant; it is a
broken one. (Under low_privilege it is fine, because there the pod's namespace
IS the release namespace.)

WHY WITHHOLDING IT IS WORSE THAN IT LOOKS. The failure is not a crash-loop.
WaitForCacheSync polls until the context is done and a Forbidden LIST is
retried forever, so newSecretsInjector hangs before webhookConfig.Register ever
runs. The container declares no readiness or liveness probe, so the pod reports
Ready and is never restarted, the Service keeps its endpoint, and
failurePolicy: Fail then rejects every pod carrying the inject-flyte-secrets
label. A green webhook pod and a dataplane that admits no task pods.

WHY THIS IS STILL A NARROWING. On the released chart this same ServiceAccount
holds cluster-wide secrets at get, create, update, patch, list and watch via
ClusterRoleBinding/union-webhook-binding, plus every apiGroup and resource at
the full write set via ClusterRoleBinding/union-leaseworker. This is list and
watch, on secrets, and nothing else.

TO NOT GRANT IT, set
config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled:
false. secrets_injector.go:74 then skips the cache entirely and uses a direct
client, and this rule disappears with it. The cost is no managed-image pull
secrets. The proper fix is in the binary -- bypass the cache for the :263 read
-- after which only namespaced get is needed and comp-ns-read plus work-ns
cover it.
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
{{- end }}
{{- if not .Values.flytepropellerwebhook.managedConfig }}
{{/*
Only reachable at low_privilege: false -- the guard at the top of this file
fails the render otherwise, because a webhook that cannot register itself
receives no pods and there is nothing to degrade to.

Verbs are named explicitly because this is a per-component cluster slot. The
emitter's write set would add delete, which this component does not do today.
*/}}
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, create, update, patch]
{{- end }}
{{- end -}}
