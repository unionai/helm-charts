{{- if .Values.flytepropellerwebhook.enabled }}
{{- if and (not .Values.flytepropellerwebhook.managedConfig) .Values.low_privilege }}
{{- fail "flytepropellerwebhook.managedConfig: false requires low_privilege: false. With managedConfig false the webhook registers its own MutatingWebhookConfiguration, a cluster-scoped resource that no namespaced Role can grant, and without that registration the webhook is sent no pods at all. Set flytepropellerwebhook.managedConfig: true to have Helm create the configuration instead, or set low_privilege: false." }}
{{- end }}
{{/*
The webhook mirrors image-pull secrets into work namespaces, which needs a
RoleBinding for union-work-ns in each of them. There is no render-time check:
work namespaces may be provisioned by this chart, by clusterresourcesync, or by
the operator's own tooling, and the chart cannot see the third. Guarding on only
the two it can see would fail a valid configuration.

The failure mode is worth knowing when reading a bug report. The Forbidden is
never surfaced: the pod is admitted without its secret and later hits
ImagePullBackOff, which reads as a registry problem. See README: RBAC, and
"Diagnosing a missing binding".
*/}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.webhook" -}}
{{/*
No components-namespace grant: the serving cert is mounted as a volume whichever
provider creates it. The secrets writes here are image-pull-secret injection.
*/}}
work-ns:
  - apiGroups: ['*']
    resources: [secrets, pods, replicasets/finalizers]
{{- if .Values.config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled }}
{{/*
Cluster-wide Secret read that cannot be narrowed: the webhook's Secret cache is
scoped to a namespace only when limitNamespace is neither empty nor "all", which
this chart does only under singleNamespace. Narrowing it would break mirroring
anyway, since the secret manager reads the mirrored secret from the admitted
pod's namespace through the same cache. Without the grant the webhook hangs
waiting for that cache to sync and failurePolicy: Fail rejects every pod
labelled inject-flyte-secrets.
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
{{- end }}
{{- if not .Values.flytepropellerwebhook.managedConfig }}
{{/*
Only emitted at low_privilege: false; the guard at the top of this file fails the
render otherwise. Verbs are listed explicitly to leave out delete.
*/}}
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, create, update, patch]
{{- end }}
{{- end -}}
