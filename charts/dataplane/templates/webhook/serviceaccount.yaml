{{- if .Values.flytepropellerwebhook.enabled }}
{{- if and (not .Values.flytepropellerwebhook.managedConfig) .Values.low_privilege }}
{{- fail "flytepropellerwebhook.managedConfig: false requires low_privilege: false. With managedConfig false the webhook registers its own MutatingWebhookConfiguration, a cluster-scoped resource no namespaced Role can convey. Without that registration the webhook receives no pods at all, so there is nothing to degrade to. Set flytepropellerwebhook.managedConfig: true to have Helm create the configuration, or set low_privilege: false." }}
{{- end }}
{{/*
The webhook mirrors image-pull secrets INTO each task namespace, so it needs
`secrets` write reach there. Without it the Forbidden is SWALLOWED rather than
surfaced: the pod is admitted without its secret and fails later with
ImagePullBackOff, with nothing connecting the symptom to RBAC. That silence is
why this is a template-time error rather than a documentation note.

TWO routes supply that reach, and the guard fires only when neither does:

  1. A non-empty namespaces.managed WITH namespaces.enabled: true -- the chart
     emits a RoleBinding per enumerated namespace (Option 2).
  2. A runtime provisioner -- clusterresourcesync applying the generated
     d_union_rolebinding_* templates, or an external one the operator has
     asserted via rbac.externalBindingProvisioner (Option 1).

There is no third route via a cluster-wide binding: this chart never binds an
ns-* role with a ClusterRoleBinding (see dataplane.rbac.emitBucket), so
per-namespace RoleBindings are the only reach any union workload ever has into a
task namespace. Route 2 is expressed as dataplane.rbac.provisionerBindingsNeeded
(the posture) AND something that will act on it. The chart cannot verify that the
provisioner is healthy, only that one is configured;
rbac.externalBindingProvisioner is explicitly an operator assertion.

Gated on `not low_privilege` because under low_privilege: true the concern cannot
arise: namespaces.managed is a documented no-op there (there are no task
namespaces; everything is pinned to the release namespace), and the webhook's
ns-write role always keeps its release-namespace RoleBinding.
*/}}
{{- $reachViaProvisioner := and (include "dataplane.rbac.provisionerBindingsNeeded" .) (or (and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .))) .Values.rbac.externalBindingProvisioner) }}
{{- if and (not .Values.low_privilege) (not (and .Values.namespaces.managed .Values.namespaces.enabled)) (not $reachViaProvisioner) .Values.config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled }}
{{- fail "flytepropellerwebhook with imagePullSecrets enabled needs write reach into task namespaces, and this configuration gives it none. The webhook mirrors image-pull secrets INTO each task namespace; without reach the Forbidden is swallowed rather than surfaced, so the pod is admitted without its secret and fails later with ImagePullBackOff, with nothing connecting the symptom to RBAC. Union workloads reach task namespaces only through per-namespace RoleBindings, so supply one by ONE of: a non-empty namespaces.managed WITH namespaces.enabled: true (README Option 2); or clusterresourcesync.enabled: true, whose generated RoleBinding templates grant it per task namespace (README Option 1). Alternatively set config.core.webhook.embeddedSecretManagerConfig.imagePullSecrets.enabled: false if this deployment does not use managed images." }}
{{- end }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.buckets.webhook" -}}
ns-read:
  - apiGroups: ['*']
    resources: [secrets, pods, replicasets/finalizers]
    verbs: [get, list, watch]
ns-write:
  - apiGroups: ['*']
    resources: [secrets, pods, replicasets/finalizers]
    verbs: [create, update, patch]
cluster-read: []
{{- if .Values.flytepropellerwebhook.managedConfig }}
cluster-write: []
{{- else }}
{{/*
Only reachable at low_privilege: false -- the guard at the top of this file
fails the render otherwise, because a webhook that cannot register itself
receives no pods and there is nothing useful to degrade to.
*/}}
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, create, update, patch]
{{- end }}
{{- end -}}
