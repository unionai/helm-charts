{{- if .Values.flytepropellerwebhook.enabled }}
kind: {{ include "dataplane.rbacKind" . }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: union-webhook-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - "*"
    resources:
      - mutatingwebhookconfigurations
      - secrets
      - pods
      - replicasets/finalizers
    verbs:
      - get
      - create
      - update
      - patch
      - list
      - watch
---
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "global.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- with .Values.flytepropellerwebhook.serviceAccount.imagePullSecrets }}
imagePullSecrets: {{ tpl (toYaml .) $ | nindent 2 }}
{{- end }}
---
{{- end }}
# Create a binding from Role -> ServiceAccount
kind: {{ include "dataplane.rbacBindingKind" . }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: union-webhook-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ include "dataplane.rbacKind" . }}
  name: union-webhook-role
subjects:
  - kind: ServiceAccount
    name: {{ include "webhook.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
