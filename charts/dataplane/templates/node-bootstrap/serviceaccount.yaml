{{- if .Values.nodeBootstrap.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-node-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodeBootstrap.labels" . | nindent 4 }}
{{- if not .Values.nodeBootstrap.startupTaintKey }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.node-bootstrap" -}}
{{/*
union-node-readiness, in the DaemonSet's install-deps init container, builds a
Kubernetes client only when it is given a taint key, which the chart passes as
STARTUP_TAINT_KEY when nodeBootstrap.startupTaintKey is set. With one, it waits
for bootstrap to finish, then removes that taint from the node it runs on: a
Get of the Node by name, then an Update with the taint dropped, retried on
conflict (operator/deploy/node-bootstrap/internal/k8s/node in unionai/cloud).
It makes no other API call. With no taint key it never talks to the API server,
so both slots are empty and the ServiceAccount mounts no token.

Both are cluster slots, in both scope modes: nodes is cluster-scoped, so no
namespaced Role can convey either verb. Neither can be pinned. The node is the
one the pod lands on, known only from the downward API at runtime, and RBAC
has no way to name "the caller's own node". The update is therefore an
unpinned cluster-scoped write, the same exception nodeobserver's taint removal
is, and it is allowlisted for singleNamespace in tests/test-rbac-guards.sh.

Split into a read slot and a write slot, as nodeobserver's are, so the write
is visible as a write.
*/}}
{{- if .Values.nodeBootstrap.startupTaintKey }}
cluster-read:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
cluster-write:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [update]
{{- end }}
{{- end -}}
