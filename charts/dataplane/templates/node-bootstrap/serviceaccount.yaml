{{- if .Values.nodeBootstrap.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: union-node-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodeBootstrap.labels" . | nindent 4 }}
{{- if .Values.nodeBootstrap.startupTaintKey }}
---
# union-node-readiness removes nodeBootstrap.startupTaintKey from its own node
# once bootstrap completes, and needs nothing else from the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-node-bootstrap
  labels:
    {{- include "nodeBootstrap.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-node-bootstrap
  labels:
    {{- include "nodeBootstrap.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: union-node-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-node-bootstrap
{{- else }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
