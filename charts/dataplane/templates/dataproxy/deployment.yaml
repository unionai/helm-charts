{{- if .Values.zero_trust.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataproxy.fullname" . }}
  labels:
    {{- include "dataproxy.labels" . | nindent 4 }}
    {{- include "dataplane.componentLabel" "dataproxy" | nindent 4 }}
spec:
  replicas: {{ .Values.dataproxy.replicas }}
  selector:
    matchLabels:
      {{- include "dataproxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        configChecksum: {{ include "dataplane.configMapDataChecksum" (dict "root" . "path" (print .Template.BasePath "/operator/configmap.yaml") "name" (include "union-operator.fullname" .)) | quote }}
        {{- with .Values.dataproxy.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "global.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "dataproxy.podLabels" . | nindent 8 }}
        {{- include "dataplane.componentLabel" "dataproxy" | nindent 8 }}
    spec:
      {{- with .Values.dataproxy.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.dataproxy.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dataproxy.serviceAccountName" . }}
      {{- $podSecurityContext := deepCopy (.Values.dataproxy.podSecurityContext | default dict) }}
      {{- if and .Values.scale.enabled .Values.scale.callerAuth.secretName (not (hasKey $podSecurityContext "fsGroup")) }}
      {{- /* The caller key is mounted 0440 and root-owned; fsGroup lets the dataproxy read it. */}}
      {{- $_ := set $podSecurityContext "fsGroup" 65532 }}
      {{- end }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "union-operator.fullname" . }}
        {{- if .Values.secrets.admin.enable }}
        - name: secret-volume
          secret:
            secretName: {{ .Values.operator.secretName }}
        {{- end }}
        {{- if and .Values.scale.enabled .Values.scale.callerAuth.secretName }}
        {{- /* The key it signs Scale caller assertions with, the same the operator proxy checks. */}}
        - name: scale-caller
          secret:
            secretName: {{ .Values.scale.callerAuth.secretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.scale.callerAuth.key }}
                path: {{ .Values.scale.callerAuth.key }}
        {{- end }}
        {{- with .Values.dataproxy.additionalVolumes -}}
        {{ tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      containers:
        - name: dataproxy
          securityContext:
            {{- toYaml .Values.dataproxy.securityContext | nindent 12 }}
          image: "{{ .Values.image.union.repository }}:{{ .Values.image.union.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.union.pullPolicy }}
          terminationMessagePolicy: FallbackToLogsOnError
          resources:
            {{- toYaml .Values.dataproxy.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /etc/union/config
              name: config-volume
            {{- if .Values.secrets.admin.enable }}
            - mountPath: /etc/union/secret
              name: secret-volume
            {{- end }}
            {{- if and .Values.scale.enabled .Values.scale.callerAuth.secretName }}
            - mountPath: /etc/union/scale-caller
              name: scale-caller
              readOnly: true
            {{- end }}
            {{- with .Values.dataproxy.additionalVolumeMounts -}}
            {{ tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          args:
            - dataproxy
            - serve
            - --config
            - /etc/union/config/*.yaml
          ports:
            - name: connect
              containerPort: {{ .Values.dataproxy.service.port }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.dataproxy.service.httpPort }}
              protocol: TCP
            - name: debug
              containerPort: 10254
              protocol: TCP
          env:
            {{- include "global.podEnvVars" . | nindent 12 }}
            {{- with .Values.dataproxy.podEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- include "dataproxy.scheduling" . | nindent 6 }}
      {{- include "additionalPodSpec" . | nindent 6 }}
{{- end }}
