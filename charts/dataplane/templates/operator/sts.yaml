{{- if .Values.sts.enabled }}
# The dataplane STS token endpoint task pods exchange their projected
# service-account token at (see sts in values.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "union-operator.fullname" . }}-sts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.sts.port }}
      targetPort: sts
      protocol: TCP
      name: sts
  selector:
    {{- include "operator.selectorLabels" . | nindent 4 }}
{{- end }}
