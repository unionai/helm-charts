{{- if .Values.operator.serviceAccount.create -}}
{{- $roleName := default "operator-system" .Values.operator.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  {{- with include "operator.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{/*
The secrets watcher outside the release namespace, emitted in both privilege
modes because what it needs is the same in both: it restarts Union services whose
mounted secrets changed, and in an intracluster install the control plane's
services sit in their own namespace with no watcher of their own.

One Role per watched namespace, driven by the same define that tells the operator
which namespaces to inspect -- granting exactly what is watched, no more. The
release namespace is skipped because the comp-ns slots already cover it. Not part
of the slot model: the emitter binds only in the release namespace, and these land
in someone else's.

Nothing is emitted for the usual split-cluster install, where the watch list is
the release namespace alone.
*/}}
{{- if .Values.config.operator.secretsWatcher.enabled }}
{{- range $ns := fromYamlArray (include "operator.secretsWatcher.namespaces" .) }}
{{- if ne $ns $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}-secrets-watcher
subjects:
  - kind: ServiceAccount
    name: {{ include "operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end -}}
{{- define "dataplane.rbac.slots.operator" -}}
{{/* PodTemplate informer over the release namespace, always running. */}}
comp-ns-read:
  - apiGroups: [""]
    resources: [podtemplates]
    verbs: [get, list, watch]
{{- if .Values.config.operator.secretsWatcher.enabled }}
{{/* secretsWatcher restarts Deployments whose mounted secrets changed
(operator/configmap.yaml). The controlplaneNamespace half is the Role above. */}}
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [get, list, watch]
{{- end }}
comp-ns-write:
{{- if .Values.config.operator.syncClusterConfig.enabled }}
{{/* Cluster-config syncer: it reads the desired config and applies it here.
create and update, not patch -- the role this replaces granted create and update
on these and no patch at all, so patching is not a path this component has ever
taken. No delete: the syncer converges objects, it does not remove them. */}}
  - apiGroups: [""]
    resources: [configmaps, podtemplates]
    verbs: [get, list, watch, create, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
{{/* The restart is a patch of the pod template's annotations, so this one needs
patch and not create: the watcher never makes a Deployment or ReplicaSet, it
rolls one that already exists. */}}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch, update, patch]
{{- end }}
work-ns:
{{/* flyteworkflows keeps the full set: workflows are garbage-collected by label
selector, which is deletecollection, and the finalizer removal is a patch.
Nothing else here is either, so the rules below carry neither verb -- get, list,
watch, create, update and delete is what the role this replaces granted on
exactly these resources. */}}
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows, flyteworkflows/finalizers]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [resourcequotas, pods, configmaps, podtemplates, secrets]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, delete]
{{- if include "apps.enabled" . }}
  - apiGroups: [serving.knative.dev]
    resources: [revisions, configurations, services]
    verbs: [get, list, watch, create, update, delete]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch, update, patch]
{{- end }}
{{/* At low_privilege: false, operator/configmap.yaml leaves limit-namespace
unset, so these informers watch every namespace; they scope to a single
namespace only when limit-namespace is set. The ResourceQuota and Pod informers
always run. */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [resourcequotas, pods]
    verbs: [list, watch]
{{- if include "apps.enabled" . }}
{{/* podtemplates: the cluster-wide PodTemplate informer starts with the apps
workers, so it only exists when apps are on. knative: the apps controllers' cache
is not namespace-scoped, so it watches every namespace. */}}
  - apiGroups: [""]
    resources: [podtemplates]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [services, configurations, revisions]
    verbs: [list, watch]
{{- end }}
{{- if .Values.imageBuilder.enabled }}
{{/* namespaces is cluster-scoped but sits in this slot rather than cluster-read,
so that low_privilege: true withholds it: cluster-read is emitted in both
privilege modes, and under low_privilege the image-builder syncer runs against
the release namespace alone and does not need it. At full privilege that syncer
starts a label-selected Namespace informer and crashes if it cannot sync. */}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
{{- end }}
{{/* Billing, not telemetry: the usages aggregator lists pod metrics in every
namespace, ignoring limit-namespace. Ungated because the operator collects them
when collectUsages.enabled is set or billing.model is ResourceUsage or Shadow,
and gating on the first alone would drop billing data silently. list returns
aggregate cpu and memory per pod, not object contents.

That second condition stopped describing the default self-hosted install in
2026.8.3, which made billing.model default to None wherever the control plane is
self-hosted (operator.enableTunnelService: false). collectUsages.enabled, still
true by default, is the only thing carrying the grant there -- so those installs
report no billing and keep the cluster-wide read anyway. Whether the read should
follow collectUsages.enabled is a question about the operator's own collection
gate, which lives in unionai/cloud and not in anything this chart can see; the
warning above is why it has not simply been narrowed here. */}}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
{{/*
The node informer runs under two of the four billing models, and not at all when
disableClusterPermissions is set -- operator/cmd/root.go gates it on both, so this
grant does too. A gate that is merely close is worse than none: too narrow and the
informer starts unauthorized, too wide and the slot hands out cluster-wide node
reads nobody asked for.

The model is read through tpl and compared lower-cased because the value reaches
the operator through tpl (operator/configmap.yaml) and its enum parser falls back
to a lower-cased lookup, so `{{ "Legacy" }}` and `legacy` both start the informer.

cluster-read, not work-ns-cluster-read. Both emit a ClusterRole and a
ClusterRoleBinding at full privilege, so either would convey the grant; they
differ only in that work-ns-cluster-read renders empty under low_privilege.
Nodes are not a work-namespace resource -- the informer reads them for usage
attribution, not to reach across the namespaces tasks run in -- so the slot that
describes this grant is cluster-read, the same one nodeobserver's node rules use.
The narrowing work-ns-cluster-read would have supplied is stated in the gate
instead, where the reason for it lives.

That gate is the effective disableClusterPermissions, not the raw value:
operator/configmap.yaml forces the operator's disableClusterPermissions true
whenever low_privilege is set, so the informer never starts there. Reading
.Values alone would emit a cluster-wide node read into every low_privilege
install, which is dead and is what this slot cannot swallow for us.
*/}}
{{- $model := lower (tpl (.Values.config.operator.billing.model | default "" | toString) .) }}
cluster-read:
{{- if and (not (or .Values.config.operator.disableClusterPermissions .Values.low_privilege)) (has $model (list "legacy" "shadow")) }}
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, watch]
{{- end }}
{{- end -}}
