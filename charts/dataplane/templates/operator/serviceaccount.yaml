{{- if .Values.operator.serviceAccount.create -}}
{{- $roleName := default "operator-system" .Values.operator.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  {{- with include "operator.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.low_privilege .Values.config.operator.secretsWatcher.enabled .Values.controlplaneNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ .Values.controlplaneNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ .Values.controlplaneNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}-secrets-watcher
subjects:
  - kind: ServiceAccount
    name: {{ include "operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end -}}
{{- define "dataplane.rbac.slots.operator" -}}
{{/*
podtemplates: operator/cmd/root.go runs a PodTemplate informer over its own
namespace unconditionally, same as the executor.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [podtemplates]
{{- if .Values.config.operator.secretsWatcher.enabled }}
{{/*
secretsWatcher reads pods and secrets and restarts Deployments whose mounted
secrets changed. Its namespace list includes the release namespace
(operator/configmap.yaml). The controlplaneNamespace half is a cross-namespace
grant and stays in its own hand-written Role above -- the slot emitter only
binds into .Release.Namespace and the work namespaces.
*/}}
  - apiGroups: [""]
    resources: [pods, secrets]
{{- end }}
comp-ns-write:
{{- if .Values.config.operator.syncClusterConfig.enabled }}
{{/*
The cluster-config syncer holds Get+Update clients for ConfigMaps, PodTemplates
and Deployments in the union namespace (operator/cmd/root.go:323-325,342;
operator/pkg/cluster_config_handler.go:45-117). Nothing in this chart hints at
it -- it was found by reading the source, and would have been a runtime
Forbidden otherwise.
*/}}
  - apiGroups: [""]
    resources: [configmaps, podtemplates]
  - apiGroups: [apps]
    resources: [deployments]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
{{- end }}
work-ns:
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows, flyteworkflows/finalizers]
  - apiGroups: ['*']
    resources: [resourcequotas, pods, configmaps, podtemplates, secrets, deployments]
{{- if include "apps.enabled" . }}
  - apiGroups: [serving.knative.dev]
    resources: [revisions, configurations, services]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
{{- end }}
{{/*
Declared for WHERE these reads must be authorized. cfg.LimitNamespace defaults
to "all" and this chart writes operator/configmap.yaml's limit-namespace only
under singleNamespace, so at low_privilege: false every informer below watches
the whole cluster. Kubernetes authorizes a namespace-less LIST or WATCH as a
cluster-scope check, which per-namespace RoleBindings cannot satisfy at any
count. Enumerated explicitly; the pooled work-ns role's wildcards deliberately
do not follow it up to cluster scope.

resourcequotas and pods: the shared informer factory at
operator/cmd/root.go:349-350 takes its namespace option from
SharedInformerOptions (:727-735), which appends informers.WithNamespace only
when LimitNamespace is not the default. The ResourceQuota informer (:351-357)
is unconditional and its sync failure returns an error; the Pod informer
(:368-372) feeds capability aggregation. Both are built whether or not apps are
enabled, so both are ungated here.

nodes is deliberately absent: the Node informer at operator/cmd/root.go:408-416
is created only under Legacy or Shadow billing, and this chart sets
billing.model: ResourceUsage.
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [resourcequotas, pods]
    verbs: [list, watch]
{{- if include "apps.enabled" . }}
{{/*
App serving only. The operator's single PodTemplate informer lives inside
startAppWorkers (operator/cmd/root.go:747, sync :761-763) and that function
returns early when the app controller is disabled, so podtemplates is gated
here rather than grouped with the two rules above -- one extra rule buys the
removal of a cluster-wide read from every apps-disabled install.
The knative trio is the apps controllers' own manager cache: reconciler.go:202
watches Service and owns Configuration, replica_watcher.go:179 watches
Configuration and owns Revision, and CreateControllerManager
(operator/dataproxy/reverse_proxy.go:243-248) leaves DefaultNamespaces nil.
pod_watcher.go:198 watches Pod through the same cache, already covered above.
*/}}
  - apiGroups: [""]
    resources: [podtemplates]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [services, configurations, revisions]
    verbs: [list, watch]
{{- end }}
{{- if .Values.imageBuilder.enabled }}
{{/*
namespaces is a cluster-scoped resource type and so is not a work-namespace
resource at all -- it is here rather than in cluster-read because of what this
slot IS, not what it is named: a cluster-scoped read that must vanish entirely
under low_privilege: true. cluster-read is kind `cluster`, which fails the
render when non-empty in that posture, and the operator is enabled by default,
so routing this there would break every default install. Under low_privilege
the read does not happen either: the image-builder syncer takes the
single-namespace branch (build_image_config_syncer.go:409-417) and builds no
namespace informer.

At full privilege it takes the else branch and creates a label-selected
Namespace informer (:418-431), started and synced at :327-339. This one IS
fatal: a sync failure propagates through syncer.Start to logger.Panicf at
operator/cmd/root.go:690-693. Gated on imageBuilder.enabled, which is what
gates the syncer in both the chart (operator/configmap.yaml) and the binary
(root.go:640).
*/}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
{{- end }}
{{/*
BILLING, not telemetry. Get the framing right or the next person will omit this
rule again: the usages aggregator feeds the RESOURCE-USAGE BILLING queue, not
just the heartbeat's status report. operator/cmd/root.go:445-448 starts
startBillableResourceUsageCollector whenever reportResourceUsage(billingModel)
is true, which is `ResourceUsage || Shadow` (:920-922), and this chart sets
billing.model: ResourceUsage (values.yaml:576-577). :453 then starts the
aggregator on `cfg.CollectUsages.Enabled || reportResourceUsage(billingModel)`
and :469 hands it the billing queue.

The aggregator's first act is
metricsClient.MetricsV1beta1().PodMetricses(metav1.NamespaceAll).List(...)
(operator/pkg/heartbeat_data.go:465) -- NamespaceAll is hard-coded and honours
no limit-namespace, so this is a cluster-scope read at full privilege however
the chart is configured. It is a direct List, not a cache, and on error it
returns before producing anything (:466-468).

The failure is a permanent retry loop, not a stop. BackgroundProcessor.Start
(operator/pkg/background_processor.go:113-130) polls on
wait.PollUntilContextCancel and only returns done when the error unwraps to
ErrPermanentSystemFailure AND requiredForHealth is true. This chart never sets
dependenciesStatus.requiredForHealth and DependenciesStatus{} defaults it false
(operator/pkg/config/config.go:175, :305-307), so the guard falls through to
`return false, nil` and the aggregator re-lists every 15s forever
(CollectUsages Interval, config.go:94-100). Net effect: NO RESOURCE-USAGE
BILLING DATA, indefinitely.

It is not silent, though it is easy to miss. Every failing round logs a Warnf
(background_processor.go:120) and increments the run_errors Prometheus counter
(:67, declared :179) under the usages_aggregator subscope -- a counter this
chart already scrapes, so it is alertable. `main` conveyed this grant through
operator-system's `pods` at a wildcard apiGroup.

UNGATED, deliberately. The binary's condition is a disjunction of two chart
values -- collectUsages.enabled and a free-form billing.model string -- and
gating on only the first (which is what an earlier draft of this rule did)
silently drops billing data for anyone who turns collectUsages off while
leaving ResourceUsage billing on. An over-gate here is invisible; the
over-grant is not, and it is close to nothing: metrics.k8s.io/pods returns
aggregate CPU and memory numbers for a pod, no object contents, no spec, no
env, no secrets. `list` only -- there is no informer and nothing watches.
*/}}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
{{- end -}}
