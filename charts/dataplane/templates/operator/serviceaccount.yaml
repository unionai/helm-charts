{{- if .Values.operator.serviceAccount.create -}}
{{- $roleName := default "operator-system" .Values.operator.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  {{- with include "operator.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{/*
This emits the secrets watcher's Role outside the release namespace, in both
scope modes, because what it needs is the same in both: it restarts Union
services whose mounted secrets changed, and in an intracluster install the
control plane's services sit in their own namespace with no watcher of their own.

It emits one Role per watched namespace, driven by the same define that tells
the operator which namespaces to inspect, granting exactly what is watched and
no more. The release namespace is skipped because the comp-ns slots already
cover it. Not part
of the slot model: the emitter binds only in the release namespace, and these land
in someone else's.

Nothing is emitted for the usual split-cluster install, where the watch list is
the release namespace alone.
*/}}
{{- if .Values.config.operator.secretsWatcher.enabled }}
{{- range $ns := fromYamlArray (include "operator.secretsWatcher.namespaces" .) }}
{{- if ne $ns $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}-secrets-watcher
subjects:
  - kind: ServiceAccount
    name: {{ include "operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end -}}
{{- define "dataplane.rbac.slots.operator" -}}
{{/*
Which usage and billing collectors the operator starts. operator/cmd/root.go
decides that from four config values, and the node and pod-metrics reads below
follow its decisions exactly, so they are computed from the same four values as
the operator will see them.

The operator reads two files that can carry these keys: config.yaml, which
operator/configmap.yaml writes from config.operator, and config-overrides.yaml,
written from config.configOverrides. It merges its config files in lexical
order and a later file wins on a key both set (flytestdlib's config collection,
viper's MergeConfig), and config-overrides.yaml sorts first. So a key the
chart writes into config.yaml beats the override, and the override only
decides a key config.yaml leaves out. Each value below is resolved that way:

  $model          the billing model operator/configmap.yaml writes, taken from
                  the same define, so the install default and the upgrade-time
                  lookup agree with it. config.yaml always carries it, so an
                  override never applies. The define fails on anything other
                  than the four model names, so no case folding is needed.
  $collectUsages  collectUsages.enabled: the values key when set, else the
                  override.
  $serverless     serverlessCollectUsages.enabled. config.yaml never carries
                  it, so the override is the only source.
  $clusterPerms   the inverse of disableClusterPermissions. operator/configmap.yaml
                  writes the values key when it is truthy, otherwise nothing,
                  and only then does the override apply. Scope does not set it:
                  under singleNamespace it is off unless configured, so the node
                  informer runs there as it does anywhere else.

Each flag is read through dataplane.parseBool, which renders it through tpl and
parses it the way the operator's config decoder does. Comparing the rendered
string to "true" would read `True` or `1` as false while the operator read it as
true, and withhold a grant the operator then blocks on.
*/}}
{{- $overrides := dig "operator" dict (.Values.config.configOverrides | default dict) | default dict }}
{{- $model := get (fromYaml (include "operator.billing.config" .)) "model" }}
{{- $cu := .Values.config.operator.collectUsages | default dict }}
{{- $cuValue := dig "collectUsages" "enabled" false $overrides }}
{{- if hasKey $cu "enabled" }}
{{- $cuValue = $cu.enabled }}
{{- end }}
{{- $collectUsages := eq (include "dataplane.parseBool" (dict "value" $cuValue "ctx" . "key" "config.operator.collectUsages.enabled")) "true" }}
{{- $serverless := eq (include "dataplane.parseBool" (dict "value" (dig "serverlessCollectUsages" "enabled" false $overrides) "ctx" . "key" "config.configOverrides.operator.serverlessCollectUsages.enabled")) "true" }}
{{- $dcpValue := dig "disableClusterPermissions" false $overrides }}
{{- if .Values.config.operator.disableClusterPermissions }}
{{- $dcpValue = .Values.config.operator.disableClusterPermissions }}
{{- end }}
{{- $clusterPerms := ne (include "dataplane.parseBool" (dict "value" $dcpValue "ctx" . "key" "config.operator.disableClusterPermissions")) "true" }}
{{/* The main usage aggregator runs when collectUsages.enabled is set or
billing.model is ResourceUsage or Shadow; the serverless one runs when
serverlessCollectUsages.enabled is set and cluster permissions are not disabled
(operator/cmd/root.go). Each lists pod metrics in usageNamespace(cfg): every
namespace when limit-namespace is unset, the release namespace under
singleNamespace. */}}
{{- $podMetrics := or $collectUsages (has $model (list "ResourceUsage" "Shadow")) (and $serverless $clusterPerms) }}
{{/* PodDisruptionBudget management in the apps controllers: off unless set, and
never reached with apps off. Resolved like the flags above: the values key when
set, else the override. */}}
{{- $appsCtl := dig "controller" dict (.Values.config.operator.apps | default dict) | default dict }}
{{- $pdbValue := dig "apps" "controller" "podDisruptionBudget" "enabled" false $overrides }}
{{- if hasKey (dig "podDisruptionBudget" dict $appsCtl | default dict) "enabled" }}
{{- $pdbValue = $appsCtl.podDisruptionBudget.enabled }}
{{- end }}
{{- $pdb := and (include "apps.enabled" .) (eq (include "dataplane.parseBool" (dict "value" $pdbValue "ctx" . "key" "config.operator.apps.controller.podDisruptionBudget.enabled")) "true") }}
{{/* No podtemplates rule. The operator's only PodTemplate informer starts with
the apps workers and reads through work-ns-cluster-read across namespaces and
work-ns under singleNamespace, and the cluster-config syncer's reads are in
comp-ns-write. */}}
comp-ns-read:
{{- if .Values.config.operator.secretsWatcher.enabled }}
{{/* secretsWatcher restarts Deployments whose mounted secrets changed
(operator/configmap.yaml). The controlplaneNamespace half is the Role above. */}}
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [get, list, watch]
{{- end }}
{{- if and (include "singleNamespace" .) $podMetrics }}
{{/* Under singleNamespace the usage aggregators list pod metrics in the release
namespace, where limit-namespace confines them. The cluster-wide grant in
work-ns-cluster-read is not emitted in this mode, so this is the only grant that
reaches them, and it follows the same conditions. */}}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
{{- end }}
{{- if .Values.imageBuilder.enabled }}
{{/* The image builder's two informers on the release namespace, both started
in operator/cmd/root.go and both blocking startup in WaitForCacheSync until they
sync. A refused list therefore hangs the operator rather than degrading it.

The build-image config syncer (operator/pkg/imagebuilder/build_image_config_syncer.go)
Gets its reference ConfigMap once at start, then watches it through an informer
field-selected on metadata.name. RBAC matches a list or watch against
resourceNames when the request carries exactly that field selector, so all three
verbs pin to the one name. That name is referenceConfigmapName, which
operator/configmap.yaml writes from the same define.

The mirror-secrets deleter (operator/pkg/imagebuilder/secret_deleter.go) watches
image-pull Secrets in the release namespace through a label selector, so its
list and watch cannot be pinned. It always runs, since operator/configmap.yaml
always writes executionNamespaceLabels.

Neither is a work namespace read, so work-ns cannot convey them outside
singleNamespace. Before this grant, the configmaps read was held only by the
cluster-wide one in work-ns-cluster-read, which exists only when apps are on.
With apps off, the operator hung at startup. The secrets read was held only
through other components' roles when every component shared one ServiceAccount. */}}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "union-operator.fullname" . }}]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
{{- end }}
comp-ns-write:
{{- if .Values.config.operator.syncClusterConfig.enabled }}
{{/* Cluster-config syncer (operator/pkg/cluster_config_handler.go): it Gets
each object by a fixed name and Updates it -- the ConfigMaps and PodTemplate
with the desired config, the Deployments with a restart annotation. It never
creates, lists, watches, patches or deletes, and a missing ConfigMap is fatal to
the operator rather than created. The names are the syncer's own constants. This
chart names two of its targets differently (union-pod-webhook,
union-syncresources) and renders neither clusterresourcesync ConfigMap nor
flytepropeller-template, so those targets do not exist here. That is an issue
between the syncer and this chart, not something the grant should paper over. */}}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [flyte-propeller-config, flyte-clusterresourcesync-config, clusterresource-template]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [podtemplates]
    resourceNames: [flytepropeller-template]
    verbs: [get, update]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [flytepropeller, flyte-pod-webhook, syncresources]
    verbs: [get, update]
{{- end }}
{{- if .Values.operator.enableTunnelService }}
{{/* The tunnel updater writes the tunnel token Secret, and when the token
changes it restarts the proxy so the proxy picks it up (operator/tunnels/tunnel.go,
through UpdateDeployment in operator/pkg/cluster_config_handler.go). The restart
is a Get then an Update of that one Deployment, the tunnel.deploymentToRestart
name operator/configmap.yaml writes. Without it the restart fails, and because
the token Secret has already been updated, later rounds see nothing to do and
never retry, so the proxy keeps the stale token until someone restarts it. */}}
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [union-operator-proxy]
    verbs: [get, update]
{{/* The token Secret itself: a Get, then an Update when the tunnel's ID or
token changed (updateTunnelTokenSecret in operator/tunnels/tunnel.go). The name
is operator.secretName, which operator/deployment.yaml passes as
--operator.tunnel.k8sSecretName. The Secret is chart-created, so there is no
create. */}}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.operator.secretName | quote }}]
    verbs: [get, update]
{{- end }}
{{- $apiKey := .Values.config.operator.apiKey | default dict }}
{{- $akValue := dig "apiKey" "enabled" false $overrides }}
{{- if hasKey $apiKey "enabled" }}
{{- $akValue = $apiKey.enabled }}
{{- end }}
{{- if eq (include "dataplane.parseBool" (dict "value" $akValue "ctx" . "key" "config.operator.apiKey.enabled")) "true" }}
{{/* The Eager API key updater caches the last-written key in a Secret in the
release namespace (readCachedAPIKey and writeCachedAPIKey in
operator/apikey/apikey.go). It Gets the Secret, Creates it on first run, and
Updates it after that. `create` cannot be pinned by resourceNames, so it is a
rule of its own. The name is apiKey.stateSecretName, resolved like the flags
above: the values key when set, else the override, else the operator's own
default in operator/pkg/config/config.go. */}}
{{- $akState := dig "apiKey" "stateSecretName" "union-operator-apikey-state" $overrides }}
{{- if $apiKey.stateSecretName }}
{{- $akState = tpl (toString $apiKey.stateSecretName) . }}
{{- end }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $akState | quote }}]
    verbs: [get, update]
{{- end }}
{{- if include "apps.enabled" . }}
{{/* The apps controllers rewrite connector-config in the release namespace when
a connector app becomes ready or is deleted (updateConnectorConfig in
operator/apps/controller.go). The read goes through the manager's cache, which
work-ns-cluster-read backs. The write is a direct Update, and nothing else
conveyed it outside singleNamespace. The name is the controller's own constant
(connectorConfigMapName); this chart does not render that ConfigMap. */}}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [connector-config]
    verbs: [update]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
{{/* The restart is a patch of the pod template's annotations, so this one needs
patch and not create: the watcher never makes a Deployment or ReplicaSet, it
rolls one that already exists. */}}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch, update, patch]
{{- end }}
work-ns:
{{/* flyteworkflows: the operator creates a workflow for each execution it is
handed and deletes one by name on abort (operator/pkg/handler.go). It never
updates, patches or collects them and never touches finalizers -- that is
propeller's garbage collector, declared in propeller's slot.

The one read is the zombie-workspace cleaner's (operator/pkg/zombie_workspace_cleaner.go),
which lists FlyteWorkflows in every namespace and deletes stale ones by name. It
is off by default (zombieWorkspaceCleaner.enabled, no chart value) and its list
is not granted: an all-namespaces list needs flyteworkflows list at cluster
scope, which work-ns, bound per namespace, cannot convey. The cluster-wide
ClusterRole this replaces did convey it; no slot has since. Turning the cleaner
on would need that list in work-ns-cluster-read; a refused list only logs.

The narrowing is invisible while leaseworker is enabled, as it is by default:
its resource wildcard in the same pooled role conveys every verb here except
deletecollection, on flyteworkflows and its finalizers alike.

The rules below carry get, list, watch, create, update and delete, which is what
the role this replaces granted on exactly those resources. */}}
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [resourcequotas, pods, configmaps, podtemplates, secrets]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, delete]
{{- if include "apps.enabled" . }}
  - apiGroups: [serving.knative.dev]
    resources: [revisions, configurations, services]
    verbs: [get, list, watch, create, update, delete]
{{/* The apps controller merge-patches a KService's annotations in place when
only its metadata changed, so Knative does not mint a new Revision
(unionai/cloud#18700). It patches Services and nothing else. */}}
  - apiGroups: [serving.knative.dev]
    resources: [services]
    verbs: [patch]
{{- end }}
{{- if $pdb }}
{{/* PodDisruptionBudget management: the apps controllers create, update and
delete a PDB beside each app that keeps enough replicas (reconcilePodDisruptionBudget
in operator/apps/controller.go), in the app's work namespace. No patch: it
updates the object it read. The read goes through the manager's cache, which at
multi-namespace installs is cluster-wide and granted in work-ns-cluster-read.
Under singleNamespace that cache is scoped to the release namespace, where this
Role is bound, so the list and watch are here as well. */}}
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [{{ if include "singleNamespace" . }}list, watch, {{ end }}create, update, delete]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch, update, patch]
{{- end }}
{{/* Outside singleNamespace, operator/configmap.yaml leaves limit-namespace
unset, so these informers watch every namespace; they scope to a single
namespace only when limit-namespace is set. The ResourceQuota and Pod informers
always run. */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [resourcequotas, pods]
    verbs: [list, watch]
{{- if include "apps.enabled" . }}
{{/* podtemplates: the cluster-wide PodTemplate informer starts with the apps
workers, so it only exists when apps are on. knative: the apps controllers' cache
is not namespace-scoped, so it watches every namespace. */}}
  - apiGroups: [""]
    resources: [podtemplates]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [services, configurations, revisions]
    verbs: [list, watch]
{{/* The apps controllers read one ConfigMap, connector-config in the release
namespace, which they update when a connector app becomes ready or is deleted
(updateConnectorConfig in operator/apps/controller.go). They read it through the
manager's cached client, and that cache is not namespace-scoped, so the first
Get starts a ConfigMap informer over every namespace and blocks until it syncs.
This grant exists only for that. Reading the ConfigMap through
GetAPIReader(), or scoping the ConfigMap cache to the release namespace in
CreateControllerManager, would make it unnecessary. */}}
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list, watch]
{{- if $pdb }}
{{/* The same cached client reads each app's PodDisruptionBudget before it
reconciles one, so the same cluster-wide informer starts for them. Only when PDB
management is on: with it off, the controller makes no PDB calls at all. The PDB
sits in the app's work namespace, which no cache entry can name in advance, so
only a read through GetAPIReader() would remove this. The writes are in
work-ns. */}}
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
{{- end }}
{{- end }}
{{- if .Values.imageBuilder.enabled }}
{{/* namespaces is cluster-scoped but sits in this slot rather than cluster-read,
so that singleNamespace withholds it: cluster-read is emitted in both modes, and
under singleNamespace the image-builder syncer runs against the release
namespace alone and does not need it. Outside singleNamespace that syncer starts
a label-selected Namespace informer and crashes if it cannot sync. */}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
{{- end }}
{{/* The usage aggregators list pod metrics in every namespace when
limit-namespace is unset. This grant follows $podMetrics, so an install with
billing.model None and collectUsages off carries no cluster-wide metrics read.
list returns aggregate cpu and memory per pod, not object contents. */}}
{{- if $podMetrics }}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
{{- end }}
{{/*
The node informer runs whenever cluster permissions are not disabled and any
usage collector does: a billing model other than None, collectUsages.enabled, or
serverlessCollectUsages.enabled (operator/cmd/root.go). Besides backing the
Legacy and Shadow node-based billing collector, it lets every usage aggregator
attribute a GPU to the node's accelerator label when the pod spec names none.
Startup waits for it to sync, so a missing grant does not degrade GPU
attribution: it stops everything the operator starts after the informer. That
includes the default install in either scope mode, where billing.model is
ResourceUsage and collectUsages is on. The gate matches the code exactly: too
narrow and the operator hangs at startup, too wide and the slot hands out
cluster-wide node reads nobody uses.

cluster-read, not work-ns-cluster-read. The two differ only in that
work-ns-cluster-read renders empty under singleNamespace, and the informer runs
there too: nodes are cluster-scoped, so no namespace confines the read, and
limit-namespace does not stop it. This is one of the cluster-scoped reads
singleNamespace allows, and it is on the allowlist in tests/test-rbac-guards.sh.
Setting disableClusterPermissions: true stops the informer and drops the grant,
at the cost of the Legacy and Shadow node-based billing collector and the
serverless aggregator, and of GPU attribution by node label.

The gate uses $clusterPerms, resolved from config.yaml and the override the way
the operator resolves it, not the raw values key.
*/}}
cluster-read:
{{- if and $clusterPerms (or (ne $model "None") $collectUsages $serverless) }}
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, watch]
{{- end }}
{{- if not (include "singleNamespace" .) }}
{{/* The work queue scrapes the API server's own /metrics every minute
(operator/pkg/apiserver_stats.go) for the FlyteWorkflow object count and etcd
storage size, and its workers pause when either passes its threshold
(operator/pkg/worker.go). A refused scrape is dropped silently, so both
throttles stay off. The scraper always runs. Withheld under singleNamespace
to keep parity: before the slot model the chart emitted a namespaced Role
there, which cannot convey a nonResourceURLs rule, so the throttles have always
been off in that mode. Granting it would add an entry to the singleNamespace
cluster-read allowlist, which is a separate decision. */}}
  - nonResourceURLs: [/metrics]
    verbs: [get]
{{- end }}
{{- end -}}
