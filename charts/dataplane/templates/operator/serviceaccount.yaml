{{- if .Values.operator.serviceAccount.create -}}
{{- $roleName := default "operator-system" .Values.operator.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  {{- with include "operator.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.low_privilege .Values.config.operator.secretsWatcher.enabled .Values.controlplaneNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ .Values.controlplaneNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ .Values.controlplaneNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}-secrets-watcher
subjects:
  - kind: ServiceAccount
    name: {{ include "operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end -}}
{{- define "dataplane.rbac.slots.operator" -}}
{{/* Unconditional PodTemplate informer over its own namespace (operator/cmd/root.go). */}}
comp-ns-read:
  - apiGroups: [""]
    resources: [podtemplates]
{{- if .Values.config.operator.secretsWatcher.enabled }}
{{/* secretsWatcher restarts Deployments whose mounted secrets changed
(operator/configmap.yaml); the controlplaneNamespace half is the Role above. */}}
  - apiGroups: [""]
    resources: [pods, secrets]
{{- end }}
comp-ns-write:
{{- if .Values.config.operator.syncClusterConfig.enabled }}
{{/* Cluster-config syncer: Get+Update in the union namespace
(operator/cmd/root.go:323-325,342; operator/pkg/cluster_config_handler.go:45-117). */}}
  - apiGroups: [""]
    resources: [configmaps, podtemplates]
  - apiGroups: [apps]
    resources: [deployments]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
{{- end }}
work-ns:
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows, flyteworkflows/finalizers]
  - apiGroups: ['*']
    resources: [resourcequotas, pods, configmaps, podtemplates, secrets, deployments]
{{- if include "apps.enabled" . }}
  - apiGroups: [serving.knative.dev]
    resources: [revisions, configurations, services]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
{{- end }}
{{/* Cluster scope: operator/configmap.yaml writes limit-namespace only under
singleNamespace, so at low_privilege: false these informers watch every namespace.
resourcequotas and pods: the shared informer factory sets a namespace only when
LimitNamespace is non-default (operator/cmd/root.go:349-350, :727-735); the
ResourceQuota (:351-357) and Pod (:368-372) informers are unconditional.
nodes is absent: that informer exists only under Legacy or Shadow billing (:408-416). */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [resourcequotas, pods]
    verbs: [list, watch]
{{- if include "apps.enabled" . }}
{{/* podtemplates: the only PodTemplate informer here lives in startAppWorkers
(operator/cmd/root.go:747), which returns early when apps are off. knative: the
apps controllers' manager cache (reconciler.go:202, replica_watcher.go:179)
leaves DefaultNamespaces nil (operator/dataproxy/reverse_proxy.go:243-248). */}}
  - apiGroups: [""]
    resources: [podtemplates]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [services, configurations, revisions]
    verbs: [list, watch]
{{- end }}
{{- if .Values.imageBuilder.enabled }}
{{/* namespaces is cluster-scoped but sits here because it must vanish under
low_privilege: true, where cluster-read fails the render. At full privilege the
image-builder syncer creates a label-selected Namespace informer
(build_image_config_syncer.go:418-431) whose sync failure panics
(operator/cmd/root.go:690-693); under low_privilege it takes the
single-namespace branch (:409-417). */}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
{{- end }}
{{/* Billing, not telemetry: the usages aggregator lists PodMetricses at
NamespaceAll (operator/pkg/heartbeat_data.go:465), ignoring limit-namespace.
Ungated because the binary keys on collectUsages.enabled OR a
ResourceUsage/Shadow billing.model (operator/cmd/root.go:453, :920-922); gating
on only the first drops billing data silently. list only; returns aggregate cpu
and memory per pod, no object contents. */}}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
{{- end -}}
