{{- if .Values.operator.serviceAccount.create -}}
{{- $roleName := default "operator-system" .Values.operator.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  {{- with include "operator.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.low_privilege .Values.config.operator.secretsWatcher.enabled .Values.controlplaneNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ .Values.controlplaneNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ .Values.controlplaneNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}-secrets-watcher
subjects:
  - kind: ServiceAccount
    name: {{ include "operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end -}}
{{- define "dataplane.rbac.slots.operator" -}}
{{/* PodTemplate informer over the release namespace, always running (operator/cmd/root.go). */}}
comp-ns-read:
  - apiGroups: [""]
    resources: [podtemplates]
{{- if .Values.config.operator.secretsWatcher.enabled }}
{{/* secretsWatcher restarts Deployments whose mounted secrets changed
(operator/configmap.yaml). The controlplaneNamespace half is the Role above. */}}
  - apiGroups: [""]
    resources: [pods, secrets]
{{- end }}
comp-ns-write:
{{- if .Values.config.operator.syncClusterConfig.enabled }}
{{/* Cluster-config syncer: Get+Update in the union namespace
(operator/cmd/root.go:323-325,342; operator/pkg/cluster_config_handler.go:45-117). */}}
  - apiGroups: [""]
    resources: [configmaps, podtemplates]
  - apiGroups: [apps]
    resources: [deployments]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
{{- end }}
work-ns:
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows, flyteworkflows/finalizers]
  - apiGroups: ['*']
    resources: [resourcequotas, pods, configmaps, podtemplates, secrets, deployments]
{{- if include "apps.enabled" . }}
  - apiGroups: [serving.knative.dev]
    resources: [revisions, configurations, services]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
{{- end }}
{{/* At low_privilege: false, operator/configmap.yaml leaves limit-namespace
unset, so these informers watch every namespace. The informer factory scopes to
one namespace only when LimitNamespace is set (operator/cmd/root.go:349-350,
:727-735), and the ResourceQuota (:351-357) and Pod (:368-372) informers always
run. No nodes rule: that informer runs only under Legacy or Shadow billing
(:408-416). */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [resourcequotas, pods]
    verbs: [list, watch]
{{- if include "apps.enabled" . }}
{{/* podtemplates: the cluster-wide PodTemplate informer lives in startAppWorkers
(operator/cmd/root.go:747), which returns early when apps are off. knative: the
apps controllers' manager cache (reconciler.go:202, replica_watcher.go:179)
leaves DefaultNamespaces nil (operator/dataproxy/reverse_proxy.go:243-248). */}}
  - apiGroups: [""]
    resources: [podtemplates]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [services, configurations, revisions]
    verbs: [list, watch]
{{- end }}
{{- if .Values.imageBuilder.enabled }}
{{/* namespaces is cluster-scoped but sits in this slot, not cluster-read, so it
disappears under low_privilege: true, where a non-empty cluster-read fails the
render and the image-builder syncer takes the single-namespace branch instead
(operator/cmd/root.go:409-417). At full privilege that syncer starts a
label-selected Namespace informer (build_image_config_syncer.go:418-431) and
panics if it fails to sync (:690-693). */}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
{{- end }}
{{/* Billing, not telemetry: the usages aggregator lists PodMetricses at
NamespaceAll (operator/pkg/heartbeat_data.go:465), ignoring limit-namespace.
Ungated because the binary keys on collectUsages.enabled or a
ResourceUsage/Shadow billing.model (operator/cmd/root.go:453, :920-922), and
gating on the first alone would drop billing data silently. list returns
aggregate cpu and memory per pod, not object contents. */}}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
{{- end -}}
