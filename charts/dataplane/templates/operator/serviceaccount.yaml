{{- if .Values.operator.serviceAccount.create -}}
{{- $roleName := default "operator-system" .Values.operator.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  {{- with include "operator.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
{{- range $ns := fromYamlArray (include "operator.secretsWatcher.namespaces" .) }}
{{- if ne $ns $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ $ns }}
  labels:
    {{- include "operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}-secrets-watcher
subjects:
  - kind: ServiceAccount
    name: {{ include "operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end -}}
{{- define "dataplane.rbac.slots.operator" -}}
{{- $overrides := dig "operator" dict (.Values.config.configOverrides | default dict) | default dict }}
{{- $model := get (fromYaml (include "operator.billing.config" .)) "model" }}
{{- $cu := .Values.config.operator.collectUsages | default dict }}
{{- $cuValue := dig "collectUsages" "enabled" false $overrides }}
{{- if hasKey $cu "enabled" }}
{{- $cuValue = $cu.enabled }}
{{- end }}
{{- $collectUsages := eq (include "dataplane.parseBool" (dict "value" $cuValue "ctx" . "key" "config.operator.collectUsages.enabled")) "true" }}
{{- $serverless := eq (include "dataplane.parseBool" (dict "value" (dig "serverlessCollectUsages" "enabled" false $overrides) "ctx" . "key" "config.configOverrides.operator.serverlessCollectUsages.enabled")) "true" }}
{{- $dcpValue := dig "disableClusterPermissions" false $overrides }}
{{- if .Values.config.operator.disableClusterPermissions }}
{{- $dcpValue = .Values.config.operator.disableClusterPermissions }}
{{- end }}
{{- $clusterPerms := ne (include "dataplane.parseBool" (dict "value" $dcpValue "ctx" . "key" "config.operator.disableClusterPermissions")) "true" }}
{{- $podMetrics := or $collectUsages (has $model (list "ResourceUsage" "Shadow")) (and $serverless $clusterPerms) }}
{{- $appsCtl := dig "controller" dict (.Values.config.operator.apps | default dict) | default dict }}
{{- $pdbValue := dig "apps" "controller" "podDisruptionBudget" "enabled" false $overrides }}
{{- if hasKey (dig "podDisruptionBudget" dict $appsCtl | default dict) "enabled" }}
{{- $pdbValue = $appsCtl.podDisruptionBudget.enabled }}
{{- end }}
{{- $pdb := and (include "apps.enabled" .) (eq (include "dataplane.parseBool" (dict "value" $pdbValue "ctx" . "key" "config.operator.apps.controller.podDisruptionBudget.enabled")) "true") }}
comp-ns-read:
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [get, list, watch]
{{- end }}
{{- if and (include "singleNamespace" .) $podMetrics }}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
{{- end }}
{{- if .Values.imageBuilder.enabled }}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "union-operator.fullname" . }}]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
{{- end }}
comp-ns-write:
{{- if .Values.config.operator.syncClusterConfig.enabled }}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [flyte-propeller-config, flyte-clusterresourcesync-config, clusterresource-template]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [podtemplates]
    resourceNames: [flytepropeller-template]
    verbs: [get, update]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [flytepropeller, flyte-pod-webhook, syncresources]
    verbs: [get, update]
{{- end }}
{{- if .Values.operator.enableTunnelService }}
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [union-operator-proxy]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.operator.secretName | quote }}]
    verbs: [get, update]
{{- end }}
{{- $apiKey := .Values.config.operator.apiKey | default dict }}
{{- $akValue := dig "apiKey" "enabled" false $overrides }}
{{- if hasKey $apiKey "enabled" }}
{{- $akValue = $apiKey.enabled }}
{{- end }}
{{- if eq (include "dataplane.parseBool" (dict "value" $akValue "ctx" . "key" "config.operator.apiKey.enabled")) "true" }}
{{- $akState := dig "apiKey" "stateSecretName" "union-operator-apikey-state" $overrides }}
{{- if $apiKey.stateSecretName }}
{{- $akState = tpl (toString $apiKey.stateSecretName) . }}
{{- end }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $akState | quote }}]
    verbs: [get, update]
{{- end }}
{{- if include "apps.enabled" . }}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [connector-config]
    verbs: [update]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch, update, patch]
{{- end }}
work-ns:
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [resourcequotas, pods, configmaps, podtemplates, secrets]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, delete]
{{- if include "apps.enabled" . }}
  - apiGroups: [serving.knative.dev]
    resources: [revisions, configurations, services]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [serving.knative.dev]
    resources: [services]
    verbs: [patch]
{{- end }}
{{- if $pdb }}
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [{{ if include "singleNamespace" . }}list, watch, {{ end }}create, update, delete]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch, update, patch]
{{- end }}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [resourcequotas, pods]
    verbs: [list, watch]
{{- if include "apps.enabled" . }}
  - apiGroups: [""]
    resources: [podtemplates]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [services, configurations, revisions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list, watch]
{{- if $pdb }}
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
{{- end }}
{{- end }}
{{- if .Values.imageBuilder.enabled }}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
{{- end }}
{{- if $podMetrics }}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
{{- end }}
{{- $nodeCapacity := .Values.config.operator.clusterHealth.nodeCapacity | default dict }}
cluster-read:
{{- if or $nodeCapacity.enabled (and $clusterPerms (or (ne $model "None") $collectUsages $serverless)) }}
  - apiGroups: [""]
    resources: [nodes]
    verbs: [{{ if $nodeCapacity.enabled }}get, {{ end }}list, watch]
{{- end }}
{{- if and $nodeCapacity.enabled $nodeCapacity.clusterWidePods }}
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
{{- end }}
{{- if not (include "singleNamespace" .) }}
  - nonResourceURLs: [/metrics]
    verbs: [get]
{{- end }}
{{- end -}}
