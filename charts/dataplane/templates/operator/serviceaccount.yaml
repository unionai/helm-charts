{{- if .Values.operator.serviceAccount.create -}}
{{- $roleName := default "operator-system" .Values.operator.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  {{- with include "operator.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.low_privilege .Values.config.operator.secretsWatcher.enabled .Values.controlplaneNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ .Values.controlplaneNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}-secrets-watcher
  namespace: {{ .Values.controlplaneNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}-secrets-watcher
subjects:
  - kind: ServiceAccount
    name: {{ include "operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end -}}
{{/*
Operator RBAC buckets. Cluster buckets are empty: namespaces, nodes and the
nonResourceURLs /metrics grant were removed -- namespace creation belongs to
clusterresourcesync and node writes to nodeobserver.

The pre-bucket template emitted a Role ALWAYS and additionally a superset
ClusterRole under full privilege, so the ServiceAccount held both. That shape is
gone: there is one definition, and the emitter picks the kind.
*/}}
{{- define "dataplane.rbac.buckets.operator" -}}
ns-read:
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows, flyteworkflows/finalizers]
    verbs: [get, list, watch]
  - apiGroups: ['*']
    resources: [resourcequotas, pods, configmaps, podtemplates, secrets, deployments]
    verbs: [get, list, watch]
{{- if include "apps.enabled" . }}
  - apiGroups: [serving.knative.dev]
    resources: [revisions, configurations, services]
    verbs: [get, list, watch]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch]
{{- end }}
ns-write:
  - apiGroups: [flyte.lyft.com]
    resources: [flyteworkflows, flyteworkflows/finalizers]
    verbs: [create, update, delete, patch, deletecollection]
  # `deployments` is split out of the delete rule on purpose. The pre-bucket Role
  # granted it at apiGroups ['*'] with get/list/watch/create/update only; the
  # separate resourcequotas/pods/configmaps/podtemplates/secrets rule was the one
  # that carried `delete`. Folding deployments into that rule would GRANT DELETE
  # ON EVERY DEPLOYMENT, which the chart never granted before.
  - apiGroups: ['*']
    resources: [resourcequotas, pods, configmaps, podtemplates, secrets, deployments]
    verbs: [create, update]
  - apiGroups: ['*']
    resources: [resourcequotas, pods, configmaps, podtemplates, secrets]
    verbs: [delete]
{{- if include "apps.enabled" . }}
  - apiGroups: [serving.knative.dev]
    resources: [revisions, configurations, services]
    verbs: [create, update, delete]
{{- end }}
{{- if .Values.config.operator.secretsWatcher.enabled }}
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [update, patch]
{{- end }}
cluster-read: []
cluster-write: []
{{- end -}}
