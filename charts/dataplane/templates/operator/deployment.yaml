apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "union-operator.fullname" . }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    {{- include "dataplane.componentLabel" "operator" | nindent 4 }}
spec:
  {{- if not .Values.operator.autoscaling }}
  replicas: {{ .Values.operator.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        configChecksum: {{ include (print .Template.BasePath "/operator/configmap.yaml") . | sha256sum | trunc 63 | quote }}
        {{- with .Values.operator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "global.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "operator.podLabels" . | nindent 8 }}
        {{- include "dataplane.componentLabel" "operator" | nindent 8 }}
    spec:
      {{- with .Values.operator.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.operator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "union-operator.fullname" . }}
        {{- if .Values.secrets.admin.enable }}
        - name: secret-volume
          secret:
            secretName: {{ .Values.operator.secretName }}
        {{- end }}
        {{- if include "dataplane.connectionConfig.emit" . }}
        - name: connection-config-volume
          configMap:
            name: {{ include "union-operator.fullname" . }}-connection
        {{- end }}
        # connector-config holds the connector apps' endpoints, written by the apps
        # controller at runtime; the cluster snapshot reads it from this mount. Optional
        # because this chart does not ship the ConfigMap: the mount stays empty until
        # something creates it, and the operator reads an empty directory as no apps.
        # Mounted whole (no subPath) so the kubelet refreshes it as the controller writes.
        - name: connector-config-volume
          configMap:
            name: connector-config
            optional: true
      {{- with .Values.operator.additionalVolumes -}}
      {{ tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          securityContext:
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
          image: "{{ .Values.image.union.repository }}:{{ .Values.image.union.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.union.pullPolicy }}
          terminationMessagePolicy: FallbackToLogsOnError
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /etc/union/config
              name: config-volume
            {{- if .Values.secrets.admin.enable }}
            - mountPath: /etc/union/secret
              name: secret-volume
            {{- end }}
            {{- if include "dataplane.connectionConfig.emit" . }}
            - mountPath: /etc/union/connection-config
              name: connection-config-volume
              readOnly: true
            {{- end }}
            - mountPath: /etc/union/connector-config
              name: connector-config-volume
              readOnly: true
          {{- with .Values.operator.additionalVolumeMounts -}}
          {{ tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          env:
            - name: HELM_CHART_VERSION
              value: {{ .Chart.Version | quote }}
            - name: HELM_APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            {{- include "global.podEnvVars" . | nindent 12 }}
            {{- with .Values.operator.podEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          args:
            - operator
            - serve
            - --config
            - /etc/union/config/*.yaml
            - --operator.clusterId.name
            - "$(CLUSTER_NAME)"
            - --operator.tunnel.k8sSecretName
            - {{ .Values.operator.secretName }}
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: http
              containerPort: 8089
              protocol: TCP
            - name: debug
              containerPort: 10254
              protocol: TCP
      {{- include "operator.scheduling" . | nindent 6 }}
      {{- include "additionalPodSpec" . | nindent 6 }}
