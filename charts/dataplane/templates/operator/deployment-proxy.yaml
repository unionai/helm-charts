apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "union-operator.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
    {{- include "dataplane.componentLabel" "proxy" | nindent 4 }}
spec:
  {{- if not .Values.proxy.autoscaling.enabled }}
  replicas: {{ .Values.proxy.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        configChecksum: {{ include "dataplane.configMapDataChecksum" (dict "root" . "path" (print .Template.BasePath "/operator/configmap.yaml") "name" (include "union-operator.fullname" .)) | quote }}
        {{- with .Values.proxy.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "global.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "proxy.podLabels" . | nindent 8 }}
        {{- include "dataplane.componentLabel" "proxy" | nindent 8 }}
    spec:
      volumes:
        - name: config-volume
          projected:
            sources:
            - configMap:
                name: {{ include "union-operator.fullname" . }}
            {{- if and .Values.clusterresourcesync.enabled (not (include "singleNamespace" .)) }}
            - configMap:
                name: union-clusterresourcesync-config
            {{- end }}
        {{- if .Values.secrets.admin.enable }}
        - name: secret-volume
          secret:
            secretName: {{ .Values.operator.secretName }}
        {{- end }}
        {{- if and .Values.scale.enabled .Values.scale.signing.secretName }}
        {{- /* The key Scale's objects are signed with, shared with the Scale runtime. */}}
        - name: scale-signing
          secret:
            secretName: {{ .Values.scale.signing.secretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.scale.signing.key }}
                path: {{ .Values.scale.signing.key }}
        {{- end }}
        {{- if and .Values.scale.enabled .Values.scale.callerAuth.secretName }}
        {{- /* The key the dataproxy signs Scale caller assertions with (this cluster's). Only the
               proxy mounts it; the Scale runtime does not need it. */}}
        - name: scale-caller
          secret:
            secretName: {{ .Values.scale.callerAuth.secretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.scale.callerAuth.key }}
                path: {{ .Values.scale.callerAuth.key }}
        {{- end }}
      {{- with .Values.proxy.additionalVolumes -}}
      {{ tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.proxy.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.proxy.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "proxy.serviceAccountName" . }}
      {{- $podSecurityContext := deepCopy (.Values.proxy.podSecurityContext | default dict) }}
      {{- if and .Values.scale.enabled (or .Values.scale.signing.secretName .Values.scale.callerAuth.secretName) (not (hasKey $podSecurityContext "fsGroup")) }}
      {{- /* Scale's keys are mounted 0440 and root-owned; fsGroup lets the proxy read them. */}}
      {{- $_ := set $podSecurityContext "fsGroup" 65532 }}
      {{- end }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      containers:
        - name: operator-proxy
          securityContext:
            {{- toYaml .Values.proxy.securityContext | nindent 12 }}
          image: "{{ .Values.image.union.repository }}:{{ .Values.image.union.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.union.pullPolicy }}
          terminationMessagePolicy: FallbackToLogsOnError
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /etc/union/config
              name: config-volume
            {{- if .Values.secrets.admin.enable }}
            - mountPath: /etc/union/secret
              name: secret-volume
            {{- end }}
            {{- if and .Values.scale.enabled .Values.scale.signing.secretName }}
            - mountPath: /etc/union/scale-signing
              name: scale-signing
              readOnly: true
            {{- end }}
            {{- if and .Values.scale.enabled .Values.scale.callerAuth.secretName }}
            - mountPath: /etc/union/scale-caller
              name: scale-caller
              readOnly: true
            {{- end }}
          {{- with .Values.proxy.additionalVolumeMounts -}}
          {{ tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          args:
            - operator
            - proxy
            - --config
            - /etc/union/config/*.yaml
          ports:
            - name: http
              containerPort: 8089
              protocol: TCP
            - name: connect
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP
            - name: debug
              containerPort: 10254
              protocol: TCP
          env:
            {{- include "global.podEnvVars" . | nindent 10 }}
            {{- with .Values.proxy.podEnv }}
            {{- toYaml . | nindent 10 }}
            {{- end }}
            {{- if and .Values.scale.enabled .Values.scale.signing.acceptUnsignedUntil }}
            {{- /* Shared with the Scale runtime (templates/scale/deployment.yaml). */}}
          - name: SCALE_SIGNING_ACCEPT_UNSIGNED_UNTIL
            value: {{ .Values.scale.signing.acceptUnsignedUntil | quote }}
            {{- end }}
        {{- if .Values.operator.enableTunnelService }}
        - name: "tunnel"
          securityContext:
              {{- toYaml .Values.operator.securityContext | nindent 12 }}
          image: "{{ .Values.image.union.repository }}:{{ .Values.image.union.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.union.pullPolicy }}
          args:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.secretName }}
                  key: tunnel_token
                  optional: true
          resources: {{- toYaml .Values.proxy.tunnel_resources | nindent 12 }}
        {{- end }}
      {{- include "proxy.scheduling" . | nindent 6 }}
      {{- include "additionalPodSpec" . | nindent 6 }}
