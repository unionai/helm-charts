apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "union-operator.fullname" . }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
data:
  k8s.yaml: | {{ tpl (include "k8s.plugins" .) $ | nindent 4 }}
  config.yaml: |
    union:
    {{- with .Values.config.union.connection }}
      connection:
        {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
    {{- with .Values.config.union.auth }}
      auth:
        {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
  {{- with .Values.config.sharedService }}
    sharedService:
      {{- tpl (toYaml .) $ | nindent 6 }}
  {{- end }}
  {{- with .Values.config.authorizer }}
    authorizer:
      {{- tpl (toYaml .) $ | nindent 6 }}
  {{- end }}
    operator:
      enabled: {{ .Values.config.operator.enabled }}
      enableTunnelService: {{ .Values.operator.enableTunnelService }}
      {{- if include "dataplane.connectionConfig.emit" . }}
      # Path to the chart-rendered connection_config JSON the operator
      # self-reports on every UpdateStatus call. Empty path = disabled.
      connectionConfigPath: /etc/union/connection-config/connection_config.json
      {{- end }}
      #  enableDepot: {{ include "operator.enableDepot" . | default "false" }}
      tunnel:
        enableDirectToAppIngress: {{ if and (include "apps.enabled" .) .Values.tunnelService.apps.enableGlobalIngress }}true{{ else }}false{{ end }}
        deploymentToRestart: union-operator-proxy
        {{- if include "apps.enabled" . }}
        {{- if .Values.tunnelService.apps.originURL }}
        appIngressOriginURL: {{ .Values.tunnelService.apps.originURL | quote }}
        {{- else if .Values.zero_trust.enabled }}
        appIngressOriginURL: "http://{{ include "gateway.fullname" . }}:{{ .Values.gateway.service.httpAppsPort }}"
        {{- else }}
        appIngressOriginURL: "http://kourier-internal"
        {{- end }}
        {{- end }}
        {{- if .Values.zero_trust.enabled }}
        enableDataplaneIngress: true
        {{- with .Values.tunnelService.dataplane.originURL }}
        dataplaneIngressOriginURL: {{ . | quote }}
        {{- else }}
        dataplaneIngressOriginURL: "http://{{ include "gateway.fullname" . }}:{{ .Values.gateway.service.httpStaticPort }}"
        {{- end }}
        {{- end }}
      {{- if .Values.config.operator.limitNamespace }}
      limitNamespace: {{ tpl (toYaml .Values.config.operator.limitNamespace) $ }}
      {{- else if include "singleNamespace" . }}
      limitNamespace: {{ .Release.Namespace }}
      {{- end }}
      {{- if .Values.config.operator.disableClusterPermissions }}
      disableClusterPermissions: {{ tpl (toYaml .Values.config.operator.disableClusterPermissions) $ }}
      {{- else if include "singleNamespace" . }}
      disableClusterPermissions: true
      {{- end }}
    {{- with .Values.config.operator.apps }}
      apps:
        {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
    {{- with .Values.config.operator.syncClusterConfig }}
      syncClusterConfig:
        {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
    {{- with .Values.config.operator.clusterId }}
      clusterId:
        {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
      {{- tpl (include "operator.clusterData" .) $ | nindent 6 }}
    {{- $collectUsages := deepCopy (.Values.config.operator.collectUsages | default dict) }}
    {{- if include "singleNamespace" $ }}
    {{- $_ := set $collectUsages "enabled" false }}
    {{- end }}
    {{- with $collectUsages }}
      collectUsages:
        {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
    {{- with .Values.config.operator.billing }}
      billing:
        {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
    {{- with .Values.config.operator.computeResourceManager }}
      computeResourceManager:
        {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
    {{- with .Values.config.operator.dependenciesHeartbeat }}
      dependenciesHeartbeat:
        {{- include "operator.dependenciesHeartbeat" $ }}
    {{- end }}
    {{- $orgRest := omit (.Values.config.operator.org | default dict) "namespaceTemplate" }}
    {{- $orgNsTmpl := include "dataplane.namespaceTemplate" . }}
    {{- if or $orgRest $orgNsTmpl }}
      org:
        {{- with $orgRest }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        {{- if $orgNsTmpl }}
        namespaceTemplate: {{ tpl $orgNsTmpl . | quote }}
        {{- end }}
    {{- end }}
    {{- with .Values.config.operator.secretsWatcher }}
      secretsWatcher:
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- if and (include "singleNamespace" $) (not .namespaces) }}
        namespaces:
          - {{ $.Release.Namespace }}
          {{- if $.Values.controlplaneNamespace }}
          - {{ $.Values.controlplaneNamespace }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.imageBuilder.enabled }}
      imageBuilder:
        enabled: {{ .Values.imageBuilder.enabled }}
        executionNamespaceLabels:
          union.ai/namespace-type: flyte
        referenceConfigmapName: {{ include "union-operator.fullname" . }}
        targetConfigMapName: {{ .Values.imageBuilder.targetConfigMapName | quote }}
    {{- end }}
      {{- if .Values.config.operator.apiKey.enabled }}
      apiKey:
        {{- tpl (toYaml .Values.config.operator.apiKey) $ | nindent 8 }}
      {{- end }}
  {{- with .Values.config.proxy }}
    proxy:
      {{- tpl (toYaml .) $ | nindent 6 }}
    {{- end }}
  {{- if .Values.zero_trust.enabled }}
    dataproxy:
      clusterSelector:
        type: local
      secureTunnelTenantURLPattern: "http://{{ include "union-operator.fullname" . }}-proxy:8080"
      taskMetrics:
        metricDelayToleranceDuration: 0s
  {{- end }}
  logger.yaml: |
{{- with .Values.logging }}
    logger:
      {{- tpl (omit . "pythonLevel" | toYaml) $ | nindent 6 }}
{{- end }}
{{- with .Values.config.configOverrides }}
  config-overrides.yaml: | {{ tpl (toYaml .) $ | nindent 4 }}
{{- end }}
  storage.yaml: | {{ tpl (include "storage" .) $ | nindent 4 }}
{{- if .Values.storage.fastRegistrationBucketName }}
  fast_registration_storage.yaml: | {{ tpl (include "fast-registration-storage" .) $ | nindent 4 }}
{{- end }}
{{- if .Values.imageBuilder.enabled }}
{{- if or .Values.imageBuilder.buildkitUri .Values.imageBuilder.buildkit.enabled }}
  image-builder.buildkit-uri: {{ (include "imagebuilder.buildkit.uri" .) | quote }}
{{- else }}
  image-builder.buildkit-uri: ""
{{- end }}
  image-builder.default-repository: {{ include "imagebuilder.defaultRepository" . | quote }}
  image-builder.authentication-type: {{ .Values.imageBuilder.authenticationType | quote }}
{{- end }}
