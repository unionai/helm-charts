{{- if .Values.proxy.serviceAccount.create -}}
{{- $roleName := default "proxy-system" .Values.proxy.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
  {{- with include "proxy.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.proxy" -}}
{{/* No components-namespace grant: proxy's secret access targets
proxy.secretsNamespace via serviceaccount-proxy-secret.yaml. It only reads work
namespaces; the write comes from sharing the pooled work-ns role. */}}
work-ns:
  - apiGroups: ['*']
    resources: [events, flyteworkflows, pods/log, pods, rayjobs, resourcequotas]
{{/* Cluster scope: the proxy mounts the operator's ConfigMap
(operator/deployment-proxy.yaml), so limit-namespace is unset at
low_privilege: false. Groups are named exactly rather than wildcarded because
this lands in a ClusterRoleBinding.
pods: actor (operator/dataproxy/actor.go:208-215), app-replica
(operator/apps/app_replica.go:179-186), and the HTTP manager cache, whose nil
ByObject lets the pod and ray handlers resolve pods by name
(reverse_proxy.go:583-585).
resourcequotas: operator/dataproxy/quota_handler.go:29-33.
events.k8s.io, not the core group: factory.Events().V1().Events()
(reverse_proxy.go:440), filtered by regarding.kind=Pod.
ray.io/rayjobs: operator/dataproxy/ray_handler.go:44-52. */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [pods, resourcequotas]
    verbs: [list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [list, watch]
  - apiGroups: [ray.io]
    resources: [rayjobs]
    verbs: [list, watch]
{{- end -}}
