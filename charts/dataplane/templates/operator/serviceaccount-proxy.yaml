{{- if .Values.proxy.serviceAccount.create -}}
{{- $roleName := default "proxy-system" .Values.proxy.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
  {{- with include "proxy.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.proxy" -}}
{{/* No components-namespace grant: the proxy's secret access targets
proxy.secretsNamespace instead (serviceaccount-proxy-secret.yaml). It only reads
work namespaces; the write verbs come with the shared pooled work-ns role. */}}
work-ns:
  - apiGroups: ['*']
    resources: [events, flyteworkflows, pods/log, pods, rayjobs, resourcequotas]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
{{/* The proxy mounts the operator's ConfigMap (operator/deployment-proxy.yaml),
so limit-namespace is unset at low_privilege: false and these caches watch every
namespace. Groups are named rather than wildcarded because this lands in a
ClusterRoleBinding.
pods: read by the data-proxy actor, the app-replica controller, and the HTTP
manager cache, which is unfiltered so the pod and ray handlers can resolve pods
by name.
resourcequotas: read by the quota handler.
events.k8s.io, not the core group: that is the group the proxy watches, filtered
by regarding.kind=Pod.
ray.io/rayjobs: read by the ray handler. */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [pods, resourcequotas]
    verbs: [list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [list, watch]
  - apiGroups: [ray.io]
    resources: [rayjobs]
    verbs: [list, watch]
{{- end -}}
