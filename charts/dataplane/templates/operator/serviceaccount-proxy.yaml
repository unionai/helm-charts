{{- if .Values.proxy.serviceAccount.create -}}
{{- $roleName := default "proxy-system" .Values.proxy.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
  {{- with include "proxy.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{/*
Proxy RBAC buckets. Read-only, and every resource is namespaced. Under full
privilege this was previously a ClusterRole bound by a ClusterRoleBinding --
cluster-wide read including every Secret in the cluster. It is now bound by
RoleBinding into the release namespace and the task namespaces, which is the
reach the proxy actually needs.
*/}}
{{- define "dataplane.rbac.buckets.proxy" -}}
ns-read:
  - apiGroups: ['*']
    resources: [events, flyteworkflows, pods/log, pods, rayjobs, resourcequotas]
    verbs: [get, list, watch]
ns-write: []
cluster-read: []
cluster-write: []
{{- end -}}
{{- define "dataplane.rbac.slots.proxy" -}}
{{/*
No components-namespace grant. Its secret access targets proxy.secretsNamespace
via the hand-written Role in serviceaccount-proxy-secret.yaml, which may be a
different namespace entirely and so stays outside the slot model.

proxy reads work namespaces and never writes them, but the pooled work-ns role
carries the executor's writes, so under split ServiceAccounts it gains write
here. Accepted: under the default shared ServiceAccount it already had them,
and one role means one answer to "what can union do in a work namespace".
*/}}
work-ns:
  - apiGroups: ['*']
    resources: [events, flyteworkflows, pods/log, pods, rayjobs, resourcequotas]
{{- end -}}
