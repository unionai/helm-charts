{{- if .Values.proxy.serviceAccount.create -}}
{{- $roleName := default "proxy-system" .Values.proxy.serviceAccount.name -}}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
  {{- with include "proxy.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.proxy" -}}
{{/*
No components-namespace grant. Its secret access targets proxy.secretsNamespace
via the hand-written Role in serviceaccount-proxy-secret.yaml, which may be a
different namespace entirely and so stays outside the slot model.

proxy reads work namespaces and never writes them, but the pooled work-ns role
carries the executor's writes, so under split ServiceAccounts it gains write
here. Accepted: under the default shared ServiceAccount it already had them,
and one role means one answer to "what can union do in a work namespace".
*/}}
work-ns:
  - apiGroups: ['*']
    resources: [events, flyteworkflows, pods/log, pods, rayjobs, resourcequotas]
{{/*
The proxy mounts the operator's ConfigMap (operator/deployment-proxy.yaml), so
limitNamespace behaves exactly as it does for the operator: unset at
low_privilege: false, and every informer below therefore watches the whole
cluster. A namespace-less LIST or WATCH is authorized as a cluster-scope check
that no per-namespace RoleBinding satisfies. These informers exist only in the
proxy process -- the operator subcommand registers a no-op HTTP hook.

The apiGroups here are narrower than the work-ns line above, and that is
deliberate: a wildcard apiGroup covers whichever group a resource really lives
in, which is fine for a role bound one namespace at a time and not fine for a
ClusterRoleBinding. Each group below was read off the informer that needs it.

pods: three separate informers -- the actor pod informer
(operator/dataproxy/actor.go:208-215), the app-replica pod informer
(operator/apps/app_replica.go:179-186), and the HTTP manager cache, which is
built with a nil ByObject deliberately because the pod and ray handlers resolve
arbitrary pods by name (reverse_proxy.go:583-585) and forced open at
pod_http_handler.go:39. The first two append informers.WithNamespace only when
GetLimitNamespace is non-empty; sync failure at reverse_proxy.go:456-458 is a
startup error.

resourcequotas: operator/dataproxy/quota_handler.go:29-33, same namespace gate;
sync failure at :41-45 aborts handler registration.

events.k8s.io, NOT the core group: the informer is factory.Events().V1().Events()
(reverse_proxy.go:440), i.e. events.k8s.io/v1, filtered by a
regarding.kind=Pod field selector. Nothing in the proxy reads core v1 events
cluster-wide.

ray.io/rayjobs: operator/dataproxy/ray_handler.go:44-52 asks the same manager
cache for an informer on ray.io/v1 RayJob and reads through it at :81. On a
cluster without KubeRay the informer is never created and the rule matches
nothing; on a cluster with it, an unauthorized cache is a logger.Panicf at
reverse_proxy.go startup. The group is ray.io, read off the GroupVersionKind
the handler passes to GetInformerForKind.
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [pods, resourcequotas]
    verbs: [list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [list, watch]
  - apiGroups: [ray.io]
    resources: [rayjobs]
    verbs: [list, watch]
{{- end -}}
