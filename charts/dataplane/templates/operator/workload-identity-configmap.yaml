{{- if .Values.workloadIdentity.enabled }}
# Whether the control plane verifies this cluster's pods' own service-account
# tokens. The operator writes data.verified from each status report; the
# leaseworker tells task pods to authenticate as themselves (and drops their
# api key) only while it is "true", so a missing value keeps pods on their
# key. The chart sets no data, so an upgrade or sync never resets the
# operator's value; it only creates the object the operator may update.
apiVersion: v1
kind: ConfigMap
metadata:
  name: union-workload-identity
  labels:
    {{- include "operator.labels" . | nindent 4 }}
{{- end }}
