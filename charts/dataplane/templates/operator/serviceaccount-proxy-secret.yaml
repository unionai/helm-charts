{{- if and .Values.proxy.secretManager.enabled (eq .Values.proxy.secretManager.type "K8s") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "proxy.serviceAccountName" . }}-secret
  namespace: {{ include "proxy.secretsNamespace" . }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "proxy.serviceAccountName" . }}-secret
  namespace: {{ include "proxy.secretsNamespace" . }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "proxy.serviceAccountName" . }}-secret
subjects:
  - kind: ServiceAccount
    name: {{ include "proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- $smType := tpl (toString (dig "embeddedSecretManagerConfig" "type" "" (.Values.config.core.webhook | default dict))) . }}
{{- $secretsNs := include "proxy.secretsNamespace" . }}
{{- $readers := list }}
{{- if .Values.flytepropellerwebhook.enabled }}
{{- $readers = append $readers (include "webhook.serviceAccountName" .) }}
{{- end }}
{{- if .Values.leaseworker.enabled }}
{{- $readers = append $readers (include "leaseworker.serviceAccountName" .) }}
{{- end }}
{{- $readers = $readers | uniq }}
{{- if and (eq $smType "K8s") $readers (not (and (include "singleNamespace" .) (eq $secretsNs .Release.Namespace))) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Namespace }}-secret-read
  namespace: {{ $secretsNs }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Namespace }}-secret-read
  namespace: {{ $secretsNs }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Namespace }}-secret-read
subjects:
{{- range $sa := $readers }}
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
