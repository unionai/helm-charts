{{- if and .Values.proxy.secretManager.enabled (eq .Values.proxy.secretManager.type "K8s") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "proxy.serviceAccountName" . }}-secret
  namespace: {{ include "proxy.secretsNamespace" . }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
{{/* Not part of the slot model: this Role targets proxy.secretsNamespace, and
the slot emitter only binds roles in the release namespace. */}}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "proxy.serviceAccountName" . }}-secret
  namespace: {{ include "proxy.secretsNamespace" . }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "proxy.serviceAccountName" . }}-secret
subjects:
  - kind: ServiceAccount
    name: {{ include "proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{/*
Direct Secret Gets in proxy.secretsNamespace by the K8s secret manager, which
the webhook and leaseworker each build from the webhook config they mount
(embeddedSecretManagerConfig, type K8s). The webhook reads a task's secret there
when it injects it (flytepropeller/pkg/secret/k8s_secret_fetcher.go), and the
leaseworker's connector plugin reads a connection's secrets there before it calls
the connector (flyteplugins/go/tasks/plugins/webapi/connector/plugin.go). Secret
names come from the task, so this cannot be pinned, and both only Get by name,
so there is no list or watch.

The Role above binds only the proxy, so these identities used to get this read
only when they shared its ServiceAccount. Not part of the slot model, for the
same reason as that Role: proxy.secretsNamespace need not be the release
namespace. It is skipped where work-ns already covers the read: under
singleNamespace with the secrets in the release namespace, which is then the
work namespace.
*/}}
{{- $smType := tpl (toString (dig "embeddedSecretManagerConfig" "type" "" (.Values.config.core.webhook | default dict))) . }}
{{- $secretsNs := include "proxy.secretsNamespace" . }}
{{- $readers := list }}
{{- if .Values.flytepropellerwebhook.enabled }}
{{- $readers = append $readers (include "webhook.serviceAccountName" .) }}
{{- end }}
{{- if .Values.leaseworker.enabled }}
{{- $readers = append $readers (include "leaseworker.serviceAccountName" .) }}
{{- end }}
{{- $readers = $readers | uniq }}
{{- if and (eq $smType "K8s") $readers (not (and (include "singleNamespace" .) (eq $secretsNs .Release.Namespace))) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Namespace }}-secret-read
  namespace: {{ $secretsNs }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Namespace }}-secret-read
  namespace: {{ $secretsNs }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Namespace }}-secret-read
subjects:
{{- range $sa := $readers }}
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
