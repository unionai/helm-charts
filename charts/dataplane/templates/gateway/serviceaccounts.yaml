{{- if include "appServing.enabled" . }}
{{/*
One ServiceAccount per app-serving binary. Upstream Knative shares a single
`controller` SA across the controller, webhook and autoscaler; splitting them
lets each declare only the permissions it uses, and makes
commonServiceAccount.enabled: false meaningful rather than nominal.

When the common ServiceAccount is enabled (the default) all five names resolve
to it and Helm renders one object, because the names collide.
*/}}
{{- $names := list
      (include "knative.controller.serviceAccountName" .)
      (include "knative.webhook.serviceAccountName" .)
      (include "knative.autoscaler.serviceAccountName" .)
      (include "knative.activator.serviceAccountName" .)
      (include "knative.kourier.serviceAccountName" .) | uniq -}}
{{- range $name := $names }}
{{- if ne $name (include "common.serviceAccountName" $) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
