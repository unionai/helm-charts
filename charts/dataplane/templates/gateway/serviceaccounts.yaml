{{- if include "appServing.enabled" . }}
{{/*
One ServiceAccount per app-serving binary. Upstream Knative shares a single
`controller` SA across the controller, webhook and autoscaler; splitting them
lets each declare only the permissions it uses, and makes
commonServiceAccount.enabled: false meaningful rather than nominal.

When the common ServiceAccount is enabled (the default) all five names resolve
to it and Helm renders one object, because the names collide.
*/}}
{{- $names := list
      (include "knative.controller.serviceAccountName" .)
      (include "knative.webhook.serviceAccountName" .)
      (include "knative.autoscaler.serviceAccountName" .)
      (include "knative.activator.serviceAccountName" .)
      (include "knative.kourier.serviceAccountName" .) | uniq -}}
{{- range $name := $names }}
{{- if ne $name (include "common.serviceAccountName" $) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}

{{- define "dataplane.rbac.slots.knative-controller" -}}
{{/*
Reconcilers: configuration, labeler, revision, route, serverlessservice,
service, gc, nscert, domainmapping. No pod informer -- that is the autoscaler.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
{{- if include "singleNamespace" . }}
{{/*
Digest resolution reads the app namespace's ServiceAccount and the Secrets its
imagePullSecrets name. Under single-namespace the app namespace is the release
namespace, so the cluster-scoped grant below is unnecessary.
*/}}
  - apiGroups: [""]
    resources: [serviceaccounts, secrets]
{{- end }}
comp-ns-write:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
{{/*
work-ns is pooled: the union-work-ns ClusterRole already carries an
{apiGroups: ["*"], resources: ["*"]} write rule contributed by the executor
and leaseworker. Any component that joins this pool -- as this one does --
holds unrestricted write in every work namespace regardless of the narrower
resource lists declared below; those lists document intent, not the effective
grant.
*/}}
work-ns:
  - apiGroups: [""]
    resources: [services, endpoints, events]
  - apiGroups: [apps]
    resources: [deployments]
  - apiGroups: [serving.knative.dev]
    resources: ["*", "*/status", "*/finalizers"]
  - apiGroups: [autoscaling.internal.knative.dev]
    resources: ["*", "*/status", "*/finalizers"]
  - apiGroups: [networking.internal.knative.dev]
    resources: ["*", "*/status", "*/finalizers"]
  - apiGroups: [caching.internal.knative.dev]
    resources: [images]
cluster-read:
  - apiGroups: [""]
    resources: [services, endpoints, namespaces]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev, autoscaling.internal.knative.dev, networking.internal.knative.dev, caching.internal.knative.dev]
    resources: ["*"]
    verbs: [list, watch]
{{- if not (include "singleNamespace" .) }}
  - apiGroups: [""]
    resources: [serviceaccounts, secrets]
    verbs: [get]
{{- end }}
{{- end -}}

{{- define "dataplane.rbac.slots.knative-webhook" -}}
{{/*
Controllers: certificates, defaulting, validation, config-validation. Its whole
informer set is a namespaced Secret informer plus the two webhook-configuration
informers, so it needs no work-ns access and no cluster-wide reads of anything
else. comp-ns-write is pooled with emitter-owned verbs -- get, list, watch,
create, update, patch, delete, deletecollection (dataplane.rbac.verbs.write)
-- so this declaration's secrets entry grants that full write set, not update
alone. Because the Role and its RoleBinding are shared across every declarer,
knative-controller, knative-autoscaler and knative-kourier -- which put only
leases (autoscaler also services and endpoints) into this same slot -- each
receive that same full write set on Secrets too.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
comp-ns-write:
  - apiGroups: [""]
    resources: [secrets]
cluster-read:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [list, watch]
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, update]
    resourceNames:
      - webhook.serving.knative.dev
      - config.webhook.serving.knative.dev
      - validation.webhook.serving.knative.dev
  - apiGroups: [""]
    resources: [namespaces/finalizers]
    verbs: [update]
    resourceNames: [{{ .Release.Namespace }}]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-autoscaler" -}}
{{/*
The statforwarder writes its bucket Service and Endpoints in the release
namespace, not work namespaces: its lease informer is filtered to
system.Namespace() and the target namespace comes from the lease. The KPA and
metric reconcilers write in the revision's namespace, hence work-ns. `leases`
needs cluster-scoped list/watch because the statforwarder registers the global
lease informer.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
comp-ns-write:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
  - apiGroups: [""]
    resources: [services, endpoints]
{{/*
work-ns is pooled: the union-work-ns ClusterRole already carries an
{apiGroups: ["*"], resources: ["*"]} write rule contributed by the executor
and leaseworker. Any component that joins this pool -- as this one does --
holds unrestricted write in every work namespace regardless of the narrower
resource lists declared below; those lists document intent, not the effective
grant.
*/}}
work-ns:
  - apiGroups: [autoscaling.internal.knative.dev]
    resources: [podautoscalers, "podautoscalers/status", metrics, "metrics/status"]
  - apiGroups: [networking.internal.knative.dev]
    resources: [serverlessservices, "serverlessservices/status"]
cluster-read:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [list, watch]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [list, watch]
  - apiGroups: [autoscaling.internal.knative.dev, networking.internal.knative.dev]
    resources: ["*"]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [revisions]
    verbs: [list, watch]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-activator" -}}
{{/*
Read-only. The throttler and revision backends watch each revision's private
Service and Endpoints; three call sites read revisions. This declaration asks
for no Secret access itself -- the cert cache is constructed only when
system-internal-tls is enabled, which this chart does not support -- but
comp-ns-read is pooled: knative-controller's singleNamespace branch above adds
serviceaccounts and secrets to that shared Role. In the chart's default
posture (singleNamespace true), this component's ServiceAccount, as a
comp-ns-read subject, therefore also holds get/list/watch on every Secret in
the release namespace.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
cluster-read:
  - apiGroups: [""]
    resources: [services, endpoints]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [revisions]
    verbs: [list, watch]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-kourier" -}}
{{/*
The pod informer is filtered to the gateway's own pods and used only to cancel
status probing on deletion, but the code uses the global informer, so the grant
is cluster-wide. The ConfigMap informer is already namespaced in code.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
comp-ns-write:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
{{/*
work-ns is pooled: the union-work-ns ClusterRole already carries an
{apiGroups: ["*"], resources: ["*"]} write rule contributed by the executor
and leaseworker. Any component that joins this pool -- as this one does --
holds unrestricted write in every work namespace regardless of the narrower
resource lists declared below; those lists document intent, not the effective
grant.
*/}}
work-ns:
  - apiGroups: [networking.internal.knative.dev]
    resources: [ingresses, "ingresses/status"]
  - apiGroups: [""]
    resources: [events]
cluster-read:
  - apiGroups: [""]
    resources: [pods, endpoints, services]
    verbs: [list, watch]
  - apiGroups: [networking.internal.knative.dev]
    resources: [ingresses]
    verbs: [list, watch]
{{/*
Temporary, not a considered permanent grant: net-kourier registers its Secret
informer unconditionally in the shipped image, unfiltered by namespace, so it
needs a cluster-scoped list and watch on Secrets -- a namespaced Role cannot
authorize a cluster-scoped list. Dropping this without the image change first
causes a silent outage: the informer's reflector fails, the cache never
syncs, the reconcilers never start, but the xDS server's readiness probe
stays green, so the controller sits at 1/1 Running with zero restarts while
every new app deployment hangs forever at IngressNotConfigured. UN-39 gates
that informer behind KOURIER_ENABLE_INGRESS_TLS; once the net-kourier image
carries that gate, this grant becomes conditional on gateway.ingressTLS and
is removed by default.
*/}}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
{{- end -}}
