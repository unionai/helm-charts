{{- if include "zeroTrustApps.enabled" . }}
{{- if not (include "useCommonServiceAccount" .) }}
{{/*
One ServiceAccount per app-serving binary.

Only rendered when the common service account is off. When it is on -- the
chart default -- all five names resolve to it and the object is already
emitted by common/system-serviceaccount.yaml, which is gated on exactly the
same helper, so this file emitting them too would be a duplicate rather than a
second identity.

The five literals below cannot collide: they are constants, not values keys.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knative.controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.knativeLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knative.webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.knativeLabels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knative.autoscaler.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.knativeLabels" . | nindent 4 }}
    app.kubernetes.io/component: autoscaler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knative.activator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.knativeLabels" . | nindent 4 }}
    app.kubernetes.io/component: activator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knative.kourier.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.knativeLabels" . | nindent 4 }}
    networking.knative.dev/ingress-provider: kourier
    app.kubernetes.io/component: net-kourier
{{- end }}
{{- end }}

{{/*
=============================================================================
What the app-serving binaries are allowed to do, declared per binary instead of
vendored from upstream. See dataplane.rbac.slotSpec for what each slot emits.

Two properties of these declarations are worth stating once rather than per
component:

Cluster-scoped reads are not a widening the chart chose. Several of these
informers are the shared, unfiltered ones from knative.dev/pkg's injection
framework, and the binaries never scope them to a namespace, so their LIST goes
out with an empty namespace -- which Kubernetes authorizes as a cluster-scope
check. Nothing a namespaced Role conveys can satisfy one. Where a read can be
namespaced it is, in comp-ns-read; where a write can be namespaced it is, in
work-ns. The cluster slots hold only what has no namespaced form. This is also
why app serving requires low_privilege: false -- see gateway/validate.yaml --
and why these declarations are written for that posture and never branch on
singleNamespace.

The namespaced slots are pooled. work-ns and the two comp-ns slots are one
object each, shared with every other declarer, so a component that joins them
holds the other declarers' rules there too -- including the leaseworker's and
flytepropeller's wildcard write rule in work-ns. The resource lists below say
what each binary asks for, not what it effectively receives in a pooled slot.
Per-component ServiceAccounts separate these five in the cluster dimension only.
*/}}

{{- define "dataplane.rbac.slots.knative-controller" -}}
{{/*
Reconcilers: configuration, labeler, revision, route, serverlessservice,
service, gc, nscert, domainmapping. No pod informer -- that is the autoscaler.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
comp-ns-write:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
work-ns:
{{/*
The serverlessservice reconciler writes the private Endpoints backing each
revision, naming activator or queue-proxy pod IPs, so it needs the same OpenShift
endpoints-restricted subresource the autoscaler does -- see the note on that
component. Declared rather than inherited: this slot is pooled, and the wildcard
rule leaseworker and flytepropeller contribute would otherwise be the only thing
supplying it, making app serving on OpenShift depend on whether two unrelated
components happen to be enabled.
*/}}
  - apiGroups: [""]
    resources: [services, endpoints, "endpoints/restricted", events]
  - apiGroups: [apps]
    resources: [deployments]
  - apiGroups: [serving.knative.dev]
    resources: ["*", "*/status", "*/finalizers"]
  - apiGroups: [autoscaling.internal.knative.dev]
    resources: ["*", "*/status", "*/finalizers"]
  - apiGroups: [networking.internal.knative.dev]
    resources: ["*", "*/status", "*/finalizers"]
  - apiGroups: [caching.internal.knative.dev]
    resources: [images]
cluster-read:
  - apiGroups: [""]
    resources: [services, endpoints, namespaces]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev, autoscaling.internal.knative.dev, networking.internal.knative.dev, caching.internal.knative.dev]
    resources: ["*"]
    verbs: [list, watch]
{{/*
The revision reconciler consumes the shared, unfiltered Deployment informer and
cmd/controller never scopes it to a namespace. The deployment writes stay in
work-ns above, where they are namespaced.
*/}}
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
{{/*
Digest resolution reads the app namespace's ServiceAccount and the Secrets its
imagePullSecrets name, by direct Get rather than through an informer. `get`
only: no list, no watch, so this conveys no ability to enumerate either kind.
*/}}
  - apiGroups: [""]
    resources: [serviceaccounts, secrets]
    verbs: [get]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-webhook" -}}
{{/*
Controllers: certificates, defaulting, validation, config-validation. Its whole
informer set is a namespaced Secret informer plus the two webhook-configuration
informers, so it needs no work namespace access at all -- the only component
here that does not.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
comp-ns-write:
  - apiGroups: [""]
    resources: [secrets]
cluster-read:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [list, watch]
{{/*
Namespace ownership: each of the three admission controllers this binary
registers -- defaulting, validation and config-validation -- reads the release
Namespace on every reconcile, to own its webhook configuration by owner
reference. It is a direct client Get rather than an informer, which is why an
inventory of this binary's informers does not turn it up, and RBAC does not
derive get from the list and watch above. Without it the reconcile returns
before its Update and the caBundle is never injected, while the pod stays
Ready and both fail-closed webhooks reject every write they admit on.
resourceNames confines the grant to the one namespace the code asks for.
*/}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
    resourceNames: [{{ .Release.Namespace | quote }}]
cluster-write:
{{/*
The only cluster-scoped writes in the whole app-serving set, and every one is
resourceNames-scoped. There is no cluster-scoped create anywhere here: a create
cannot be confined by resourceNames, because there is no name to match before
the object exists.

The two webhook-configuration kinds are declared as separate rules rather than
one rule naming both, because Kubernetes applies resourceNames across every
resource in a rule. Combining them would authorize six kind/name pairs, of which
only three name an object this chart creates -- one mutating configuration and
two validating ones. Split, the grant is exactly those three.
*/}}
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, update]
    resourceNames:
      - webhook.serving.knative.dev
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    verbs: [get, update]
    resourceNames:
      - config.webhook.serving.knative.dev
      - validation.webhook.serving.knative.dev
  - apiGroups: [""]
    resources: [namespaces/finalizers]
    verbs: [update]
    resourceNames: [{{ .Release.Namespace | quote }}]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-autoscaler" -}}
{{/*
Shared by the autoscaler and autoscaler-hpa workloads, which run the same
reconcilers under different PodAutoscaler classes.

The statforwarder writes its bucket Service and Endpoints in the release
namespace, not in work namespaces: its lease informer is filtered to the system
namespace and the target namespace comes from the lease. The KPA, HPA and metric
reconcilers write in the revision's namespace, hence work-ns.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
comp-ns-write:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
{{/*
The endpoints-restricted subresource below is an OpenShift admission concept, not
a Kubernetes one. Its RestrictedEndpointsAdmission plugin refuses an Endpoints
object naming an address inside the cluster or service network unless the caller
holds create on that subresource -- and the bucket Endpoints this binary writes
names the holder pod's IP, which is exactly such an address. RBAC does not derive
a subresource from its parent, so granting endpoints alone does not cover it.
Withholding it leaves the autoscaler unable to publish its bucket on OpenShift
while every other cluster works, which is why the vendored role carried both. It
stays namespaced.
*/}}
  - apiGroups: [""]
    resources: [services, endpoints, "endpoints/restricted"]
work-ns:
  - apiGroups: [autoscaling.internal.knative.dev]
    resources: [podautoscalers, "podautoscalers/status", metrics, "metrics/status"]
  - apiGroups: [networking.internal.knative.dev]
    resources: [serverlessservices, "serverlessservices/status"]
{{/*
autoscaler-hpa reconciles an HPA-class PodAutoscaler into a
HorizontalPodAutoscaler alongside the revision it scales, so the write is
namespaced even though the vendored role granted it cluster-wide.
*/}}
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
cluster-read:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [list, watch]
{{/*
`leases` is cluster-scoped here, unlike the namespaced write above, because the
statforwarder registers the global lease informer.
*/}}
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [list, watch]
  - apiGroups: [autoscaling.internal.knative.dev, networking.internal.knative.dev]
    resources: ["*"]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [revisions]
    verbs: [list, watch]
{{/*
Two more shared informers with no namespace set: the KPA reconciler reaches a
revision's scale target through the podscalable duck informer, whose factory
LISTs apps/v1 deployments cluster-wide, and the HPA reconciler watches
HorizontalPodAutoscalers the same way. Both return the error directly, and
sharedmain starts informers before serving health probes, so a Forbidden
reflector leaves the pod permanently un-Ready rather than degrading.
*/}}
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-activator" -}}
{{/*
Read-only -- the one binary here that declares into neither write slot. The
throttler and revision backends watch each revision's private Service and
Endpoints; three call sites read revisions.

The namespaced Secret read is needed in every posture, not only when
system-internal-tls is on. cmd/activator imports the certificate cache, whose
namespaced Secret informer registers itself in an init(); registration is an
import side effect, so the informer starts and its cache is waited on
regardless of configuration. The cache it feeds is inert without
system-internal-tls -- the informer is not, and the pod does not become Ready
until it syncs.

That entry is what widens comp-ns-read for everyone: the slot is pooled, so
every other declarer -- operator, proxy, leaseworker and the other four
app-serving binaries -- reads every Secret in the release namespace because of
it. There is no per-component namespaced slot to declare it into, so this is
what the informer costs, not a defect in the declaration.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps, secrets]
cluster-read:
  - apiGroups: [""]
    resources: [services, endpoints]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [revisions]
    verbs: [list, watch]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-kourier" -}}
{{/*
The net-kourier controller. Its ClusterRole is named for the component,
union-knative-kourier-cluster-read, while its ServiceAccount keeps the upstream
name net-kourier; the two are deliberately different.

The pod informer is filtered to the gateway's own pods and used only to cancel
status probing on deletion, but the code takes the global informer, so the read
is cluster-wide. The ConfigMap informer is already namespaced in code.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
comp-ns-write:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
work-ns:
  - apiGroups: [networking.internal.knative.dev]
    resources: [ingresses, "ingresses/status"]
  - apiGroups: [""]
    resources: [events]
cluster-read:
  - apiGroups: [""]
    resources: [pods, endpoints, services]
    verbs: [list, watch]
  - apiGroups: [networking.internal.knative.dev]
    resources: [ingresses]
    verbs: [list, watch]
{{/*
Temporary, and the one grant here that is not a considered permanent one:
net-kourier registers its Secret informer unconditionally in the image this
chart ships, unfiltered by namespace, so a cluster-scoped list and watch is
load-bearing today -- a namespaced Role cannot authorize a cluster-scoped LIST.
Dropping it before the image can gate that informer causes a silent outage: the
reflector fails, the cache never syncs, the reconcilers never start, but the xDS
readiness probe stays green, so the controller sits Running with zero restarts
while every new app deployment hangs at IngressNotConfigured. It is still
narrower than the vendored net-kourier ClusterRole it replaces, which also held
`get`.
*/}}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
{{- end -}}
