{{- if include "serving.useVendoredGateway" . }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knative.controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.knativeLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knative.webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.knativeLabels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knative.autoscaler.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.knativeLabels" . | nindent 4 }}
    app.kubernetes.io/component: autoscaler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knative.activator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.knativeLabels" . | nindent 4 }}
    app.kubernetes.io/component: activator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "knative.kourier.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.knativeLabels" . | nindent 4 }}
    networking.knative.dev/ingress-provider: kourier
    app.kubernetes.io/component: net-kourier
{{- end }}
{{- end }}

{{- define "dataplane.rbac.slots.knative-controller" -}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
comp-ns-write:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
work-ns:
  - apiGroups: [""]
    resources: [services, endpoints, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: ["endpoints/restricted"]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [serving.knative.dev]
    resources: ["*", "*/status", "*/finalizers"]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [autoscaling.internal.knative.dev]
    resources: ["*", "*/status", "*/finalizers"]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [networking.internal.knative.dev]
    resources: ["*", "*/status", "*/finalizers"]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [caching.internal.knative.dev]
    resources: [images]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts, secrets]
    verbs: [get]
cluster-read:
  - apiGroups: [""]
    resources: [services, endpoints, namespaces]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev, autoscaling.internal.knative.dev, networking.internal.knative.dev, caching.internal.knative.dev]
    resources: ["*"]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-webhook" -}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
comp-ns-write:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, create, update]
cluster-read:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
    resourceNames: [{{ .Release.Namespace | quote }}]
cluster-write:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, update]
    resourceNames:
      - webhook.serving.knative.dev
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    verbs: [get, update]
    resourceNames:
      - config.webhook.serving.knative.dev
      - validation.webhook.serving.knative.dev
  - apiGroups: [""]
    resources: [namespaces/finalizers]
    verbs: [update]
    resourceNames: [{{ .Release.Namespace | quote }}]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-autoscaler" -}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
comp-ns-write:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch, create, update]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices/restricted"]
    verbs: [create]
work-ns:
  - apiGroups: [autoscaling.internal.knative.dev]
    resources: [podautoscalers, "podautoscalers/status", metrics, "metrics/status"]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [networking.internal.knative.dev]
    resources: [serverlessservices, "serverlessservices/status"]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: ["deployments/scale"]
    verbs: [patch]
cluster-read:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [list, watch]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [list, watch]
  - apiGroups: [autoscaling.internal.knative.dev, networking.internal.knative.dev]
    resources: ["*"]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [revisions]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-activator" -}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, watch]
cluster-read:
  - apiGroups: [""]
    resources: [services, endpoints]
    verbs: [list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [revisions]
    verbs: [list, watch]
{{- end -}}

{{- define "dataplane.rbac.slots.knative-kourier" -}}
comp-ns-read:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
comp-ns-write:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
work-ns:
  - apiGroups: [networking.internal.knative.dev]
    resources: [ingresses]
    verbs: [get, list, watch, patch]
  - apiGroups: [networking.internal.knative.dev]
    resources: ["ingresses/status"]
    verbs: [update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, update, patch]
cluster-read:
  - apiGroups: [""]
    resources: [pods, endpoints, services]
    verbs: [list, watch]
  - apiGroups: [networking.internal.knative.dev]
    resources: [ingresses]
    verbs: [list, watch]
{{- end -}}
