{{- /*
Why this fails the install instead of just skipping the gateway stack: apps.enabled would
stay true with nothing behind it. The operator would keep advertising app serving and keep
its serving.knative.dev grant, and every Knative Service would sit unreconciled with nothing
reporting why.

The constraint outlived the vendored RBAC that first motivated it. App serving's grants are
declared per binary now (gateway/serviceaccounts.yaml) and every one that can be namespaced
is, but the cluster-scoped reads that remain are a property of the images, not of how the
manifests are written -- so replacing the manifests did not remove the reason.
*/ -}}
{{- if and .Values.zero_trust.enabled (include "apps.enabled" .) .Values.low_privilege }}
{{- fail "App serving at zero_trust.enabled: true requires low_privilege: false. The Knative binaries take the shared, unfiltered informers from knative.dev/pkg and never scope them to a namespace, so their reads go out with an empty namespace and Kubernetes authorizes them as cluster-scope checks: each binary needs cluster-wide list and watch on Deployments, Pods, Services, Endpoints and the Knative API groups, and net-kourier additionally on Secrets. A namespaced Role cannot authorize any of them and the deployments take no watch-scope flag, so app serving reads every namespace in the cluster no matter how the RBAC is written -- which is exactly what low_privilege: true promises it does not do. This chart will not render that behind a flag that promises otherwise. Set low_privilege: false to run app serving, or apps.enabled: false to run the zero-trust dataplane (Envoy gateway, dataproxy, tunnel ingress) without it. See charts/dataplane/docs/rbac.md#app-serving." }}
{{- end }}
