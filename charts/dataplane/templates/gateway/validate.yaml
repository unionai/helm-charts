{{- if and (include "serving.useVendoredGateway" .) (include "singleNamespace" .) }}
{{- fail "App serving on the vendored gateway (gateway.enabled: true) requires singleNamespace: false. The Knative binaries take the shared, unfiltered informers from knative.dev/pkg and never scope them to a namespace, so their reads go out with an empty namespace and Kubernetes authorizes them as cluster-scope checks. Between them the binaries need cluster-wide list and watch on Deployments, Pods, Services, Endpoints, Namespaces, HorizontalPodAutoscalers, leases, both webhook-configuration kinds and the Knative API groups -- the requirement is collective, and every component's share of it is cluster-scoped. A namespaced Role cannot authorize any of them and the deployments take no watch-scope flag, so app serving reads every namespace in the cluster no matter how the RBAC is written. singleNamespace: true promises that Union's workloads, apps included, stay in the release namespace and that the only cluster-scoped reads are a short fixed list; Knative's reads are neither, and this chart will not render them behind a flag that promises otherwise. Set singleNamespace: false to run app serving, or apps.enabled: false to run the dataplane (under zero trust: Envoy gateway, dataproxy, tunnel ingress) without it. See charts/dataplane/docs/rbac.md#app-serving." }}
{{- end }}
