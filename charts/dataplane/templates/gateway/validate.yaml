{{- if include "appServing.enabled" . }}
{{/*
This chart does not support Knative's TLS certificate provisioning: the
config-certmanager ConfigMap and the routing-serving-certs Certificate are
removed. Knative registers that reconciler when any of these six network
settings is on -- four distinct
knobs (external-domain-tls, cluster-local-domain-tls, system-internal-tls,
namespace-wildcard-cert-selector) plus two legacy aliases (auto-tls,
internal-encryption) that map onto them -- and then hard-fails at startup
if the cert-manager CRDs are absent. Setting one here would otherwise be
silently inert, so fail the render naming the key. TLS terminates at the
Envoy gateway in this chart.

The six do not share a value type, so they are checked in two groups below.
Both compare the raw values entry, deliberately, and not what tpl would make
of it. configmap-network.yaml renders these through tpl, so a value written as
a template is refused here even where it would resolve to a supported off
value: hardcode the off value instead.

Resolving it here would mean two evaluations, one per file, which Helm cannot
share -- and a values template with side effects could then return an off value
to this guard and an on value to the ConfigMap. A loud refusal an operator can
work around beats a guard that can be lied to. Do not add tpl here.
*/}}
{{- $network := ((.Values.gateway).config).network | default dict -}}
{{/*
Five on/off switches. Knative parses them case-insensitively, so "disabled" is
as legitimately off as "Disabled"; compare lowercased or the guard rejects a
value that turns the feature off.
*/}}
{{- $tlsSwitches := list "external-domain-tls" "cluster-local-domain-tls" "system-internal-tls" "auto-tls" "internal-encryption" -}}
{{- range $key := $tlsSwitches }}
{{- $v := index $network $key }}
{{- if $v }}
{{- $off := lower (toString $v) }}
{{- if not (or (eq $off "disabled") (eq $off "false")) }}
{{- fail (printf "gateway.config.network.%s is set to %q, but this chart does not ship Knative TLS certificate provisioning: the config-certmanager ConfigMap and the routing-serving-certs Certificate are removed. TLS terminates at the Envoy gateway instead. Remove this setting, or hardcode \"Disabled\" if it is templated -- this guard reads the value as written." $key (toString $v)) }}
{{- end }}
{{- end }}
{{- end }}
{{/*
The sixth is not a switch. namespace-wildcard-cert-selector is a LabelSelector,
where empty disables the feature -- so "false" and "disabled" are not off here,
just selectors Knative cannot parse. Any non-empty value is refused.
*/}}
{{- $selector := index $network "namespace-wildcard-cert-selector" }}
{{- if $selector }}
{{- fail (printf "gateway.config.network.namespace-wildcard-cert-selector is set to %q, but this chart does not ship Knative TLS certificate provisioning: the config-certmanager ConfigMap and the routing-serving-certs Certificate are removed. TLS terminates at the Envoy gateway instead. This key takes a LabelSelector, not a switch: an empty value is what disables it, so anything else -- including a template, which this guard reads as written -- is refused. Remove this setting." (toString $selector)) }}
{{- end }}
{{- end }}
