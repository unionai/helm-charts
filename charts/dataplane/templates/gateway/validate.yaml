{{- /*
App serving at zero_trust.enabled: true is the vendored Knative Serving / Kourier stack under
templates/gateway/, and it cannot be scoped to a namespace. Three separate things about it
have no namespaced form: `controller` receives its entire grant through the aggregated
`knative-serving-admin`, and aggregationRule exists only on ClusterRole; `knative-serving-core`
needs namespaces, CRDs and both webhook configurations, which are cluster-scoped resources;
and the deployments take no watch-scope flag, so a namespaced Role would leave controller,
webhook and activator Ready and denied.

Refusing rather than dropping the stack is the point. Dropping it would leave `apps.enabled`
true with no backend: the operator would keep advertising app serving and keep its
serving.knative.dev grant, and every Knative Service it created would sit unreconciled with
nothing reporting why. That is the failure shape this chart writes guards to avoid, so the
combination is refused here and `zeroTrustApps.enabled` carries no low_privilege term.
*/ -}}
{{- if and .Values.zero_trust.enabled (include "apps.enabled" .) .Values.low_privilege }}
{{- fail "App serving at zero_trust.enabled: true requires low_privilege: false. The vendored Knative Serving / Kourier stack is 10 ClusterRoles and 4 ClusterRoleBindings with no namespaced form -- `controller` receives its whole grant through an aggregated ClusterRole, `knative-serving-core` needs namespaces, CRDs and the webhook configurations, and the deployments take no watch-scope flag -- so low_privilege cannot scope it, and this chart will not render it unscoped behind a flag that promises otherwise. Set low_privilege: false to run app serving, or apps.enabled: false to run the zero-trust dataplane (Envoy gateway, dataproxy, tunnel ingress) without it. See charts/dataplane/docs/rbac.md#app-serving." }}
{{- end }}
