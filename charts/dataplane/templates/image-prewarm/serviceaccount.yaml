{{- /*
The image pre-warm Job's identity. A hook like the Job, weighted to exist
before it: a regular resource wouldn't exist yet when a pre-install or
pre-upgrade hook runs. imagePrewarm.serviceAccount.annotations bind it to the
cloud identity that logs in to the mirror.
*/}}
{{- if and .Values.imagePrewarm.enabled .Values.global.imageMirrors }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-prewarm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: image-prewarm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- range $key, $value := .Values.imagePrewarm.serviceAccount.annotations }}
    {{ $key | quote }}: {{ tpl $value $ | quote }}
    {{- end }}
{{- end }}
