{{- if .Values.nodeobserver.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "nodeobserver.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
{{/*
Keyed on cluster scope, NOT on singleNamespace -- deliberate, do not "fix" for
consistency with the other components' RBAC. The rules below grant `nodes`,
which is a cluster-scoped resource: no namespaced Role can ever convey it, and
RBAC cannot scope it to "the node this pod runs on". Design spec 3.4 lists this
as escape hatch #1, genuinely unavoidable. Keying it on singleNamespace would
emit a Role under the default namespaces.enabled=false with low_privilege=false
and the grant would be silently inert (Forbidden at runtime).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "dataplane.clusterScopedRbacKind" . }}
metadata:
  name: union-nodeobserver
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "dataplane.clusterScopedRbacBindingKind" . }}
metadata:
  name: union-nodeobserver
subjects:
- kind: ServiceAccount
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: {{ include "dataplane.clusterScopedRbacKind" . }}
  apiGroup: rbac.authorization.k8s.io
  name: union-nodeobserver
{{- end }}
