{{- if .Values.nodeobserver.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "nodeobserver.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
{{/*
The rules below grant `nodes`, a cluster-scoped resource: no namespaced Role can
ever convey it, and RBAC cannot scope it to "the node this pod runs on". Design
spec 3.4 lists this as escape hatch #1, genuinely unavoidable, so nodeobserver
is only functional under low_privilege: false. dataplane.rbacKind guarantees
that -- it is keyed on low_privilege alone, so it yields ClusterRole for every
low_privilege: false install regardless of namespaces.enabled. Under
low_privilege: true the grant degrades to a namespaced Role along with every
other cluster-scoped object this chart would create.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "dataplane.rbacKind" . }}
metadata:
  name: union-nodeobserver
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "dataplane.rbacBindingKind" . }}
metadata:
  name: union-nodeobserver
subjects:
- kind: ServiceAccount
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: {{ include "dataplane.rbacKind" . }}
  apiGroup: rbac.authorization.k8s.io
  name: union-nodeobserver
{{- end }}
