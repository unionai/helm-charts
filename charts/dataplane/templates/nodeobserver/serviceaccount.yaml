{{- if .Values.nodeobserver.enabled }}
{{- if .Values.low_privilege }}
{{- fail "nodeobserver.enabled requires low_privilege: false. nodeobserver's entire function is watching and updating `nodes`, a cluster-scoped resource: no namespaced Role can convey it, and RBAC cannot scope it to \"the node this pod runs on\". Under low_privilege the component would install cleanly and fail on its first node write. Set low_privilege: false, or set nodeobserver.enabled: false." }}
{{- end }}
{{- if not .Values.rbac.clusterWideBindings }}
{{- fail "nodeobserver.enabled requires rbac.clusterWideBindings: true. nodeobserver lists pods with an empty namespace plus a spec.nodeName field selector, which Kubernetes authorizes as a cluster-scope check -- no number of per-namespace RoleBindings can satisfy it, and the call fails with 403 rather than returning a filtered subset. The pods it actually reads live in the release namespace, so this is a property of the query shape rather than of the data, but the chart cannot change that. Set rbac.clusterWideBindings: true, or set nodeobserver.enabled: false." }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "nodeobserver.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{/*
Only reachable at low_privilege: false -- the guard at the top of this file
fails the render otherwise. `nodes` is cluster-scoped and RBAC cannot scope it
to "the node this pod runs on", so there is no namespaced form of this grant.
Design spec 3.4 lists this as escape hatch #1, genuinely unavoidable; gating
framework case 2 (see the RBAC scope-split spec, section 6).
*/}}
{{- define "dataplane.rbac.buckets.nodeobserver" -}}
ns-read:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
ns-write: []
cluster-read:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
cluster-write:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [update]
{{- end -}}
