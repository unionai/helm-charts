{{- if .Values.nodeobserver.enabled }}
{{- if .Values.low_privilege }}
{{- fail "nodeobserver.enabled: true requires low_privilege: false. nodeobserver's whole job is reading and updating nodes, a cluster-scoped resource that no namespaced Role can grant, so under low_privilege it installs cleanly and then fails on its first node write. Set low_privilege: false, or set nodeobserver.enabled: false." }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "nodeobserver.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.nodeobserver" -}}
{{/* `pods` is namespaced but sits in this slot: nodeobserver lists pods with an
empty namespace plus a spec.nodeName field selector, which Kubernetes checks as a
cluster-scoped request. */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
cluster-read:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
cluster-write:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [update]
{{- end -}}
