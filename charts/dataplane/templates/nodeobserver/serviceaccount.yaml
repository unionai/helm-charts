{{- if .Values.nodeobserver.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "nodeobserver.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.nodeobserver" -}}
{{/* `pods` is namespaced but sits in a cluster slot rather than a work-ns one:
nodeobserver lists pods with an empty namespace plus a spec.nodeName field
selector, which Kubernetes authorizes as a cluster-scoped request, so no number
of per-namespace RoleBindings can satisfy it. cluster-read is the slot that
holds in both privilege modes -- it emits a ClusterRole and a
ClusterRoleBinding either way, whereas work-ns-cluster-read renders empty under
low_privilege, and this list is not optional there. At full privilege the two
slots are equivalent for this rule. */}}
cluster-read:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
cluster-write:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [update]
{{- end -}}
