{{- if .Values.nodeobserver.enabled }}
{{- if .Values.low_privilege }}
{{- fail "nodeobserver.enabled requires low_privilege: false. nodeobserver's entire function is watching and updating `nodes`, a cluster-scoped resource: no namespaced Role can convey it, and RBAC cannot scope it to \"the node this pod runs on\". Under low_privilege the component would install cleanly and fail on its first node write. Set low_privilege: false, or set nodeobserver.enabled: false." }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "nodeobserver.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.nodeobserver" -}}
{{/*
`pods` is a namespaced resource but belongs in work-ns-read-unscoped, and the
exception is deliberate. The axis is the scope at which a grant must be
AUTHORIZED, not the scope of the resource type: nodeobserver lists pods with an
empty namespace plus a spec.nodeName field selector, which Kubernetes evaluates
as a cluster-scope attribute check. No number of per-namespace RoleBindings
satisfies it -- the call returns 403 rather than a filtered subset.

Narrowing it means changing nodeobserver to list per-namespace, not moving the
rule.
*/}}
work-ns-read-unscoped:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
cluster-read:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
cluster-write:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [update]
{{- end -}}
