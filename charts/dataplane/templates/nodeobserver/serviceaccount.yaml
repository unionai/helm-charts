{{- if .Values.nodeobserver.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "nodeobserver.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.nodeobserver" -}}
cluster-read:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  # The node's pods, listed with an empty namespace and a spec.nodeName field
  # selector, which the API server authorizes at cluster scope.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
# Removes a startup taint from the node the pod runs on. RBAC cannot pin a rule
# to the caller's own node, so the update is unpinned.
cluster-write:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [update]
{{- end -}}
