{{- if .Values.nodeobserver.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "nodeobserver.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.nodeobserver" -}}
{{/*
Both slots are cluster slots, in both privilege modes, and neither is a
narrowing this chart can make.

nodes is cluster-scoped, so a namespaced Role can never convey it. The Role the
release emitted under low_privilege carried the rule and granted nothing by it.

pods looks namespaced but is not, as nodeobserver asks for it: it lists pods
with an empty namespace and a spec.nodeName field selector, which the API server
authorizes as a cluster-scoped request, so no number of per-namespace
RoleBindings can satisfy it.

cluster-read rather than work-ns-cluster-read for the same reason work-ns does
not fit: work-ns-cluster-read renders empty under low_privilege, where this list
is not optional. At full privilege the two slots produce the same object.
*/}}
cluster-read:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
cluster-write:
{{/*
Carried forward from the role this replaces, unchanged. Split out of the read
slot so the one write in the component's grant is visible as a write rather than
buried in a combined verb list on the same resource.
*/}}
  - apiGroups: [""]
    resources: [nodes]
    verbs: [update]
{{- end -}}
