{{- if .Values.nodeobserver.enabled }}
{{- if .Values.low_privilege }}
{{- fail "nodeobserver.enabled requires low_privilege: false. nodeobserver's entire function is watching and updating `nodes`, a cluster-scoped resource: no namespaced Role can convey it, and RBAC cannot scope it to \"the node this pod runs on\". Under low_privilege the component would install cleanly and fail on its first node write. Set low_privilege: false, or set nodeobserver.enabled: false." }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "nodeobserver.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
---
{{/*
The rules below grant `nodes`, a cluster-scoped resource: no namespaced Role can
ever convey it, and RBAC cannot scope it to "the node this pod runs on". Design
spec 3.4 lists this as escape hatch #1, genuinely unavoidable.

This file therefore only renders under low_privilege: false -- the guard above
fails the render otherwise. Gating framework case 2 (see the RBAC scope-split
spec, section 6): the component still has a job under low_privilege, and that
job cannot be done without cluster scope, so the honest outcome is a template
error rather than a green install that dies on first use.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "dataplane.rbacKind" . }}
metadata:
  name: union-nodeobserver
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "dataplane.rbacBindingKind" . }}
metadata:
  name: union-nodeobserver
subjects:
- kind: ServiceAccount
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: {{ include "dataplane.rbacKind" . }}
  apiGroup: rbac.authorization.k8s.io
  name: union-nodeobserver
{{- end }}
