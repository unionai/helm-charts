{{- if .Values.nodeobserver.enabled }}
{{- if .Values.low_privilege }}
{{- fail "nodeobserver.enabled requires low_privilege: false. nodeobserver's entire function is watching and updating `nodes`, a cluster-scoped resource: no namespaced Role can convey it, and RBAC cannot scope it to \"the node this pod runs on\". Under low_privilege the component would install cleanly and fail on its first node write. Set low_privilege: false, or set nodeobserver.enabled: false." }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodeobserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "nodeobserver.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{/*
Only reachable at low_privilege: false -- the guard at the top of this file
fails the render otherwise. `nodes` is cluster-scoped and RBAC cannot scope it
to "the node this pod runs on", so there is no namespaced form of this grant.
Design spec 3.4 lists this as escape hatch #1, genuinely unavoidable; gating
framework case 2 (see the RBAC scope-split spec, section 6).
*/}}
{{- define "dataplane.rbac.buckets.nodeobserver" -}}
ns-read: []
ns-write: []
{{/*
`pods` is a namespaced resource but belongs in cluster-read, and the exception is
deliberate. The bucket axis is the scope at which the grant must be AUTHORIZED,
not the scope of the resource type: nodeobserver lists pods with an empty
namespace plus a spec.nodeName field selector, which Kubernetes evaluates as a
cluster-scope attribute check. No number of per-namespace RoleBindings satisfies
it -- the call returns 403 rather than a filtered subset -- and this chart binds
ns-* roles only per namespace. Putting the rule here is what gets it a
ClusterRole plus a ClusterRoleBinding, which is the only shape that works.

The pods it actually reads live in the release namespace, so this is a property
of how the query is written rather than of the data it needs. Narrowing it means
changing nodeobserver to list per-namespace, not moving this rule back.
*/}}
cluster-read:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
cluster-write:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [update]
{{- end -}}
