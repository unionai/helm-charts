{{- define "imagebuilder.buildkit.pdb" -}}
{{- if and (include "imagebuilder.buildkit.enabled" .) (gt (.Values.imageBuilder.buildkit.replicaCount | int) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    {{- include "imagebuilder.buildkit.workloadLabels" . | nindent 4 }}
  name: {{ include "imagebuilder.buildkit.workloadName" . }}
spec:
  selector:
    matchLabels:
      {{- include "imagebuilder.buildkit.workloadSelectorLabels" . | nindent 6 }}
  minAvailable: {{ .Values.imageBuilder.buildkit.pdb.minAvailable }}
{{- end }}
{{- end -}}

{{- include "imagebuilder.buildkit.pdb" . }}
{{- if and (include "imagebuilder.buildkit.enabled" .) (.Values.imageBuilder.buildkit.arm | default dict).enabled }}
{{- $arm := include "imagebuilder.buildkit.pdb" (merge (dict "buildkitArm" true) .) }}
{{- if $arm }}
---
{{ $arm }}
{{- end }}
{{- end -}}
