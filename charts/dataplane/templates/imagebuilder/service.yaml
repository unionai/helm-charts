{{- define "imagebuilder.buildkit.service" -}}
{{- if (include "imagebuilder.buildkit.enabled" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "imagebuilder.buildkit.workloadName" . }}
  labels:
    {{- include "imagebuilder.buildkit.workloadLabels" . | nindent 4 }}
  {{- if not .buildkitArm }}
  {{- with .Values.imageBuilder.buildkit.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- if .buildkitArm }}
  type: ClusterIP
  {{- else }}
  type: {{ .Values.imageBuilder.buildkit.service.type }}
  {{- if .Values.imageBuilder.buildkit.service.loadbalancerIp }}
  loadBalancerIP: {{ .Values.imageBuilder.buildkit.service.loadbalancerIp | quote }}
  {{- end }}
  {{- end }}
  ports:
    - port: {{ .Values.imageBuilder.buildkit.service.port }}
      targetPort: tcp
      protocol: TCP
      name: tcp
  selector:
    {{- include "imagebuilder.buildkit.workloadSelectorLabels" . | nindent 4 }}
{{- end }}
{{- end -}}

{{- include "imagebuilder.buildkit.service" . }}
{{- if and (include "imagebuilder.buildkit.enabled" .) (.Values.imageBuilder.buildkit.arm | default dict).enabled }}
{{- $arm := include "imagebuilder.buildkit.service" (merge (dict "buildkitArm" true) .) }}
{{- if $arm }}
---
{{ $arm }}
{{- end }}
{{- end -}}
