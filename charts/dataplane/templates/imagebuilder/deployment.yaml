{{- define "imagebuilder.buildkit.deployment" -}}
{{- if (include "imagebuilder.buildkit.enabled" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "imagebuilder.buildkit.workloadName" . }}
  labels:
    {{- include "imagebuilder.buildkit.workloadLabels" . | nindent 4 }}
spec:
  strategy:
    type: {{ .Values.imageBuilder.buildkit.deploymentStrategy }}
  {{- if not .Values.imageBuilder.buildkit.autoscaling.enabled }}
  replicas: {{ .Values.imageBuilder.buildkit.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "imagebuilder.buildkit.workloadSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.imageBuilder.buildkit.rootless .Values.imageBuilder.buildkit.podAnnotations (and .Values.imageBuilder.buildkit.openShift.enabled .Values.imageBuilder.buildkit.openShift.securityContextConstraints.pinRequiredSCC) }}
      annotations:
        {{- if .Values.imageBuilder.buildkit.rootless }}
        container.apparmor.security.beta.kubernetes.io/buildkit: unconfined
        {{- end }}
        {{- if and .Values.imageBuilder.buildkit.openShift.enabled .Values.imageBuilder.buildkit.openShift.securityContextConstraints.pinRequiredSCC }}
        openshift.io/required-scc: {{ include "imagebuilder.buildkit.openShiftSccName" . | quote }}
        {{- end }}
        {{- with .Values.imageBuilder.buildkit.podAnnotations }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        platform.union.ai/zone: "dataplane"
        {{- include "imagebuilder.buildkit.workloadSelectorLabels" . | nindent 8 }}
    spec:
      {{- if hasKey .Values.imageBuilder.buildkit "hostUsers" }}
      hostUsers: {{ .Values.imageBuilder.buildkit.hostUsers }}
      {{- end }}
      serviceAccountName: {{ include "buildkit.serviceAccountName" . | quote }}
      {{- $pc := .Values.imageBuilder.buildkit.persistentCache }}
      {{- if $pc.enabled }}
      {{- if .Values.imageBuilder.buildkit.rootless }}
      {{- fail "imageBuilder.buildkit.persistentCache needs the privileged buildkit shape: set rootless: false" }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $pc.terminationGracePeriodSeconds }}
      initContainers:
        # A native sidecar (restartPolicy: Always): Kubernetes starts buildkit
        # only once its startupProbe passes -- the cache is mounted -- and
        # stops it only after buildkit has exited, so the final commit sees
        # a quiet filesystem.
        - name: volume-cache
          image: "{{ required "imageBuilder.buildkit.persistentCache.image.repository is required" $pc.image.repository }}:{{ $pc.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $pc.image.pullPolicy }}
          restartPolicy: Always
          args:
            - --name
            - {{ include "imagebuilder.buildkit.workloadName" . | quote }}
            - --bucket
            - {{ required "imageBuilder.buildkit.persistentCache.bucket is required" $pc.bucket | quote }}
            - --pointer
            {{- /* Per workload: the ARM builder (imageBuilder.buildkit.arm) keeps its own
            cache and pointer, or each architecture would fork the other's state. */}}
            {{- $defaultPointer := printf "%s/%s/LATEST" (trimSuffix "/" $pc.bucket) (include "imagebuilder.buildkit.workloadName" .) }}
            - {{ (ternary $pc.armPointer $pc.pointer (not (not .buildkitArm))) | default $defaultPointer | quote }}
            - --mount-at
            - /var/lib/buildkit-cache/state
            - --size
            - {{ $pc.size | quote }}
            {{- with $pc.maxSize }}
            - --max-size
            - {{ . | quote }}
            {{- end }}
            - --grow-at
            - {{ $pc.growAt | quote }}
            - --commit-every
            - {{ $pc.commitEvery | quote }}
            - --ready-file
            - /run/volume-cache/ready
            # FUSE passthrough staging must not sit on a stacked filesystem
            # (the container's overlay root): the kernel refuses its backing
            # files there and every write falls back to the slow daemon path.
            - --staging-dir
            - /var/lib/volume-cache-staging
          startupProbe:
            exec:
              command: ["test", "-f", "/run/volume-cache/ready"]
            periodSeconds: 2
            failureThreshold: 300
          securityContext:
            privileged: true
          volumeMounts:
            - name: volume-cache-mnt
              mountPath: /var/lib/buildkit-cache
              mountPropagation: Bidirectional
            - name: volume-cache-run
              mountPath: /run/volume-cache
            - name: volume-cache-staging
              mountPath: /var/lib/volume-cache-staging
          resources:
            {{- toYaml $pc.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: "buildkit"
          image: {{ include "imagebuilder.buildkit.image" . | quote }}
          imagePullPolicy: {{ .Values.imageBuilder.buildkit.image.pullPolicy }}
          env:
            {{- include "global.podEnvVars" . | nindent 12 }}
            {{- with .Values.imageBuilder.buildkit.podEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
          {{- if .Values.imageBuilder.buildkit.rootless }}
            - mountPath: /home/user/.local/share/buildkit
              name: buildkitd
          {{- end }}
            - mountPath: /etc/buildkit
              name: buildkit-config
          {{- if $pc.enabled }}
            - mountPath: /var/lib/buildkit-cache
              name: volume-cache-mnt
              mountPropagation: HostToContainer
          {{- end }}
          {{- with .Values.imageBuilder.buildkit.additionalVolumeMounts -}}
          {{ tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          args:
            - --config
            - /etc/buildkit/buildkitd.toml
            - --addr
            - unix:///run/{{ .Values.imageBuilder.buildkit.rootless | ternary "user/1000" ""}}/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
          {{- if $pc.enabled }}
            - --root
            - /var/lib/buildkit-cache/state/buildkit
          {{- end }}
          {{- if .Values.imageBuilder.buildkit.rootless }}
            - --oci-worker-no-process-sandbox
          {{- end }}
          ports:
            - name: tcp
              containerPort: 1234
              protocol: TCP
          readinessProbe:
            exec:
              command:
              - buildctl
              - debug
              - workers
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec:
              command:
              - buildctl
              - debug
              - workers
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
          {{- if .Values.imageBuilder.buildkit.securityContext }}
            {{- toYaml .Values.imageBuilder.buildkit.securityContext | nindent 12 }}
          {{- else if .Values.imageBuilder.buildkit.rootless }}
            seccompProfile: # Needs Kubernetes >= 1.19
              type: Unconfined
            runAsUser: 1000
            runAsGroup: 1000
            {{- if .Values.imageBuilder.buildkit.openShift.enabled }}
            allowPrivilegeEscalation: true
            {{- end }}
          {{- else }}
            privileged: true
          {{- end }}
          resources:
            {{- toYaml .Values.imageBuilder.buildkit.resources | nindent 12 }}
      volumes:
      {{- if .Values.imageBuilder.buildkit.rootless }}
      - name: buildkitd
        emptyDir: {}
      {{- end }}
      - configMap:
          name: {{ include "imagebuilder.buildkit.fullname" . }}
        name: buildkit-config
      {{- if $pc.enabled }}
      - name: volume-cache-mnt
        emptyDir: {}
      - name: volume-cache-run
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: volume-cache-staging
        emptyDir: {}
      {{- end }}
      {{- with .Values.imageBuilder.buildkit.additionalVolumes -}}
      {{ tpl (toYaml .) $ | nindent 6 }}
      {{- end }}
      {{- $nodeSelector := deepCopy .Values.imageBuilder.buildkit.nodeSelector }}
      {{- if .buildkitArm }}
      {{- $nodeSelector = mergeOverwrite $nodeSelector (.Values.imageBuilder.buildkit.arm.nodeSelector | default dict) (dict "kubernetes.io/arch" "arm64") }}
      {{- else if or (.Values.imageBuilder.buildkit.arm | default dict).enabled .Values.imageBuilder.buildkitUriArm }}
      {{- $_ := set $nodeSelector "kubernetes.io/arch" "amd64" }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                {{- include "imagebuilder.buildkit.workloadSelectorLabels" . | nindent 16 }}
            topologyKey: "kubernetes.io/hostname"
      {{- $tolerations := .Values.imageBuilder.buildkit.tolerations }}
      {{- if .buildkitArm }}
      {{- $tolerations = concat $tolerations (.Values.imageBuilder.buildkit.arm.tolerations | default list) (list (dict "key" "kubernetes.io/arch" "operator" "Equal" "value" "arm64" "effect" "NoSchedule")) }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
{{- end -}}

{{- include "imagebuilder.buildkit.deployment" . }}
{{- if and (include "imagebuilder.buildkit.enabled" .) (.Values.imageBuilder.buildkit.arm | default dict).enabled }}
{{- $arm := include "imagebuilder.buildkit.deployment" (merge (dict "buildkitArm" true) .) }}
{{- if $arm }}
---
{{ $arm }}
{{- end }}
{{- end -}}
