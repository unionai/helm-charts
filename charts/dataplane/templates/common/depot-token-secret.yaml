{{- /*
helm.sh/resource-policy: keep leaves the Secret, and the credentials added to it
by hand, in place when imageBuilder.depot.createSecret is switched to false or
the release is uninstalled.
*/}}
{{- if and (include "operator.enableDepot" .) .Values.imageBuilder.depot.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: depot-token
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{}}` | b64enc }}
{{- end }}
