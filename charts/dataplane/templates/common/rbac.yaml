{{/*
Emits every union component's RBAC from the slots each component declares.

Pooled slots produce ONE object holding the union of every enabled declarer's
rules, bound to every declarer's ServiceAccount. Per-component slots produce
one object per declarer. Which is which is decided in dataplane.rbac.slotSpec,
by the pooling rule: pooled if conveyed by a RoleBinding, per-component if
conveyed by a ClusterRoleBinding.

Rule DEFINITIONS stay per-component (dataplane.rbac.slots.*) even where the
OBJECT is shared, so "does this component need cluster scope" and "what did
this component actually ask for" both stay answerable from the source.

A pooled slot's contents are the union of only its ENABLED contributors, which
is what lets a dataplane running operator + proxy + webhook -- without the
executor or propeller and their resource wildcards -- get a genuinely narrow
work-ns role rather than one covering every apiGroup and resource.
*/}}
{{- $ctx := . -}}
{{- if and .Values.namespaces.enabled (has .Release.Namespace (.Values.namespaces.static | default list)) -}}
{{- fail (printf "namespaces.static must not contain the release namespace (%q). work-ns would then be bound in the components namespace, silently collapsing the split this model exists to create -- union components would regain write access to union's own Deployments and Secrets with nothing in the render to show it." .Release.Namespace) -}}
{{- end -}}
{{- if and .Values.namespaces.enabled (not .Values.namespaces.static) (not (include "singleNamespace" .)) -}}
{{- fail "namespaces.enabled: true requires a non-empty namespaces.static. With an empty list the chart emits no work-namespace RoleBindings and clusterresourcesync gets no cluster grant either, so nothing can reach any work namespace -- a render that looks clean and fails at first task execution. Populate namespaces.static, or set namespaces.enabled: false to use the runtime posture." -}}
{{- end -}}
{{- $spec := fromYaml (include "dataplane.rbac.slotSpec" .) -}}
{{- $components := fromYamlArray (include "dataplane.rbac.components" .) -}}
{{- range $slot := fromYamlArray (include "dataplane.rbac.slotOrder" .) -}}
{{- $slotSpec := index $spec $slot -}}
{{- if $slotSpec.pooled -}}
{{/*
`uniq` drops rules two components declare identically (executor's and
leaseworker's wildcards are byte-identical). RBAC unions a role's rules, so
this changes nothing an API server would decide -- it only keeps the rendered
role readable.
*/}}
{{- $rules := list -}}
{{- range $c := $components -}}
{{- $decl := fromYaml (include (printf "dataplane.rbac.slots.%s" $c.name) $ctx) -}}
{{- $rules = concat $rules (index $decl $slot | default list) -}}
{{- end -}}
{{- include "dataplane.rbac.emitSlot" (dict
      "ctx" $ctx
      "slot" $slot
      "rules" ($rules | uniq)
      "component" ""
      "subjects" (fromYamlArray (include "dataplane.rbac.slotSubjects" (dict "ctx" $ctx "slot" $slot)))) }}
{{- else -}}
{{- range $c := $components -}}
{{- $decl := fromYaml (include (printf "dataplane.rbac.slots.%s" $c.name) $ctx) -}}
{{- $rules := index $decl $slot | default list -}}
{{- $extraRules := list -}}
{{- if and (eq $slot "cluster-write") (eq $c.name "clusterresourcesync") -}}
{{/*
The bind rule is handed to emitSlot as extraRules, not concatenated into
$rules, and only for clusterresourcesync's cluster-write role. See
dataplane.rbac.provisionerBindRule. Declared rules -- chart-derived and, since
Task 11, operator-supplied via clusterresourcesync.clusterRoleRules -- are
validated with no `bind` exemption of any kind; extraRules is appended by
emitSlot only after that validation has already run, so this is the ONLY
place a `bind` rule can enter the slot, and nothing read from .Values can
reach this variable.
*/}}
{{- $extraRules = fromYamlArray (include "dataplane.rbac.provisionerBindRule" $ctx) | default list -}}
{{- end -}}
{{- include "dataplane.rbac.emitSlot" (dict
      "ctx" $ctx
      "slot" $slot
      "rules" $rules
      "extraRules" $extraRules
      "component" $c.name
      "subjects" (list $c.sa)) }}
{{- end -}}
{{- end -}}
{{- end -}}
