{{- $ctx := . -}}
{{- if not (include "singleNamespace" .) -}}
{{- if and .Values.namespaces.enabled (has .Release.Namespace (.Values.namespaces.static | default list)) -}}
{{- fail (printf "namespaces.static must not contain the release namespace (%q). The chart would bind the work-ns role in the release namespace, where union's own components run, so those components would get write access to union's own Deployments and Secrets, with nothing in the render to show it. Remove the release namespace from namespaces.static and list only work namespaces." .Release.Namespace) -}}
{{- end -}}
{{- if and .Values.namespaces.enabled (not .Values.namespaces.static) -}}
{{- fail "namespaces.enabled: true requires a non-empty namespaces.static. With an empty list the chart pre-seeds no work namespaces and creates no work-namespace RoleBindings, so no union component can reach any work namespace: the render looks clean and every task fails at first execution. List your work namespaces in namespaces.static, or set namespaces.enabled: false to have work namespaces and their bindings created as projects are registered." -}}
{{- end -}}
{{- end -}}
{{- $spec := fromYaml (include "dataplane.rbac.slotSpec" .) -}}
{{- $components := fromYamlArray (include "dataplane.rbac.components" .) -}}
{{- $known := fromYamlArray (include "dataplane.rbac.slotOrder" .) -}}
{{- range $c := $components -}}
{{- $decl := fromYaml (include (printf "dataplane.rbac.slots.%s" $c.name) $ctx) -}}
{{- range $k, $v := $decl -}}
{{- if not (has $k $known) -}}
{{- fail (printf "Component %q declares RBAC slot %q, which does not exist. Known slots: %v. An unrecognised key is silently ignored, so the component would render with fewer permissions than intended and no error." $c.name $k $known) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $slot := fromYamlArray (include "dataplane.rbac.slotOrder" .) -}}
{{- $slotSpec := index $spec $slot -}}
{{- if $slotSpec.pooled -}}
{{- $rules := list -}}
{{- range $c := $components -}}
{{- $decl := fromYaml (include (printf "dataplane.rbac.slots.%s" $c.name) $ctx) -}}
{{- $rules = concat $rules (index $decl $slot | default list) -}}
{{- end -}}
{{- include "dataplane.rbac.emitSlot" (dict
      "ctx" $ctx
      "slot" $slot
      "rules" ($rules | uniq)
      "component" ""
      "subjects" (fromYamlArray (include "dataplane.rbac.slotSubjects" (dict "ctx" $ctx "slot" $slot)))) }}
{{- else -}}
{{- range $c := $components -}}
{{- $decl := fromYaml (include (printf "dataplane.rbac.slots.%s" $c.name) $ctx) -}}
{{- $rules := index $decl $slot | default list -}}
{{- include "dataplane.rbac.emitSlot" (dict
      "ctx" $ctx
      "slot" $slot
      "rules" $rules
      "component" $c.name
      "subjects" (list $c.sa)) }}
{{- end -}}
{{- end -}}
{{- end -}}
