{{- if or (include "singleNamespace" .) (include "operator.enableDepot" .) .Values.taskPodTemplate.nodeSelector .Values.taskPodTemplate.affinity .Values.taskPodTemplate.tolerations }}
apiVersion: v1
kind: PodTemplate
metadata:
  name: task-template
  namespace: {{ .Release.Namespace }}
template:
  spec:
{{- if include "singleNamespace" . }}
    serviceAccountName: union
{{- end }}
{{- if include "operator.enableDepot" . }}
    imagePullSecrets:
      - name: depot-token
{{- end }}
    containers:
      - name: default
        image: docker.io/rwgrim/docker-noop
{{- if include "storage.taskCredentialsFromPodTemplate" . }}
{{- $ref := .Values.storage.credentialsSecretRef }}
        # The object store's keys, read from the Secret at pod start rather than
        # copied into the task config (storage.taskCredentialsFromPodTemplate).
        env:
          - name: FLYTE_AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: {{ $ref.name | quote }}
                key: {{ $ref.accessKeyIdKey | default "access_key_id" | quote }}
          - name: FLYTE_AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ $ref.name | quote }}
                key: {{ $ref.secretKeyKey | default "secret_key" | quote }}
{{- end }}
{{- with .Values.taskPodTemplate.workingDir }}
        workingDir: {{ . | quote }}
{{- end }}
{{- with .Values.taskPodTemplate.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
{{- end }}
{{- with .Values.taskPodTemplate.affinity }}
    affinity:
      {{- toYaml . | nindent 6 }}
{{- end }}
{{- with .Values.taskPodTemplate.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
{{- end }}
{{- end }}
