{{- if and .Values.namespaces.enabled .Values.namespaces.create (not (include "singleNamespace" .)) }}
{{/*
Pre-seeded task namespaces, driven by .Values.namespaces.static. Only the
statically-known set; clusterresourcesync creates further namespaces at runtime
as projects are registered, and those cannot appear here.
*/}}
{{/*
helm.sh/resource-policy: keep makes `helm uninstall` leave these Namespaces in
place. Without it, uninstall deletes the namespace and cascades to everything
inside it: task pods, Secrets, PVCs, ResourceQuotas, including objects
clusterresourcesync created at runtime. The cost is that uninstall leaves
namespaces behind for an operator who did want them cleaned up, which one
kubectl delete recovers; the reverse does not.

Verified on k3s 1.35: uninstall leaves the Namespace and its Helm ownership
metadata, so reinstalling under the same release name adopts it cleanly.
Reinstalling under a different release name fails with "invalid ownership
metadata"; renaming the release requires transferring ownership first (see
RELEASE.md), not deleting the namespaces.

Operators whose namespaces are created elsewhere should set
namespaces.create: false rather than handing Helm a Namespace to adopt.
*/}}
{{- range $ns := .Values.namespaces.static }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
{{- end }}