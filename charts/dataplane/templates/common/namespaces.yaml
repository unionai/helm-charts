{{- if hasKey .Values.namespaces "enabled" }}
{{- fail "namespaces.enabled has been renamed to namespaces.create. Setting the old key is silently ignored by Helm (unknown values keys are not an error), which would leave you believing namespace pre-seeding and binding are configured when they are not. Rename namespaces.enabled to namespaces.create in your values -- the meaning is unchanged, but it now also gates whether union roles are bound into taskNamespaces (see _rbac.tpl and RELEASE.md)." }}
{{- end }}
{{- if and .Values.namespaces.create (not (include "singleNamespace" .)) }}
{{/*
Pre-seeded task namespaces. This list was hardcoded to six names; it is now
driven by .Values.taskNamespaces, whose default is those same six, so existing
renders are unchanged.

This is only the statically-known set. clusterresourcesync creates additional
namespaces at runtime as projects are registered, and those cannot appear here.
*/}}
{{- range $ns := .Values.taskNamespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
{{- end }}
{{- end }}