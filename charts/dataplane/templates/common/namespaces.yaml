{{- if and .Values.namespaces.enabled (not (include "singleNamespace" .)) }}
{{- range $ns := .Values.namespaces.static }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  {{- with $.Values.namespaces.labels }}
  labels:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with $.Values.namespaces.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}