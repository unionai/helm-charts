{{- /*
The one cluster-scoped read a scoped ingress-nginx controller still needs.

At rbac.scope: true the subchart gives the controller a namespaced Role that names
`ingressclasses`. IngressClass is cluster-scoped, so that rule never matches. The controller
does not crash -- it logs "No permissions to list and get Ingress Classes", comes up Ready,
and then ignores every Ingress that sets spec.ingressClassName, which is every Ingress this
chart renders. Ready pod, green sync, silent 404s.

This grants `ingressclasses` and nothing else -- not the secrets, configmaps, pods, endpoints
or nodes that scoping exists to take away. Unscoped, the subchart's own ClusterRole already
covers it, so nothing renders here.
*/ -}}
{{- $nginx := index .Values "ingress-nginx" }}
{{- /* hasKey, not `| default true`: that reads a literal false as unset. */ -}}
{{- $rbac := ($nginx.rbac) | default dict }}
{{- $rbacCreate := or (not (hasKey $rbac "create")) $rbac.create }}
{{- if and $nginx.enabled $rbacCreate $rbac.scope }}

{{- /* Name, ServiceAccount and namespace, derived the way the subchart derives them. */ -}}
{{- $fullname := "" }}
{{- if $nginx.fullnameOverride }}
{{- $fullname = $nginx.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $n := default "ingress-nginx" $nginx.nameOverride }}
{{- $fullname = ternary (.Release.Name | trunc 63 | trimSuffix "-") (printf "%s-%s" .Release.Name $n | trunc 63 | trimSuffix "-") (contains $n .Release.Name) }}
{{- end }}
{{- $saVals := ($nginx.serviceAccount) | default dict }}
{{- $saCreate := or (not (hasKey $saVals "create")) $saVals.create }}
{{- $sa := ternary (default $fullname $saVals.name) (default "default" $saVals.name) $saCreate }}
{{- $ns := default .Release.Namespace $nginx.namespaceOverride | trunc 63 | trimSuffix "-" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-ingressclass" $fullname | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-ingressclass" $fullname | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-ingressclass" $fullname | trunc 63 | trimSuffix "-" }}
{{- end }}
