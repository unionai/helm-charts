{{- /*
union-k8s-ro — a scale-to-zero, read-only `kubectl proxy` exposed as a Knative
Service on the apps wildcard domain. It lets Cally (/union-help) and on-call
engineers read live cluster state (pending pods, events, nodes, App container
logs) through the same edge that fronts app serving — authenticated by the
union-authn ext_authz filter and hard-pinned to the dataplane's owner org — so
no laptop kubeconfig / cloud-SSO drift is in the path.

Dark by default (systemApps.k8sProxy.enabled=false); opt-in per environment.
Requires the Knative Serving substrate (apps.enabled) since it is a KSVC, and
the kubernetes.podspec-serviceaccount feature flag so the revision can run under
the dedicated read-only ServiceAccount below (bound to a ClusterRole that omits
secrets and every mutate verb).
*/ -}}
{{- $k8s := (.Values.systemApps | default dict).k8sProxy | default dict -}}
{{- if and $k8s.enabled (include "apps.enabled" .) -}}
{{- $name := $k8s.subdomain | default "union-k8s-ro" -}}
{{- $img := $k8s.image | default dict -}}
{{- $repo := $img.repository | default "registry.k8s.io/kubectl" -}}
{{- $tag := $img.tag | default "v1.32.2" -}}
{{- /* Strip-auth sidecar: the union-apps edge authorizes the caller then passes the
       caller's Authorization bearer through to the backend (apps opt-in to token
       passthrough; there is no per-app strip knob today — see SYSTEM_APPS.md §6).
       kubectl proxy must instead reach the API server with its own read-only SA, so
       an nginx front clears Authorization before kubectl proxy (client-go then adds
       the SA token). */ -}}
{{- $strip := $k8s.authStripSidecar | default dict -}}
{{- $stripImg := $strip.image | default "nginxinc/nginx-unprivileged:1.27-alpine" -}}
{{- /* Apps wildcard base for the DomainMapping. NOT the CP host (which is the
       intracluster service name on selfhosted). Prefer an explicit
       systemApps.k8sProxy.appsDomain; else derive from the apps ingress host
       ("*.apps.<host>" → "apps.<host>"), which honors ingress.serving.hostOverride. */ -}}
{{- $appsDomain := tpl ($k8s.appsDomain | default "") . -}}
{{- if not $appsDomain -}}
{{- $appsDomain = trimPrefix "*." (include "ingress.serving.host" . | trim | trimAll "\"") -}}
{{- end -}}
{{- $host := printf "%s.%s" $name $appsDomain -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-app
    union.ai/system-app: {{ $name }}
{{- with $k8s.imagePullSecrets }}
imagePullSecrets:
{{ toYaml . | indent 2 }}
{{- end }}
---
{{- if $k8s.lowPrivilege }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-app
    union.ai/system-app: {{ $name }}
rules:
  # Namespace-scoped read only. Secrets and every mutate verb are excluded.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints", "configmaps", "resourcequotas", "limitranges", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "revisions", "routes", "configurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.internal.knative.dev"]
    resources: ["podautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-app
    union.ai/system-app: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "unionai-dataplane.fullname" . }}-{{ $name }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-app
    union.ai/system-app: {{ $name }}
rules:
  # Cluster-wide read only. Secrets and every mutate verb are excluded.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "namespaces", "services", "endpoints", "configmaps", "resourcequotas", "limitranges", "persistentvolumeclaims", "persistentvolumes", "replicationcontrollers", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools", "nodeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["karpenter.k8s.aws"]
    resources: ["ec2nodeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "revisions", "routes", "configurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.internal.knative.dev"]
    resources: ["podautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "unionai-dataplane.fullname" . }}-{{ $name }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-app
    union.ai/system-app: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "unionai-dataplane.fullname" . }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-authstrip
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-app
    union.ai/system-app: {{ $name }}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log off;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        location / {
          # The edge already authorized the caller; drop their Union bearer so
          # kubectl proxy authenticates to the API server with its own read-only SA.
          proxy_set_header Authorization "";
          proxy_pass http://127.0.0.1:8081;
          proxy_http_version 1.1;
        }
      }
    }
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unionai-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-app
    union.ai/system-app: {{ $name }}
  annotations:
    # Route + authorize through the standard app-serving edge (Union's net-kourier
    # fork + union-apps ext_authz filter), exactly like a Flyte App: the fork
    # programs an external-host route to this cluster-local ksvc, and the filter
    # authorizes callers against the dataplane owner org (empty project/domain =>
    # org-level check => cross-tenant callers are 403'd). No DomainMapping / no
    # public config-domain needed.
    serving.unionai.dev/external-hosts: {{ $host | quote }}
    serving.unionai.dev/app-id: {{ dict "name" $name "org" (tpl .Values.orgName .) | toJson | quote }}
    serving.unionai.dev/allow-anonymous: "false"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: {{ $k8s.minScale | default 0 | quote }}
        autoscaling.knative.dev/max-scale: {{ $k8s.maxScale | default 1 | quote }}
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      serviceAccountName: {{ $name }}
      volumes:
        - name: authstrip-config
          configMap:
            name: {{ $name }}-authstrip
        - name: tmp
          emptyDir: {}
      containers:
        # Ingress/serving container (Knative routes to the one with a port): strips
        # the caller's Authorization then forwards to kubectl proxy on localhost.
        - name: authstrip
          image: {{ $stripImg | quote }}
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: authstrip-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
        # Read-only kubectl proxy: bound to localhost, reached only via the sidecar.
        # Talks to the API server with the pod's read-only ServiceAccount (the
        # sidecar has removed the caller bearer, so client-go adds the SA token).
        - name: kubectl-proxy
          image: "{{ $repo }}:{{ $tag }}"
          imagePullPolicy: {{ $img.pullPolicy | default "IfNotPresent" }}
          command: ["kubectl"]
          args:
            - "proxy"
            - "--port=8081"
            - "--address=127.0.0.1"
            - "--accept-hosts=.*"
          {{- with $k8s.env }}
          env:
{{ toYaml . | indent 12 }}
          {{- end }}
          resources:
            {{- toYaml ($k8s.resources | default (dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "250m" "memory" "256Mi"))) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # registry.k8s.io/kubectl runs as root by default; pin a non-root uid
            # (kubectl proxy needs no root and binds a >1024 port).
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
{{- end }}
