{{- if and .Values.uvolMountBroker.enabled .Values.uvolMountBroker.priorityClass.create .Values.uvolMountBroker.priorityClassName (not .Values.low_privilege) }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.uvolMountBroker.priorityClassName }}
  labels:
    {{- include "uvolBroker.labels" . | nindent 4 }}
value: {{ .Values.uvolMountBroker.priorityClass.value | int }}
globalDefault: false
description: "Priority for the Union uvol mount broker (a node-critical CSI DaemonSet on the task Volume-mount path) so it schedules ahead of task pods and a node's broker is not evicted out from under pods that depend on it to mount Volumes. Uses a custom class rather than a reserved system class (e.g. system-node-critical), which GKE restricts to kube-system."
{{- end }}
