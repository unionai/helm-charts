{{- if .Values.uvolMountBroker.enabled }}
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ .Values.uvolMountBroker.driverName }}
  labels:
    {{- include "uvolBroker.labels" . | nindent 4 }}
spec:
  # Node-local ephemeral inline volumes only: the driver premounts a FUSE
  # channel per pod and hands the fd to the pod's unprivileged client. No
  # controller service, no attach/provision, no per-volume secrets — the
  # data plane authenticates in-pod with the pod's own identity.
  volumeLifecycleModes:
    - Ephemeral
  attachRequired: false
  podInfoOnMount: true
  storageCapacity: false
  fsGroupPolicy: None
{{- end }}
