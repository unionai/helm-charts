{{- if .Values.uvolMountBroker.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: union-uvol-broker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uvolBroker.labels" . | nindent 4 }}
data:
  broker.yaml: |
    uvolBroker:
      driverName: {{ .Values.uvolMountBroker.driverName }}
      kubeletDir: {{ .Values.uvolMountBroker.kubeletDir }}
      socketDir: {{ .Values.uvolMountBroker.socketDir }}
      stateDir: {{ .Values.uvolMountBroker.stateDir }}
      {{- if .Values.uvolMountBroker.nodeCache.enabled }}
      nodeCacheDir: {{ required "uvolMountBroker.nodeCache.hostPath is required when nodeCache is enabled" .Values.uvolMountBroker.nodeCache.hostPath }}
      {{- end }}
      {{- $block := .Values.uvolMountBroker.block | default dict }}
      {{- /* block.allow unset: every pod outside singleNamespace, and disabled under it;
             any list (even []) is used as given. The singleNamespace define returns
             "true" or "", and reads low_privilege as its alias. */}}
      {{- $allow := $block.allow }}
      {{- if kindIs "invalid" $allow }}
      {{- $allow = ternary (list (dict "namespace" "*")) (list) (empty (include "singleNamespace" .)) }}
      {{- end }}
      {{- if $allow }}
      blockAllow:
        {{- toYaml $allow | nindent 8 }}
      blockFreezeMax: {{ $block.freezeMax | default "60s" | quote }}
      {{- end }}
      metricsScope: "{{ .Values.uvolMountBroker.metricsScope }}"
      profilerPort: {{ .Values.uvolMountBroker.profilerPort }}
      {{- with .Values.uvolMountBroker.config }}
      {{- tpl (toYaml .) $ | nindent 6 }}
      {{- end }}
{{- end }}
