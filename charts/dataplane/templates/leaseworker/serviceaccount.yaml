{{- if .Values.leaseworker.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "leaseworker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leaseworker.labels" . | nindent 4 }}
  {{- with include "leaseworker.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

---
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.leaseworker" -}}
{{/*
Its leases are Union v2.Lease objects streamed from the control plane
(leaseworker/lease_tracker.go), not coordination.k8s.io Leases, so they need no
API access. endpoints is for the k8s:/// gRPC resolver's namespaced Endpoints
watch (leaseworker/action_handler.go:462, k8s_resolver.go:162), which is retried
with no backoff.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [endpoints]
work-ns:
  - apiGroups: ['*']
    resources: ['*']
{{/*
Re-declared from work-ns for where they must be authorized: at
low_privilege: false no limit namespace is set, so these caches watch every
namespace and a namespace-less list or watch is a cluster-scope check no
RoleBinding can satisfy (leaseworker/action_handler.go:464-474,
leaseworker/plugin/k8s/kube_manager.go:113-119).
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [podtemplates, pods]
    verbs: [list, watch]
{{- end -}}
