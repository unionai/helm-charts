{{- if .Values.leaseworker.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "leaseworker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leaseworker.labels" . | nindent 4 }}
  {{- with include "leaseworker.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

---
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.leaseworker" -}}
{{/*
One components-namespace grant, down from read and write on every apiGroup and
resource.

Its "leases" are Union protobuf v2.Lease objects streamed from the control
plane (leaseworker/lease_tracker.go), NOT Kubernetes coordination.k8s.io
Leases, so it needs no API access for them. Config and the auth secret are
volume mounts.

endpoints is the k8s:/// gRPC resolver, registered unconditionally at
leaseworker/action_handler.go:462. The chart's default connector endpoint is
k8s:///flyteconnector.<release namespace>:8000 (values.yaml) with
connector-service in enabled_plugins, so dialling it reaches
flyte2/flytestdlib/resolver/k8s_resolver.go:162 --
CoreV1().Endpoints(releaseNamespace).Watch() with a metadata.name field
selector, the resolver's only Kubernetes call. `watch` is the only verb it
needs; this slot's emitter-owned read set is a superset and costs nothing in
the release namespace.

The failure mode is why it is worth a rule rather than a note: the watcher runs
under wait.Until(r.run, 0, ctx.Done()) (k8s_resolver.go:107), a ZERO retry
period, so a Forbidden is a hot loop against the API server rather than a
backoff, and connector tasks never resolve. Only reachable at
low_privilege: false; under low_privilege the work-ns Role binds in the release
namespace and already covers it.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [endpoints]
work-ns:
  - apiGroups: ['*']
    resources: ['*']
{{/*
Same resources as the pooled work-ns role, re-declared for WHERE they must be
authorized. At low_privilege: false nothing sets a limit namespace, so both
caches below watch every namespace, and a namespace-less LIST or WATCH is a
cluster-scope authorization check that per-namespace RoleBindings cannot
satisfy. Enumerated explicitly -- work-ns's wildcards must not follow the grant
up to cluster scope.

podtemplates: the PodTemplate informer at leaseworker/action_handler.go:464-474
appends k8sInformers.WithNamespace only when GetLimitNamespace is non-empty;
its sync failure at :489-491 is a startup error.

pods: the manager cache at leaseworker/plugin/k8s/kube_manager.go:113-119
leaves DefaultNamespaces nil, and leaseworker/plugin/loader.go:92-99 registers
one watch per unique enabled-plugin ResourceToWatch. container and sidecar are
the only enabled ones and both watch a core v1 Pod; fastray's RayJob/RayCluster
watches are registered but the plugin is not enabled by this chart, so no Ray
informer exists and no Ray rule is needed.
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [podtemplates, pods]
    verbs: [list, watch]
{{- end -}}
