{{- if .Values.leaseworker.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "leaseworker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leaseworker.labels" . | nindent 4 }}
  {{- with include "leaseworker.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

---
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.leaseworker" -}}
{{/*
No coordination.k8s.io grant: leaseworker's leases are Union's own leases,
streamed from the control plane, not Kubernetes Leases. endpoints is for the
gRPC resolver's namespaced Endpoints watch, retried with no backoff.
No customresourcedefinitions rule, though the role this replaces carried one:
CRDs are cluster-scoped, so only a cluster slot can convey them, and this chart
installs the FlyteWorkflow CRD itself from crds/. Under singleNamespace the
namespaced Role that held it never conveyed it at all.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list, watch]
{{/*
The plugin wildcard, at the verbs the role this replaces carried: no
deletecollection, which that role never granted and nothing in this binary calls.
The rule stays a resource wildcard because the enabled plugin set decides what it
touches and the chart cannot see it.
*/}}
work-ns:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [get, list, watch, create, update, patch, delete]
{{/*
At singleNamespace: false no limit namespace is set, so these caches list and watch
across all namespaces, which no RoleBinding can authorize. The fast-task orphan
pod lists run there too. Under singleNamespace all of them run in the limit
namespace (cloud#18782), which work-ns covers.
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [podtemplates, pods]
    verbs: [list, watch]
{{/*
The shared event watcher that enriches task status with Kubernetes events
(leaseworker/plugin/k8s/event_watcher.go, NewEventWatcher). It is a raw client-go
informer that watches every namespace when no limit namespace is set.
LoadK8sPlugins (leaseworker/plugin/loader.go) starts it unconditionally, since
the clientset it needs always exists. It is best-effort: a refused watch leaves
event enrichment silently empty rather than blocking startup.

Under singleNamespace this slot renders nothing. The informer takes the limit
namespace there (informers.WithNamespace, cloud#18782), so the work-ns Role
covers it. A leaseworker image without that change still watches every
namespace in that mode and is refused, since a cluster-wide events read is not
on the allowlist.
*/}}
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [list, watch]
{{- with fromYamlArray (include "dataplane.rbac.taskPluginClusterReadRules" .) }}
{{/* Operator-supplied plugin CRD reads. See taskPluginClusterReadRules in
values.yaml. */}}
{{ toYaml . | indent 2 }}
{{- end }}
{{- end -}}
