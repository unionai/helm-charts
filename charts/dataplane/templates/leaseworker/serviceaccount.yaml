{{- if .Values.leaseworker.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "leaseworker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leaseworker.labels" . | nindent 4 }}
  {{- with include "leaseworker.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

---
{{- end }}
{{- if $.Capabilities.APIVersions.Has "rbac.authorization.k8s.io/v1" }}
apiVersion: rbac.authorization.k8s.io/v1
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1beta1
{{- end }}
kind: {{ include "dataplane.rbacKind" . }}
metadata:
  name: {{ .Release.Namespace }}-leaseworker
  labels:
    app: leaseworker
rules:
# Allow Access All plugin objects.
#
# This single wildcard rule is the entire grant. Explicit rules for pods (read),
# events (write) and customresourcedefinitions were removed because each was a
# strict subset of it -- RBAC unions a role's rules, so a rule subsumed by a
# sibling in the same role confers nothing. They advertised a granularity the
# role does not have, and the CRD entry additionally went dead under
# low_privilege, where the role is namespaced and the resource is not.
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ include "dataplane.rbacBindingKind" . }}
metadata:
  name: {{ .Release.Namespace }}-leaseworker
  labels:
    app: leaseworker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ include "dataplane.rbacKind" . }}
  name: {{ .Release.Namespace }}-leaseworker
subjects:
- kind: ServiceAccount
  name: {{ include "leaseworker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
