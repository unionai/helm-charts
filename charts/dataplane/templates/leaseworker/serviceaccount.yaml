{{- if .Values.leaseworker.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "leaseworker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leaseworker.labels" . | nindent 4 }}
  {{- with include "leaseworker.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

---
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.leaseworker" -}}
{{/*
No coordination.k8s.io grant: leaseworker's leases are Union v2.Lease objects
streamed from the control plane (leaseworker/lease_tracker.go), not Kubernetes
Leases. endpoints is for the k8s:/// gRPC resolver's namespaced Endpoints watch
(leaseworker/action_handler.go:462, k8s_resolver.go:162), retried with no backoff.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [endpoints]
work-ns:
  - apiGroups: ['*']
    resources: ['*']
{{/*
At low_privilege: false no limit namespace is set, so these caches list and watch
across all namespaces, which no RoleBinding can authorize
(leaseworker/action_handler.go:464-474,
leaseworker/plugin/k8s/kube_manager.go:113-119).
*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [podtemplates, pods]
    verbs: [list, watch]
{{- end -}}
