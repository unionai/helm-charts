{{- if .Values.leaseworker.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "leaseworker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leaseworker.labels" . | nindent 4 }}
  {{- with include "leaseworker.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

---
{{- end }}
{{- end }}
{{/*
Leaseworker RBAC buckets. Byte-identical to the executor's on purpose: the two
roles were identical before the bucket split and remain so. The duplication is
deliberate -- each component owns its own declaration so the gating question
"does this component need cluster scope" stays answerable per component.

Both cluster buckets are empty: the explicit customresourcedefinitions rule was
deleted as a strict subset of the wildcard below, which leaves nothing
cluster-scoped. The wildcard belongs in ns-* and never in cluster-* -- bound by
RoleBinding it is namespace-admin, the accepted operating model; bound
cluster-wide it would be cluster-admin.
*/}}
{{- define "dataplane.rbac.buckets.leaseworker" -}}
ns-read:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [get, list, watch]
ns-write:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [create, update, delete, patch]
cluster-read: []
cluster-write: []
{{- end -}}
{{- define "dataplane.rbac.slots.leaseworker" -}}
{{/*
No components-namespace grant at all, down from read and write on every
apiGroup and resource.

Its "leases" are Union protobuf v2.Lease objects streamed from the control
plane (leaseworker/lease_tracker.go), NOT Kubernetes coordination.k8s.io
Leases, so it needs no API access for them. Config and the auth secret are
volume mounts.
*/}}
work-ns:
  - apiGroups: ['*']
    resources: ['*']
{{- end -}}
