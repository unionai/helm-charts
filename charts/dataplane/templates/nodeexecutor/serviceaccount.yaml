{{- if .Values.executor.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "executor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "executor.labels" . | nindent 4 }}
  {{- with include "executor.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

---
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.executor" -}}
{{/* podtemplates: the executor always runs a PodTemplate informer over the release
namespace, and a sync failure is a startup failure.
endpoints: the gRPC resolver for k8s:/// addresses watches Endpoints in the
release namespace and retries with no backoff. */}}
comp-ns-read:
  - apiGroups: [""]
    resources: [podtemplates]
{{/* Byte-identical to leaseworker's, so common/rbac.yaml's `uniq` collapses the two. */}}
  - apiGroups: [""]
    resources: [endpoints]
{{/* Wildcard resources: a task plugin may create a SparkApplication, a RayCluster
or another CRD that does not exist when Helm renders. */}}
work-ns:
  - apiGroups: ['*']
    resources: ['*']
{{/* At low_privilege: false the chart writes no propeller.limit-namespace
(nodeexecutor/configmap.yaml), so both informers watch every namespace.
podtemplates: the executor waits for this informer to sync before it starts.
pods: the manager cache is not scoped to a namespace; container and sidecar are
the only enabled Kubernetes plugins.
Not granted: the garbage collector lists every registered plugin's resource kind
through a cache-first client, so on a cluster running KubeRay or the Spark
operator the sweep blocks. That needs a fix upstream. */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [podtemplates, pods]
    verbs: [list, watch]
{{/* namespaces is cluster-scoped but sits in this slot so it disappears under
low_privilege: true, where the garbage collector sweeps only the configured
namespace. Otherwise it lists namespaces through a cache-first reader, so without
the grant the sweep blocks on an informer that never syncs. At
commonServiceAccount.enabled: true the fluentbit subchart already binds this
ServiceAccount cluster-wide. */}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
{{- end -}}
