{{- if .Values.executor.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "executor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "executor.labels" . | nindent 4 }}
  {{- with include "executor.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

---
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.executor" -}}
{{/*
podtemplates in the components namespace is MANDATORY and not gated on
enableDepot. flyte2/executor/setup.go registers a PodTemplate informer over
POD_NAMESPACE unconditionally, and its sync failure message says so verbatim:
"verify the service account can get/list/watch core/v1 podtemplates". The
informer failing to sync is a startup failure, not a degraded mode.

endpoints is the k8s:/// gRPC resolver, registered unconditionally at
queue/executorv2/pkg/executor.go:166. The chart's default connector endpoint is
k8s:///flyteconnector.<release namespace>:8000 (values.yaml) with
connector-service in enabled_plugins, so dialling it reaches
flyte2/flytestdlib/resolver/k8s_resolver.go:162 --
CoreV1().Endpoints(releaseNamespace).Watch() with a metadata.name field
selector. That is the resolver's ONLY Kubernetes call, so `watch` is the only
verb it needs; the read set this slot supplies is a superset and costs nothing
in the release namespace.

It matters because of how the failure behaves. The watcher runs under
wait.Until(r.run, 0, ctx.Done()) (k8s_resolver.go:107) -- a ZERO retry period,
so a Forbidden is a hot loop against the API server, not a backoff, and
connector tasks never resolve. Only reachable at low_privilege: false; under
low_privilege the work-ns Role binds in the release namespace and already
covers it.

Nothing else is needed here: config and the auth secret are volume mounts, and
task pods land in work namespaces.
*/}}
comp-ns-read:
  - apiGroups: [""]
    resources: [podtemplates]
{{/*
Its own rule, byte-identical to leaseworker's, so common/rbac.yaml's `uniq`
collapses the two into one rule in the pooled Role instead of two overlapping
ones.
*/}}
  - apiGroups: [""]
    resources: [endpoints]
{{/*
Resource wildcards stay. A task plugin may bring SparkApplication, RayCluster,
PyTorchJob or a CRD that does not exist when Helm renders, so the resource
types genuinely are not enumerable. This is the one wildcard with an argument
behind it -- unlike verbs: ['*'], which had none.
*/}}
work-ns:
  - apiGroups: ['*']
    resources: ['*']
{{/*
These are the SAME resources the pooled work-ns role already names, declared a
second time because of WHERE they must be authorized, not what they are. At
low_privilege: false the chart writes no propeller.limit-namespace
(nodeexecutor/configmap.yaml), so contextutils.GetLimitNamespace is empty and
both informers below watch every namespace. Kubernetes authorizes a
namespace-less LIST or WATCH as a cluster-scope check: per-namespace
RoleBindings return 403 rather than a filtered subset, no matter how many of
them exist. Enumerated explicitly rather than mirroring work-ns's wildcards --
a cluster-wide grant is the one place breadth is never free.

podtemplates: the client-go PodTemplate informer at
queue/executorv2/pkg/executor.go:178-189 appends k8sInformers.WithNamespace
only when the limit namespace is set. Its sync is checked at :207 and the
failure is a startup error, not a degraded mode.

pods: the controller-runtime manager cache at
queue/executorv2/pkg/propeller/utils.go:115-131 leaves DefaultNamespaces nil,
and each enabled k8s task plugin registers a watch through it (source.Kind at
queue/executorv2/pkg/flytepropeller2/nodes/task/k8s/plugin_manager.go:649,
started :726). Only enabled plugins get a PluginManager, and of the enabled
set only container and sidecar are registered k8s plugins; both declare
ResourceToWatch as a core v1 Pod. So the set of PLUGIN-MANAGER watches is
exactly pods -- the dask/mpi/pytorch/ray/spark imports in plugins/loader.go
build no informer through that path. The Pod label selector on the cache
narrows what is delivered, not what is authorized.

That is not the whole story for the cache, and the difference is a real upstream
defect rather than something to grant around. The garbage collector enumerates
pluginmachinery.PluginRegistry().GetK8sPlugins() at
queue/executorv2/pkg/k8s_garbage_collector.go:366 -- the REGISTRY, not the
enabled list -- and lists each plugin's GVK at :133 through the same cache-first
client. meta.IsNoMatchError at :135 skips a GVK whose CRD is absent, which is
why this is inert on a cluster carrying only the FlyteWorkflow CRD this chart
ships. On a cluster that also runs KubeRay or the Spark operator, the GC starts
a cluster-wide informer for that CRD and blocks on it. Granting cluster-wide
list/watch on rayjobs, sparkapplications, daskjobs, pytorchjobs, tfjobs and
mpijobs to fix a background sweep would trade a stalled loop for exactly the
breadth this model removes. The fix belongs in the binary: use
mgr.GetAPIReader() for the GC, or filter the sweep to enabled plugins.

*/}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [podtemplates, pods]
    verbs: [list, watch]
{{/*
namespaces is a cluster-scoped resource type and so is not a work-namespace
resource at all. It is in this slot rather than cluster-read because of what
the slot IS, not what it is named: a cluster-scoped read that must vanish
entirely under low_privilege: true. cluster-read is kind `cluster`, which fails
the render when non-empty in that posture, and executor.enabled defaults true,
so routing it there would break every default install. Under low_privilege the
read does not happen either -- k8s_garbage_collector.go:78 takes the
limit-namespace branch and sweeps that one namespace directly.

The GC's outer loop lists namespaces at :79-82 when no limit namespace is set,
and that list is CACHE-FIRST (executors/kube.go:68-75 tries the cache reader
before falling through to the direct client). So without the grant the failure
is not a per-round error: it is a permanently blocked goroutine waiting on an
informer that can never sync, plus a reflector retrying a Forbidden LIST.

Granted rather than omitted as a non-startup-blocking read, because the
privilege argument for omitting it does not survive the chart's defaults: at
commonServiceAccount.enabled: true every union component runs as one
ServiceAccount, and the fluentbit subchart already binds that ServiceAccount
cluster-wide namespaces get/list/watch. Withholding it therefore bought no
reduction at defaults and cost the sweep only under
commonServiceAccount.enabled: false -- the more hardened posture. Namespace
names and labels are also the least sensitive read in this file.
*/}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
{{- end -}}
