{{- if .Values.executor.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "executor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "executor.labels" . | nindent 4 }}
  {{- with include "executor.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

---
{{- end }}
{{- end }}
{{/*
Executor RBAC buckets. Both cluster buckets are empty: the explicit
customresourcedefinitions rule was deleted as a strict subset of the wildcard
below, which leaves nothing cluster-scoped. The wildcard belongs in ns-* and
never in cluster-* -- bound by RoleBinding it is namespace-admin, the accepted
operating model; bound cluster-wide it would be cluster-admin.
*/}}
{{- define "dataplane.rbac.buckets.executor" -}}
ns-read:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [get, list, watch]
ns-write:
  - apiGroups: ['*']
    resources: ['*']
    verbs: [create, update, delete, patch]
cluster-read: []
cluster-write: []
{{- end -}}
