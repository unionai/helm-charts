{{- if .Values.executor.enabled }}
{{- if not (include "useCommonServiceAccount" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "executor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "executor.labels" . | nindent 4 }}
  {{- with include "executor.serviceAccount.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}

---
{{- end }}
{{- end }}
{{- define "dataplane.rbac.slots.executor" -}}
{{/* podtemplates: flyte2/executor/setup.go registers a PodTemplate informer over
POD_NAMESPACE unconditionally, and a sync failure is a startup failure.
endpoints: the k8s:/// gRPC resolver (queue/executorv2/pkg/executor.go:166)
watches Endpoints in the release namespace
(flyte2/flytestdlib/resolver/k8s_resolver.go:162) and retries with no backoff
(:107). */}}
comp-ns-read:
  - apiGroups: [""]
    resources: [podtemplates]
{{/* Byte-identical to leaseworker's, so common/rbac.yaml's `uniq` collapses the two. */}}
  - apiGroups: [""]
    resources: [endpoints]
{{/* Wildcard resources: a task plugin may create a SparkApplication, a RayCluster
or another CRD that does not exist when Helm renders. */}}
work-ns:
  - apiGroups: ['*']
    resources: ['*']
{{/* At low_privilege: false the chart writes no propeller.limit-namespace
(nodeexecutor/configmap.yaml), so both informers watch every namespace.
podtemplates: queue/executorv2/pkg/executor.go:178-189, sync checked at :207.
pods: the manager cache (queue/executorv2/pkg/propeller/utils.go:115-131) leaves
DefaultNamespaces nil; container and sidecar are the only enabled k8s plugins
(queue/executorv2/pkg/flytepropeller2/nodes/task/k8s/plugin_manager.go:649).
Not granted: the GC lists every registered plugin's GVK through the cache-first
client (k8s_garbage_collector.go:366, :133), so on a cluster running KubeRay or
the Spark operator the sweep blocks. That needs a fix upstream. */}}
work-ns-cluster-read:
  - apiGroups: [""]
    resources: [podtemplates, pods]
    verbs: [list, watch]
{{/* namespaces is cluster-scoped but sits in this slot so it disappears under
low_privilege: true, where k8s_garbage_collector.go:78 takes the limit-namespace
branch instead. Otherwise the GC lists namespaces at :79-82 through a cache-first
reader (executors/kube.go:68-75), so without the grant the sweep blocks on an
informer that never syncs. At commonServiceAccount.enabled: true the fluentbit
subchart already binds this ServiceAccount cluster-wide. */}}
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
{{- end -}}
