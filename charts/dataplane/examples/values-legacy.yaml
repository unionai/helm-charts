# Restores legacy (pre-low-privilege, pre-v2) defaults.
# Use this file to opt back into the previous behavior:
#   helm install -f values-legacy.yaml [...]
low_privilege: false
flytepropeller:
  enabled: true
flyteconnector:
  enabled: false
clusterresourcesync:
  enabled: true
opencost:
  enabled: true
commonServiceAccount:
  enabled: false
fluentbit:
  serviceAccount:
    create: true
    name: fluentbit-system
apps:
  enabled: false
knative-operator-crds:
  enabled: false
knative-operator:
  enabled: false
namespaces:
  enabled: true
prometheus:
  # low_privilege: false above grants the cluster-scoped RBAC and the cAdvisor scrape
  # job. The keys below widen collection to match, as in values.full-privilege.yaml.
  # See ../docs/rbac.md.
  kube-state-metrics:
    collectors:
      - pods
      - deployments
      - daemonsets
      - resourcequotas
      - nodes
      - namespaces
    # Collect from every namespace: legacy deployments run task pods outside the
    # release namespace.
    releaseNamespace: false
