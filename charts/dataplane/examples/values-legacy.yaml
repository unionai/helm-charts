# Restores legacy (pre-low-privilege, pre-v2) defaults.
# Use this file to opt back into the previous behavior:
#   helm install -f values-legacy.yaml [...]
low_privilege: false
flytepropeller:
  enabled: true
flyteconnector:
  enabled: false
clusterresourcesync:
  enabled: true
opencost:
  enabled: true
commonServiceAccount:
  enabled: false
fluentbit:
  serviceAccount:
    create: true
    name: fluentbit-system
apps:
  enabled: false
knative-operator-crds:
  enabled: false
knative-operator:
  enabled: false
namespaces:
  enabled: true
prometheus:
  # low_privilege: false above is enough to get cluster-scoped RBAC and the cAdvisor
  # scrape job -- both follow the flag. What follows is the collection scope that comes
  # with full privilege, the same as values.full-privilege.yaml. See ../docs/rbac.md.
  kube-state-metrics:
    collectors:
      - pods
      - deployments
      - daemonsets
      - resourcequotas
      - nodes
      - namespaces
    # Collect across every namespace, not just the release namespace -- legacy
    # deployments run task pods outside it.
    releaseNamespace: false
