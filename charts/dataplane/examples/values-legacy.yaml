# Restores legacy (multi-namespace, pre-v2) defaults.
# Use this file to opt back into the previous behavior:
#   helm install -f values-legacy.yaml [...]
singleNamespace: false
flytepropeller:
  enabled: true
flyteconnector:
  enabled: false
clusterresourcesync:
  enabled: true
opencost:
  enabled: true
commonServiceAccount:
  enabled: false
fluentbit:
  serviceAccount:
    create: true
    name: fluentbit-system
apps:
  enabled: false
knative-operator-crds:
  enabled: false
knative-operator:
  enabled: false
namespaces:
  enabled: true
prometheus:
  kube-state-metrics:
    collectors:
      - pods
      - deployments
      - daemonsets
      - resourcequotas
      - nodes
      - namespaces
    releaseNamespace: false
