# Full-privilege monitoring. Layer this after your cloud and deployment-mode values:
#
#   helm upgrade --install unionai-dataplane unionai/dataplane \
#     --values values.aws.selfhosted-intracluster.yaml \
#     --values examples/values.full-privilege.yaml \
#     --values values.aws.selfhosted-customer.yaml
#
# low_privilege: false grants the cluster-scoped RBAC. The two keys below are the
# matching collection settings, which the chart cannot derive from the flag.
# See ../docs/rbac.md.
low_privilege: false

prometheus:
  kube-state-metrics:
    # Helm replaces lists wholesale, so list every collector you want.
    collectors:
      - pods
      - deployments
      - daemonsets
      - resourcequotas
      - nodes           # kube_node_labels, kube_node_status_* — feeds cost accuracy
      - namespaces      # kube_namespace_labels, the join key for pod aggregates
    # Collect from every namespace, so task pods in project/domain namespaces are
    # included. When true, only the release namespace is collected.
    releaseNamespace: false
