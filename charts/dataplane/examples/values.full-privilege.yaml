# Overlay for multi-namespace installs. Layer it after your other values files.
# singleNamespace: false grants the cluster-scoped RBAC; the keys below are the
# matching settings, which the chart can't derive from that flag. See ../docs/rbac.md.
singleNamespace: false

# Creates a namespace per project and domain as projects are registered, and binds
# Union's work-namespace role in each. Drop this only if your own tooling does both.
clusterresourcesync:
  enabled: true

prometheus:
  kube-state-metrics:
    # Collect from every namespace, so task pods in project namespaces are included.
    releaseNamespace: false
