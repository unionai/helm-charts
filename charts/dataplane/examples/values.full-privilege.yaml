# Full-privilege monitoring. Layer this after your cloud and deployment-mode values:
#
#   helm upgrade --install unionai-dataplane unionai/dataplane \
#     --values values.aws.selfhosted-intracluster.yaml \
#     --values examples/values.full-privilege.yaml \
#     --values values.aws.selfhosted-customer.yaml
#
# low_privilege: false is what grants the cluster-scoped RBAC, and the chart follows it on
# its own. The two keys below are the collection settings that belong with it, and Helm
# can't derive them from the flag: both are read by the kube-state-metrics Deployment,
# which the subchart renders. See ../docs/rbac.md.
low_privilege: false

prometheus:
  kube-state-metrics:
    # Helm replaces lists wholesale, so this is the whole list: the four a namespaced
    # install can be granted, plus the two that need cluster scope.
    collectors:
      - pods
      - deployments
      - daemonsets
      - resourcequotas
      - nodes           # kube_node_labels, kube_node_status_* — feeds cost accuracy
      - namespaces      # kube_namespace_labels, the join key for pod aggregates
    # Collect from every namespace, so task pods running in project/domain namespaces are
    # included. Left true, only the release namespace is.
    releaseNamespace: false
