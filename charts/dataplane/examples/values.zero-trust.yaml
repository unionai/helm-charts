# Opt-in zero-trust mode (https://www.union.ai/docs/v2/union/security/). 
# It's stronly recommended to enable this for production deployments.

# zero_trust.enabled renders the Kourier+Envoy gateway + dataproxy; 
# knative-operator.enabled must be set false separately because Helm evaluates 
# the subchart condition at parse time.
zero_trust:
  enabled: true
knative-operator:
  enabled: false

# catalog-cache admin auth is required for zero-trust regardless of cloud
# environment: the per-cloud overlays disable it for the intra-cluster assumption,
# but zero-trust talks to a remote CP that requires OAuth.
config:
  catalog:
    catalog-cache:
      use-admin-auth: true

# Optional: turn off Knative Serving while keeping zero trust.
#
# apps.enabled: false drops the activator, autoscaler, autoscaler-hpa,
# controller, webhook, net-kourier-controller, their RBAC and all the Knative
# ConfigMaps. Union apps / serverless workloads stop working.
#
# The Envoy gateway keeps rendering either way: its static dataplane listener
# carries the routes to dataproxy that zero trust depends on. With app serving
# off, Envoy runs purely static — no ADS, and readiness moves to the stats
# listener on :9000.
#
# apps.enabled supersedes the deprecated serving.enabled. When both are set,
# apps.enabled wins and a deprecation notice is emitted.
#
# apps:
#   enabled: false
