# CI-specific dataplane values overlay.
# Layered on top of values-provision.yaml (generated by uctl selfserve provision-dataplane-resources).
# Points storage at the in-cluster RustFS instance and disables heavy optional components.

# The provision command sets provider=metal but the operator binary only accepts
# aws/gcp/azure/oci/custom. Use "custom" for k3d (on-prem / bare-metal).
provider: custom

storage:
  provider: compat
  endpoint: "http://rustfs.rustfs.svc.cluster.local:9000"
  accessKey: rustfsadmin
  secretKey: rustfsadmin
  bucketName: union-data
  fastRegistrationBucketName: union-data
  region: us-east-1
  disableSSL: true
  s3ForcePathStyle: true

# Image builder: push/pull via the k3d in-cluster registry.
# k3d --registry-create maps host:5001 → container:5000 (no REGISTRY_HTTP_ADDR).
# Port 5000 is open inside the Docker cluster network; port 5001 is only the
# host-side mapping. buildkit must push to :5000. k3s containerd is configured
# to pull from http://k3d-registry:5000 via --registry-config on cluster create.
imageBuilder:
  enabled: true
  defaultRepository: "k3d-registry:5000/union"
  buildkit:
    enabled: true
    resources:
      # CPU request kept low (no limit set) so buildkit still bursts during
      # builds but doesn't reserve scheduling capacity the test pods need on the
      # 4-vCPU runner.
      requests:
        cpu: "250m"
        memory: "512Mi"
        ephemeral-storage: "5Gi"
    # k3d registry is HTTP-only; tell buildkit not to use TLS for it.
    # Both the bare hostname and host:port forms are listed because different
    # buildkit versions normalise the registry address differently.
    extraConfig: |
      [registry."k3d-registry:5000"]
        http = true
        insecure = true

      [registry."k3d-registry"]
        http = true
        insecure = true

      # Serve the default task base image — ghcr.io/flyteorg/flyte:py3.x-vX.Y.Z,
      # the FROM that buildkit pulls once per run for from_debian_base() — from
      # the in-cluster k3d registry, where the "Pre-warm build base image" CI
      # step has mirrored it. That base pull is then served locally and never
      # touches ghcr.io, so it can't be throttled. BuildKit falls back to the
      # canonical ghcr.io registry if the mirror lacks the tag, so this is
      # strictly best-effort and never blocks a build (e.g. if the pre-warm
      # step was skipped or the tag didn't match).
      [registry."ghcr.io"]
        mirrors = ["k3d-registry:5000"]

# Image-pull resilience for the shared CI runner.
# flytepropeller's k8s plugin reaps a pod stuck in ImagePullBackOff once
# image-pull-backoff-grace-period elapses (default 3m) — seen as
# "Grace period [3m0s] exceeded ... Back-off pulling image". On shared GitHub
# runners, ghcr.io / Docker Hub pulls intermittently throttle (429 / 5xx) and
# recover on containerd's own (widening) backoff schedule, but the 3m cap reaps
# them first and fails the task. Widen the grace so a throttled-but-progressing
# pull can finish; this pairs with the per-task retries=2 (which re-pull on a
# fresh pod) and the scenario-level retry in integration_ops.py. create-container
# grace is widened too for transient CRI hiccups. These deep-merge into the base
# config.k8s.plugins.k8s map (default-pod-template-name etc. are preserved).
config:
  k8s:
    plugins:
      k8s:
        image-pull-backoff-grace-period: 8m
        create-container-error-grace-period: 8m

# App serving (verify_app) runs on the chart's DEFAULT vendored Knative gateway
# (gateway.enabled=true, knative-operator.enabled=false) — the same delivery path
# that ships to self-hosted data planes.
#
# The vendored gateway renders a full Knative Serving control plane (activator,
# autoscaler, controller, webhook, net-kourier-controller) plus the Envoy public
# gateway, every component HA at replicas=2 by default. On the single 4-vCPU
# runner that overflows the node (net-kourier-controller alone requests 2×500m
# and activator 2×300m), leaving the app/reusable task pods stuck in
# WAITING_FOR_RESOURCES. Collapse every component to a single replica and trim
# the two heaviest requests so the whole serving stack + test pods fit. HPA'd
# components (envoy, activator, webhook) also need minReplicas=1, else the HPA
# holds them at 2. The k3d in-cluster HTTP registry is already skipped for
# tag→digest resolution via gateway.config.deployment's default
# (imagebuilder.defaultRegistry = k3d-registry:5000), so no extra config here.
gateway:
  components:
    envoy:
      replicas: 1
      hpa:
        minReplicas: 1
    kourier-controller:
      replicas: 1
      containers:
        controller:
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
    activator:
      replicas: 1
      hpa:
        minReplicas: 1
      containers:
        activator:
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
    controller:
      replicas: 1
    autoscaler:
      replicas: 1
    autoscaler-hpa:
      replicas: 1
    webhook:
      replicas: 1
      hpa:
        minReplicas: 1

# Legacy knative-operator serving path stays off (matches the chart default now
# that gateway.enabled=true). Leaving it enabled would deploy the operator + its
# webhook for nothing — the KnativeServing CR they manage isn't rendered while
# the vendored gateway is active.
knative-operator:
  enabled: false

# Disable monitoring stack — not needed for chart validation.
monitoring:
  enabled: false

prometheus:
  enabled: false

metrics-server:
  enabled: false

# Disable log shipping — no remote sink in CI.
fluentbit:
  enabled: false

# Disable cost tracking.
opencost:
  enabled: false
cost:
  enabled: false

# Disable GPU exporter.
dcgm-exporter:
  enabled: false

# k3d ships Traefik; skip nginx to avoid port conflicts.
ingress-nginx:
  enabled: false

# leaseworker (nworker) is the flyte-v2 action dispatcher: it leases QUEUED
# actions off the cluster queue and hands them to propeller. REQUIRED for tasks
# to run — without it every action sits in ACTION_PHASE_QUEUED forever. It is the
# replacement for the retired executor (disabled below). The chart default
# requests 4 CPU / 8 Gi (too big for the 4-vCPU runner), so shrink the request; it
# still bursts to its limit when busy.
leaseworker:
  enabled: true
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"

# flyteconnector default: 1 CPU × HPA-min-2 = 2 CPUs; not needed for functional tests.
flyteconnector:
  enabled: false

# Lower operator/executor/proxy requests so all pods fit on the runner
# alongside k3s. The operator defaults to a 1-CPU request — the single biggest
# consumer on the 4-vCPU node — which left no room for the verify_app Knative
# revision to schedule (RevisionFailed: Insufficient cpu). It bursts to its
# 2-CPU limit when busy, so only the scheduling request is lowered.
operator:
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"

# executor is retired — leaseworker (above) is its v2 replacement. Disabling it
# frees ~200m for the leaseworker and avoids running two dispatchers.
executor:
  enabled: false

proxy:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
  # The operator-proxy pod also runs a tunnel sidecar (loopback tunnel to the CP)
  # whose request defaults to 500m — the second-largest single request on the
  # node. Lower the scheduling request; it still bursts to its 3-CPU limit when
  # the tunnel is busy. Without this the vendored gateway's larger serving
  # footprint tips the 4-vCPU node over and the verify_app task pods can't fit.
  tunnel_resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
