# OpenShift compatibility defaults.
#
# Layer this file after the cloud/mode values file, for example:
#   values.aws.selfhosted-intracluster.yaml
#   values.openshift.yaml
#
# Namespace-specific OpenShift UID/GID/SELinux values are intentionally not set
# here because OpenShift allocates them per namespace.

imageBuilder:
  buildkit:
    openShift:
      enabled: true
      securityContextConstraints:
        create: true
        name: ""
        existingName: ""
        allowPrivilegeEscalation: true
        defaultAllowPrivilegeEscalation: true
        pinRequiredSCC: true
    rootless: true
    hostUsers: false
    securityContext: {}
    serviceAccount:
      create: true
      forceDedicated: true
      name: union-imagebuilder

taskPodTemplate:
  workingDir: /tmp

fluentbit:
  extraVolumeMounts:
    - mountPath: /fluent-bit/state
      name: fluentbit-state
  extraVolumes:
    - emptyDir: {}
      name: fluentbit-state
  tailDBPath: /fluent-bit/state/flb_kube.db

serving:
  knativeServingHook:
    enabled: false
  openShift:
    kourierGatewayScc:
      enabled: true
      create: true
      serviceAccountName: default

# The uvol mount broker is privileged (host root, CAP_SYS_ADMIN, /dev/fuse) and
# the chart ships no SecurityContextConstraints for it, so on OpenShift its pods
# would be refused at admission. Off here until it has one; enable it together
# with an SCC that grants the broker's service account privileged.
uvolMountBroker:
  enabled: false
