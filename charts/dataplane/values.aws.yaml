# Union Dataplane — AWS cloud overlay.
#
# PURPOSE (for humans and agents): this file holds ONLY cloud-specific
# configuration for AWS — the provider, S3 object storage, IAM/IRSA service-
# account annotations, region wiring, and the AWS-unique globals a user fills
# in. It layers on top of the chart's base values.yaml.
#
# It MUST NOT carry deployment-topology or Union-platform config — auth
# enablement, ingress/ingress-nginx, secret creation, namespace/RBAC, billing,
# etc. Those are chart defaults in base values.yaml and are set per-topology
# (managed-CP vs selfhosted, intracluster vs split) by the terraform
# union_extension module. Keep this overlay cloud-only.

global:
  # --- Control plane (configure first) ---
  CONTROLPLANE_HOST: ""         # Bare CP hostname (no scheme, no port)

  # --- Identity ---
  CLUSTER_NAME: ""              # Unique cluster identifier
  ORG_NAME: ""                  # Organization name (must match controlplane)

  # --- Storage ---
  METADATA_BUCKET: ""           # S3 bucket for workflow metadata
  FAST_REGISTRATION_BUCKET: ""  # S3 bucket for code uploads

  # --- AWS ---
  AWS_ACCOUNT_ID: ""            # 12-digit account ID (used for ECR registry URL)
  AWS_REGION: ""

  # --- AWS IAM (IRSA) ---
  # Format: arn:aws:iam::<account>:role/<role-name>
  AWS_POD_IDENTITY_ANNOTATION_PREFIX: eks.amazonaws.com
  BACKEND_IAM_ROLE_ARN: ""      # IAM role for Union backend services
  WORKER_IAM_ROLE_ARN: ""       # IAM role for workflow execution pods

  # --- Dataplane to Controlplane Auth ---
  AUTH_CLIENT_ID: ""            # client_credentials client ID
  OIDC_S2S_SCOPE: ""            # Okta: leave empty. Entra ID: "api://my-app/.default"

# ----------------------------------------------------------------------------
# Cloud provider
# ----------------------------------------------------------------------------
# Cloud provider identifier (do not change for AWS).
provider: aws

# ----------------------------------------------------------------------------
# Object storage — S3
# ----------------------------------------------------------------------------
# S3 buckets for workflow metadata and fast registration; create before deploy.

storage:
  provider: aws
  authType: iam  # Use IAM roles for pods (IRSA recommended)

  # AWS region for S3 buckets
  region: '{{ .Values.global.AWS_REGION }}'

# ----------------------------------------------------------------------------
# IAM roles (IRSA)
# ----------------------------------------------------------------------------
# IAM Roles for Service Accounts; create with the appropriate trust policies.

# IAM role for Union backend services (operator, propeller, etc.)
# Override global.AWS_POD_IDENTITY_ANNOTATION_PREFIX if your AWS pod identity
# webhook uses a custom --annotation-prefix.
additionalServiceAccountAnnotations:
  "{{ .Values.global.AWS_POD_IDENTITY_ANNOTATION_PREFIX }}/role-arn": "{{ tpl .Values.global.BACKEND_IAM_ROLE_ARN . }}"

# IAM role for workflow execution pods
userRoleAnnotationKey: "{{ .Values.global.AWS_POD_IDENTITY_ANNOTATION_PREFIX }}/role-arn"
userRoleAnnotationValue: "{{ tpl .Values.global.WORKER_IAM_ROLE_ARN . }}"

# ----------------------------------------------------------------------------
# Operator proxy — keep the DP<->CP tunnel pinned
# ----------------------------------------------------------------------------
# The single-replica union-operator-proxy pod hosts the cloudflared tunnel that
# keeps this cluster ONLINE on the CP. do-not-disrupt stops EKS Auto Mode /
# Karpenter consolidation from evicting it as "Underutilized" (which drops the
# tunnel and briefly fails CP data routing: dataproxy "failed to get proxy").
# Harmless on non-Karpenter clusters.
proxy:
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"

# ----------------------------------------------------------------------------
# Secret Manager backend identity
# ----------------------------------------------------------------------------
# Identify the AWS Secrets Manager backend so the operator can report a canonical
# secret store identity to the control plane (used for cluster-pool drift
# detection). Read only when proxy.secretManager.type is AWS.
config:
  proxy:
    smConfig:
      awsConfig:
        account: '{{ .Values.global.AWS_ACCOUNT_ID }}'
        region: '{{ .Values.global.AWS_REGION }}'

# ----------------------------------------------------------------------------
# Task-level monitoring — DCGM exporter (GPU) node affinity
# ----------------------------------------------------------------------------
# Only the AWS-specific GPU-instance node affinity lives here; whether the
# exporter is enabled is a base values.yaml default.
dcgm-exporter:

  # Configure AWS specific affinity
  # Reference: https://github.com/aws-observability/helm-charts/blob/release-4.2.1/charts/amazon-cloudwatch-observability/values.yaml#L1371-L1503
