# ============================================================================
# Union Dataplane — Azure cloud overlay.
# ============================================================================
# PURPOSE (for humans and agents): this file holds ONLY cloud-specific
# configuration for Azure — the provider, Azure Blob/ABFS storage, Workload
# Identity annotations + pod labels, Azure task-log links, fluentbit shared-key
# logging, and the Azure-unique globals a user fills in. It layers on top of
# the chart's base values.yaml.
#
# It MUST NOT carry deployment-topology or Union-platform config — auth
# enablement, ingress/ingress-nginx, secret creation, namespace/RBAC, billing,
# etc. Those are chart defaults in base values.yaml and are set per-topology
# by the terraform union_extension module. Keep this overlay cloud-only.
#
# For more details, see: https://docs.union.ai/deployment/
# ============================================================================

# ----------------------------------------------------------------------------
# Global Configuration
# ----------------------------------------------------------------------------
# Placeholders a user fills in before deployment; accessible to the chart and
# all subcharts. Replace each "" below.

global:
  # --- Control plane (configure first) ---
  CONTROLPLANE_HOST: ""         # Bare CP hostname (no scheme, no port)

  # --- Identity ---
  CLUSTER_NAME: ""              # Unique cluster identifier
  ORG_NAME: ""                  # Organization name (must match controlplane)

  # --- Storage ---
  METADATA_CONTAINER: ""        # Blob container for metadata + fast registration (must exist)
  AZURE_STORAGE_ACCOUNT: ""     # Storage account name (3-24 lowercase alphanumeric)

  # --- Azure ---
  AZURE_SUBSCRIPTION_ID: ""     # Subscription GUID
  AZURE_TENANT_ID: ""           # Entra ID (Azure AD) tenant GUID
  AZURE_RESOURCE_GROUP: ""      # Resource group containing Union resources

  # --- Azure IAM (Workload Identity managed identities) ---
  AZURE_BACKEND_CLIENT_ID: ""   # Managed Identity client ID for Union backend services
  AZURE_WORKER_CLIENT_ID: ""    # Managed Identity client ID for workflow execution pods
  AZURE_KEY_VAULT_URI: ""       # Key Vault URI (optional; see secret-manager example under config)

  # --- Dataplane to Controlplane Auth ---
  AUTH_CLIENT_ID: ""            # client_credentials client ID
  OIDC_S2S_SCOPE: ""            # Entra ID: "api://my-app/.default"

# ----------------------------------------------------------------------------
# Cloud provider
# ----------------------------------------------------------------------------
# Cloud provider identifier (do not change for Azure). clusterName / orgName /
# host are inherited from base values.yaml and reference the globals above.
provider: azure

# ----------------------------------------------------------------------------
# Object Storage Configuration
# ----------------------------------------------------------------------------
# Configure Azure Blob Storage for workflow metadata and fast registration.
# Storage account and containers must be created before deployment.

storage:
  provider: custom
  bucketName: '{{ .Values.global.METADATA_CONTAINER }}'

  # Custom storage configuration using stow with Azure backend
  custom:
    container: '{{ .Values.global.METADATA_CONTAINER }}'
    type: stow
    stow:
      kind: azure
      config:
        # Storage account name
        account: '{{ .Values.global.AZURE_STORAGE_ACCOUNT }}'
        # Leave key empty to use Workload Identity / Managed Identity authentication
        # For key-based auth, provide the storage account access key
        # key: ""

# ----------------------------------------------------------------------------
# Image Builder Authentication (OPTIONAL)
# ----------------------------------------------------------------------------
# By default, the image builder uses authenticationType: "noop". Uncomment and
# set "azure" if you want the builder to authenticate to ACR via the Azure
# provider credential chain (Workload Identity / Managed Identity).
# imageBuilder:
#   authenticationType: azure

# ----------------------------------------------------------------------------
# Workload Identity
# ----------------------------------------------------------------------------
# Configure Azure Workload Identity for secure Azure access.
# Managed Identities must be created with federated credentials for service accounts.

# Workload Identity annotation for Union backend services (operator, propeller, etc.)
additionalServiceAccountAnnotations:
  azure.workload.identity/client-id: "{{ .Values.global.AZURE_BACKEND_CLIENT_ID }}"

# Workload Identity annotation for workflow execution pods
userRoleAnnotationKey: azure.workload.identity/client-id
userRoleAnnotationValue: "{{ .Values.global.AZURE_WORKER_CLIENT_ID }}"

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
# Azure task logs flow via Container Insights / Log Analytics (config.proxy
# .persistedLogs below), not fluentbit. The fluentbit -> Blob daemonset is
# disabled — it crashloops without an azureBlobSharedKey (azure_blob can't use
# workload identity). For the Blob path, set enabled: true + that key.
fluentbit:
  enabled: false

# ----------------------------------------------------------------------------
# Workload Identity Pod Labels
# ----------------------------------------------------------------------------
# Pod labels required for Azure Workload Identity webhook injection.

additionalPodLabels:
  # Enable workload identity by default
  azure.workload.identity/use: "true"

# ----------------------------------------------------------------------------
# Azure-Specific Configuration
# ----------------------------------------------------------------------------
# Configuration for Azure services including Key Vault, Log Analytics, and scheduling.

# Task namespace mapping (multi-namespace / namespaces.enabled=true only).
# Azure Workload Identity federated credentials have no wildcard subject support
# (unlike AWS IRSA's `*:ksa`), so worker FICs must enumerate explicit
# `namespace:ksa` subjects. Pin the task namespace to `{{ domain }}` (a bounded
# set: development / staging / production) rather than Flyte's unbounded default
# `{{ project }}-{{ domain }}`, so the FICs in
# modules/selfmanaged/azure/dataplane/user_assigned_identities.tf can enumerate
# them. Must be the top-level `namespace_mapping` key the propeller configmap
# reads (the previous top-level `namespace_config` key was ignored, which is why
# azure fell through to the project-domain default). Ignored in
# single-namespace mode.
namespace_mapping:
  template: "{{ `{{ domain }}` }}"
config:
  # Optional: route the operator's secret manager to Azure Key Vault instead of
  # the embedded K8s backend (see proxy.smConfig below). Example:
  # core:
  #   webhook:
  #     embeddedSecretManagerConfig:
  #       enabled: true
  #       type: Azure
  #       azureConfig:
  #         vaultURI: '{{ .Values.global.AZURE_KEY_VAULT_URI }}'
  #     secretManagerTypes:
  #       - Azure
  #       - Embedded
  # Operator configuration with Azure Blob Storage metadata path
  operator:
    clusterData:
      # Azure Blob Storage path format (ABFS protocol for Data Lake Storage Gen2)
      metadataBucketPrefix: "abfs://{{.Values.global.METADATA_CONTAINER}}@{{.Values.global.AZURE_STORAGE_ACCOUNT}}.dfs.core.windows.net"
  # Proxy configuration with Azure Log Analytics and secret manager
  proxy:
    # Operator queries task-pod logs from a Log Analytics workspace fed by the AKS
    # Container Insights (OMS) addon. To enable: grant the AMA/kubelet identity
    # "Monitoring Metrics Publisher" on the cluster (ODS ingestion checks it there)
    # and the operator identity "Log Analytics Reader" on the workspace, which
    # needs internet ingest+query (no VNet service-endpoint support).
    persistedLogs:
      sourceType: AzureLogAnalytics
      azureLogAnalytics:
        logAnalyticsWorkspaceResourceIdTemplate: "/subscriptions/{{.Values.global.AZURE_SUBSCRIPTION_ID}}/resourceGroups/{{.Values.global.AZURE_RESOURCE_GROUP}}/providers/Microsoft.OperationalInsights/workspaces/union-{{.Values.global.ORG_NAME}}"
    # Operator secret manager. Inherit the base `type: K8s` (embedded k8s) like
    # values.aws.yaml / values.gcp.yaml — the flyte-pod-webhook that reads the
    # eager API key uses the embedded k8s manager, so the operator must write
    # there too. Setting `type: Azure` here routed operator secrets to Key Vault
    # while the webhook still read embedded k8s, so task pods were denied the
    # EAGER_API_KEY secret. azureConfig is retained (inert unless type=Azure).
    smConfig:
      azureConfig:
        vaultURI: '{{ .Values.global.AZURE_KEY_VAULT_URI }}'

  # Task logs configuration with Azure Log Analytics templates
  task_logs:
    plugins:
      logs:
        cloudwatch-enabled: false
        kubernetes-enabled: false
        stackdriver-enabled: false
        azure-log-templates:
          - displayName: Azure Logs
            templateUris:
              - "https://portal.azure.com#@{{.Values.global.AZURE_TENANT_ID}}/blade/Microsoft_OperationsManagementSuite_Workspace/Logs.ReactView/resourceId/%2Fsubscriptions%2F{{.Values.global.AZURE_SUBSCRIPTION_ID}}%2FresourceGroups%2F{{.Values.global.AZURE_RESOURCE_GROUP}}/source/LogsBlade.AnalyticsShareLinkToQuery/q/"
      k8s-array:
        logs:
          config:
            cloudwatch-enabled: false
            kubernetes-enabled: false
            stackdriver-enabled: false
            azure-log-templates:
              - displayName: Azure Logs
                templateUris:
                  - "https://portal.azure.com#@{{.Values.global.AZURE_TENANT_ID}}/blade/Microsoft_OperationsManagementSuite_Workspace/Logs.ReactView/resourceId/%%2Fsubscriptions%%2F{{.Values.global.AZURE_SUBSCRIPTION_ID}}%%2FresourceGroups%%2F{{.Values.global.AZURE_RESOURCE_GROUP}}/source/LogsBlade.AnalyticsShareLinkToQuery/q/"
      fasttask:
        logs:
          cloudwatch-enabled: false
          kubernetes-enabled: false
          stackdriver-enabled: false
          azure-log-templates:
            - displayName: Azure Logs
              templateUris:
                - "https://portal.azure.com#@{{.Values.global.AZURE_TENANT_ID}}/blade/Microsoft_OperationsManagementSuite_Workspace/Logs.ReactView/resourceId/%2Fsubscriptions%2F{{.Values.global.AZURE_SUBSCRIPTION_ID}}%2FresourceGroups%2F{{.Values.global.AZURE_RESOURCE_GROUP}}/source/LogsBlade.AnalyticsShareLinkToQuery/q/"

  # Kubernetes plugin configuration for worker pods
  k8s:
    plugins:
      k8s:
        # Workload Ident!ity label for worker pods
        default-labels:
          - azure.workload.identity/use: "true"

        # Storage account environment variable for SDK access
        default-env-vars:
          - AZURE_STORAGE_ACCOUNT_NAME: "{{ .Values.global.AZURE_STORAGE_ACCOUNT }}"

        # Azure Spot VM configuration for interruptible workloads
        interruptible-node-selector-requirement:
          key: kubernetes.azure.com/scalesetpriority
          operator: In
          values:
            - spot

        interruptible-tolerations:
          - effect: NoSchedule
            key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot

        # Non-interruptible workloads avoid spot VMs
        non-interruptible-node-selector-requirement:
          key: kubernetes.azure.com/scalesetpriority
          operator: DoesNotExist

# ----------------------------------------------------------------------------
# Task Level Monitoring
# ----------------------------------------------------------------------------

# DCGM Exporter
dcgm-exporter:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.azure.com/accelerator
            operator: In
            values:
            - "nvidia"

