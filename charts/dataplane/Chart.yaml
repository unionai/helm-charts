apiVersion: v2
name: dataplane
description: Deploys the Union dataplane components to onboard a kubernetes cluster to the Union Cloud.
type: application
icon: https://i.ibb.co/JxfDQsL/Union-Symbol-yellow-2.png
version: 2026.8.2
appVersion: 2026.8.0
kubeVersion: '>= 1.28.0-0'
dependencies:
- name: kube-prometheus-stack
  repository: https://prometheus-community.github.io/helm-charts
  version: 80.8.0
  alias: monitoring
  condition: monitoring.enabled
- name: prometheus
  repository: https://prometheus-community.github.io/helm-charts
  version: 25.30.2
  alias: prometheus
  condition: prometheus.enabled
- name: metrics-server
  repository: https://kubernetes-sigs.github.io/metrics-server/
  version: 3.12.2
  condition: metrics-server.enabled
  alias: metrics-server
- name: knative-operator
  repository: https://unionai.github.io/helm-charts
  version: 2026.6.0
  alias: knative-operator
  condition: knative-operator.enabled
# NOTE: the knative-operator -> vendored-gateway migration is NOT a subchart. It
# ships as an idempotent ArgoCD PostSync hook Job from the union_extension
# terraform (selfhosted envs), so it is decoupled from the chart's dependency
# graph and runs after the sync disables the operator. See
# infra/terraform/modules/selfmanaged/union_extension/*/dataplane.tf.
- name: fluent-bit
  version: 0.48.9
  repository: https://fluent.github.io/helm-charts
  condition: fluentbit.enabled
  alias: fluentbit
- name: opencost
  repository: https://opencost.github.io/opencost-helm-chart
  version: 1.42.0
  condition: opencost.enabled
- name: dcgm-exporter
  version: 4.7.1
  repository: https://nvidia.github.io/dcgm-exporter/helm-charts
  condition: dcgm-exporter.enabled
- name: ingress-nginx
  repository: https://kubernetes.github.io/ingress-nginx
  version: 4.12.3
  condition: ingress-nginx.enabled
