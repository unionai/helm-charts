{{- if .Values.imageBuilder.enabled }}
# Read by the build-image task (deployed into the system project): where
# BuildKit is, where to push, and how to read build contexts from storage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: build-image-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
data:
  buildkit-uri: {{ required "imageBuilder.buildkitURI is required" .Values.imageBuilder.buildkitURI | quote }}
  default-repository: {{ .Values.imageBuilder.repository | quote }}
  authentication-type: noop
  storage.yaml: |
    storage:
      {{- include "onebox.storage" . | nindent 6 }}
{{- end }}
