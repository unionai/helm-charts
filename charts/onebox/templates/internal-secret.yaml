{{- /*
Credentials onebox uses between its own parts: userclouds-lite's client
secret. Generated once and kept across upgrades.
*/}}
{{- if not .Values.internalSecret.existingSecret }}
{{- $name := include "onebox.internalSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  userclouds-client-secret: {{ index $existing.data "userclouds-client-secret" }}
  {{- else }}
  userclouds-client-secret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
