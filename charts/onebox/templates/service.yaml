apiVersion: v1
kind: Service
metadata:
  name: {{ include "onebox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "onebox.selectorLabels" . | nindent 4 }}
  ports:
    # The console (/v2), the Connect and gRPC API and the REST routes. Put the
    # authenticating proxy in front of this port.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      appProtocol: kubernetes.io/h2c
    # Task pods call the API here: TLS with a self-signed certificate, which
    # they do not verify. In-cluster only.
    - name: tasks
      port: 443
      targetPort: tasks
    # Reusable-container (fast task) workers report back here. In-cluster only.
    - name: fasttask
      port: 15606
      targetPort: fasttask
    {{- if .Values.webhook.enabled }}
    # The API server calls the pod webhook here (task pods only).
    - name: webhook
      port: 9443
      targetPort: webhook
    {{- end }}
