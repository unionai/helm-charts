{{- $enabled := .Values.networkPolicy.enabled }}
{{- if kindIs "invalid" $enabled }}{{ $enabled = .Values.authz.enabled }}{{ end }}
{{- if $enabled }}
# The tasks port trusts whoever reaches it as the built-in tasks app: only task
# pods (this namespace, plus tasksFrom) may. Only the authenticating proxy may
# reach the port that trusts its identity headers, when proxyFrom names it.
# The webhook port stays open: the API server's address is not something a
# policy can name portably.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "onebox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "onebox.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
      {{- with .Values.networkPolicy.proxyFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: 8082
        - port: 15606
      from:
        - podSelector: {}
        {{- with .Values.networkPolicy.tasksFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    - ports:
        - port: 9443
    - ports:
        - port: 10254
{{- end }}
