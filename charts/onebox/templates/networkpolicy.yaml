{{- if .Values.networkPolicy.enabled }}
# Only the authenticating proxy may reach the port that trusts its identity
# headers. Task pods (this namespace) reach the tasks and fast task ports,
# where only built-in app tokens identify a caller. The webhook port stays
# open: the API server's address is not something a policy can name portably.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "onebox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "onebox.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
      from:
        {{- required "networkPolicy.proxyFrom must list the authenticating proxy's peers" .Values.networkPolicy.proxyFrom | toYaml | nindent 8 }}
    - ports:
        - port: 8443
        - port: 15606
      from:
        - podSelector: {}
    - ports:
        - port: 9443
{{- end }}
