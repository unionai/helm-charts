# onebox runs task pods, and keeps their secrets and plugin objects, in its
# own namespace; it needs nothing outside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "onebox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "onebox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "onebox.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "onebox.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.webhook.enabled }}
---
# The pod webhook registers itself. Its MutatingWebhookConfiguration only
# selects pods in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-webhook" .Release.Namespace (include "onebox.fullname" .) }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    resourceNames: [{{ include "onebox.fullname" . | quote }}]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-webhook" .Release.Namespace (include "onebox.fullname" .) }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-webhook" .Release.Namespace (include "onebox.fullname" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "onebox.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
