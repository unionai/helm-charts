# onebox runs task pods and keeps their secrets in its own namespace; it needs
# nothing outside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "onebox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
rules:
  # Task pods, their logs, and the pod templates tasks may name.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log, podtemplates, serviceaccounts]
    verbs: [get, list, watch]
  # Secrets: the secret store, image pull secrets, the webhook's certificate.
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # Task events: read for the console, recorded by the worker.
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [get, list, watch, create, update, patch]
  # The operator proxy's namespace quota route (read only).
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list, watch]
  {{- if .Values.serving.enabled }}
  # Apps: each is a Knative Service the app controller owns, plus an optional
  # PodDisruptionBudget for apps that keep several replicas.
  - apiGroups: [serving.knative.dev]
    resources: [services, configurations, revisions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [serving.knative.dev]
    resources: [services/status]
    verbs: [get]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  {{- end }}
  {{- with .Values.rbac.extraRules }}
  # Plugin objects (Spark, Ray, ...) for task types enabled in extraConfig.
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "onebox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "onebox.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "onebox.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.webhook.enabled }}
---
# The pod webhook registers itself. Its MutatingWebhookConfiguration only
# selects pods in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-webhook" .Release.Namespace (include "onebox.fullname" .) }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    resourceNames: [{{ include "onebox.fullname" . | quote }}]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-webhook" .Release.Namespace (include "onebox.fullname" .) }}
  labels:
    {{- include "onebox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-webhook" .Release.Namespace (include "onebox.fullname" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "onebox.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
