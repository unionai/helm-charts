apiVersion: v2
name: onebox
description: Union in one pod. The v2 control plane, the data plane worker and the console, against one Postgres database and one object store, on one port.
type: application
icon: https://i.ibb.co/JxfDQsL/Union-Symbol-yellow-2.png
version: 2026.10.4
appVersion: 2026.10.4
kubeVersion: '>= 1.28.0'
dependencies:
  # The Metrics tab's Prometheus (prometheus.enabled): the same chart and
  # version the dataplane chart uses.
  - name: prometheus
    repository: https://prometheus-community.github.io/helm-charts
    version: 25.30.2
    condition: prometheus.enabled
