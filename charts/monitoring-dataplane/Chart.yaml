apiVersion: v2
name: monitoring-dataplane
description: Monitoring stack for the Union dataplane (kube-prometheus-stack + Prometheus). Install separately before enabling monitoring in the dataplane chart.
type: application
icon: https://i.ibb.co/JxfDQsL/Union-Symbol-yellow-2.png
version: 2026.4.7
appVersion: 2026.4.7
kubeVersion: '>= 1.28.0-0'
dependencies:
- name: kube-prometheus-stack
  repository: https://prometheus-community.github.io/helm-charts
  version: 80.8.0
  alias: monitoring
  condition: monitoring.enabled
- name: prometheus
  repository: https://prometheus-community.github.io/helm-charts
  version: 25.27.0
  alias: prometheus
  condition: prometheus.enabled
