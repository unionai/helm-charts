apiVersion: v2
name: dataplane-tools
description: |
  Auxiliary Knative-served tooling for a Union data plane cluster: Grafana plus
  Prometheus and Kubernetes MCP servers for observability and debugging. Each
  service is a scale-to-zero Knative Service exposed under the data plane's apps
  wildcard behind the vendored Kourier + union-authn gateway. Long-term, the
  durable home for these is likely Union Apps rather than a standalone chart.
type: application
icon: https://i.ibb.co/JxfDQsL/Union-Symbol-yellow-2.png
version: 2026.8.1
appVersion: 2026.8.1
kubeVersion: '>= 1.28.0-0'
