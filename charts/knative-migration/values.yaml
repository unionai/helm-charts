image:
  # Registry host spelled out — an unqualified repository resolves against the
  # implicit docker.io default and fails on clusters that pin an
  # allowed-registry policy.
  repository: docker.io/alpine/kubectl
  tag: "1.33.4"
  pullPolicy: IfNotPresent

labels: {}

annotations: {}

knativeServingName: union-operator-serving

adoption:
  enabled: false
  targetRelease: ""
  targetNamespace: ""

job:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

nameOverride: ""
fullnameOverride: ""
