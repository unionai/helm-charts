# DATASOURCE_MODE=amp: AWS Managed Prometheus via Grafana-native SigV4.
# sigV4AuthType=default resolves the pod's IRSA identity (worker-namespace default SA); grant
# it aps:QueryMetrics/GetLabels/GetSeries. DS_PROM_URL = the AMP workspace query endpoint
# (https://aps-workspaces.<region>.amazonaws.com/workspaces/<ws-id>); DS_AWS_REGION = region.
apiVersion: 1
deleteDatasources:
  - name: Prometheus
    orgId: 1
datasources:
  - name: cluster-prometheus
    uid: cluster-prometheus
    type: prometheus
    access: proxy
    url: ${DS_PROM_URL}
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: false
      sigV4Auth: true
      sigV4AuthType: default
      sigV4Region: ${DS_AWS_REGION}
