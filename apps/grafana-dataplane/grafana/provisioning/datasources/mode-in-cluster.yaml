# DATASOURCE_MODE=in-cluster (default) and gmp-frontend: unauthenticated Prometheus.
# in-cluster  -> co-located kube-prometheus-stack service.
# gmp-frontend -> DS_PROM_URL points at the in-cluster GMP frontend proxy, which itself
#                 authenticates to Google via the pod's Workload Identity.
apiVersion: 1
deleteDatasources:
  - name: Prometheus
    orgId: 1
datasources:
  - name: cluster-prometheus
    uid: cluster-prometheus
    type: prometheus
    access: proxy
    url: ${DS_PROM_URL}
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: false
      timeInterval: 30s
