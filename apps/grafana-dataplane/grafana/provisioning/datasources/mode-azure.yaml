# DATASOURCE_MODE=azure: Azure Monitor Managed Prometheus via Grafana-native Azure auth.
# authType=workloadidentity resolves the pod's AKS Workload Identity (worker-namespace default
# SA); grant it Monitoring Data Reader on the workspace. DS_PROM_URL = the Azure Monitor
# workspace query endpoint.
apiVersion: 1
deleteDatasources:
  - name: Prometheus
    orgId: 1
datasources:
  - name: cluster-prometheus
    uid: cluster-prometheus
    type: prometheus
    access: proxy
    url: ${DS_PROM_URL}
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: false
      azureCredentials:
        authType: workloadidentity
