repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      # Enable later
      # - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: tests/generated/*
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-chart-version-bump
        name: Ensure Chart.yaml version is bumped with appVersion
        language: script
        entry: scripts/check-chart-version-bump.sh
        files: Chart\.yaml$
