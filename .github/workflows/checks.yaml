name: helm
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-notes:
    # Gate: a chart `version:` bump must ship a matching `## <version>` section
    # in that chart's RELEASE.md. Only meaningful on PRs (needs a base ref).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check RELEASE.md is updated for version bumps
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          ./.github/ci-scripts/check_release_notes.sh "origin/${GITHUB_BASE_REF}"
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v4.2.2
      - name: Run linter
        run: make lint
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v4.2.2
      - name: Run tests
        run: make helm-test
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up kubeconform
        uses: yokawasa/action-setup-kube-tools@v0.11.2
      - name: Run kubeconform
        run: make kubeconform-test
  rbac:
    # Enforces the RBAC invariants in
    # docs/superpowers/specs/2026-07-31-dataplane-rbac-hardening-design.md:
    # no ClusterRoleBinding may reference a write-bearing role, and no
    # ClusterRoles may render under low_privilege. Known violations are pinned
    # in tests/rbac-baseline.yaml and shrink with each hardening phase.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install PyYAML==6.0.2
      - name: Run RBAC check
        run: make rbac-test
  vendored-crds:
    # Drift gate for the vendored CRDs under crds/<name>/. Each
    # scripts/check.sh re-pulls its upstream chart and diffs the rendered
    # CRD YAML against the checked-in copy; the job fails if any CRD set
    # drifts from the parent-chart dep version it claims to track.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v4.2.2
      - name: Set up yq
        # mikefarah/yq (Go), not the Python yq that ships in Ubuntu —
        # check.sh / sync.sh use the mikefarah expression syntax.
        run: |
          YQ_VERSION=v4.43.1
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Verify vendored CRDs match upstream charts
        run: make check-vendored-crds
