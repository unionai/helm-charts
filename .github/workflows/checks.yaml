name: Static Checks
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format:
    # Gate: every Python file is ruff-formatted and imports are sorted (ruff
    # replaces black + isort). Mirrors the .pre-commit-config.yaml ruff hooks.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install -r dev-requirements.in
      - name: Check formatting and imports
        run: |
          ruff format --check .
          ruff check .
  release-notes:
    # Gate: a chart `version:` bump must ship a matching `## <version>` section
    # in that chart's RELEASE.md. Only meaningful on PRs (needs a base ref).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check RELEASE.md is updated for version bumps
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          ./.github/ci-scripts/check_release_notes.sh "origin/${GITHUB_BASE_REF}"
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v4.2.2
      - name: Run linter
        run: make lint
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v4.2.2
      - name: Run tests
        run: make helm-test
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up kubeconform
        uses: yokawasa/action-setup-kube-tools@v0.11.2
      - name: Run kubeconform
        run: make kubeconform-test
  image-paths:
    # Gate on fully qualified image references (registry host spelled out).
    # An unqualified repository resolves against the implicit docker.io
    # default, which clusters running an allowed-registry admission policy
    # reject with ErrImagePull. Reads tests/generated/, so no helm or network
    # is needed; the `validate` job is what keeps that corpus honest.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check image paths
        run: make check-image-paths
  vendored-crds:
    # Drift gate for the vendored CRDs under crds/<name>/. Each
    # scripts/check.sh re-pulls its upstream chart and diffs the rendered
    # CRD YAML against the checked-in copy; the job fails if any CRD set
    # drifts from the parent-chart dep version it claims to track.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v4.2.2
      - name: Set up yq
        # mikefarah/yq (Go), not the Python yq that ships in Ubuntu —
        # check.sh / sync.sh use the mikefarah expression syntax.
        run: |
          YQ_VERSION=v4.43.1
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Verify vendored CRDs match upstream charts
        run: make check-vendored-crds
