name: release
on:
  push:
    branches: [main]
    paths:
      - 'charts/*/Chart.yaml'

jobs:
  create:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Record existing tags
        id: existing-tags
        run: echo "tags=$(git tag -l | tr '\n' ',')" >> "$GITHUB_OUTPUT"

      # skip_existing must be true — this workflow triggers on every Chart.yaml
      # change pushed to main, so chart-releaser will see all charts, not just
      # the ones with new versions. Without skip_existing it would fail on
      # charts that have already been released.
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # A chart version with a SemVer pre-release suffix (-alpha.N / -beta.N) is
      # not a stable release: flag its GitHub release as a pre-release so it is
      # excluded from "latest". Helm's repo index already hides pre-release
      # versions from `helm pull` unless --devel is passed, so stable consumers
      # are unaffected. chart-releaser's mark_as_latest is run-level, so this is
      # done per-chart here instead.
      - name: Flag pre-release versions as not latest
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          for f in charts/*/Chart.yaml; do
            name=$(basename "$(dirname "$f")")
            ver=$(grep '^version:' "$f" | awk '{print $2}' | tr -d '"')
            case "$ver" in
              *-alpha.*|*-beta.*)
                tag="${name}-${ver}"
                if gh release view "$tag" >/dev/null 2>&1; then
                  echo "Flagging $tag as pre-release"
                  gh release edit "$tag" --prerelease --latest=false
                fi
                ;;
            esac
          done

      - name: Generate release notes
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          EXISTING_TAGS: "${{ steps.existing-tags.outputs.tags }}"
        run: |
          git fetch --tags
          ./scripts/generate-release-notes.sh --publish

      # Add a newly published stable dataplane version to Fleet: start cloud's
      # fleet-chart-staging-release pipeline, which publishes it to Fleet's OCI
      # registry and, once approved, registers it in each staging region serving
      # stored templates. Canary and production are started by hand for now.
      # This workflow runs on every Chart.yaml change, so it triggers only when
      # this push changed the dataplane version. That is decided from the push
      # itself (before/after commits), not from the tags this run created, so
      # rerunning a failed job retries the trigger; the pipeline is safe to rerun.
      - name: Register the new dataplane chart with Fleet
        if: github.repository == 'unionai/helm-charts'
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version_of() { grep '^version:' | awk '{print $2}' | tr -d '"'; }
          ver=$(version_of < charts/dataplane/Chart.yaml)
          tag="dataplane-${ver}"
          old_ver=""
          if [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            old_ver=$(git show "${BEFORE_SHA}:charts/dataplane/Chart.yaml" 2>/dev/null | version_of || true)
          fi
          if [ "$ver" = "$old_ver" ]; then
            echo "dataplane is still ${ver} in this push; nothing to register"; exit 0
          fi
          # Stable CalVer only (YYYY.M.N), as the pipeline accepts.
          if ! [[ "$ver" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "${tag} is not a stable release; Fleet registers stable versions only"; exit 0
          fi
          # chart-releaser must have published it; fail (so a rerun retries) if not.
          git fetch -q --tags
          git rev-parse -q --verify "refs/tags/${tag}" >/dev/null ||
            { echo "${tag} was not released by chart-releaser; nothing to register" >&2; exit 1; }
          .github/scripts/trigger-buildkite-build.sh fleet-chart-staging-release \
            CHART_NAME=dataplane CHART_VERSION="${ver}"
